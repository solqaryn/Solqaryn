name: V19 C09-04.M06.04 - MySQL 8.4 disable rollback
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/C0904M0604DisableRollbackIntegrationTests.cs'
      - 'backend/src/Infrastructure/Persistence/Configurations/ConfiguracionWhatsAppEmpresaConfiguration.cs'
      - 'backend/src/Infrastructure/Migrations/20261117215700_V19WhatsAppE164LiteralPlus.cs'
      - 'backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.N76C.cs'
      - '.github/workflows/v19-c09-04-m06-04-synthetic-disable-rollback.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c0904-m0604-${{ github.sha }}
  cancel-in-progress: false
jobs:
  mysql-ephemeral:
    name: C09-04.M06.04 - A-B disable rollback MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=v19_m0604_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Scope Lock exact SHA
        run: node scripts/verify-project-scope.mjs
      - name: Verify real ephemeral MySQL version
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION()' | grep -E '^8[.]4[.]'
      - name: xUnit Release Category Integration and strict TRX
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --filter 'FullyQualifiedName~C0904M0604DisableRollbackIntegrationTests&Category=Integration' --logger 'trx;LogFileName=c0904m0604.trx' --logger 'console;verbosity=normal'
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          fs=list(Path('tests/Solqaryn.Tests/TestResults').glob('**/c0904m0604.trx'))
          assert len(fs)==1, f'Expected 1 TRX, got {len(fs)}'
          root=ET.parse(fs[0]).getroot()
          c=next((e.attrib for e in root.iter() if e.tag.endswith('Counters')), None)
          assert c and (int(c['executed']),int(c['passed']),int(c['failed']),int(c['notExecuted']))==(4,4,0,0), c
          print('REAL_MYSQL84_TENANT_AB_ROLLBACK_TRX=4/4')
          PY
