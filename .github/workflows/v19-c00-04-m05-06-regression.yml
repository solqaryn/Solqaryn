name: V19 C00-04.M05.06 - Regresion y accesibilidad
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c00-04-m05-06-regression.spec.ts'
      - '.github/workflows/v19-c00-04-m05-06-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c0004-m0506-${{ github.sha }}
  cancel-in-progress: false
jobs:
  regression:
    name: C00-04.M05.06 - cuatro Chromium reales
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: |
          npm run lint
          npm run build:prod
      - run: npx playwright install --with-deps chromium
      - name: Loopback Angular
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c0004m0506.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c0004m0506.log >&2
          exit 1
      - run: npx playwright test e2e/c00-04-m05-06-regression.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v19-c0004-m0506-regression
          path: |
            frontend/c0004m0506.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
