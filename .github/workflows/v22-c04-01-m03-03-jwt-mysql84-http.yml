name: V22 - C04-01.M03.03 signed JWT HTTP MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/API/Security/C0401PlanVerifiedActorSource.cs'
      - 'backend/src/API/Program.cs'
      - 'backend/tests/Solqaryn.Tests/Integration/C0401M0303SignedJwtMysql84HttpIntegrationTests.cs'
      - '.github/workflows/v22-c04-01-m03-03-jwt-mysql84-http.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0401-m0303-jwt-${{ github.sha }}
  cancel-in-progress: false
jobs:
  signed-jwt-http-mysql:
    name: C04-01.M03.03 - real signed JWT HTTP MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v22-only
          MYSQL_DATABASE: solqaryn_c1502_m0503
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v22-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0401_M0303_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_c1502_m0503;User=root;Password=ephemeral-v22-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C1502_M0503_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_c1502_m0503;User=root;Password=ephemeral-v22-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Exact HEAD and Scope Lock
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Signed JWT TestServer HTTP + MySQL 8.4
        working-directory: backend
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0401M0303SignedJwtMysql84HttpIntegrationTests' --logger 'trx;LogFileName=C0401JwtHttpMySql84.trx' --verbosity normal
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path("tests/Solqaryn.Tests/TestResults").rglob("C0401JwtHttpMySql84.trx"))
          assert len(files)==1, f"TRX required exactly one: {files}"
          root=ET.parse(files[0]).getroot()
          ns={"t":"http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          counters=root.find(".//t:Counters",ns)
          assert counters is not None
          c=counters.attrib
          assert int(c["total"]) >= 1 and int(c["passed"]) >= 1, c
          assert int(c["failed"]) == 0 and int(c["notExecuted"]) == 0, c
          assert int(c["executed"]) == int(c["total"]), c
          print("REAL_MYSQL84_JWT_HTTP_TRX_EXECUTED_PASS",c)
          PY
