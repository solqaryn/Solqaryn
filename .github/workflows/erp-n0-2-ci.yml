name: ERP-N0.2 - Certificación CatalogoProducto legacy

on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/**/*CatalogoProducto*.cs'
      - 'backend/src/**/*TipoCatalogoProducto*.cs'
      - 'backend/src/Infrastructure/Migrations/20260811013917_N0_2_RetirarCatalogoProductoLegacy*.cs'
      - 'backend/tests/Solqaryn.Tests/CatalogoProductoServiceTests.cs'
      - 'frontend/e2e/catalogos-mantenimientos.spec.ts'
      - 'backend/scripts/preflight-erp-n0-2-catalogos-normalizados.sql'
      - 'backend/scripts/postdeploy-erp-n0-2-catalogos-normalizados.sql'
      - '.github/workflows/erp-n0-2-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/**/*CatalogoProducto*.cs'
      - 'backend/src/**/*TipoCatalogoProducto*.cs'
      - 'backend/src/Infrastructure/Migrations/20260811013917_N0_2_RetirarCatalogoProductoLegacy*.cs'
      - 'backend/tests/Solqaryn.Tests/CatalogoProductoServiceTests.cs'
      - 'frontend/e2e/catalogos-mantenimientos.spec.ts'
      - 'backend/scripts/preflight-erp-n0-2-catalogos-normalizados.sql'
      - 'backend/scripts/postdeploy-erp-n0-2-catalogos-normalizados.sql'
      - '.github/workflows/erp-n0-2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-n0-2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalogos-normalizados:
    name: Migración, integridad y runtime en MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_n02_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=solqaryn_n02_ci;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: ERP-N0-2-CI-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: Solqaryn.CI
      Jwt__Audience: Solqaryn.CI.Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Restaurar backend
        working-directory: backend
        run: dotnet restore Solqaryn.sln

      - name: Compilar backend sin advertencias
        working-directory: backend
        run: dotnet build Solqaryn.sln --configuration Release --no-restore -warnaserror

      - name: Ejecutar pruebas backend
        working-directory: backend
        run: dotnet test Solqaryn.sln --configuration Release --no-build

      - name: Instalar EF
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Crear esquema inmediatamente anterior a N0.2
        working-directory: backend
        run: |
          dotnet ef database update 20260810174200_M12AutomatizacionTransversal \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext

      - name: Sembrar caso representativo legacy y normalizado
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot solqaryn_n02_ci -e "
            INSERT INTO CatalogosProducto
              (Id, Tipo, Nombre, Descripcion, CodigoVisual, Orden, Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES
              (9101, 'Marca', 'N02 Marca CI', NULL, NULL, 1, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6)),
              (9102, 'Modelo', 'N02 Modelo CI', NULL, NULL, 1, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6)),
              (9103, 'Color', 'N02 Color CI', NULL, '#112233', 1, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6)),
              (9104, 'Talla', 'N02 Talla CI', NULL, NULL, 1, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));
            UPDATE CatalogosProducto SET CatalogoPadreId = 9101 WHERE Id = 9102;

            INSERT INTO Marcas
              (Id, Nombre, Descripcion, Orden, Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES (9101, 'N02 Marca CI', NULL, 1, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));
            INSERT INTO Modelos
              (Id, MarcaId, Nombre, Descripcion, Orden, Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES (9102, 9101, 'N02 Modelo CI', NULL, 1, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));
            INSERT INTO Colores
              (Id, Nombre, Descripcion, CodigoVisual, Orden, Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES (9103, 'N02 Color CI', NULL, '#112233', 1, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));
            INSERT INTO Tallas
              (Id, Nombre, Descripcion, Orden, Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES (9104, 'N02 Talla CI', NULL, 1, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));

            INSERT INTO Productos
              (Nombre, Marca, Modelo, Cantidad, Costo, Precio, UmbralStockBajo, Activo, Eliminado,
               MarcaId, ModeloId, ColorId, TallaId, FechaCreacion, FechaActualizacion)
            VALUES
              ('ERP N0.2 Producto CI', 'N02 Marca CI', 'N02 Modelo CI', 1, 10.00, 20.00, 1, 1, 0,
               9101, 9102, 9103, 9104, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));"

      - name: Ejecutar preflight N0.2
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          bloqueos="$(docker exec -i "$mysql_container" mysql -uroot -proot solqaryn_n02_ci --batch --skip-column-names \
            < backend/scripts/preflight-erp-n0-2-catalogos-normalizados.sql | tail -n 1)"
          test "$bloqueos" = '0'

      - name: Aplicar migración N0.2
        working-directory: backend
        run: |
          dotnet ef database update \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext

      - name: Validar integridad posterior N0.2
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          errores="$(docker exec -i "$mysql_container" mysql -uroot -proot solqaryn_n02_ci --batch --skip-column-names \
            < backend/scripts/postdeploy-erp-n0-2-catalogos-normalizados.sql | tail -n 1)"
          test "$errores" = '0'

          legado="$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_n02_ci -Nse "
            SELECT COUNT(*) FROM information_schema.tables
            WHERE table_schema = DATABASE() AND table_name = 'CatalogosProducto';")"
          test "$legado" = '0'

          relaciones="$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_n02_ci -Nse "
            SELECT COUNT(*)
            FROM Productos p
            JOIN Marcas ma ON ma.Id = p.MarcaId
            JOIN Modelos mo ON mo.Id = p.ModeloId AND mo.MarcaId = ma.Id
            JOIN Colores c ON c.Id = p.ColorId
            JOIN Tallas t ON t.Id = p.TallaId
            WHERE p.Nombre = 'ERP N0.2 Producto CI'
              AND ma.Nombre = 'N02 Marca CI'
              AND mo.Nombre = 'N02 Modelo CI'
              AND c.Nombre = 'N02 Color CI'
              AND t.Nombre = 'N02 Talla CI';")"
          test "$relaciones" = '1'

      - name: Verificar snapshot EF sin cambios pendientes
        working-directory: backend
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext

      - name: Guardas estáticas de retiro legacy
        shell: bash
        run: |
          set -euo pipefail
          runtime_files="$(find backend/src -type f -name '*.cs' ! -path '*/Migrations/*')"

          if grep -nE 'class[[:space:]]+CatalogoProducto([[:space:]:{]|$)' $runtime_files; then
            echo 'Existe una entidad/clase runtime CatalogoProducto.' >&2
            exit 1
          fi
          if grep -nE 'DbSet<CatalogoProducto>|\.CatalogosProducto\b|IEntityTypeConfiguration<CatalogoProducto>|ToTable\("CatalogosProducto"\)' $runtime_files; then
            echo 'Existe dependencia runtime/persistencia sobre CatalogosProducto.' >&2
            exit 1
          fi

          migration='backend/src/Infrastructure/Migrations/20260811013917_N0_2_RetirarCatalogoProductoLegacy.cs'
          grep -q 'DropTable(' "$migration"
          grep -q 'name: "CatalogosProducto"' "$migration"
          grep -q 'FK_Productos_Colores_ColorId' "$migration"
          grep -q 'FK_Productos_Tallas_TallaId' "$migration"
          grep -q 'FK_Productos_Marcas_MarcaId' "$migration"
          grep -q 'FK_Productos_Modelos_ModeloId' "$migration"
          grep -q 'throw new NotSupportedException' "$migration"
