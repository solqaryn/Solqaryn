name: V19 C14-01.M04.02 - QA estados privados seguros
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/features/plataforma/c14-01-m04-01-qa-global.component*'
      - 'frontend/src/app/features/plataforma/c14-01-m04-02-qa-*'
      - 'frontend/e2e/c14-01-m04-02-qa-states.spec.ts'
      - '.github/workflows/v19-c14-01-m04-02-qa-states.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c14-01-m04-02-${{ github.sha }}
  cancel-in-progress: false
jobs:
  states:
    name: C14-01.M04.02 - Vitest y Chromium estados QA
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Npm fijado
        run: npm install --global npm@11.19.0
      - name: Dependencias fijas
        run: npm ci
      - name: Unitarias estados QA
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c14-01-m04-02-qa-states.spec.ts
      - name: Regression unidad QA global
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c14-01-m04-01-qa-global.component.spec.ts
      - name: Tipado lint y build
        run: |
          npm run lint
          npm run build:prod
      - name: Chromium efimero
        run: npx playwright install --with-deps chromium
      - name: Angular loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c1401m0402.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c1401m0402.log >&2
          exit 1
      - name: QA privado y cinco Chromium reales
        run: npx playwright test e2e/c14-01-m04-01-qa-global.spec.ts e2e/c14-01-m04-02-qa-states.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c14-01-m04-02-qa-states
          path: |
            frontend/c1401m0402.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
