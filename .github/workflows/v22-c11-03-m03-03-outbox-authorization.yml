name: V22 C11-03.M03.03 - outbox tenant authorization signed JWT
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Application/AutomationV5/C1103OutboxAuthorizationGate.cs'
      - 'backend/tests/Solqaryn.Tests/Application/C1103M0303OutboxAuthorizationGateTests.cs'
      - 'backend/src/API/Security/C1103OutboxVerifiedMembershipReader.cs'
      - 'backend/tests/Solqaryn.Tests/API/C1103M0303VerifiedMembershipReaderJwtRegressionTests.cs'
      - '.github/workflows/v22-c11-03-m03-03-outbox-authorization.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c1103-m0303-${{ github.sha }}
  cancel-in-progress: false
jobs:
  outbox-authorization:
    name: C11-03.M03.03 - real signed JWT and tenant grant tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify strict Scope Lock
        run: node scripts/verify-project-scope.mjs
      - name: Restore and Release build
        run: |
          dotnet restore backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet build backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore
      - name: Real cryptographic JWT and negative tenant xUnit with TRX counters
        shell: bash
        run: |
          set -euo pipefail
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~C1103M0303OutboxAuthorizationGateTests --logger 'trx;LogFileName=c1103-m0303.trx'
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          results=list(pathlib.Path('backend/tests/Solqaryn.Tests').rglob('c1103-m0303.trx'))
          if len(results)!=1: raise SystemExit('Missing unique xUnit TRX')
          counters=ET.parse(results[0]).getroot().find('.//{*}Counters')
          if counters is None: raise SystemExit('No test counters')
          nums={k:int(counters.attrib.get(k,-1)) for k in ('total','passed','failed','notExecuted')}
          print('C11-03.M03.03 directed counts',nums)
          if nums['passed']<17 or nums['passed']!=nums['total'] or nums['failed']!=0 or nums['notExecuted']!=0:
              raise SystemExit('Required authorization tests missing/failed/skipped')
          PY
      - name: Signed JWT subject-name versus numeric-id regression (real middleware)
        shell: bash
        run: |
          set -euo pipefail
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~C1103M0303VerifiedMembershipReaderJwtRegressionTests' --logger 'trx;LogFileName=c1103-reader-jwt.trx'
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files=list(pathlib.Path('backend/tests/Solqaryn.Tests').rglob('c1103-reader-jwt.trx'))
          if len(files)!=1: raise SystemExit('Missing exact reader JWT regression TRX')
          counters=ET.parse(files[0]).getroot().find('.//{*}Counters')
          if counters is None: raise SystemExit('Missing JWT reader counters')
          n={k:int(counters.attrib.get(k,-1)) for k in ('total','passed','failed','notExecuted')}
          print('C1103_READER_JWT_SUBJECT_FIX_COUNTS',n)
          if n['total']!=4 or n['passed']!=4 or n['failed'] or n['notExecuted']:
              raise SystemExit('Reader JWT subject regression failed')
          PY
