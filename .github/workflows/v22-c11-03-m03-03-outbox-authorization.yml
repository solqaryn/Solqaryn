name: V22 C11-03.M03.03 - outbox tenant authorization signed JWT
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Application/AutomationV5/C1103OutboxAuthorizationGate.cs'
      - 'backend/tests/Solqaryn.Tests/Application/C1103M0303OutboxAuthorizationGateTests.cs'
      - 'backend/src/API/Security/C1103OutboxVerifiedMembershipReader.cs'
      - 'backend/tests/Solqaryn.Tests/API/C1103M0303VerifiedMembershipReaderJwtRegressionTests.cs'
      - 'backend/tests/Solqaryn.Tests/Integration/C1103M0303SignedJwtMysql84HttpIntegrationTests.cs'
      - 'backend/tests/Solqaryn.Tests/Integration/C1103M0303RealMysqlEfJwtHttpIntegrationTests.cs'
      - 'backend/src/API/Program.cs'
      - '.github/workflows/v22-c11-03-m03-03-outbox-authorization.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c1103-m0303-${{ github.sha }}
  cancel-in-progress: false
jobs:
  outbox-authorization:
    name: C11-03.M03.03 - real signed JWT and tenant grant tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Strictly isolated GitHub-hosted MySQL service; never a configured production DB.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_c1502_m0503
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      C1502_M0503_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_c1502_m0503;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify strict Scope Lock
        run: node scripts/verify-project-scope.mjs
      - name: Restore and Release build
        run: |
          dotnet restore backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet build backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore
      - name: Real cryptographic JWT and negative tenant xUnit with TRX counters
        shell: bash
        run: |
          set -euo pipefail
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~C1103M0303OutboxAuthorizationGateTests --logger 'trx;LogFileName=c1103-m0303.trx'
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          results=list(pathlib.Path('backend/tests/Solqaryn.Tests').rglob('c1103-m0303.trx'))
          if len(results)!=1: raise SystemExit('Missing unique xUnit TRX')
          counters=ET.parse(results[0]).getroot().find('.//{*}Counters')
          if counters is None: raise SystemExit('No test counters')
          nums={k:int(counters.attrib.get(k,-1)) for k in ('total','passed','failed','notExecuted')}
          print('C11-03.M03.03 directed counts',nums)
          if nums['passed']<17 or nums['passed']!=nums['total'] or nums['failed']!=0 or nums['notExecuted']!=0:
              raise SystemExit('Required authorization tests missing/failed/skipped')
          PY
      - name: Signed JWT subject-name versus numeric-id regression (real middleware)
        shell: bash
        run: |
          set -euo pipefail
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~C1103M0303VerifiedMembershipReaderJwtRegressionTests' --logger 'trx;LogFileName=c1103-reader-jwt.trx'
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files=list(pathlib.Path('backend/tests/Solqaryn.Tests').rglob('c1103-reader-jwt.trx'))
          if len(files)!=1: raise SystemExit('Missing exact reader JWT regression TRX')
          counters=ET.parse(files[0]).getroot().find('.//{*}Counters')
          if counters is None: raise SystemExit('Missing JWT reader counters')
          n={k:int(counters.attrib.get(k,-1)) for k in ('total','passed','failed','notExecuted')}
          print('C1103_READER_JWT_SUBJECT_FIX_COUNTS',n)
          if n['total']!=4 or n['passed']!=4 or n['failed'] or n['notExecuted']:
              raise SystemExit('Reader JWT subject regression failed')
          PY
      - name: Signed JWT HTTP and MySQL 8.4 tests with real SQL, revocation and rollback
        shell: bash
        run: |
          set -euo pipefail
          # These are TestServer + disposable MySQL fixture tests, NOT the
          # production UsuarioEmpresa/RolPermiso adapter acceptance.
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~C1103M0303SignedJwtMysql84HttpIntegrationTests --logger 'trx;LogFileName=c1103-mysql84-http.trx'
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files=list(pathlib.Path('backend/tests/Solqaryn.Tests').rglob('c1103-mysql84-http.trx'))
          if len(files)!=1: raise SystemExit('Missing unique real MySQL/JWT HTTP TRX')
          counters=ET.parse(files[0]).getroot().find('.//{*}Counters')
          if counters is None: raise SystemExit('Missing MySQL/JWT HTTP counters')
          n={k:int(counters.attrib.get(k,-1)) for k in ('total','passed','failed','notExecuted')}
          print('C1103_MYSQL84_SIGNED_JWT_HTTP',n)
          if n['total']!=2 or n['passed']!=2 or n['failed']!=0 or n['notExecuted']!=0:
              raise SystemExit('Real MySQL 8.4, JWT, HTTP and rollback test gate failed')
          PY
      - name: Actual Oracle EF UsuarioEmpresa RolPermiso JWT HTTP MySQL 8.4
        shell: bash
        run: |
          set -euo pipefail
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter FullyQualifiedName~C1103M0303RealMysqlEfJwtHttpIntegrationTests --logger 'trx;LogFileName=c1103-real-ef-jwt-mysql84.trx'
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          paths=list(pathlib.Path('backend/tests/Solqaryn.Tests').rglob('c1103-real-ef-jwt-mysql84.trx'))
          if len(paths)!=1: raise SystemExit('Missing real Oracle EF JWT MySQL84 TRX')
          counters=ET.parse(paths[0]).getroot().find('.//{*}Counters')
          if counters is None: raise SystemExit('No real EF integration counters')
          n={key:int(counters.attrib.get(key,-1)) for key in ('total','passed','failed','notExecuted')}
          print('C1103_REAL_ORACLE_EF_MYSQL84_JWT_HTTP',n)
          if n!={'total':1,'passed':1,'failed':0,'notExecuted':0}:
              raise SystemExit('Actual app authorization services integration failed')
          PY
