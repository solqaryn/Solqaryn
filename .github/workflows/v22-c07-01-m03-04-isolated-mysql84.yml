name: V22 C07-01.M03.04 isolated catalog MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Infrastructure/AutomationV5/C0701IsolatedMySqlResourceReader.cs'
      - 'backend/tests/Solqaryn.Tests/Integration/C0701M0304IsolatedMySqlResourceReaderTests.cs'
      - '.github/workflows/v22-c07-01-m03-04-isolated-mysql84.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0701-m0304-${{ github.sha }}
  cancel-in-progress: false
jobs:
  isolated-mysql-catalog:
    name: C07-01.M03.04 - real isolated MySQL 8.4 product ownership rollback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v22-only
          MYSQL_DATABASE: c0701_m0304_bootstrap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v22-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0701_M0304_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=c0701_m0304_bootstrap;User=root;Password=ephemeral-v22-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Verify exact SHA and Scope Lock
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Run real MySQL 8.4 catalog ownership and rollback regression
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0701M0304IsolatedMySqlResourceReaderTests' --logger 'trx;LogFileName=C0701M0304Mysql84.trx' --verbosity normal
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('tests/Solqaryn.Tests').rglob('C0701M0304Mysql84.trx'))
          assert len(files)==1, files
          counter=ET.parse(files[0]).getroot().find('.//{*}Counters')
          assert counter is not None
          c={k:int(counter.attrib.get(k,-1)) for k in ('total','passed','failed','notExecuted','executed')}
          assert c['total']>=1 and c['passed']==c['total'] and c['failed']==0 and c['notExecuted']==0 and c['executed']==c['total'], c
          print('C0701_REAL_ISOLATED_MYSQL84_SUCCESS',c)
          PY
