name: V20 C03-04.M05.02 - incident DTO contract
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Application/C0304M0502IncidentDtoContractTests.cs'
      - 'backend/src/Application/AutomationV5/V5ContinuityIncidentApplicationService.cs'
      - '.github/workflows/v20-c03-04-m05-02-dto-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c0304-m0502-${{ github.sha }}
  cancel-in-progress: false
jobs:
  dto-contract:
    name: C03-04.M05.02 - .NET 10 real DTO xUnit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify strict project scope
        run: node scripts/verify-project-scope.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restore and build .NET 10 Release
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln -c Release --no-restore
      - name: Execute real DTO serialization and fail-closed xUnit
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~C0304M0502IncidentDtoContractTests' --logger 'trx;LogFileName=c0304-m0502-dto.trx' --logger 'console;verbosity=normal'
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          paths=glob.glob('tests/Solqaryn.Tests/TestResults/**/c0304-m0502-dto.trx',recursive=True)
          assert len(paths)==1, f'one TRX required: {len(paths)}'
          root=ET.parse(paths[0]).getroot()
          node=next((x for x in root.iter() if x.tag.endswith('}Counters') or x.tag=='Counters'),None)
          assert node is not None, 'missing TRX counters'
          counts=node.attrib
          print('C03-04.M05.02',counts)
          assert int(counts.get('executed','0'))>=18
          assert int(counts.get('failed','-1'))==0
          assert int(counts.get('error','-1'))==0
          assert int(counts.get('notExecuted','-1'))==0
          PY
      - name: Preserve genuine TRX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c03-04-m05-02-dto-contract-trx
          path: backend/tests/Solqaryn.Tests/TestResults/**/c0304-m0502-dto.trx
          if-no-files-found: error
          retention-days: 14
