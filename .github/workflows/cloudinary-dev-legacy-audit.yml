name: DEV - Auditoría de locators Cloudinary (solo lectura)

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/cloudinary-dev-legacy-audit.yml'
      - 'scripts/audit_cloudinary_dev_locations.py'
      - 'scripts/tests/test_audit_cloudinary_dev_locations.py'
      - '.github/checkpoints/cloudinary-dev-legacy-audit'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-cloudinary-locator-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Auditar referencias Cloudinary sin modificar Aiven
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: DEV
    env:
      DB_HOST: ${{ vars.SOLQARYN_DEV_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_DEV_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_DEV_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_DEV_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_DEV_DB_PASSWORD }}
    steps:
      - name: Checkout exact-head DEV
        uses: actions/checkout@v4

      - name: Scope SOLQARYN y rama de entorno
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "dev"
          node scripts/verify-project-scope.mjs
          test "$DB_HOST" = "solqaryn-mysql-solqaryn.h.aivencloud.com"
          test "$DB_PORT" = "14402"
          test "$DB_NAME" = "solqaryn_dev"
          test "$DB_USER" = "solqaryn_dev_user"
          test -n "$DB_PASSWORD"

      - name: Pruebas de clasificación sin acceso a datos
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/tests -p 'test_audit_cloudinary_dev_locations.py' -v

      - name: Instalar exclusivamente el cliente MySQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Inventariar sin DML ni revelar locators
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_cloudinary_dev_locations.py

      - name: Publicar únicamente contadores, nunca URLs o PublicIds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudinary-dev-locators-${{ github.run_id }}
          retention-days: 14
          path: evidence/cloudinary-dev-locator-audit.json
          if-no-files-found: ignore
