name: V22 C11-03.M04.03 - outbox branding Vitest Chromium
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v22-c11-03-m04-03-branding.yml'
      - 'frontend/src/app/features/plataforma/c11-03-m04-01-outbox-readonly.component.ts'
      - 'frontend/src/app/features/plataforma/c11-03-m04-03-branding.spec.ts'
      - 'frontend/e2e/c11-03-m04-03-outbox-branding.spec.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c1103-m0403-${{ github.sha }}
  cancel-in-progress: false
jobs:
  branding:
    name: C11-03.M04.03 - Angular branding Vitest Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm 11
        run: npm install --global npm@11.19.0
      - name: Verify exact SHA Scope Lock and catalog
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd ..
          node scripts/verify-project-scope.mjs
          node scripts/verify-p0-007-a-component-catalog.mjs --self-test
      - name: Install npm packages
        run: npm ci
      - name: Adversarial branding and existing session tests
        run: |
          npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c11-03-m04-03-branding.spec.ts
          npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c11-03-m04-01-outbox-readonly.component.spec.ts
          npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c11-03-m04-02-states.spec.ts
      - name: Angular lint and production build
        run: |
          npm run lint
          npm run build:prod
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c1103-m0403.log 2>&1 &
          for attempt in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c1103-m0403.log >&2
          exit 1
      - name: Chromium browser negative and responsive checks
        run: npx playwright test e2e/c11-03-m04-03-outbox-branding.spec.ts e2e/c11-03-m04-01-outbox-private.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: On failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: c1103-m0403-ci
          path: |
            frontend/c1103-m0403.log
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
