name: M13 - Auditoría integral y certificación final

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Autorización explícita del propietario: AUTORIZADO_REABRIR'
        required: true
        type: string
permissions:
  contents: read
  actions: read

concurrency:
  group: m13-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Autorizar reapertura cerrada
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir administrador, DEV y token literal
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          TARGET_REF: ${{ github.ref }}
          AUTHORIZATION: ${{ inputs.authorization }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$REPOSITORY" = solqaryn/Solqaryn
          test "$TARGET_REF" = refs/heads/dev
          test "$ACTOR" = "$TRIGGERING_ACTOR"
          test "$AUTHORIZATION" = AUTORIZADO_REABRIR
          admin="$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" --jq '.user.permissions.admin')"
          test "$admin" = "true"
          echo 'REOPEN_AUTHORIZATION=PASS'

  audit:
    needs: authorize
    name: Secretos, higiene y dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Auditoría estática fail-closed
        run: python3 scripts/m13_static_audit.py
      - name: Auditar paquetes .NET vulnerables y deprecados
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore InventoryApp.sln
          dotnet list InventoryApp.sln package --vulnerable --include-transitive | tee ../m13-dotnet-vulnerable.txt
          if grep -q 'has the following vulnerable packages' ../m13-dotnet-vulnerable.txt; then
            echo 'M13 bloqueada: paquetes .NET vulnerables.' >&2
            exit 1
          fi
          dotnet list InventoryApp.sln package --deprecated --include-transitive | tee ../m13-dotnet-deprecated.txt
      - name: Auditar npm runtime y registrar tooling
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev --audit-level=high | tee ../m13-npm-runtime-audit.txt
          npm audit --audit-level=high > ../m13-npm-tooling-audit.txt || true
      - name: Publicar auditorías de dependencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m13-auditoria-estatica-dependencias
          path: |
            m13-static-audit.json
            m13-dotnet-vulnerable.txt
            m13-dotnet-deprecated.txt
            m13-npm-runtime-audit.txt
            m13-npm-tooling-audit.txt
          if-no-files-found: warn
          retention-days: 30

  backend_database:
    needs: authorize
    name: Backend, MySQL, migraciones, snapshot y upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventoryapp_m13_fresh
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=inventoryapp_m13_fresh;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: 'M13-CI-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'Solqaryn.M13.API'
      Jwt__Audience: 'Solqaryn.M13.Frontend'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      Cloudinary__CloudName: 'm13-not-used'
      Cloudinary__ApiKey: 'm13-not-used'
      Cloudinary__ApiSecret: 'm13-not-used'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - name: Restaurar y compilar Release con warnings como error
        working-directory: backend
        run: |
          dotnet restore InventoryApp.sln
          dotnet build InventoryApp.sln --configuration Release --no-restore -warnaserror
      - name: Unitarias y contrato no integración
        working-directory: backend
        run: dotnet test InventoryApp.sln --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=m13-unit.trx"
      - name: Preparar EF y MySQL administrado estricto
        shell: bash
        run: |
          dotnet tool install --global dotnet-ef --version 8.0.8
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot -e "SET GLOBAL sql_require_primary_key=ON; CREATE DATABASE IF NOT EXISTS inventoryapp_m13_upgrade;"
          test "$(docker exec "$mysql_container" mysql -uroot -proot -Nse 'SELECT @@GLOBAL.sql_require_primary_key;')" = 1
      - name: Historial completo desde cero y esquema ERP-N1 materializado
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet ef database update \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext

          mysql_container="${{ job.services.mysql.id }}"
          table_count="$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_m13_fresh -Nse "
            SELECT COUNT(*) FROM information_schema.tables
            WHERE table_schema='inventoryapp_m13_fresh' AND table_name='ExistenciasVariante';")"
          test "$table_count" = '1'

          correlation_column="$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_m13_fresh -Nse "
            SELECT COUNT(*) FROM information_schema.columns
            WHERE table_schema='inventoryapp_m13_fresh'
              AND table_name='MovimientosInventario'
              AND column_name='CorrelationId';")"
          test "$correlation_column" = '1'

          for index_name in \
            IX_MovInv_Producto_Variante_Fecha_N15 \
            IX_MovInv_Almacen_Ubicacion_Fecha_N15 \
            IX_MovInv_Compra_Fecha_N15 \
            IX_MovInv_Venta_Fecha_N15 \
            IX_MovInv_Consumo_Fecha_N15 \
            IX_MovInv_Ajuste_Fecha_N15; do
            index_count="$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_m13_fresh -Nse "
              SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics
              WHERE table_schema='inventoryapp_m13_fresh'
                AND table_name='MovimientosInventario'
                AND index_name='$index_name';")"
            test "$index_count" = '1'
          done

          for migration_id in \
            20260815012500_N1_4_ExistenciaVariante \
            20260815202500_N1_5_KardexCorrelation \
            20260816005000_N1_5_KardexQueryIndexes; do
            migration_count="$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_m13_fresh -Nse "
              SELECT COUNT(*) FROM __EFMigrationsHistory
              WHERE MigrationId='$migration_id';")"
            test "$migration_count" = '1'
          done
      - name: Integración MySQL sobre esquema actual
        working-directory: backend
        run: dotnet test InventoryApp.sln --configuration Release --no-build --filter "Category=Integration" --logger "trx;LogFileName=m13-integration.trx"
      - name: SQL forward completo e idempotente
        working-directory: backend
        run: |
          dotnet ef migrations script --idempotent \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext \
            --output m13-forward-idempotent.sql
          test -s m13-forward-idempotent.sql
          grep -q '__EFMigrationsHistory' m13-forward-idempotent.sql
      - name: Construir esquema anterior representativo
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=inventoryapp_m13_upgrade;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
        run: |
          dotnet ef database update 20260722142118_Fase6SeguridadFacturacionPerfil \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
      - name: Sembrar dato legado representativo
        shell: bash
        run: |
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot inventoryapp_m13_upgrade -e "
            INSERT INTO Productos
              (Nombre, Marca, Modelo, Cantidad, Costo, Precio, UmbralStockBajo, Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES
              ('M13 Legacy Sentinel', 'Samsung', 'S24', 4, 100.00, 160.00, 1, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));"
      - name: Evolucionar esquema representativo hasta actual
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=inventoryapp_m13_upgrade;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
        run: |
          dotnet ef database update 20260728152434_Fase3CostoEnvioEnVentas \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
      - name: Preparar catálogo legado y completar upgrade
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=inventoryapp_m13_upgrade;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
        shell: bash
        run: |
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot inventoryapp_m13_upgrade -e "
            INSERT INTO CatalogosProducto
              (Tipo, Nombre, Descripcion, CodigoVisual, Orden, Activo, Eliminado, FechaCreacion, FechaActualizacion)
            VALUES
              ('Color', 'Negro M13 legado', 'Upgrade representativo M13', '#111827', 1, 1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));
            SET @color_id = LAST_INSERT_ID();
            UPDATE Productos SET ColorId=@color_id WHERE Nombre='M13 Legacy Sentinel';"
          dotnet ef database update \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext
      - name: Verificar preservación histórica tras upgrade
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          count="$(docker exec "$mysql_container" mysql -uroot -proot inventoryapp_m13_upgrade -Nse "
            SELECT COUNT(*) FROM ProductoVariantes pv
            JOIN Productos p ON p.Id=pv.ProductoId
            WHERE p.Nombre='M13 Legacy Sentinel' AND pv.Cantidad=4 AND pv.Costo=100 AND pv.Precio=160;")"
          test "$count" = 1
      - name: Publicar evidencia de base
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m13-backend-base
          path: |
            backend/m13-forward-idempotent.sql
            backend/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 30

  frontend:
    needs: authorize
    name: Frontend TypeScript, lint y producción
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar, tipar, lint y build
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npm run lint
          npm run build:prod

  runtime_e2e:
    needs: authorize
    name: Runtime, seguridad HTTP y Playwright integral
    runs-on: ubuntu-latest
    timeout-minutes: 100
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventoryapp_m13_runtime
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Staging
      PORT: '5005'
      AllowedHosts: '127.0.0.1;localhost'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=inventoryapp_m13_runtime;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'
      Jwt__Secret: 'M13-E2E-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'Solqaryn.M13.API'
      Jwt__Audience: 'Solqaryn.M13.Frontend'
      Jwt__ExpiraMinutos: '120'
      Security__LoginRateLimitPerMinute: '300'
      SeedAdmin__Username: 'e2e_admin'
      SeedAdmin__Password: 'E2E.Admin#2026!'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      Cors__AllowedOrigins__1: 'http://localhost:4200'
      Swagger__Enabled: 'false'
      AppSettings__BackendPublicUrl: 'https://preview.solqaryn.invalid'
      AppSettings__LogoPublicUrl: ''
      AppSettings__EnlacePublicoFacturaHorasValidez: '1'
      AppSettings__EnlacePublicoFacturaMaximoAccesos: '5'
      AppSettings__CorreoFacturaIdempotenciaMinutos: '15'
      Cloudinary__CloudName: 'm13-not-used'
      Cloudinary__ApiKey: 'm13-not-used'
      Cloudinary__ApiSecret: 'm13-not-used'
      Cloudinary__EnvironmentPrefix: 'solqaryn_dev'
      Smtp__Host: '127.0.0.1'
      Smtp__Port: '1025'
      Smtp__UsuarioSmtp: 'smtp-user'
      Smtp__UsarSsl: 'false'
      Smtp__RequiereAutenticacion: 'false'
      Smtp__CorreoRemitente: 'facturas@m13.test'
      Smtp__CorreoRespuesta: 'soporte@m13.test'
      Smtp__NombreRemitente: 'Solqaryn M13'
      Smtp__TimeoutSeconds: '10'
      Smtp__MaxAttempts: '3'
      Smtp__RetryBaseDelayMilliseconds: '100'
      SMTP_CAPTURE_DIR: '/tmp/solqaryn-m13-smtp'
      SMTP_CAPTURE_HOST: '127.0.0.1'
      SMTP_CAPTURE_PORT: '1025'
      SMTP_CAPTURE_REQUIRE_AUTH: 'false'
      SMTP_CAPTURE_USERNAME: 'smtp-user'
      SMTP_CAPTURE_PASSWORD: 'smtp-pass'
      SMTP_FAIL_FIRST_MESSAGES: '1'
      PHASE7_API_URL: 'http://127.0.0.1:5005'
      PHASE7_ADMIN_USERNAME: 'e2e_admin'
      PHASE7_ADMIN_PASSWORD: 'E2E.Admin#2026!'
      PHASE8_EXPECT_SWAGGER_DISABLED: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - name: Backend Release
        working-directory: backend
        run: |
          dotnet restore InventoryApp.sln
          dotnet build InventoryApp.sln --configuration Release --no-restore
      - name: SMTP efímero
        shell: bash
        run: |
          rm -rf "$SMTP_CAPTURE_DIR" && mkdir -p "$SMTP_CAPTURE_DIR"
          nohup python3 scripts/fase7_fake_smtp.py > m13-smtp.log 2>&1 &
          for attempt in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/1025) >/dev/null 2>&1 && exit 0; sleep 1; done
          cat m13-smtp.log >&2 || true; exit 1
      - name: API Staging y migraciones
        shell: bash
        run: |
          nohup dotnet run --project backend/src/API/InventoryApp.API.csproj --configuration Release --no-build --no-launch-profile > backend/m13-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:5005/health/ready >/dev/null && exit 0
            sleep 2
          done
          cat backend/m13-api.log >&2 || true; exit 1
      - name: Seguridad HTTP y autorización fail-closed
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --dump-header m13-headers.txt --output m13-health.json http://127.0.0.1:5005/health
          grep -qi '^X-Content-Type-Options: nosniff' m13-headers.txt
          grep -qi '^X-Frame-Options: DENY' m13-headers.txt
          grep -qi '^Referrer-Policy: no-referrer' m13-headers.txt
          grep -qi '^Permissions-Policy:.*camera=()' m13-headers.txt
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:5005/swagger/index.html)" = 404
          test "$(curl --silent -o /dev/null -w '%{http_code}' 'http://127.0.0.1:5005/productos?page=1&pageSize=1')" = 401
          test "$(curl --silent -o /dev/null -w '%{http_code}' 'http://127.0.0.1:5005/automatizaciones/sugerencias')" = 401
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend y Chromium
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build:prod

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Angular
        shell: bash
        run: |
          nohup npm --prefix frontend start -- --host 127.0.0.1 --port 4200 > frontend/m13-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1:4200/login >/dev/null && exit 0; sleep 2; done
          cat frontend/m13-frontend.log >&2 || true; exit 1
      - name: Playwright integral
        working-directory: frontend
        run: npx playwright test --config=playwright.config.ts
      - name: Validar SMTP, PDF y logs sin secretos
        env:
          PHASE8_ADMIN_PASSWORD: 'E2E.Admin#2026!'
          PHASE8_JWT_SECRET: 'M13-E2E-Only-Secret-With-More-Than-32-Characters-2026'
          PHASE8_SMTP_PASSWORD: 'smtp-pass'
          PHASE8_DATABASE_PASSWORD: 'root'
        shell: bash
        run: |
          python3 scripts/fase7_validate_email.py
          python3 scripts/fase8_validate_runtime.py
      - name: Publicar evidencia runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m13-runtime-e2e
          path: |
            backend/m13-api.log
            frontend/m13-frontend.log
            frontend/playwright-report/
            frontend/test-results/
            m13-smtp.log
            m13-headers.txt
            m13-health.json
            fase8-runtime-report.json
          if-no-files-found: warn
          retention-days: 30

  infra_backup:
    needs: authorize
    name: Docker, aislamiento y backup certificado vigente
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configuración de DEV y Docker
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.safe_load(File.read('render.yaml'), permitted_classes: [], aliases: true)"
          node -e "JSON.parse(require('fs').readFileSync('frontend/vercel.json', 'utf8'))"
          grep -q 'branch: dev' render.yaml
          grep -q 'name: solqaryn-api-dev' render.yaml
          grep -A1 'Cloudinary__EnvironmentPrefix' render.yaml | grep -q 'solqaryn_dev'
          docker build --file backend/Dockerfile --tag solqaryn-api:m13 .
      - name: Exigir drill de backup/restore exitoso y vigente
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api 'repos/solqaryn/Solqaryn/actions/workflows/m11-backup-restore-dev.yml/runs?branch=dev&status=success&per_page=1')"
          backup_sha="$(jq -r '.workflow_runs[0].head_sha // empty' <<<"$run_json")"
          test -n "$backup_sha"
          git merge-base --is-ancestor "$backup_sha" HEAD
          git diff --quiet "$backup_sha"..HEAD -- \
            scripts/backup_dev.sh \
            scripts/restore_dev.sh \
            .github/workflows/backup-restore-dev.yml \
            backend/src/Infrastructure/Migrations
          echo "SOLQARYN backup/restore vigente: $backup_sha" | tee m13-backup-cert.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m13-infra-backup
          path: m13-backup-cert.txt
          retention-days: 30

  certify:
    name: Dictamen automatizado M13
    if: ${{ always() && needs.authorize.result == 'success' }}
    needs: [authorize, audit, backend_database, frontend, runtime_e2e, infra_backup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exigir todos los gates verdes
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.audit.result }}' = success
          test '${{ needs.backend_database.result }}' = success
          test '${{ needs.frontend.result }}' = success
          test '${{ needs.runtime_e2e.result }}' = success
          test '${{ needs.infra_backup.result }}' = success
          {
            echo 'FASE=M13'
            echo 'RESULTADO=AUTOMATIZADO_Y_COMPROBADO'
            echo 'P0_P1_ABIERTOS=0'
            echo 'PRODUCCION_TOCADA=false'
            echo 'VALIDACION_EXTERNA_FISICA=PENDIENTE'
            echo 'COMMIT=${{ github.sha }}'
            echo 'RUN=${{ github.run_id }}'
          } | tee m13-certificacion.txt
      - uses: actions/upload-artifact@v4
        with:
          name: m13-certificacion-final
          path: m13-certificacion.txt
          retention-days: 60
