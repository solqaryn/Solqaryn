name: V22 C03-04.M05.06 - incident continuity regression and MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Domain/C0304M0506IncidentContinuityRegressionTests.cs'
      - 'backend/tests/Solqaryn.Tests/C0304M0503IncidentMySqlPersistenceIntegrationTests.cs'
      - 'backend/src/Domain/AutomationV5/V5ContinuityIncidentDomainRules.cs'
      - '.github/workflows/v22-c03-04-m05-06-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0304-m0506-${{ github.sha }}
  cancel-in-progress: false
jobs:
  regression:
    name: C03-04.M05.06 - xUnit concurrent/rollback regression and real MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=mysql;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
    steps:
      - uses: actions/checkout@v4
      - name: Strict SOLQARYN scope
        run: node scripts/verify-project-scope.mjs
      - name: Verify SOLQARYN skill freshness
        run: node scripts/verify-solqaryn-skills.mjs --self-test
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Prove ephemeral MySQL 8.4
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION();' | grep -E '^8[.]4[.]'
      - name: Real regression xUnit and MySQL with bounded smoke TRX
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --filter 'FullyQualifiedName~C0304M0506IncidentContinuityRegressionTests|FullyQualifiedName~C0304M0503IncidentMySqlPersistenceIntegrationTests' --logger 'trx;LogFileName=c0304-m0506.trx' --logger 'console;verbosity=normal'
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths=list(Path('tests/Solqaryn.Tests/TestResults').rglob('c0304-m0506.trx'))
          assert len(paths)==1, f'expected one real regression TRX, got {len(paths)}'
          root=ET.parse(paths[0]).getroot()
          counts=next((e.attrib for e in root.iter() if e.tag.endswith('Counters')),None)
          assert counts, 'TRX counters missing'
          assert int(counts['executed'])>=10, counts
          assert int(counts['passed'])>=10, counts
          assert int(counts['failed'])==0, counts
          assert int(counts['notExecuted'])==0, counts
          assert int(counts.get('error','0'))==0, counts
          print('C0304_M0506_REGRESSION_MYSQL84_PASS=TRUE')
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c03-04-m05-06-regression-trx
          path: backend/tests/Solqaryn.Tests/TestResults/**/c0304-m0506.trx
          if-no-files-found: error
          retention-days: 14
