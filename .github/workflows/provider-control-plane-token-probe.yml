name: Provider control-plane token probe

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/provider-control-plane-token-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: DEV
    steps:
      - name: Probe provider tokens without exposing values
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${VERCEL_TOKEN:-}" ]; then echo "VERCEL_TOKEN_PRESENT=yes"; else echo "VERCEL_TOKEN_PRESENT=no"; fi
          if [ -n "${RENDER_API_KEY:-}" ]; then echo "RENDER_API_KEY_PRESENT=yes"; else echo "RENDER_API_KEY_PRESENT=no"; fi
          if [ -n "${RENDER_TOKEN:-}" ]; then echo "RENDER_TOKEN_PRESENT=yes"; else echo "RENDER_TOKEN_PRESENT=no"; fi
          echo "SECRET_VALUES_PRINTED=no"
