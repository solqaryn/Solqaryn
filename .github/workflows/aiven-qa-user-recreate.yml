name: DEV - Recreate Aiven QA user least privilege

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/aiven-qa-user-recreate.yml'

permissions:
  contents: read

jobs:
  recreate:
    name: Recreate solqaryn_qa_user sin privilegios globales
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV
    env:
      AIVEN_TOKEN: ${{ secrets.SOLQARYN_AIVEN_TOKEN }}
      DB_HOST: ${{ vars.SOLQARYN_DEV_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_DEV_DB_PORT }}
      AIVEN_PROJECT: solqaryn
      AIVEN_SERVICE: solqaryn-mysql
      QA_USER: solqaryn_qa_user
      QA_DB: solqaryn_qa
    steps:
      - name: Instalar cliente MySQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Resolver credenciales actuales QA y avnadmin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          token=os.environ['AIVEN_TOKEN'].strip()
          project=urllib.parse.quote(os.environ['AIVEN_PROJECT'], safe='')
          service=urllib.parse.quote(os.environ['AIVEN_SERVICE'], safe='')
          root=f'https://api.aiven.io/v1/project/{project}/service/{service}/user'

          def get_password(username):
              url=f'{root}/{urllib.parse.quote(username,safe="")}?include_secrets=true'
              req=urllib.request.Request(url,headers={
                  'Authorization':f'aivenv1 {token}',
                  'Accept':'application/json',
                  'User-Agent':'SOLQARYN-Aiven-QA-Least-Privilege/1.0'
              })
              with urllib.request.urlopen(req,timeout=30) as resp:
                  payload=json.load(resp)
              def find(v):
                  if isinstance(v,dict):
                      for k,x in v.items():
                          if k.lower()=='password' and isinstance(x,str) and x and x!='<redacted>':
                              return x
                      for x in v.values():
                          p=find(x)
                          if p: return p
                  elif isinstance(v,list):
                      for x in v:
                          p=find(x)
                          if p: return p
              password=find(payload)
              if not password:
                  raise SystemExit(f'Password no disponible para {username}.')
              return password

          qa_password=get_password(os.environ['QA_USER'])
          admin_password=get_password('avnadmin')
          print(f'::add-mask::{qa_password}')
          print(f'::add-mask::{admin_password}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
              f.write(f'QA_PASSWORD_CURRENT={qa_password}\n')
              f.write(f'AVNADMIN_PASSWORD={admin_password}\n')
          PY

      - name: Preflight QA actual
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$QA_PASSWORD_CURRENT"
          actual="$(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$QA_USER" --ssl-mode=REQUIRED "$QA_DB" --batch --skip-column-names -e 'SELECT DATABASE();')"
          test "$actual" = "$QA_DB"

      - name: Recreate usuario QA con grants Aiven vacios y mismo password
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          token=os.environ['AIVEN_TOKEN'].strip()
          project=urllib.parse.quote(os.environ['AIVEN_PROJECT'], safe='')
          service=urllib.parse.quote(os.environ['AIVEN_SERVICE'], safe='')
          username=os.environ['QA_USER']
          password=os.environ['QA_PASSWORD_CURRENT']
          root='https://api.aiven.io/v1'
          base=f'{root}/project/{project}/service/{service}/user'
          headers={
              'Authorization':f'aivenv1 {token}',
              'Accept':'application/json',
              'Content-Type':'application/json',
              'User-Agent':'SOLQARYN-Aiven-QA-Least-Privilege/1.0'
          }

          def req(url, method='GET', body=None):
              data=json.dumps(body).encode() if body is not None else None
              request=urllib.request.Request(url,data=data,headers=headers,method=method)
              try:
                  with urllib.request.urlopen(request,timeout=30) as resp:
                      raw=resp.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  detail=exc.read().decode('utf-8','replace')[:800]
                  raise SystemExit(f'Aiven HTTP {exc.code}: {detail}')

          user_url=f'{base}/{urllib.parse.quote(username,safe="")}'
          req(user_url, method='DELETE')
          req(base, method='POST', body={
              'username':username,
              'authentication':'caching_sha2_password',
              'mysql_grants':[]
          })
          req(user_url, method='PUT', body={
              'operation':'reset-credentials',
              'authentication':'caching_sha2_password',
              'new_password':password
          })
          print('AIVEN_QA_USER_RECREATED=PASS')
          PY

      - name: Conceder privilegios solo sobre solqaryn_qa
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$AVNADMIN_PASSWORD"

          ready=false
          for attempt in $(seq 1 20); do
            if mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u avnadmin --ssl-mode=REQUIRED mysql               -e "GRANT ALL PRIVILEGES ON \`solqaryn_qa\`.* TO 'solqaryn_qa_user'@'%';" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = "true"

      - name: Certificar password preservado y aislamiento total QA
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$QA_PASSWORD_CURRENT"

          ready=false
          for attempt in $(seq 1 20); do
            if mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$QA_USER" --ssl-mode=REQUIRED "$QA_DB" --batch --skip-column-names -e 'SELECT DATABASE();' >/tmp/qa-db.txt 2>/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = "true"
          test "$(cat /tmp/qa-db.txt)" = "$QA_DB"

          if mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$QA_USER" --ssl-mode=REQUIRED solqaryn_dev --batch --skip-column-names -e 'SHOW TABLES;' >/dev/null 2>&1; then
            echo "QA_TO_DEV=CROSS_ACCESS" >&2
            exit 41
          fi
          if mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$QA_USER" --ssl-mode=REQUIRED solqaryn_prod --batch --skip-column-names -e 'SHOW TABLES;' >/dev/null 2>&1; then
            echo "QA_TO_PROD=CROSS_ACCESS" >&2
            exit 42
          fi

          export MYSQL_PWD="$AVNADMIN_PASSWORD"
          grants="$(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u avnadmin --ssl-mode=REQUIRED mysql --batch --skip-column-names -e "SHOW GRANTS FOR 'solqaryn_qa_user'@'%';")"
          echo "$grants"
          echo "$grants" | grep -Fq 'GRANT USAGE ON *.* TO "solqaryn_qa_user"@"%"'
          echo "$grants" | grep -Fq 'GRANT ALL PRIVILEGES ON "solqaryn_qa".* TO "solqaryn_qa_user"@"%"'
          ! echo "$grants" | grep -Eq 'WITH GRANT OPTION|ROLE_ADMIN|REPLICATION_APPLIER|solqaryn_dev|solqaryn_prod'

          echo "AIVEN_QA_LEAST_PRIVILEGE=PASS"
