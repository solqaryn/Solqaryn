name: V22 C11-03.M03.06 - safe structured audit MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Infrastructure/Repositories/C1103OutboxAuditedRelay.cs'
      - 'backend/tests/Solqaryn.Tests/C1103M0306AuditedRelayMysqlTests.cs'
      - '.github/workflows/v22-c11-03-m03-06-audit-mysql.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c1103-m0306-${{ github.sha }}
  cancel-in-progress: false
jobs:
  audit:
    name: C11-03.M03.06 - physical MySQL 8.4 and safe audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=c1103_m0306_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify Scope Lock
        run: node scripts/verify-project-scope.mjs
      - name: Verify physical ephemeral MySQL 8.4
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION();' | grep -E '^8[.]4[.]'
      - name: Release build, selected Integration tests and TRX gate
        run: |
          set -euo pipefail
          dotnet restore backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet build backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-restore
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~C1103M0306AuditedRelayMysqlTests&Category=Integration' --logger 'trx;LogFileName=c1103-m0306-audit-mysql.trx'
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          found=list(Path('backend/tests/Solqaryn.Tests').rglob('c1103-m0306-audit-mysql.trx'))
          if len(found)!=1: raise SystemExit('C1103_M0306_TRX_MISSING_OR_DUPLICATED')
          root=ET.parse(found[0]).getroot()
          count=next((e.attrib for e in root.iter() if e.tag.endswith('Counters')),None)
          if count is None: raise SystemExit('C1103_M0306_TRX_NO_COUNTERS')
          values={k:int(count.get(k,-1)) for k in ('total','passed','failed','notExecuted')}
          print('C1103_M0306_ORACLE_EF_MYSQL84_AUDIT',values)
          if values!={'total':5,'passed':5,'failed':0,'notExecuted':0}:
              raise SystemExit('C1103_M0306_TRX_FAILURE')
          PY
