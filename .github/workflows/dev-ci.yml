name: DEV - Compilación y pruebas

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'backend/Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.*'
      - 'render.yaml'
      - 'global.json'
      - 'Directory.*'
      - '.github/workflows/dev-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Higiene del repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bloquear temporales y conflictos
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(node_modules|bin|obj|dist|\.angular|TestResults|playwright-report|test-results|coverage|tmp|temp)(/|$)|\.(log|tmp|temp|bak|swp|swo)$' || true)"
          test -z "$forbidden" || { echo "$forbidden" >&2; exit 1; }
          git diff --check HEAD~1 HEAD || git diff --check
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md'

  backend:
    name: Backend Release y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - run: dotnet restore Solqaryn.sln
      - run: dotnet build Solqaryn.sln --configuration Release --no-restore
      - run: dotnet test Solqaryn.sln --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=tests.trx"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-backend-tests
          path: backend/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend producción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build:prod

  migrations:
    name: Migraciones EF Oracle, variantes y cargas masivas en MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: Migration-CI-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: Solqaryn.CI
      Jwt__Audience: Solqaryn.CI.Frontend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restore y build
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
          dotnet tool restore
          test "$(dotnet tool run dotnet-ef --version | awk '{print $NF}')" = "10.0.12"
      - name: Bootstrap Oracle fresh
        env:
          SOLQARYN_DATABASE_BOOTSTRAP_MODE: fresh
        run: |
          set -euo pipefail
          dotnet run             --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj             --configuration Release             --no-build
          dotnet tool run dotnet-ef migrations has-pending-model-changes             --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj             --startup-project src/API/Solqaryn.API.csproj             --context AppDbContext             --configuration Release             --no-build
      - name: Validar historia Pomelo preservada y esquema Oracle
        working-directory: .
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          q(){ docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -Nse "$1"; }
          history_sources="$(find backend/src/Infrastructure/Migrations backend/src/Infrastructure/Persistence/Migrations -type f -name '*.cs' ! -name '*.Designer.cs' ! -name '*ModelSnapshot*' | wc -l)"
          test "$history_sources" = "107"
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")" = "1"
          test "$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='solqaryn_ci' AND table_name IN ('CargasMasivas','CargaMasivaErrores');")" = "2"
          test "$(q "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema='solqaryn_ci' AND table_name='CargasMasivas' AND index_name='IX_CargasMasivas_Tipo_HashArchivo';")" = "1"
          test "$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='solqaryn_ci' AND table_name='ExistenciasVariante';")" = "1"
          test "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='solqaryn_ci' AND table_name='MovimientosInventario' AND column_name='CorrelationId';")" = "1"
          echo "POMELO_HISTORY_SOURCE_FILES=$history_sources"
          echo "ORACLE_FRESH_SCHEMA=PASS"
      - name: Validar Preflight fail-closed y escenarios
        working-directory: .
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          ejecutar_preflight() {
            local cantidad
            cantidad="$(docker exec -i "$mysql_container" mysql -uroot -proot solqaryn_ci --batch --skip-column-names < backend/scripts/preflight-tipo-cliente-predeterminado.sql)"
            [[ "$cantidad" =~ ^[0-9]+$ ]]
            test "$cantidad" -le 1
          }
          trap 'docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -e "DELETE FROM TipoClientes WHERE Codigo = '\''TEST_DUP'\'';"' EXIT
          docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -e "UPDATE TipoClientes SET EsPredeterminado = 0 WHERE EsPredeterminado = 1;"
          ejecutar_preflight
          docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -e "UPDATE TipoClientes SET EsPredeterminado = 1 WHERE Codigo = 'SIN_CLASIFICAR';"
          ejecutar_preflight
          docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -e "INSERT INTO TipoClientes (Codigo, Nombre, NombreNormalizado, EsSistema, EsPredeterminado, Activo, Eliminado, ColorHex, Orden, FechaCreacion, FechaActualizacion) VALUES ('TEST_DUP', 'Test Duplicado', 'TEST DUPLICADO', 0, 1, 1, 0, '#FF0000', 99, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));"
          if ejecutar_preflight; then
            echo "El escenario duplicado debió ser rechazado." >&2
            exit 1
          fi
          docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -e "DELETE FROM TipoClientes WHERE Codigo='TEST_DUP';"
          ejecutar_preflight
      - name: Ejecutar pruebas de integración MySQL Oracle
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter "Category=Integration"

  deployment-config:
    name: Docker y aislamiento de entornos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar configuración
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.safe_load(File.read('render.yaml'), permitted_classes: [], aliases: true)"
          node -e "JSON.parse(require('fs').readFileSync('frontend/vercel.json', 'utf8'))"
          grep -q 'branch: dev' render.yaml
          grep -q 'name: solqaryn-api-dev' render.yaml
          grep -q 'healthCheckPath: /health' render.yaml
          grep -A1 'Database__ApplyMigrationsOnStartup' render.yaml | grep -q '"true"'
          grep -A1 'Cloudinary__EnvironmentPrefix' render.yaml | grep -q 'solqaryn_dev'
      - run: docker build --file backend/Dockerfile --tag solqaryn-api:dev-ci .

# Activación de certificación Bloque 2C.2; no modifica la lógica del workflow.
