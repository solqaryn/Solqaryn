name: DEV - Compilación y pruebas

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'backend/Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.*'
      - 'render.yaml'
      - 'global.json'
      - 'Directory.*'
      - 'scripts/security/ci-impact-routing.mjs'
      - 'scripts/ci/reuse-dev-ci-evidence.mjs'
      - '.github/workflows/solqaryn-core-ci.yml'
      - '.github/workflows/dev-ci.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - 'backend/Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.*'
      - 'render.yaml'
      - 'global.json'
      - 'Directory.*'
      - 'scripts/security/ci-impact-routing.mjs'
      - 'scripts/ci/reuse-dev-ci-evidence.mjs'
      - '.github/workflows/solqaryn-core-ci.yml'
      - '.github/workflows/dev-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # La CI de cada push protegido a dev debe terminar, incluso cuando otro PR se fusiona.
  # Solo los runs de pull_request se sustituyen al recibir un HEAD mas nuevo del mismo PR.
  group: dev-ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  impact:
    name: Impacto CI - clasificacion MySQL fail-closed
    runs-on: ubuntu-latest
    outputs:
      run_mysql_integration: ${{ steps.classify.outputs.run_mysql_integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Probar clasificador de impacto (positivos y negativos)
        run: node scripts/security/ci-impact-routing.mjs --self-test
      - name: Clasificar diff exacto
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/security/ci-impact-routing.mjs --github-output
  hygiene:
    name: Higiene del repositorio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bloquear temporales y conflictos
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(node_modules|bin|obj|dist|\.angular|TestResults|playwright-report|test-results|coverage|tmp|temp)(/|$)|\.(log|tmp|temp|bak|swp|swo)$' || true)"
          test -z "$forbidden" || { echo "$forbidden" >&2; exit 1; }
          git diff --check HEAD~1 HEAD || git diff --check
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md'

  backend:
    name: Backend Release y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - run: dotnet restore Solqaryn.sln
      - run: dotnet build Solqaryn.sln --configuration Release --no-restore
      - run: dotnet test Solqaryn.sln --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=tests.trx"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-backend-tests
          path: backend/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend producción
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build:prod

  migrations:
    name: Migraciones EF Oracle, variantes y cargas masivas en MySQL 8.4
    needs: impact
    if: needs.impact.outputs.run_mysql_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      # El test Oracle EF exige su propio esquema efimero separado y conexion loopback.
      C1502_M0503_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_c1502_m0503;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      # CI-only loopback MySQL 8.4 for the existing integration traits.
      # Each xUnit suite creates a uniquely named isolated database, no Aiven/prod.
      C0404_M0304_MYSQL: "Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0404_M0305_MYSQL: "Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0404_M0306_MYSQL: "Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      # V22: cuatro pruebas existentes de Integration exigen sus propias variables de MySQL 8.4 efimero.
      C0404_M0503_MYSQL: "Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0404_M0504_MYSQL: "Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0404_M0505_MYSQL: "Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0404_M0604_MYSQL: "Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      # V22 R2 causal repair: 13 legacy integration suites require explicit local ephemeral MySQL flags.
      # Same disposable mysql:8.4 service; each name is read only by its test, never Aiven or PROD.
      C0401_M0604_MYSQL: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0701_M0304_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=c0701_m0304_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0402_M0303_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0701_M0305_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_c0701_catalog;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0402_M0304_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0401_M0305_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_c0401_dispatch;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0601_M0303_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      # V22 DEV03: regression real 139/140: C06-01.M03.04 requires explicit ephemeral MySQL 8.4 connection.
      # Test creates and rolls back a random isolated schema; never Aiven/QA/PROD.
      C0601_M0304_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      # V22 DEV03: integration suite runs unfiltered; a missing variable must fail-closed, never skip tests.
      C0601_M0305_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      # V22 R2: C06-01.M03.06 durable-audit tests create isolated schemas; fail closed without this loopback credential.
      C0601_M0306_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      # C01-04.M03.06: true InnoDB audit integration, disposable loopback-only schema; never Aiven.
      C0104_M0306_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      # V23 DEV01 R2: required global Category=Integration includes C04-02.M03.06 durable audit.
      # Use only the disposable mysql:8.4 container; fail-closed tests remain enabled.
      C0402_M0306_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0401_M0304_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_c1502_m0503;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0701_M0303_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0701_M0306_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_c0701_audit;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      # V22 DEV03: physical catalog acceptance requires a named disposable bootstrap schema.
      C0701_M0503_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=c0701_m0503_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      # V22 C06-01.M03.05 CI repair: Category=Integration includes the real /productos JWT+Oracle EF test.
      # Fail closed in tests unless pointed at the disposable mysql:8.4 service; never Aiven/QA/PROD.
      C0701_M0606_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=c0701_m0606_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      # V23 DEV05 R2: required global Category=Integration includes signed JWT/HTTP/tenant A-B C14-02.M06.06.
      # Fail closed on missing loopback MySQL 8.4; the xUnit creates its own disposable schema.
      C1402_M0606_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=c1402_m0606_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0401_M0503_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0401_M0306_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=c0401_m0306_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      C0401_M0303_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
      Jwt__Secret: Migration-CI-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: Solqaryn.CI
      Jwt__Audience: Solqaryn.CI.Frontend
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Reutilizar NuGet para migraciones MySQL sin omitir pruebas
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-solqaryn-net10-nuget-${{ hashFiles('backend/**/*.csproj', 'backend/**/*.props', 'backend/**/*.targets', 'global.json') }}
      - name: Restore y build
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
          dotnet tool restore
          dotnet tool run dotnet-ef --version | grep -F '10.0.12'
      - name: Bootstrap Oracle fresh
        env:
          SOLQARYN_DATABASE_BOOTSTRAP_MODE: fresh
        run: |
          set -euo pipefail
          dotnet run             --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj             --configuration Release             --no-build
          dotnet tool run dotnet-ef migrations has-pending-model-changes             --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj             --startup-project src/API/Solqaryn.API.csproj             --context AppDbContext             --configuration Release             --no-build
      - name: Validar historia Pomelo preservada y esquema Oracle
        working-directory: .
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          q(){ docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -Nse "$1"; }
          history_sources="$(find backend/src/Infrastructure/Migrations backend/src/Infrastructure/Persistence/Migrations -type f -name '*.cs' ! -name '*.Designer.cs' ! -name '*ModelSnapshot*' | wc -l)"
          test "$history_sources" = "107"
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")" = "1"
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261117215700_V19WhatsAppE164LiteralPlus';")" = "1"
          test "$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='solqaryn_ci' AND table_name IN ('CargasMasivas','CargaMasivaErrores');")" = "2"
          test "$(q "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema='solqaryn_ci' AND table_name='CargasMasivas' AND index_name='IX_CargasMasivas_Tipo_HashArchivo';")" = "1"
          test "$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='solqaryn_ci' AND table_name='ExistenciasVariante';")" = "1"
          test "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='solqaryn_ci' AND table_name='MovimientosInventario' AND column_name='CorrelationId';")" = "1"
          echo "POMELO_HISTORY_SOURCE_FILES=$history_sources"
          echo "ORACLE_FRESH_SCHEMA=PASS"
      - name: Validar Preflight fail-closed y escenarios
        working-directory: .
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          ejecutar_preflight() {
            local cantidad
            cantidad="$(docker exec -i "$mysql_container" mysql -uroot -proot solqaryn_ci --batch --skip-column-names < backend/scripts/preflight-tipo-cliente-predeterminado.sql)"
            [[ "$cantidad" =~ ^[0-9]+$ ]]
            test "$cantidad" -le 1
          }
          trap 'docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -e "DELETE FROM TipoClientes WHERE Codigo = '\''TEST_DUP'\'';"' EXIT
          docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -e "UPDATE TipoClientes SET EsPredeterminado = 0 WHERE EsPredeterminado = 1;"
          ejecutar_preflight
          docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -e "UPDATE TipoClientes SET EsPredeterminado = 1 WHERE Codigo = 'SIN_CLASIFICAR';"
          ejecutar_preflight

          # Para probar el fail-closed del preflight necesitamos crear un estado imposible
          # bajo el índice único canónico. Sólo en esta BD efímera se retira el índice,
          # se materializa el duplicado, se exige rechazo y luego se restaura la invariante.
          docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -e "ALTER TABLE TipoClientes DROP INDEX IX_TipoClientes_EsPredeterminadoUnico;"
          docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -e "INSERT INTO TipoClientes (Codigo, Nombre, NombreNormalizado, EsSistema, EsPredeterminado, Activo, Eliminado, ColorHex, Orden, FechaCreacion, FechaActualizacion) VALUES ('TEST_DUP', 'Test Duplicado', 'TEST DUPLICADO', 0, 1, 1, 0, '#FF0000', 99, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));"
          if ejecutar_preflight; then
            echo "El escenario duplicado debió ser rechazado." >&2
            exit 1
          fi
          docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -e "DELETE FROM TipoClientes WHERE Codigo='TEST_DUP';"
          docker exec "$mysql_container" mysql -uroot -proot solqaryn_ci -e "CREATE UNIQUE INDEX IX_TipoClientes_EsPredeterminadoUnico ON TipoClientes (EsPredeterminadoUnico);"
          ejecutar_preflight
      - name: Preparar MySQL 8.4 efimero separado para tests Oracle EF
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          # Solo el contenedor descartable del job; nunca Aiven ni produccion.
          docker exec "$mysql_container" mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS solqaryn_c1502_m0503 CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          actual="$(docker exec "$mysql_container" mysql -uroot -proot -Nse "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name='solqaryn_c1502_m0503';")"
          test "$actual" = "1"
          echo "C1502_M0503_MYSQL84_EPHEMERAL_DB_READY=1"
          # Isolated schemas needed by fail-closed integration tests; ephemeral GitHub-hosted service only.
          docker exec "$mysql_container" mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS c0701_m0304_bootstrap CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          docker exec "$mysql_container" mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS solqaryn_c0701_catalog CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          docker exec "$mysql_container" mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS c0701_m0503_bootstrap CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          docker exec "$mysql_container" mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS solqaryn_c0401_dispatch CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          docker exec "$mysql_container" mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS solqaryn_c0701_audit CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          docker exec "$mysql_container" mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS c0401_m0306_bootstrap CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          # V23 DEV05: C14 signed JWT MySQL test opens its bootstrap DB before first query.
          # Create and assert only the ephemeral MySQL 8.4 schema; no external database.
          docker exec "$mysql_container" mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS c1402_m0606_bootstrap CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
          c1402_ready="$(docker exec "$mysql_container" mysql -uroot -proot -Nse "SELECT COUNT(*) FROM information_schema.schemata WHERE schema_name='c1402_m0606_bootstrap';")"
          test "$c1402_ready" = "1"
          echo "C1402_M0606_MYSQL84_BOOTSTRAP_READY=1"
          echo "V22_EPHEMERAL_MYSQL13_TEST_SCHEMAS_READY=1"
      - name: Ejecutar pruebas de integración MySQL Oracle
        run: |
          set -euo pipefail
          # V22 C06-01.M03.05: the 2026-11-21 real MySQL 8.4.13 integration job
          # was cancelled by its 35-minute limit while xUnit was still executing.
          # Keep every Category=Integration test; identify a stalled individual test.
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter "Category=Integration" --blame-hang --blame-hang-timeout 12m --blame-hang-dump-type none --logger "trx;LogFileName=dev-ci-mysql84.trx"
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import json
          import os
          paths = list(Path('tests/Solqaryn.Tests').rglob('dev-ci-mysql84.trx'))
          if len(paths) != 1:
              raise SystemExit('FAIL_MYSQL84_MISSING_UNIQUE_TRX')
          root = ET.parse(paths[0]).getroot()
          counters = root.find('.//{*}Counters')
          if counters is None:
              raise SystemExit('FAIL_MYSQL84_MISSING_TRX_COUNTERS')
          stats = {k: int(counters.attrib.get(k, -1))
                   for k in ('total', 'passed', 'failed', 'notExecuted')}
          print('DEV_CI_MYSQL84_INTEGRATION_TRX', stats)
          if (stats['total'] < 144 or stats['passed'] != stats['total']
                  or stats['failed'] != 0 or stats['notExecuted'] != 0):
              raise SystemExit('FAIL_MYSQL84_INTEGRATION_INCOMPLETE')
          # V31 C14: retain only the allowlisted Fact identity/outcome, never raw TRX,
          # stdout, exception text, JWT, fixture values or connection strings.
          class_name = 'Solqaryn.Tests.Integration.C1402M0606ProductDeleteRealHttpMysql84Tests'
          method_name = 'RealDeleteRequiresLiveTenantGrantAndRollsBackProductVariantsAndAudit'
          test_ids = set()
          for definition in root.findall('.//{*}UnitTest'):
              method = definition.find('{*}TestMethod')
              test_id = definition.get('id')
              if (method is not None and test_id
                      and method.get('className', '').split(',')[0] == class_name
                      and method.get('name') == method_name):
                  test_ids.add(test_id)
          outcomes = []
          for result in root.findall('.//{*}UnitTestResult'):
              if result.get('testId') in test_ids:
                  outcome = result.get('outcome', 'Unknown')
                  outcomes.append(outcome if outcome in ('Passed', 'Failed', 'NotExecuted', 'Skipped', 'Inconclusive') else 'Unknown')
          evidence = {'sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                      'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                      'test': class_name + '.' + method_name, 'matched_results': len(outcomes),
                      'outcomes': outcomes, 'suite_counters': stats}
          print('C1402_M0606_DELETE_FACT_EVIDENCE', json.dumps(evidence, sort_keys=True))
          Path('c1402-m0606-mysql84-evidence.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          # V44 R10: sanitized exact Fact identity; never upload raw TRX or fixture values.
          class_name = 'Solqaryn.Tests.C1503M0505CargaMasivaOwnershipIntegrationTests'
          method_name = 'RealMySqlJobsRequireLiveTenantMembershipAndCreatorEvenWithLegacyAdmin'
          definitions = [d for d in root.findall('.//{*}UnitTest') if d.find('{*}TestMethod') is not None and d.find('{*}TestMethod').get('className', '').split(',')[0] == class_name and d.find('{*}TestMethod').get('name') == method_name]
          if len(definitions) != 1 or not definitions[0].get('id'):
              raise SystemExit('FAIL_C1503_M0505_FACT_DEFINITION_NOT_UNIQUE')
          matched_id = definitions[0].get('id')
          if sum(d.get('id') == matched_id for d in root.findall('.//{*}UnitTest')) != 1:
              raise SystemExit('FAIL_C1503_M0505_FACT_ID_NOT_UNIQUE')
          outcomes = [r.get('outcome', 'Unknown') for r in root.findall('.//{*}UnitTestResult') if r.get('testId') == matched_id]
          if outcomes != ['Passed']:
              raise SystemExit('FAIL_C1503_M0505_FACT_RESULT_NOT_UNIQUE_PASS')
