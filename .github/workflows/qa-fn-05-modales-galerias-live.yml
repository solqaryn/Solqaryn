name: QA - FN-05 modales y galerias reales A/B
on:
  push:
    branches: [qa]
    paths:
      - '.github/workflows/qa-fn-05-modales-galerias-live.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: qa-fn-05-live-admin
  cancel-in-progress: false
jobs:
  modales:
    name: Modales de envio autenticados A/B sobre frontend corregido
    if: github.repository == 'solqaryn/Solqaryn' && github.ref == 'refs/heads/qa' && github.event.before == 'b0cc65cfa99c27f2adaf370230bbd9e62dea6df9'
    runs-on: ubuntu-latest
    environment: QA
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar alcance y evidencia de versiones desplegadas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa
          node scripts/verify-project-scope.mjs
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code dea277293408751b1b49416a8164e1392e80a483 HEAD -- backend render.yaml
          # Los tres gates generales se disparan por este cambio frontend.
          # Consultar exclusivamente el SHA actual; no volver a ejecutar ninguno.
          deadline=$((SECONDS+900))
          for workflow in 'QA - Compilación y pruebas' 'QA - Barrido integral de rutas' 'QA - Certificación viva'; do
            while true; do
              runs="$(gh api "repos/solqaryn/Solqaryn/actions/runs?branch=qa&head_sha=$GITHUB_SHA&event=push&per_page=100")"
              state="$(jq -c --arg name "$workflow" --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.name == $name and .head_sha == $sha and .head_branch == "qa")] | sort_by(.created_at, .id) | last // empty' <<<"$runs")"
              if test -n "$state" && jq -e '.status == "completed"' <<<"$state" >/dev/null; then
                jq -e '.conclusion == "success"' <<<"$state" >/dev/null
                jq -r '"QA_CAUSAL_GATE_" + (.id|tostring) + "=PASS"' <<<"$state"
                break
              fi
              test "$SECONDS" -lt "$deadline" || { echo "QA_CAUSAL_GATE_TIMEOUT"; exit 1; }
              sleep 15
            done
          done
          gh api repos/solqaryn/Solqaryn/actions/runs/46027530182 | jq -e '.head_sha == "dea277293408751b1b49416a8164e1392e80a483" and .head_branch == "qa" and .status == "completed" and .conclusion == "success"' >/dev/null
          while true; do
            status="$(gh api "repos/solqaryn/Solqaryn/commits/$GITHUB_SHA/status" | jq -r '[.statuses[] | select(.context == "Vercel – solqaryn_qa")][0].state // "pending"')"
            if test "$status" = success; then echo QA_VERCEL_CAUSAL=PASS; break; fi
            test "$status" != failure && test "$status" != error
            test "$SECONDS" -lt "$deadline" || { echo QA_VERCEL_CAUSAL_TIMEOUT; exit 1; }
            sleep 15
          done
          node --check .github/qa/qa-fn-05-v3-browser.mjs
          python3 -m py_compile .github/qa/qa-fn-05-v3-shipping-ui.py .github/qa/qa-fn-05-v3-galerias-live.py
      - name: Preparar cliente MySQL y BCrypt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mysql-client apache2-utils
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar navegador
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Certificar modales en Vercel QA - movil A y escritorio B
        env:
          QA_SHIPPING_RETRY_DESKTOP: '0'
          EXPECTED_DEPLOYED_SHA: 'dea277293408751b1b49416a8164e1392e80a483'
          DB_HOST: ${{ vars.SOLQARYN_QA_DB_HOST }}
          DB_PORT: ${{ vars.SOLQARYN_QA_DB_PORT }}
          DB_NAME: ${{ vars.SOLQARYN_QA_DB_NAME }}
          DB_USER: ${{ vars.SOLQARYN_QA_DB_USER }}
          DB_PASSWORD: ${{ secrets.SOLQARYN_QA_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/qa/qa-fn-05-v3-shipping-ui.py
  galerias:
    name: Galerias de categorias con persistencia y aislamiento A/B
    needs: modales
    if: ${{ github.repository == 'solqaryn/Solqaryn' && github.ref == 'refs/heads/qa' && github.event.before == 'b0cc65cfa99c27f2adaf370230bbd9e62dea6df9' && needs.modales.result == 'success' }}
    runs-on: ubuntu-latest
    environment: QA
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verificar alcance y evidencia de versiones desplegadas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa
          node scripts/verify-project-scope.mjs
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code dea277293408751b1b49416a8164e1392e80a483 HEAD -- backend render.yaml
          # Los tres gates generales se disparan por este cambio frontend.
          # Consultar exclusivamente el SHA actual; no volver a ejecutar ninguno.
          deadline=$((SECONDS+900))
          for workflow in 'QA - Compilación y pruebas' 'QA - Barrido integral de rutas' 'QA - Certificación viva'; do
            while true; do
              runs="$(gh api "repos/solqaryn/Solqaryn/actions/runs?branch=qa&head_sha=$GITHUB_SHA&event=push&per_page=100")"
              state="$(jq -c --arg name "$workflow" --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.name == $name and .head_sha == $sha and .head_branch == "qa")] | sort_by(.created_at, .id) | last // empty' <<<"$runs")"
              if test -n "$state" && jq -e '.status == "completed"' <<<"$state" >/dev/null; then
                jq -e '.conclusion == "success"' <<<"$state" >/dev/null
                jq -r '"QA_CAUSAL_GATE_" + (.id|tostring) + "=PASS"' <<<"$state"
                break
              fi
              test "$SECONDS" -lt "$deadline" || { echo "QA_CAUSAL_GATE_TIMEOUT"; exit 1; }
              sleep 15
            done
          done
          gh api repos/solqaryn/Solqaryn/actions/runs/46027530182 | jq -e '.head_sha == "dea277293408751b1b49416a8164e1392e80a483" and .head_branch == "qa" and .status == "completed" and .conclusion == "success"' >/dev/null
          while true; do
            status="$(gh api "repos/solqaryn/Solqaryn/commits/$GITHUB_SHA/status" | jq -r '[.statuses[] | select(.context == "Vercel – solqaryn_qa")][0].state // "pending"')"
            if test "$status" = success; then echo QA_VERCEL_CAUSAL=PASS; break; fi
            test "$status" != failure && test "$status" != error
            test "$SECONDS" -lt "$deadline" || { echo QA_VERCEL_CAUSAL_TIMEOUT; exit 1; }
            sleep 15
          done
          node --check .github/qa/qa-fn-05-v3-browser.mjs
          python3 -m py_compile .github/qa/qa-fn-05-v3-shipping-ui.py .github/qa/qa-fn-05-v3-galerias-live.py
      - name: Preparar cliente MySQL y BCrypt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mysql-client apache2-utils
      - name: Certificar operaciones reales y limpieza de fixtures
        env:
          EXPECTED_DEPLOYED_SHA: 'dea277293408751b1b49416a8164e1392e80a483'
          DB_HOST: ${{ vars.SOLQARYN_QA_DB_HOST }}
          DB_PORT: ${{ vars.SOLQARYN_QA_DB_PORT }}
          DB_NAME: ${{ vars.SOLQARYN_QA_DB_NAME }}
          DB_USER: ${{ vars.SOLQARYN_QA_DB_USER }}
          DB_PASSWORD: ${{ secrets.SOLQARYN_QA_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/qa/qa-fn-05-v3-galerias-live.py
