name: V20 C02-03.M03.01 - Tenant lifecycle domain security
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Domain/AutomationV5/V5TenantLifecycleDomainRules.cs'
      - 'backend/tests/Solqaryn.Tests/Domain/V5TenantLifecycleDomainRulesTests.cs'
      - '.github/workflows/v20-c02-03-m03-01-lifecycle-domain.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c0203-m0301-${{ github.sha }}
  cancel-in-progress: false
jobs:
  lifecycle-domain:
    name: C02-03.M03.01 - .NET 10 lifecycle deny by default
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Verify project Scope Lock
        run: node scripts/verify-project-scope.mjs
      - name: Restore and build net10 Release
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: Run actual lifecycle positive and adversarial xUnit tests
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~V5TenantLifecycleDomainRulesTests" --logger "console;verbosity=normal"
          echo "C0203_M0301_LIFECYCLE_DOMAIN_TESTS_COMPLETED"
