name: DEV MF3 - A/B/C JWT real sin escrituras comerciales

on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/dev-mf3-live-abc-readonly.yml
      - scripts/ci/mf3-abc-membership-readonly.sh
      - scripts/ci/mf3-abc-live-readonly.mjs
  push:
    branches: [dev]
    paths:
      - .github/workflows/dev-mf3-live-abc-readonly.yml
      - scripts/ci/mf3-abc-membership-readonly.sh
      - scripts/ci/mf3-abc-live-readonly.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solqaryn-dev-mf3-live-abc-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Contrato de certificación (sin secretos)
    if: github.repository == 'solqaryn/Solqaryn'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Gate identidad de proyecto
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'solqaryn/Solqaryn'
          node scripts/verify-project-scope.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar shell y contrato JWT sin datos
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci/mf3-abc-membership-readonly.sh
          node --check scripts/ci/mf3-abc-live-readonly.mjs
          node scripts/ci/mf3-abc-live-readonly.mjs --self-test

  real-abc:
    name: DEV real — membresía, JWT y aislamiento A/B/C
    needs: [contract]
    if: github.repository == 'solqaryn/Solqaryn' && github.ref == 'refs/heads/dev' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: DEV
    timeout-minutes: 20
    env:
      API_ORIGIN: https://solqaryn-api-dev-fxx8.onrender.com
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Identidad exacta de DEV
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'solqaryn/Solqaryn'
          test "$GITHUB_REF" = 'refs/heads/dev'
          test "$GITHUB_SHA" = "$(git rev-parse HEAD)"
          test "$API_ORIGIN" = 'https://solqaryn-api-dev-fxx8.onrender.com'
          node scripts/verify-project-scope.mjs
      - name: Instalar cliente MySQL para consulta inmutable
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq > /dev/null
          sudo apt-get install -qq -y mysql-client > /dev/null
      - name: Confirmar empresa propia de cada cuenta en MySQL DEV (solo SELECT)
        shell: bash
        env:
          DB_HOST: ${{ vars.SOLQARYN_DEV_DB_HOST }}
          DB_PORT: ${{ vars.SOLQARYN_DEV_DB_PORT }}
          DB_NAME: ${{ vars.SOLQARYN_DEV_DB_NAME }}
          DB_USER: ${{ vars.SOLQARYN_DEV_DB_USER }}
          DB_PASSWORD: ${{ secrets.SOLQARYN_DEV_DB_PASSWORD }}
          # Los nombres A/B nuevos se verifican contra IDs 2/3. Los slots
          # originales B/C guardan sus contraseñas; el slot A anterior queda C (ID 1).
          SOLQARYN_DEV_A_USERNAME: admin_prueba_a
          SOLQARYN_DEV_B_USERNAME: admin_prueba_b
          SOLQARYN_DEV_C_USERNAME: ${{ secrets.SOLQARYN_DEV_A_USERNAME }}
          SOLQARYN_DEV_A_EXPECTED_COMPANY_ID: '2'
          SOLQARYN_DEV_B_EXPECTED_COMPANY_ID: '3'
          SOLQARYN_DEV_C_EXPECTED_COMPANY_ID: '1'
        run: bash scripts/ci/mf3-abc-membership-readonly.sh
      - name: Prueba HTTP JWT propia y cruzada A/B/C contra Render DEV (solo GET)
        shell: bash
        env:
          # Mantener cada contraseña ligada a la cuenta que ya validó el preflight.
          SOLQARYN_DEV_A_USERNAME: admin_prueba_a
          SOLQARYN_DEV_A_PASSWORD: ${{ secrets.SOLQARYN_DEV_B_PASSWORD }}
          SOLQARYN_DEV_B_USERNAME: admin_prueba_b
          SOLQARYN_DEV_B_PASSWORD: ${{ secrets.SOLQARYN_DEV_C_PASSWORD }}
          SOLQARYN_DEV_C_USERNAME: ${{ secrets.SOLQARYN_DEV_A_USERNAME }}
          SOLQARYN_DEV_C_PASSWORD: ${{ secrets.SOLQARYN_DEV_A_PASSWORD }}
        run: |
          set -euo pipefail
          node scripts/ci/mf3-abc-live-readonly.mjs
      - name: Certificado sin PII ni tokens
        if: success()
        shell: bash
        run: |
          {
            echo '## MF3 — DEV real A/B/C'
            echo '- Tres identidades activas independientes / tres empresas activas: PASS'
            echo '- JWT reales y contexto empresarial propio: PASS'
            echo '- Rechazo cruzado y respuesta de permisos empresarial: PASS'
            echo '- GET /roles A/B: con permiso valida lectura tenant-scoped; sin permiso valida 403 RBAC o 503 TENANT_DATA_ISOLATION_REQUIRED en lista y detalle'
            echo '- GET /roles/{id} cruzado: PASS cuando hay roles privados A/B; si no, se informa NO_FIXTURE'
            echo '- Lecturas comerciales certificadas sólo por grants + flags: PASS'
            echo '- Operaciones de escritura comercial: NO ejecutadas'
            echo '- Secretos y tokens: no volcados a artefactos ni summaries'
            echo "- Commit DEV probado: \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
