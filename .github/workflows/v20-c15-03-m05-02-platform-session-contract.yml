name: V20 C15-03.M05.02 - platform session API DTO contract
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/API/Controllers/C1503M0502PlataformaSesionApiContractTests.cs'
      - 'backend/src/API/Controllers/PlataformaSesionController.cs'
      - '.github/workflows/v20-c15-03-m05-02-platform-session-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c1503-m0502-${{ github.sha }}
  cancel-in-progress: false
jobs:
  api-dto:
    name: C15-03.M05.02 - xUnit plataforma session DTO negative contract
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Scope Lock STRICT
        run: node scripts/verify-project-scope.mjs
      - name: Restore Release
        run: dotnet restore backend/Solqaryn.sln
      - name: Build Release
        run: dotnet build backend/Solqaryn.sln --configuration Release --no-restore
      - name: Real xUnit controller and DTO contract
        run: dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~C1503M0502PlataformaSesionApiContractTests" --logger "console;verbosity=normal"
