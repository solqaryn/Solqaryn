name: V22 C15-05.M06.04 real isolated Git rollback
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/quality/v22-c15-05-m06-04-rollback.test.mjs'
      - '.github/workflows/v22-c15-05-m06-04-rollback.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c15-05-m06-04
  cancel-in-progress: false
jobs:
  rollback-ephemeral-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Real Git revert and adversarial fail-closed controls
        run: node --test scripts/quality/v22-c15-05-m06-04-rollback.test.mjs
