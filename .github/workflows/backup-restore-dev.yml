name: SOLQARYN - Backup y restauración en DEV

on:
  push:
    branches:
      - dev
    paths:
      - backend/tools/Solqaryn.DatabaseBootstrap/**
      - backend/src/Infrastructure.Migrations/**
      - backend/src/Infrastructure/Persistence/CanonicalMySqlPhysicalContract.cs
      - scripts/backup_dev.sh
      - scripts/restore_dev.sh
      - .github/workflows/backup-restore-dev.yml
      - backend/src/Infrastructure/Migrations/**
      - docs/BACKUP_RESTORE_DESARROLLO_RUNBOOK.md
  pull_request:
    branches:
      - dev
    paths:
      - backend/tools/Solqaryn.DatabaseBootstrap/**
      - backend/src/Infrastructure.Migrations/**
      - backend/src/Infrastructure/Persistence/CanonicalMySqlPhysicalContract.cs
      - scripts/backup_dev.sh
      - scripts/restore_dev.sh
      - .github/workflows/backup-restore-dev.yml
      - backend/src/Infrastructure/Migrations/**
      - docs/BACKUP_RESTORE_DESARROLLO_RUNBOOK.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solqaryn-backup-restore-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backup-restore-drill:
    name: Backup cifrado y restore MySQL descartable
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_m11_source
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: '5005'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=solqaryn_m11_source;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: 'SOLQARYN-CI-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'Solqaryn.API'
      Jwt__Audience: 'Solqaryn.Frontend'
      Jwt__ExpiraMinutos: '120'
      Security__LoginRateLimitPerMinute: '300'
      SeedAdmin__Username: 'm11_restore_admin'
      SeedAdmin__Password: 'SOLQARYN.Restore#2026!'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      AppSettings__BackendPublicUrl: 'https://preview.solqaryn.invalid'
      Cloudinary__CloudName: 'ci-not-used'
      Cloudinary__ApiKey: 'ci-not-used'
      Cloudinary__ApiSecret: 'ci-not-used'
      SOLQARYN_BACKUP_CI_PASSPHRASE: 'M11-CI-Disposable-Backup-Key-2026-Only'

    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Scope lock, toolchain y MySQL estricto
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          (cd .. && node scripts/verify-project-scope.mjs)
          test "$(dotnet --version)" = "10.0.401"
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
          dotnet tool restore
          dotnet tool run dotnet-ef --version | grep -F "10.0.12"
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot -e "SET GLOBAL sql_require_primary_key=ON;"
          test "$(docker exec "$mysql_container" mysql -uroot -proot -Nse "SELECT @@GLOBAL.sql_require_primary_key;")" = 1

      - name: Crear esquema Oracle EF10 fresh canónico
        working-directory: backend
        shell: bash
        env:
          SOLQARYN_DATABASE_BOOTSTRAP_MODE: fresh
        run: |
          set -euo pipefail
          dotnet run --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj --configuration Release --no-build | tee "$RUNNER_TEMP/solqaryn-m11-bootstrap.log"
          grep -F "SOLQARYN_ORACLE_BOOTSTRAP=PASS mode=fresh tables=136 pending=0" "$RUNNER_TEMP/solqaryn-m11-bootstrap.log"
          dotnet tool run dotnet-ef migrations has-pending-model-changes             --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj             --startup-project src/API/Solqaryn.API.csproj             --context AppDbContext             --configuration Release --no-build
          export MYSQL_PWD=root
          test "$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot solqaryn_m11_source -Nse "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")" = 1
          unset MYSQL_PWD
          echo "PHASE11_ORACLE_EPHEMERAL_SOURCE=PASS"

      - name: Sembrar registros y referencias de activos SOLQARYN
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot solqaryn_m11_source <<'SQL'
          INSERT INTO Productos
            (Nombre, Marca, Modelo, TipoInventario, Cantidad, Costo, Precio, UmbralStockBajo,
             Activo, Eliminado, FechaCreacion, FechaActualizacion)
          VALUES
            ('Producto Sentinel SOLQARYN', 'Marca SOLQARYN', 'Modelo SOLQARYN', 0, 0, 125.5000, 199.9900, 5,
             1, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));
          SET @producto_id = LAST_INSERT_ID();

          INSERT INTO ProductoImagenes
            (ProductoId, ProductoVarianteId, Url, PublicId, Orden, EsPrincipal, FechaCreacion)
          VALUES
            (@producto_id, NULL, 'https://assets.invalid/backup-drill/producto-sentinel.webp',
             'dev/backup-drill/producto-sentinel', 0, 1, UTC_TIMESTAMP(6));

          INSERT INTO Compras
            (NumeroCompra, Fecha, ProveedorNombre, Estado, EstadoPago, MetodoPago,
             Subtotal, Descuento, Impuesto, Total, Eliminado, FechaCreacion, FechaActualizacion)
          VALUES
            ('SOLQARYN-BACKUP-001', UTC_TIMESTAMP(6), 'Proveedor Sentinel SOLQARYN', 0, 0, 0,
             100.0000, 0.0000, 0.0000, 100.0000, 0, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6));
          SET @compra_id = LAST_INSERT_ID();

          INSERT INTO CompraDocumentos
            (CompraId, NombreOriginal, ContentType, SizeBytes, Url, PublicId, ResourceType,
             Eliminado, FechaCreacion)
          VALUES
            (@compra_id, 'factura-m11.pdf', 'application/pdf', 3210,
             'https://assets.invalid/backup-drill/factura-sentinel.pdf',
             'dev/backup-drill/factura-sentinel', 'raw', 0, UTC_TIMESTAMP(6));
          SQL
          unset MYSQL_PWD

      - name: Probar retención aislada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/solqaryn-backups"
          touch "$RUNNER_TEMP/solqaryn-backups/solqaryn-dev-20000101T000000Z.tar.gz.gpg"
          touch "$RUNNER_TEMP/solqaryn-backups/solqaryn-dev-20000101T000000Z.tar.gz.gpg.sha256"
          touch "$RUNNER_TEMP/solqaryn-backups/solqaryn-dev-20000101T000000Z.meta.json"
          touch "$RUNNER_TEMP/solqaryn-backups/NO_ELIMINAR.txt"
          touch -d '30 days ago' "$RUNNER_TEMP/solqaryn-backups/solqaryn-dev-20000101T000000Z.tar.gz.gpg" \
            "$RUNNER_TEMP/solqaryn-backups/solqaryn-dev-20000101T000000Z.tar.gz.gpg.sha256" \
            "$RUNNER_TEMP/solqaryn-backups/solqaryn-dev-20000101T000000Z.meta.json"

      - name: Ejecutar backup SOLQARYN cifrado
        id: backup
        shell: bash
        env:
          SOLQARYN_ENVIRONMENT: ci
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: solqaryn_m11_source
          DB_USER: root
          DB_PASSWORD: root
          BACKUP_PASSPHRASE: ${{ env.SOLQARYN_BACKUP_CI_PASSPHRASE }}
          OUTPUT_DIR: ${{ runner.temp }}/solqaryn-backups
          RETENTION_DAYS: '14'
          BACKUP_LABEL: dev
        run: |
          set -euo pipefail
          chmod +x scripts/backup_dev.sh scripts/restore_dev.sh
          scripts/backup_dev.sh | tee "$RUNNER_TEMP/solqaryn-backup.log"
          backup_file="$(grep '^SOLQARYN_BACKUP_FILE=' "$RUNNER_TEMP/solqaryn-backup.log" | cut -d= -f2-)"
          checksum_file="$(grep '^SOLQARYN_BACKUP_SHA256=' "$RUNNER_TEMP/solqaryn-backup.log" | cut -d= -f2-)"
          metadata_file="$(grep '^SOLQARYN_BACKUP_METADATA=' "$RUNNER_TEMP/solqaryn-backup.log" | cut -d= -f2-)"
          test -s "$backup_file"
          test -s "$checksum_file"
          test -s "$metadata_file"
          test ! -e "$RUNNER_TEMP/solqaryn-backups/solqaryn-dev-20000101T000000Z.tar.gz.gpg"
          test -e "$RUNNER_TEMP/solqaryn-backups/NO_ELIMINAR.txt"
          test "$(stat -c '%a' "$backup_file")" = 600
          echo "backup_file=$backup_file" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$checksum_file" >> "$GITHUB_OUTPUT"
          echo "metadata_file=$metadata_file" >> "$GITHUB_OUTPUT"

      - name: Confirmar que solo persiste material cifrado
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find "$RUNNER_TEMP/solqaryn-backups" -maxdepth 1 -type f \( -name '*.sql' -o -name '*.tar.gz' \) -print -quit)"
          grep -q '"encrypted": true' "${{ steps.backup.outputs.metadata_file }}"
          grep -q '"productionInScope": false' "${{ steps.backup.outputs.metadata_file }}"

      - name: Restaurar en base descartable y validar integridad
        id: restore
        shell: bash
        env:
          RESTORE_ENVIRONMENT: ci
          TARGET_DB_HOST: 127.0.0.1
          TARGET_DB_PORT: '3306'
          TARGET_DB_NAME: solqaryn_m11_restore
          TARGET_DB_USER: root
          TARGET_DB_PASSWORD: root
          BACKUP_PASSPHRASE: ${{ env.SOLQARYN_BACKUP_CI_PASSPHRASE }}
          BACKUP_FILE: ${{ steps.backup.outputs.backup_file }}
          BACKUP_CHECKSUM_FILE: ${{ steps.backup.outputs.checksum_file }}
          ALLOW_DESTRUCTIVE_RESTORE: YES_SOLQARYN_DISPOSABLE_RESTORE
          RESTORE_FILES_DIR: ${{ runner.temp }}/solqaryn-restored-files
          RESTORE_REPORT_PATH: ${{ runner.temp }}/solqaryn-restore-report.json
        run: |
          set -euo pipefail
          scripts/restore_dev.sh | tee "$RUNNER_TEMP/solqaryn-restore.log"
          test -s "$RUNNER_TEMP/solqaryn-restore-report.json"
          grep -q '"status": "SUCCESS"' "$RUNNER_TEMP/solqaryn-restore-report.json"
          grep -q '"productionTouched": false' "$RUNNER_TEMP/solqaryn-restore-report.json"
          grep -q 'dev/backup-drill/producto-sentinel' "$RUNNER_TEMP/solqaryn-restored-files/references/producto-imagenes.tsv"
          grep -q 'dev/backup-drill/factura-sentinel' "$RUNNER_TEMP/solqaryn-restored-files/references/compra-documentos.tsv"

      - name: Verificar datos sentinel tras restore
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          test "$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot solqaryn_m11_restore -Nse "SELECT COUNT(*) FROM Productos WHERE Nombre='Producto Sentinel SOLQARYN';")" = 1
          test "$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot solqaryn_m11_restore -Nse "SELECT COUNT(*) FROM ProductoImagenes WHERE PublicId='dev/backup-drill/producto-sentinel';")" = 1
          test "$(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot solqaryn_m11_restore -Nse "SELECT COUNT(*) FROM CompraDocumentos WHERE PublicId='dev/backup-drill/factura-sentinel';")" = 1
          unset MYSQL_PWD

      - name: Certificar baseline Oracle restaurado y conteos
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          q() { mysql --protocol=TCP -h 127.0.0.1 -P 3306 -uroot solqaryn_m11_restore -Nse "$1"; }
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")" = 1
          test "$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE' AND TABLE_NAME <> '__EFMigrationsHistory';")" = 136
          unset MYSQL_PWD
          echo "PHASE11_ORACLE_RESTORE_CONTRACT=PASS tables=136 baseline=1"

      - name: Arrancar API contra restore descartable
        working-directory: backend
        shell: bash
        env:
          ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=solqaryn_m11_restore;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
        run: |
          set -euo pipefail
          dotnet build Solqaryn.sln --configuration Release --no-restore
          nohup dotnet run \
            --project src/API/Solqaryn.API.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            > "$RUNNER_TEMP/solqaryn-restored-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/solqaryn-restored-api.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5005/health > /dev/null && \
               curl --fail --silent http://127.0.0.1:5005/health/ready > /dev/null; then
              echo 'API restaurada SOLQARYN saludable.'
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/solqaryn-restored-api.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/solqaryn-restored-api.log" >&2 || true
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/solqaryn-restored-api.log" >&2 || true
          exit 1

      - name: Validar protecciones fail-closed
        shell: bash
        run: |
          set -euo pipefail
          if SOLQARYN_ENVIRONMENT=produccion \
             DB_HOST=127.0.0.1 DB_PORT=3306 DB_NAME=storefront_produccion DB_USER=root DB_PASSWORD=root \
             BACKUP_PASSPHRASE="$SOLQARYN_BACKUP_CI_PASSPHRASE" \
             scripts/backup_dev.sh > /dev/null 2>&1; then
            echo 'El backup no bloqueó Producción.' >&2
            exit 1
          fi

          if RESTORE_ENVIRONMENT=dev-descartable \
             TARGET_DB_HOST=127.0.0.1 TARGET_DB_PORT=3306 TARGET_DB_NAME=solqaryn_dev \
             TARGET_DB_USER=root TARGET_DB_PASSWORD=root BACKUP_PASSPHRASE="$SOLQARYN_BACKUP_CI_PASSPHRASE" \
             BACKUP_FILE="${{ steps.backup.outputs.backup_file }}" \
             BACKUP_CHECKSUM_FILE="${{ steps.backup.outputs.checksum_file }}" \
             ALLOW_DESTRUCTIVE_RESTORE=YES_SOLQARYN_DISPOSABLE_RESTORE \
             scripts/restore_dev.sh > /dev/null 2>&1; then
            echo 'El restore permitió un destino no descartable.' >&2
            exit 1
          fi

      - name: Publicar evidencia SOLQARYN cifrada y reporte de restore
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solqaryn-backup-restore-dev
          path: |
            ${{ runner.temp }}/solqaryn-backups/*.tar.gz.gpg
            ${{ runner.temp }}/solqaryn-backups/*.tar.gz.gpg.sha256
            ${{ runner.temp }}/solqaryn-backups/*.meta.json
            ${{ runner.temp }}/solqaryn-restore-report.json
            ${{ runner.temp }}/solqaryn-backup.log
            ${{ runner.temp }}/solqaryn-restore.log
            ${{ runner.temp }}/solqaryn-restored-api.log
          if-no-files-found: warn
          retention-days: 14
