name: V22 C04-04.M03.03 - payment authorization deny by default
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Application/AutomationV5/C0404PaymentAuthorizationGate.cs'
      - 'backend/tests/Solqaryn.Tests/Application/C0404M0303PaymentAuthorizationGateTests.cs'
      - 'backend/tests/Solqaryn.Tests/API/C0404M0303VerifiedReaderTests.cs'
      - 'backend/src/API/Security/C0404PaymentVerifiedEvidenceReader.cs'
      - 'backend/src/API/Program.cs'
      - '.github/workflows/v22-c04-04-m03-03-authorization.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0404-m0303-${{ github.sha }}
  cancel-in-progress: false
jobs:
  authorization:
    name: C04-04.M03.03 - backend tenant denial xUnit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restore and Release build
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: Exact-SHA xUnit with TRX
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c0404-m0303"
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~C0404M0303PaymentAuthorizationGateTests|FullyQualifiedName~C0404M0303VerifiedReaderTests' --logger 'trx;LogFileName=scope.trx' --results-directory "$RUNNER_TEMP/c0404-m0303"
          python3 - <<'PY'
          import os,sys,xml.etree.ElementTree as ET
          p=os.path.join(os.environ['RUNNER_TEMP'],'c0404-m0303','scope.trx')
          c=ET.parse(p).getroot().find('.//{*}Counters')
          if c is None:sys.exit('NO_TRX')
          total=int(c.get('total','0'));passed=int(c.get('passed','0'));failed=int(c.get('failed','0'));skipped=int(c.get('notExecuted','0'))
          if total<18 or total!=passed or failed or skipped:sys.exit(f'NO_GO total={total} pass={passed} fail={failed} skip={skipped}')
          print(f'GITHUB_HOSTED_REAL_PASS {passed}/{total} SHA={os.environ["GITHUB_SHA"]}')
          PY
