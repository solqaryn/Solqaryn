name: DEV - Punto 8 Angular bundle

on:
  push:
    branches:
      - p8-angular-bundle-20260929
    paths:
      - frontend/**
      - .github/workflows/p8-angular-bundle.yml
  pull_request:
    branches:
      - dev
    paths:
      - frontend/**
      - .github/workflows/p8-angular-bundle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Angular stats, lint and production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Static validation
        working-directory: frontend
        run: npm run lint

      - name: Production stats and bundle baseline
        working-directory: frontend
        run: npm run perf:bundle-baseline

      - name: Upload bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: punto-8-angular-bundle
          path: |
            frontend/dist/inventoryapp-frontend/**/stats.json
            frontend/dist/inventoryapp-frontend/performance-bundle-baseline.json
            frontend/dist/inventoryapp-frontend/angular-stats-summary.json
          if-no-files-found: warn
          retention-days: 7
