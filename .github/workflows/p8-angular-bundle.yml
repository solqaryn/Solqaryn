name: DEV - Punto 8 Angular bundle

on:
  push:
    branches:
      - p8-angular-bundle-20260929
    paths:
      - frontend/**
      - .github/workflows/p8-angular-bundle.yml
  pull_request:
    branches:
      - dev
    paths:
      - frontend/**
      - .github/workflows/p8-angular-bundle.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Angular stats, lint and production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Static validation
        working-directory: frontend
        run: npm run lint

      - name: Production stats and bundle baseline
        working-directory: frontend
        run: npm run perf:bundle-baseline

      - name: Persist measured summary on branch
        if: github.event_name == 'push' && success()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/evidencias
          cp frontend/dist/solqaryn-frontend/performance-bundle-baseline.json docs/evidencias/DEV_PUNTO_8_BUNDLE_BASELINE.json
          cp frontend/dist/solqaryn-frontend/angular-stats-summary.json docs/evidencias/DEV_PUNTO_8_ANGULAR_STATS_SUMMARY.json
          git config user.name "solqaryn-actions"
          git config user.email "actions@users.noreply.github.com"
          git add docs/evidencias/DEV_PUNTO_8_BUNDLE_BASELINE.json docs/evidencias/DEV_PUNTO_8_ANGULAR_STATS_SUMMARY.json
          if git diff --cached --quiet; then
            echo "Bundle evidence unchanged."
            exit 0
          fi
          git commit -m "docs(perf): capture Point 8 Angular bundle baseline [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload bundle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: punto-8-angular-bundle
          path: |
            frontend/dist/solqaryn-frontend/**/stats.json
            frontend/dist/solqaryn-frontend/performance-bundle-baseline.json
            frontend/dist/solqaryn-frontend/angular-stats-summary.json
          if-no-files-found: warn
          retention-days: 7
