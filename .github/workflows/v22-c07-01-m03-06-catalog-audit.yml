name: V22 C07-01.M03.06 catalog audit isolated MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Infrastructure/AutomationV5/C0701IsolatedCatalogAuditSink.cs'
      - 'backend/tests/Solqaryn.Tests/Integration/C0701M0306CatalogAuditTests.cs'
      - '.github/workflows/v22-c07-01-m03-06-catalog-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0701-m0306-${{ github.sha }}
  cancel-in-progress: false
jobs:
  isolated-audit:
    name: C07-01.M03.06 - real MySQL 8.4 tenant audit TRX
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v22-audit-only
          MYSQL_DATABASE: solqaryn_c0701_audit
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v22-audit-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0701_M0306_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_c0701_audit;User=root;Password=ephemeral-v22-audit-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Verify Scope Lock exact SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Real MySQL 8.4 isolated tenant audit and negative integration
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0701M0306CatalogAuditTests' --logger 'trx;LogFileName=C0701M0306Audit.trx' --verbosity normal
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = list(Path("tests/Solqaryn.Tests/TestResults").rglob("C0701M0306Audit.trx"))
          assert len(paths) == 1, paths
          root = ET.parse(paths[0]).getroot()
          ns = {"t":"http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          c = root.find(".//t:Counters", ns)
          assert c is not None
          d = c.attrib
          assert int(d["total"]) >= 1 and int(d["executed"]) == int(d["total"]), d
          assert int(d["passed"]) == int(d["total"]), d
          assert int(d["failed"]) == 0 and int(d["notExecuted"]) == 0, d
          print("V22_C0701_MYSQL84_AUDIT_TRX_PASS", d)
          PY
