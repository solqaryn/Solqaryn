name: VAEP N5.7.C effective EF snapshot exact-head gate

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/vaep-n57c-snapshot-repair-probe.yml
      - backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.N43C.cs
      - backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.N57C.cs
      - backend/src/Infrastructure/Migrations/20260910113300_N5_7_C_DashboardKpiConfiguraciones.cs
      - backend/src/Infrastructure/Persistence/AppDbContext.cs
      - backend/src/Infrastructure/Persistence/Configurations/DashboardKpiConfiguracionConfiguration.cs
      - backend/src/Domain/Entities/DashboardKpiConfiguracion.cs

permissions:
  contents: read
  actions: read

concurrency:
  group: vaep-n57c-snapshot-repair-probe
  cancel-in-progress: true

jobs:
  verify-effective-snapshot:
    name: Verify N5.7.C effective EF snapshot exact head
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout exact DEV head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restore
        run: dotnet restore Solqaryn.sln

      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 10.0.12

      - name: Build exact head
        run: dotnet build Solqaryn.sln --configuration Release --no-restore

      - name: Verify effective snapshot has no pending model changes
        shell: bash
        run: |
          set -euo pipefail
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext 2>&1 | tee vaep-n57c-exact-head-model-gate.log
          grep -q 'DashboardKpiConfiguracion' src/Infrastructure/Migrations/AppDbContextModelSnapshot.N57C.cs
          grep -q 'ApplyN57CModel(modelBuilder);' src/Infrastructure/Migrations/AppDbContextModelSnapshot.N43C.cs

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vaep-n57c-exact-head-model-gate
          path: backend/vaep-n57c-exact-head-model-gate.log
          if-no-files-found: warn
          retention-days: 2
