name: ERP-N0.3 - Certificación ProductoVariante autoridad única

on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/**/*ProductoVariante*.cs'
      - 'backend/src/**/*TipoCatalogoProducto*.cs'
      - 'backend/src/Infrastructure/Migrations/20260811032000_N0_3_ConsolidarProductoVariante.cs'
      - 'backend/tests/Solqaryn.Tests/ProductoVarianteAuthorityTests.cs'
      - 'backend/tests/Solqaryn.Tests/ProductoVarianteServiceTests.cs'
      - 'backend/tests/Solqaryn.Tests/N03AutoridadOperativaRegressionTests.cs'
      - 'backend/scripts/*erp-n0-3*'
      - 'backend/scripts/check-erp-n0-3-runtime.py'
      - '.github/workflows/erp-n0-3-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/**/*ProductoVariante*.cs'
      - 'backend/src/**/*TipoCatalogoProducto*.cs'
      - 'backend/src/Infrastructure/Migrations/20260811032000_N0_3_ConsolidarProductoVariante.cs'
      - 'backend/tests/Solqaryn.Tests/ProductoVarianteAuthorityTests.cs'
      - 'backend/tests/Solqaryn.Tests/ProductoVarianteServiceTests.cs'
      - 'backend/tests/Solqaryn.Tests/N03AutoridadOperativaRegressionTests.cs'
      - 'backend/scripts/*erp-n0-3*'
      - 'backend/scripts/check-erp-n0-3-runtime.py'
      - '.github/workflows/erp-n0-3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-n0-3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autoridad-variante:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_n03_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=solqaryn_n03_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: ERP-N0-3-CI-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: Solqaryn.CI
      Jwt__Audience: Solqaryn.CI.Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.401' }
      - name: Guardas runtime N0.3
        run: python3 backend/scripts/check-erp-n0-3-runtime.py
      - name: Restaurar, compilar y probar backend
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln -c Release --no-restore -warnaserror
          dotnet test Solqaryn.sln -c Release --no-build
      - name: Instalar EF
        run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Crear esquema N0.2
        working-directory: backend
        run: |
          dotnet ef database update 20260811013917_N0_2_RetirarCatalogoProductoLegacy \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj --context AppDbContext
      - name: Sembrar caso representativo pre-N0.3
        shell: bash
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          docker exec "$c" mysql -uroot -proot solqaryn_n03_ci -e "
            INSERT INTO Marcas (Id,Nombre,Orden,Activo,Eliminado,FechaCreacion,FechaActualizacion) VALUES (9301,'N03 Marca',1,1,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));
            INSERT INTO Modelos (Id,MarcaId,Nombre,Orden,Activo,Eliminado,FechaCreacion,FechaActualizacion) VALUES (9302,9301,'N03 Modelo',1,1,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));
            INSERT INTO Colores (Id,Nombre,CodigoVisual,Orden,Activo,Eliminado,FechaCreacion,FechaActualizacion) VALUES (9303,'N03 Color','#112233',1,1,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));
            INSERT INTO Tallas (Id,Nombre,Orden,Activo,Eliminado,FechaCreacion,FechaActualizacion) VALUES (9304,'N03 Talla',1,1,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));
            INSERT INTO Productos (Id,Nombre,Marca,Modelo,Cantidad,Costo,Precio,UmbralStockBajo,MarcaId,ModeloId,ColorId,TallaId,Activo,Eliminado,FechaCreacion,FechaActualizacion)
              VALUES (9300,'N03 Producto','legacy marca','legacy modelo',7,10.00,20.00,2,9301,9302,9303,9304,1,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));
            INSERT INTO ProductoVariantes (Id,ProductoId,Sku,Cantidad,UmbralStockBajo,Costo,Precio,EsTecnica,Activo,Eliminado,FechaCreacion,FechaActualizacion)
              VALUES (9350,9300,'  tec-n03-9300  ',7,2,10.00,20.00,1,1,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));"
      - name: Preflight N0.3
        shell: bash
        run: |
          c="${{ job.services.mysql.id }}"
          test "$(docker exec -i "$c" mysql -uroot -proot solqaryn_n03_ci --batch --skip-column-names < backend/scripts/preflight-erp-n0-3-producto-variante.sql | tail -n 1)" = '0'
      - name: Aplicar N0.3 aislado
        working-directory: backend
        run: |
          dotnet ef database update 20260811032000_N0_3_ConsolidarProductoVariante \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj --context AppDbContext
      - name: Postcheck N0.3 y datos preservados
        shell: bash
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          test "$(docker exec -i "$c" mysql -uroot -proot solqaryn_n03_ci --batch --skip-column-names < backend/scripts/postdeploy-erp-n0-3-producto-variante.sql | tail -n 1)" = '0'
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n03_ci -Nse "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20260811032000_N0_3_ConsolidarProductoVariante';")" = '1'
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n03_ci -Nse "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20260811174745_N0_4_ConsolidarRbacRelacional';")" = '0'
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n03_ci -Nse "SELECT COUNT(*) FROM ProductoVariantes WHERE Id=9350 AND Sku='TEC-N03-9300' AND MarcaId=9301 AND ModeloId=9302 AND ColorId=9303 AND TallaId=9304 AND Cantidad=7 AND Costo=10.00 AND Precio=20.00 AND UmbralStockBajo=2;")" = '1'
          if docker exec "$c" mysql -uroot -proot solqaryn_n03_ci -e "UPDATE ProductoVariantes SET Sku=' ' WHERE Id=9350;"; then echo 'CHECK SKU vacío no bloqueó' >&2; exit 1; fi
          if docker exec "$c" mysql -uroot -proot solqaryn_n03_ci -e "UPDATE ProductoVariantes SET ModeloId=9302, MarcaId=NULL WHERE Id=9350;"; then echo 'CHECK Modelo/Marca no bloqueó' >&2; exit 1; fi
      - name: Snapshot EF consistente
        working-directory: backend
        run: |
          dotnet ef migrations has-pending-model-changes --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj --context AppDbContext
