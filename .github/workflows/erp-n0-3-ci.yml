name: ERP-N0.3 - Certificación ProductoVariante autoridad única

on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/**/*ProductoVariante*.cs'
      - 'backend/src/**/*TipoCatalogoProducto*.cs'
      - 'backend/src/Infrastructure/Migrations/20260811032000_N0_3_ConsolidarProductoVariante.cs'
      - 'backend/tests/Solqaryn.Tests/ProductoVarianteAuthorityTests.cs'
      - 'backend/tests/Solqaryn.Tests/ProductoVarianteServiceTests.cs'
      - 'backend/tests/Solqaryn.Tests/N03AutoridadOperativaRegressionTests.cs'
      - 'backend/scripts/*erp-n0-3*'
      - 'backend/scripts/check-erp-n0-3-runtime.py'
      - '.github/workflows/erp-n0-3-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/**/*ProductoVariante*.cs'
      - 'backend/src/**/*TipoCatalogoProducto*.cs'
      - 'backend/src/Infrastructure/Migrations/20260811032000_N0_3_ConsolidarProductoVariante.cs'
      - 'backend/tests/Solqaryn.Tests/ProductoVarianteAuthorityTests.cs'
      - 'backend/tests/Solqaryn.Tests/ProductoVarianteServiceTests.cs'
      - 'backend/tests/Solqaryn.Tests/N03AutoridadOperativaRegressionTests.cs'
      - 'backend/scripts/*erp-n0-3*'
      - 'backend/scripts/check-erp-n0-3-runtime.py'
      - '.github/workflows/erp-n0-3-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-n0-3-ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  autoridad-variante:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_n03_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=solqaryn_n03_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: ERP-N0-3-CI-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: Solqaryn.CI
      Jwt__Audience: Solqaryn.CI.Frontend
      # Pruebas fisicas originales: nunca ejecutar sin MySQL 8.4 efimero.
      C0404_M0305_MYSQL: 'Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0701_M0503_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=c0701_m0503_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0402_M0306_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_n03_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0401_M0303_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_n03_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0701_M0306_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_c0701_audit;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0404_M0504_MYSQL: 'Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0404_M0505_MYSQL: 'Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0401_M0503_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_n03_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C1502_M0503_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_c1502_m0503;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0701_M0304_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=c0701_m0304_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0404_M0604_MYSQL: 'Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0402_M0304_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_n03_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0401_M0604_MYSQL: 'Server=127.0.0.1;Port=3306;Database=solqaryn_n03_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0401_M0306_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=c0401_m0306_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0404_M0503_MYSQL: 'Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0404_M0304_MYSQL: 'Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0404_M0306_MYSQL: 'Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0401_M0304_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_c1502_m0503;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0601_M0305_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_n03_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C1402_M0606_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=c1402_m0606_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0104_M0306_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0701_M0303_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_n03_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0402_M0303_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_n03_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0701_M0305_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_c0701_catalog;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0701_M0606_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=c0701_m0606_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0601_M0304_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_n03_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0601_M0303_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_n03_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0401_M0305_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_c0401_dispatch;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      C0601_M0306_MYSQL_TEST: 'Server=127.0.0.1;Port=3306;Database=solqaryn_n03_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.401' }
      - name: Guardas runtime N0.3
        run: python3 backend/scripts/check-erp-n0-3-runtime.py
      - name: Preparar bases locales de integracion y redo MySQL 8.4
        shell: bash
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          docker exec "$c" mysql -uroot -proot -e "SET GLOBAL innodb_redo_log_capacity=536870912;"
          docker exec "$c" mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS c0701_m0503_bootstrap; CREATE DATABASE IF NOT EXISTS solqaryn_c0701_audit; CREATE DATABASE IF NOT EXISTS solqaryn_c1502_m0503; CREATE DATABASE IF NOT EXISTS c0701_m0304_bootstrap; CREATE DATABASE IF NOT EXISTS c0401_m0306_bootstrap; CREATE DATABASE IF NOT EXISTS c1402_m0606_bootstrap; CREATE DATABASE IF NOT EXISTS solqaryn_c0701_catalog; CREATE DATABASE IF NOT EXISTS c0701_m0606_bootstrap; CREATE DATABASE IF NOT EXISTS solqaryn_c0401_dispatch; CREATE DATABASE IF NOT EXISTS c0404_bootstrap; CREATE DATABASE IF NOT EXISTS solqaryn_ci;"
          docker exec "$c" mysql -uroot -proot -Nse "SELECT VERSION(), @@innodb_redo_log_capacity;"
      - name: Restaurar, compilar y probar backend
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln -c Release --no-restore -warnaserror
          dotnet test Solqaryn.sln -c Release --no-build
      # La migracion historica N0.2/N0.3 (Pomelo/EF8) esta fuera del assembly Oracle EF10.
      # No simular esa historia ni insertar marcadores falsos en __EFMigrationsHistory.
      # Validar el runtime real en un MySQL 8.4 descartable con bootstrap canonico.
      - name: Comprobar frontera Oracle EF10 y exclusión de migraciones legacy
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool restore
          dotnet tool run dotnet-ef migrations list \
            --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext --configuration Release --no-build --no-connect \
            | tee /tmp/n03-oracle-migrations.txt
          grep -Fq '20261006111818_OracleBaseline' /tmp/n03-oracle-migrations.txt
          grep -Fq '20261018200000_TenantRoleOwnershipDeterministicBackfill' /tmp/n03-oracle-migrations.txt
          if grep -Eq '20260811013917_N0_2_|20260811032000_N0_3_' /tmp/n03-oracle-migrations.txt; then
            echo 'ERROR: migracion legacy reintroducida en assembly Oracle productivo' >&2
            exit 1
          fi
          echo 'N03_ORACLE_MIGRATION_BOUNDARY=PASS historical_n02_n03=NOT_EXECUTED'
      - name: Bootstrap Oracle canónico fresco en MySQL 8.4 efímero
        working-directory: backend
        shell: bash
        env:
          SOLQARYN_DATABASE_BOOTSTRAP_MODE: fresh
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'solqaryn/Solqaryn'
          test "$ASPNETCORE_ENVIRONMENT" = 'Development'
          dotnet run --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj \
            --configuration Release --no-build | tee /tmp/n03-oracle-fresh.txt
          grep -Fq 'SOLQARYN_ORACLE_BOOTSTRAP=PASS mode=fresh' /tmp/n03-oracle-fresh.txt
          grep -Fq 'pending=0' /tmp/n03-oracle-fresh.txt
      - name: Contrato físico ProductoVariantes actual, tenant y FK en MySQL
        shell: bash
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          q() { docker exec "$c" mysql -uroot -proot solqaryn_n03_ci --batch --skip-column-names -e "$1"; }
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")" = '1'
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId LIKE '20260811%N0_%';")" = '0'
          test "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='ProductoVariantes' AND column_name IN ('EmpresaId','ProductoId','Sku','CodigoBarras','Cantidad','UmbralStockBajo','Costo','Precio','EsTecnica');")" = '9'
          test "$(q "SELECT COUNT(DISTINCT index_name) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='ProductoVariantes' AND index_name IN ('UX_ProductoVariantes_Empresa_Sku','UX_ProductoVariantes_Empresa_CodigoBarras','UX_ProductoVariantes_IdentidadActiva','IX_ProductoVariantes_ProductoTecnicoUnico');")" = '4'
          test "$(q "SELECT COUNT(*) FROM information_schema.key_column_usage WHERE table_schema=DATABASE() AND table_name='ProductoVariantes' AND constraint_name='FK_ProductoVariantes_Empresas_EmpresaId' AND referenced_table_name='Empresas';")" = '1'
          test "$(q "SELECT COUNT(DISTINCT referenced_table_name) FROM information_schema.key_column_usage WHERE table_schema=DATABASE() AND table_name='ProductoVariantes' AND referenced_table_name IN ('Empresas','Productos');")" = '2'
          # La verificación negativa usa la FK real y exige el error físico 1452.
          if docker exec "$c" mysql -uroot -proot solqaryn_n03_ci \
            -e "INSERT INTO ProductoVariantes (ProductoId,EmpresaId,Sku,Cantidad,UmbralStockBajo,EsTecnica,Activo,Eliminado) VALUES (2147483647,2147483647,'CI-ORPHAN-N03',0,0,0,1,0);" \
            > /tmp/n03-orphan-reject.log 2>&1; then
            echo 'ERROR: MySQL aceptó ProductoVariante huérfana/cross-tenant' >&2
            exit 1
          fi
          grep -Eq 'ERROR 1452|foreign key constraint fails' /tmp/n03-orphan-reject.log
          test "$(q "SELECT COUNT(*) FROM ProductoVariantes WHERE Sku='CI-ORPHAN-N03';")" = '0'
          echo 'N03_ORACLE_PHYSICAL=PASS mysql84=fresh tenant_fk=ENFORCED orphan=DENIED legacy_migration=NOT_EXECUTED'
      - name: Snapshot EF Oracle actual sin drift
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext --configuration Release --no-build
