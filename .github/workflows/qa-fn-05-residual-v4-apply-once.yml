name: QA - FN-05 V4 aplicacion unica segura

on:
  push:
    branches: [qa]
    paths:
      - '.github/workflows/qa-fn-05-residual-v4-apply-once.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: qa-fn-05-live-admin
  cancel-in-progress: false

jobs:
  verify-restore:
    if: github.repository == 'solqaryn/Solqaryn' && github.ref == 'refs/heads/qa' && github.event.before == 'c3bb43b245852f1e04092c7a6f525ca09e44b314' && github.run_attempt == 1
    name: QA respaldo recuperable, ensayo y aplicacion V4
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: QA
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: solqaryn-ci-qa-disposable-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psolqaryn-ci-qa-disposable-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: ${{ vars.SOLQARYN_QA_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_QA_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_QA_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_QA_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_QA_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.SOLQARYN_QA_BACKUP_PASSPHRASE }}
    steps:
      - name: Checkout QA (identidad)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard QA solo Aiven 8.4.11 y secretos
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "qa"
          python3 -m py_compile .github/qa/qa-commercial-v4-ef-verify.py .github/qa/qa-commercial-v4-source-verify.py .github/qa/qa-commercial-schema-v3.py
          node scripts/verify-project-scope.mjs
          test "$DB_HOST" = "solqaryn-mysql-solqaryn.h.aivencloud.com"
          test "$DB_PORT" = "14402"
          test "$DB_NAME" = "solqaryn_qa"
          test "$DB_USER" = "solqaryn_qa_user"
          test -n "$DB_PASSWORD" && test -n "$BACKUP_PASSPHRASE"
          # El repositorio es público: sólo se admite el respaldo cifrado con una clave de alta longitud ya existente.
          test "${#BACKUP_PASSPHRASE}" -ge 32 || { echo QA_RECOVERY_PASSPHRASE_TOO_SHORT; exit 1; }
          echo "QA_BACKUP_SCOPE=PASS"

      - name: Confirmar SHA exacto y seis gates causales
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(git rev-parse HEAD^)" = "c3bb43b245852f1e04092c7a6f525ca09e44b314"
          test "$(gh api repos/solqaryn/Solqaryn/branches/qa --jq '.commit.sha')" = "$GITHUB_SHA"
          git diff --exit-code c3bb43b245852f1e04092c7a6f525ca09e44b314 HEAD -- backend frontend render.yaml .agents scripts docs/PROJECT_SCOPE_LOCK.md AGENTS.md
          for id in 46153385655 46153385642 46153385653 46153385697 46153385759 46153385698; do
            gh api "repos/solqaryn/Solqaryn/actions/runs/$id" | jq -e '.head_sha == "c3bb43b245852f1e04092c7a6f525ca09e44b314" and .head_branch == "qa" and .status == "completed" and .conclusion == "success"' >/dev/null
            echo "QA_V4_CAUSAL_GATE=PASS run=$id"
          done
          echo QA_V4_CERTIFIED_CODE_EQUIVALENCE=PASS

      - name: Instalar cliente MySQL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Exigir mantenimiento y esquema V3 certificado antes del respaldo
        shell: bash
        run: |
          set -euo pipefail
          check_maintenance() {
            local body code
            body="$(mktemp)"
            code="$(curl --connect-timeout 10 --max-time 30 -sS -o "$body" -w '%{http_code}' https://solqaryn.onrender.com/metodos-pago/activos || true)"
            if [ "$code" = "503" ] && jq -e '.status == 503 and .title == "Servicio temporalmente en mantenimiento"' "$body" >/dev/null 2>&1; then
              rm -f "$body"
              return 0
            fi
            rm -f "$body"
            return 1
          }
          ready=false
          for attempt in $(seq 1 90); do
            if check_maintenance; then ready=true; break; fi
            sleep 10
          done
          test "$ready" = true || { echo QA_V4_MAINTENANCE_NOT_CONFIRMED; exit 1; }
          # Allow the previous service instance and in-flight requests to drain.
          sleep 30
          check_maintenance
          python3 .github/qa/qa-commercial-schema-v3.py --live
          echo QA_V4_MAINTENANCE=PASS

      - name: Backup transaccional de QA y cifrado AES-256 (sin dump en artefacto)
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          folder="$RUNNER_TEMP/solqaryn-qa-oracle-backup"
          mkdir -p "$folder"
          dump="$folder/qa.sql"
          enc="$folder/qa.sql.enc"
          trap 'rm -f "$dump"' EXIT
          export MYSQL_PWD="$DB_PASSWORD"
          version="$(mysql --protocol=TCP --ssl-mode=REQUIRED -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --batch --skip-column-names "$DB_NAME" -e 'SELECT VERSION();')"
          case "$version" in 8.4.11|8.4.11-*) ;; *) echo "QA_MYSQL_VERSION_INVALID: se exige 8.4.11; version observada: $version" >&2; exit 1;; esac
          echo "QA_BACKUP_AIVEN_MYSQL_VERSION=$version"
          mysqldump --protocol=TCP --ssl-mode=REQUIRED -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" \
            --single-transaction --skip-lock-tables --no-tablespaces --set-gtid-purged=OFF \
            --routines --triggers "$DB_NAME" > "$dump"
          test -s "$dump"
          sha256sum "$dump" | cut -d' ' -f1 > "$folder/qa-plaintext.sha256"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -pass env:BACKUP_PASSPHRASE -in "$dump" -out "$enc"
          test -s "$enc"
          (cd "$folder"; sha256sum qa.sql.enc > qa-encrypted.sha256)
          rm -f "$dump"
          trap - EXIT
          echo "encrypted=$enc" >> "$GITHUB_OUTPUT"
          echo "QA_BACKUP_ENCRYPTED=PASS"
          echo "QA_DATABASE_WRITES=0"

      - name: Restore real del respaldo cifrado en MySQL local efímero
        shell: bash
        env:
          ENCRYPTED_FILE: ${{ steps.backup.outputs.encrypted }}
        run: |
          set -euo pipefail
          test -s "$ENCRYPTED_FILE"
          folder="$(dirname "$ENCRYPTED_FILE")"
          (cd "$folder"; sha256sum -c qa-encrypted.sha256)
          actual="$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:BACKUP_PASSPHRASE -in "$ENCRYPTED_FILE" | sha256sum | cut -d' ' -f1)"
          test "$actual" = "$(cat "$folder/qa-plaintext.sha256")"
          export MYSQL_PWD=solqaryn-ci-qa-disposable-only
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root \
            -e 'CREATE DATABASE solqaryn_qa_restore_ephemeral CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          # El SQL descifrado fluye directamente a mysql local: no hay fichero SQL en disco.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -pass env:BACKUP_PASSPHRASE -in "$ENCRYPTED_FILE" |
            mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root solqaryn_qa_restore_ephemeral
          qlocal(){ mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root -Nse "$1" solqaryn_qa_restore_ephemeral; }
          export MYSQL_PWD="$DB_PASSWORD"
          qsource(){ mysql --protocol=TCP --ssl-mode=REQUIRED -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -Nse "$1" "$DB_NAME"; }
          sql="SELECT TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE' ORDER BY TABLE_NAME;"
          tables="$(qsource "$sql")"
          count=0
          while IFS= read -r tbl; do
            test -n "$tbl" || continue
            [[ "$tbl" =~ ^[A-Za-z0-9_]+$ ]] || { echo 'QA_RESTORE_TABLE_NAME_INVALID' >&2; exit 1; }
            a="$(qsource "SELECT COUNT(*) FROM \`$tbl\`;")"
            export MYSQL_PWD=solqaryn-ci-qa-disposable-only
            b="$(qlocal "SELECT COUNT(*) FROM \`$tbl\`;")"
            export MYSQL_PWD="$DB_PASSWORD"
            test "$a" = "$b" || { echo 'QA_RESTORE_ROWCOUNT_MISMATCH' >&2; exit 1; }
            count=$((count+1))
          done <<< "$tables"
          export MYSQL_PWD=solqaryn-ci-qa-disposable-only
          marker="$(qlocal "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")"
          gallery_marker="$(qlocal "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261125212000_CategoriasGalerias';")"
          gallery_table="$(qlocal "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='CategoriasGalerias' AND TABLE_TYPE='BASE TABLE';")"
          history="$(qlocal "SELECT COUNT(*) FROM __EFMigrationsHistory;")"
          test "$marker" = "1"
          case "$gallery_marker:$gallery_table:$count:$history" in
            1:1:138:112) ;;
            *) echo 'QA_RESTORE_TABLECOUNT_OR_HISTORY_DRIFT' >&2; exit 1 ;;
          esac
          echo "QA_BACKUP_RESTORE=PASS tables=$count history=$history rows_exact=YES oracle_marker=$marker category_gallery=$gallery_marker"
          echo "QA_ORIGINAL_DB_WRITES=0"


      - name: Conservar respaldo recuperable cifrado (sin datos en claro)
        id: recovery
        uses: actions/upload-artifact@v4
        with:
          name: qa-v4-pre-migration-encrypted-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/solqaryn-qa-oracle-backup/qa.sql.enc
            ${{ runner.temp }}/solqaryn-qa-oracle-backup/qa-encrypted.sha256
            ${{ runner.temp }}/solqaryn-qa-oracle-backup/qa-plaintext.sha256
          if-no-files-found: error
          retention-days: 14

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Apply exact EF V4 only to disposable loopback copy
        shell: bash
        env:
          LOCAL_MYSQL_PASSWORD: solqaryn-ci-qa-disposable-only
        run: |
          set -euo pipefail
          unset DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD BACKUP_PASSPHRASE
          export ConnectionStrings__DefaultConnection='Server=127.0.0.1;Port=3306;Database=solqaryn_qa_restore_ephemeral;User=root;Password=solqaryn-ci-qa-disposable-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
          python3 .github/qa/qa-commercial-v4-ef-verify.py capture
          pushd backend
          dotnet tool restore
          dotnet restore src/API/Solqaryn.API.csproj
          dotnet restore src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj
          dotnet ef migrations has-pending-model-changes --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj --startup-project src/API/Solqaryn.API.csproj --context AppDbContext --configuration Release
          dotnet ef migrations script 20261126223000_QaCommercialOwnershipV3 20261128150000_QaCommercialOwnershipV4 --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj --startup-project src/API/Solqaryn.API.csproj --context AppDbContext --configuration Release --no-build --output "$RUNNER_TEMP/qa-v4-exact.sql"
          test -s "$RUNNER_TEMP/qa-v4-exact.sql"
          sha256sum "$RUNNER_TEMP/qa-v4-exact.sql" > "$RUNNER_TEMP/qa-v4-exact.sha256"
          dotnet ef database update 20261128150000_QaCommercialOwnershipV4 --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj --startup-project src/API/Solqaryn.API.csproj --context AppDbContext --configuration Release --no-build
          popd
          python3 .github/qa/qa-commercial-v4-ef-verify.py verify
          echo QA_V4_REHEARSAL_WITH_BASELINE=PASS

      - name: Verificar respaldo publicado y estabilidad del origen antes de DDL
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_ARTIFACT_ID: ${{ steps.recovery.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RECOVERY_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          gh api "repos/solqaryn/Solqaryn/actions/artifacts/$RECOVERY_ARTIFACT_ID" | jq -e --arg rid "$GITHUB_RUN_ID" '.expired == false and .size_in_bytes > 0 and (.workflow_run.id | tostring) == $rid' >/dev/null
          test "$(gh api repos/solqaryn/Solqaryn/branches/qa --jq '.commit.sha')" = "$GITHUB_SHA"
          sha256sum -c "$RUNNER_TEMP/qa-v4-exact.sha256"
          check_maintenance() {
            local body code
            body="$(mktemp)"
            code="$(curl --connect-timeout 10 --max-time 30 -sS -o "$body" -w '%{http_code}' https://solqaryn.onrender.com/metodos-pago/activos || true)"
            if [ "$code" = "503" ] && jq -e '.status == 503 and .title == "Servicio temporalmente en mantenimiento"' "$body" >/dev/null 2>&1; then
              rm -f "$body"
              return 0
            fi
            rm -f "$body"
            return 1
          }
          check_maintenance
          python3 .github/qa/qa-commercial-schema-v3.py --live
          python3 .github/qa/qa-commercial-v4-source-verify.py source-baseline
          check_maintenance
          echo "QA_V4_RECOVERY_ARTIFACT_VERIFIED=PASS id=$RECOVERY_ARTIFACT_ID"

      - name: Aplicar una sola vez EF V4 en Aiven QA y verificar preservacion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = solqaryn/Solqaryn
          test "$GITHUB_REF" = refs/heads/qa
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(gh api repos/solqaryn/Solqaryn/branches/qa --jq '.commit.sha')" = "$GITHUB_SHA"
          test "$DB_HOST" = solqaryn-mysql-solqaryn.h.aivencloud.com
          test "$DB_PORT" = 14402
          test "$DB_NAME" = solqaryn_qa
          test "$DB_USER" = solqaryn_qa_user
          check_maintenance() {
            local body code
            body="$(mktemp)"
            code="$(curl --connect-timeout 10 --max-time 30 -sS -o "$body" -w '%{http_code}' https://solqaryn.onrender.com/metodos-pago/activos || true)"
            if [ "$code" = "503" ] && jq -e '.status == 503 and .title == "Servicio temporalmente en mantenimiento"' "$body" >/dev/null 2>&1; then
              rm -f "$body"
              return 0
            fi
            rm -f "$body"
            return 1
          }
          check_maintenance
          export MYSQL_PWD="$DB_PASSWORD"
          qsource(){ mysql --protocol=TCP --connect-timeout=12 --ssl-mode=REQUIRED -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -Nse "$1" "$DB_NAME"; }
          test "$(qsource "SELECT COUNT(*) FROM __EFMigrationsHistory")" = 112
          test "$(qsource "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261128150000_QaCommercialOwnershipV4'")" = 0
          test "$(qsource 'SELECT COUNT(*) FROM INFORMATION_SCHEMA.PROCESSLIST WHERE DB=DATABASE() AND ID<>CONNECTION_ID()')" = 0
          sha256sum -c "$RUNNER_TEMP/qa-v4-exact.sha256"
          export ConnectionStrings__DefaultConnection="$(python3 -c 'import os; p=os.environ["DB_PASSWORD"]; assert "\n" not in p and "\r" not in p; print("Server=solqaryn-mysql-solqaryn.h.aivencloud.com;Port=14402;Database=solqaryn_qa;User=solqaryn_qa_user;Password=\""+p.replace("\"","\"\"")+"\";SslMode=Required;")')"
          unset MYSQL_PWD
          printf '::add-mask::%s\n' "$ConnectionStrings__DefaultConnection"
          echo QA_V4_SOURCE_DDL_STARTED
          # MySQL DDL is not atomic. No retry or automatic destructive rollback.
          pushd backend
          if ! dotnet ef database update 20261128150000_QaCommercialOwnershipV4 --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj --startup-project src/API/Solqaryn.API.csproj --context AppDbContext --configuration Release --no-build > "$RUNNER_TEMP/qa-v4-apply-private.log" 2>&1; then
            echo QA_V4_SOURCE_DDL_FAILED_KEEP_MAINTENANCE_AND_BACKUP
            exit 1
          fi
          popd
          unset ConnectionStrings__DefaultConnection
          python3 .github/qa/qa-commercial-v4-source-verify.py source-after
          check_maintenance
          echo QA_V4_LIVE_MIGRATION=PASS
          echo QA_V4_BACKEND_MAINTENANCE_REMAINS_ENABLED

      - name: Remove encrypted temporary backup and fingerprints
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/solqaryn-qa-oracle-backup" "$RUNNER_TEMP/qa-v4-fingerprints.json" "$RUNNER_TEMP/qa-v4-exact.sql" "$RUNNER_TEMP/qa-v4-exact.sha256" "$RUNNER_TEMP/qa-v4-apply-private.log"
