name: P0-003.B - DEV parity evidence negative fixtures

on:
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/verify-p0-003-b-dev-parity.mjs'
      - '.github/workflows/p0-003-b-dev-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-dev-parity-negatives:
    name: P0-003.B - Native DEV parity negative fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Run one synthetic positive and thirteen negatives without provider credentials
        run: node scripts/verify-p0-003-b-dev-parity.mjs --self-test
