name: V22 C04-04.M06.04 - real MySQL 8.4 rollback preserves tenant A/B
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/C0404M0604RollbackAndDeactivationMySqlTests.cs'
      - 'backend/src/Infrastructure/AutomationV5/C0404PaymentReservationStore.cs'
      - '.github/workflows/v22-c04-04-m06-04-rollback-mysql.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0404-m0604-${{ github.sha }}
  cancel-in-progress: false
jobs:
  rollback-mysql:
    name: C04-04.M06.04 - MySQL 8.4 rollback and tenant data preservation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-c0404-m0604
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-c0404-m0604"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      C0404_M0604_MYSQL: 'Server=127.0.0.1;Port=3306;Database=c0404_bootstrap;User=root;Password=ephemeral-c0404-m0604;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Exact SHA Scope Lock and canonical Skill
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
          node scripts/verify-solqaryn-skills.mjs --self-test
      - name: Physical MySQL 8.4 rollback and preserved A/B data TRX
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet build backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore
          mkdir -p "$RUNNER_TEMP/c0404-m0604"
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~C0404M0604RollbackAndDeactivationMySqlTests&Category=Integration' --logger 'trx;LogFileName=rollback.trx' --results-directory "$RUNNER_TEMP/c0404-m0604"
          python3 - <<'PY'
          import os, xml.etree.ElementTree as ET
          path=os.path.join(os.environ['RUNNER_TEMP'],'c0404-m0604','rollback.trx')
          counters=ET.parse(path).getroot().find('.//{*}Counters')
          if counters is None: raise SystemExit('MISSING_TRX')
          values={k:int(counters.get(k,'-1')) for k in ('total','passed','failed','notExecuted')}
          print('M0604_MYSQL84_ROLLBACK_TENANT_AB',values,'SHA',os.environ['GITHUB_SHA'])
          if values != {'total':1,'passed':1,'failed':0,'notExecuted':0}:
              raise SystemExit('ROLLBACK_ISOLATION_EVIDENCE_NOT_CERTIFIED')
          PY
