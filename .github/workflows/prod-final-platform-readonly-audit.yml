name: PROD - Final platform read-only audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-final-platform-readonly-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: PROD
    env:
      DB_HOST: ${{ vars.SOLQARYN_PROD_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_PROD_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_PROD_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_PROD_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_PROD_DB_PASSWORD }}
      AIVEN_TOKEN: ${{ secrets.SOLQARYN_AIVEN_TOKEN }}
      RENDER_PROD: https://solqaryn-api-prod.onrender.com
    steps:
      - uses: actions/checkout@v4

      - name: Install audit tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y mysql-client jq dnsutils >/dev/null

      - name: Canonical PROD database read-only
        shell: bash
        run: |
          set -euo pipefail
          test "$DB_NAME" = "solqaryn_prod"
          test "$DB_USER" = "solqaryn_prod_user"
          test -n "$DB_PASSWORD"
          export MYSQL_PWD="$DB_PASSWORD"
          mysql_cmd=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" --batch --skip-column-names)
          db="$("${mysql_cmd[@]}" -e "SET SESSION TRANSACTION READ ONLY; START TRANSACTION READ ONLY; SELECT DATABASE(); COMMIT;")"
          test "$db" = "solqaryn_prod"
          tables="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';")"
          migrations="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM __EFMigrationsHistory;")"
          empresas="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM Empresas;" 2>/dev/null || printf '0')"
          productos="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM Productos;" 2>/dev/null || printf '0')"
          usuarios="$("${mysql_cmd[@]}" -e "SELECT COUNT(*) FROM Usuarios;" 2>/dev/null || printf '0')"
          echo "PROD_DB=solqaryn_prod"
          echo "PROD_BASE_TABLES=$tables"
          echo "PROD_EF_MIGRATIONS=$migrations"
          echo "PROD_EMPRESAS=$empresas"
          echo "PROD_PRODUCTOS=$productos"
          echo "PROD_USUARIOS=$usuarios"
          echo "PROD_DB_READ_ONLY=PASS"

      - name: Aiven corporate control plane and legacy-defaultdb read-only
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AIVEN_TOKEN"
          python3 - <<'PY'
          import json, os, urllib.request
          root="https://api.aiven.io/v1"
          token=os.environ["AIVEN_TOKEN"].strip()
          project="solqaryn"
          service="solqaryn-mysql"
          headers={"Authorization":f"aivenv1 {token}","Accept":"application/json","User-Agent":"SOLQARYN-PROD-FinalAudit/1.0"}
          def get(path):
              req=urllib.request.Request(root+path,headers=headers,method="GET")
              with urllib.request.urlopen(req,timeout=30) as resp:
                  return json.load(resp)
          svc=get(f"/project/{project}/service/{service}").get("service",{})
          if svc.get("service_name") != service or svc.get("service_type") != "mysql":
              raise SystemExit("AIVEN_SERVICE_MISMATCH")
          if svc.get("state") != "RUNNING":
              raise SystemExit("AIVEN_NOT_RUNNING")
          dbs=get(f"/project/{project}/service/{service}/db").get("databases",[])
          names=sorted({(x.get("database_name") or x.get("name")) for x in dbs if isinstance(x,dict)})
          required={"defaultdb","solqaryn_dev","solqaryn_prod"}
          if not required.issubset(set(names)):
              raise SystemExit("AIVEN_DATABASE_INVENTORY_MISMATCH")
          users=get(f"/project/{project}/service/{service}/user").get("users",[])
          admin=next((u for u in users if u.get("username")=="avnadmin"),None)
          if not admin or not admin.get("password"):
              raise SystemExit("AIVEN_ADMIN_CREDENTIAL_UNAVAILABLE")
          comps=[c for c in (svc.get("components") or []) if c.get("component")=="mysql" and c.get("usage")=="primary"]
          if not comps:
              raise SystemExit("AIVEN_MYSQL_COMPONENT_MISSING")
          comp=comps[0]
          print("::add-mask::"+admin["password"])
          with open(os.environ["GITHUB_ENV"],"a") as f:
              f.write(f"AIVEN_ADMIN_HOST={comp.get('host')}\n")
              f.write(f"AIVEN_ADMIN_PORT={comp.get('port')}\n")
              f.write("AIVEN_ADMIN_USER=avnadmin\n")
              f.write(f"AIVEN_ADMIN_PASSWORD={admin['password']}\n")
          print("AIVEN_PROJECT=solqaryn")
          print("AIVEN_SERVICE=solqaryn-mysql")
          print("AIVEN_STATE=RUNNING")
          print("AIVEN_DATABASES=defaultdb,solqaryn_dev,solqaryn_prod")
          print("AIVEN_CONTROL_PLANE=PASS")
          PY
          export MYSQL_PWD="$AIVEN_ADMIN_PASSWORD"
          legacy=(mysql --protocol=TCP -h "$AIVEN_ADMIN_HOST" -P "$AIVEN_ADMIN_PORT" -u "$AIVEN_ADMIN_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 defaultdb --batch --skip-column-names)
          tables="$("${legacy[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';")"
          migrations="$("${legacy[@]}" -e "SELECT IF(EXISTS(SELECT 1 FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='__EFMigrationsHistory'),(SELECT COUNT(*) FROM __EFMigrationsHistory),0);")"
          empresas="$("${legacy[@]}" -e "SELECT IF(EXISTS(SELECT 1 FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='Empresas'),(SELECT COUNT(*) FROM Empresas),0);" )"
          productos="$("${legacy[@]}" -e "SELECT IF(EXISTS(SELECT 1 FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='Productos'),(SELECT COUNT(*) FROM Productos),0);" )"
          usuarios="$("${legacy[@]}" -e "SELECT IF(EXISTS(SELECT 1 FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='Usuarios'),(SELECT COUNT(*) FROM Usuarios),0);" )"
          echo "CORPORATE_DEFAULTDB_BASE_TABLES=$tables"
          echo "CORPORATE_DEFAULTDB_EF_MIGRATIONS=$migrations"
          echo "CORPORATE_DEFAULTDB_EMPRESAS=$empresas"
          echo "CORPORATE_DEFAULTDB_PRODUCTOS=$productos"
          echo "CORPORATE_DEFAULTDB_USUARIOS=$usuarios"
          echo "CORPORATE_DEFAULTDB_READ_ONLY=PASS"

      - name: Render PROD live HTTP readback
        shell: bash
        run: |
          set -euo pipefail
          wait_http() {
            local url="$1"
            local outfile="$2"
            local expected="$3"
            local code=""
            for i in $(seq 1 18); do
              code="$(curl -L -sS --connect-timeout 10 --max-time 30 -o "$outfile" -w '%{http_code}' "$url" || true)"
              if [ "$code" = "$expected" ]; then return 0; fi
              sleep 5
            done
            echo "HTTP_CHECK_FAILED last_code=$code" >&2
            return 1
          }
          wait_http "$RENDER_PROD/health" /tmp/health.json 200
          jq -e '.status == "ok"' /tmp/health.json >/dev/null
          wait_http "$RENDER_PROD/health/ready" /tmp/ready.json 200
          jq -e '.status == "ready" and .database == "connected"' /tmp/ready.json >/dev/null
          wait_http "$RENDER_PROD/empresa-configuracion/publica" /tmp/empresa.json 200
          jq -e '.success == true' /tmp/empresa.json >/dev/null
          wait_http "$RENDER_PROD/tienda/categorias" /tmp/categorias.json 200
          jq -e '.success == true' /tmp/categorias.json >/dev/null
          echo "RENDER_PROD_HEALTH=PASS"
          echo "RENDER_PROD_READY=PASS"
          echo "RENDER_PROD_PUBLIC_API=PASS"
          echo "PRODUCTION_WRITES=0"

      - name: Summary
        run: |
          echo "PROD_FINAL_READONLY_AUDIT=PASS"
          echo "PRODUCTION_WRITES=0"
