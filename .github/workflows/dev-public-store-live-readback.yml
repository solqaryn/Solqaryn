name: DEV - Certificar binding público multiempresa (read-only)
# This is a live DEV readback plus reviewed historical attestation. The push
# event is limited to modifications of this evidence gate and its validator:
# NEVER add general backend/schema paths (Render checksPass would deadlock).
# The workflow does not mutate companies, signatures, or migrations.
on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/dev-public-store-live-readback.yml'
      - 'scripts/certification/**'
      - 'docs/certifications/dev-public-store-microfase1.json'
  push:
    branches: [dev]
    paths:
      - '.github/workflows/dev-public-store-live-readback.yml'
      - 'scripts/certification/**'
      - 'docs/certifications/dev-public-store-microfase1.json'

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify-attestation-code:
    name: Probar integridad del certificador (PR, sin infraestructura)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tests fail-closed de actas y compatibilidad HMAC
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/certification -p 'test_*.py' -v

  certify-public-store-dev:
    if: github.event_name != 'pull_request'
    name: Readback Aiven y smoke HTTP DEV, sin escrituras
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV
    env:
      DB_HOST: ${{ vars.SOLQARYN_DEV_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_DEV_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_DEV_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_DEV_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_DEV_DB_PASSWORD }}
    steps:
      - name: Verificar alcance corporativo DEV
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "solqaryn/Solqaryn"
          test "$GITHUB_REF_NAME" = "dev"
          test "$DB_HOST" = "solqaryn-mysql-solqaryn.h.aivencloud.com"
          test "$DB_PORT" = "14402"
          test "$DB_NAME" = "solqaryn_dev"
          test "$DB_USER" = "solqaryn_dev_user"
          test -n "$DB_PASSWORD"
          echo "PUBLIC_STORE_DEV_SCOPE=PASS; DDL=NONE; DML=NONE"

      - name: Checkout exact-head y historia para verificar equivalencia
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probar contrato fail-closed del verificador
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/certification -p 'test_*.py' -v

      - name: Corroborar acta histórica y código de seguridad exacto
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/certification/verify_dev_public_store_evidence.py

      - name: Instalar cliente MySQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq mysql-client >/dev/null

      - name: Readback y smoke público sin cambiar estados
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import time
          import subprocess
          import sys
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          public_origin = "https://solqaryn-dev.vercel.app"
          api_origin = "https://solqaryn-api-dev-fxx8.onrender.com"
          arg = ["mysql", "--protocol=TCP", "-h", os.environ["DB_HOST"],
                 "-P", os.environ["DB_PORT"], "-u", os.environ["DB_USER"],
                 "--ssl-mode=REQUIRED", os.environ["DB_NAME"],
                 "--batch", "--skip-column-names", "--raw"]
          sql_env = dict(os.environ)
          sql_env["MYSQL_PWD"] = sql_env.pop("DB_PASSWORD")
          report = []
          security_failures = []
          blockers = []
          attested = os.environ.get("MICROFASE1_COMPOSITE_ATTESTATION") == "PASS_ATTESTED"
          if not attested:
              blockers.append("reviewed_historical_evidence_unavailable")
          def out(message):
              report.append(message)
              print(message)
          def sql(query):
              return subprocess.run(arg + ["-e", query], env=sql_env, text=True,
                                    capture_output=True, check=True, timeout=35).stdout.strip()
          def http(base, path, hostile=False):
              url = base + path
              headers = {"User-Agent":"SOLQARYN-DEV-Readback/1.0",
                         "Cache-Control":"no-store"}
              if hostile:
                  headers.update({"X-Forwarded-Host":"evil.example.test",
                                  "X-Empresa-Id":"9999",
                                  "X-Solqaryn-Store-Proof":"forged"})
              try:
                  with urlopen(Request(url, headers=headers), timeout=45) as r:
                      return r.status, r.read(65536).decode("utf-8", "replace")
              except HTTPError as e:
                  return e.code, e.read(16384).decode("utf-8", "replace")
              except (URLError, TimeoutError) as e:
                  raise RuntimeError("DEV HTTP endpoint unavailable") from e

          # No SELECT *. No tenants, passwords or proof material are logged.
          migrations = int(sql("SELECT COUNT(*) FROM __EFMigrationsHistory "
                               "WHERE MigrationId='20261016200000_PublicStoreProofReplayGuard'"))
          ledger = int(sql("SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES "
                           "WHERE TABLE_SCHEMA=DATABASE() "
                           "AND TABLE_NAME='PublicStoreProofReplays'"))
          count_bindings = int(sql("SELECT COUNT(*) FROM PublicStoreBindings"))
          version = sql("SELECT VERSION()")
          out(f"MICROFASE1_HISTORICAL_ATTESTATION={'PASS_ATTESTED' if attested else 'BLOCKED'}")
          out(f"MYSQL_VERSION={version}")
          if version.split("-")[0] != "8.4.8":
              blockers.append("mysql_version_requires_review")
              out("MYSQL_APPROVED_VERSION=MISMATCH")
          else:
              out("MYSQL_APPROVED_VERSION=PASS")
          replay_columns = set(sql(
              "SELECT CONCAT(COLUMN_NAME, ':', COLUMN_TYPE, ':', IS_NULLABLE) "
              "FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA=DATABASE() "
              "AND TABLE_NAME='PublicStoreProofReplays'").splitlines())
          replay_indexes = set(sql(
              "SELECT CONCAT(INDEX_NAME, ':', NON_UNIQUE, ':', SEQ_IN_INDEX, ':', COLUMN_NAME) "
              "FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE() "
              "AND TABLE_NAME='PublicStoreProofReplays'").splitlines())
          expected_columns = {"ProofDigest:binary(32):NO", "ExpiresUtc:datetime(6):NO"}
          expected_indexes = {"PRIMARY:0:1:ProofDigest",
                              "IX_PublicStoreProofReplays_ExpiresUtc:1:1:ExpiresUtc"}
          replay_structure = (migrations == 1 and ledger == 1
                              and replay_columns == expected_columns
                              and expected_indexes.issubset(replay_indexes))
          out(f"MYSQL_REPLAY_SCHEMA={'PASS' if replay_structure else 'FAIL'}")
          if not replay_structure:
              security_failures.append("replay_schema")
          binding_indexes = set(sql(
              "SELECT CONCAT(INDEX_NAME, ':', NON_UNIQUE, ':', SEQ_IN_INDEX, ':', COLUMN_NAME) "
              "FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE() "
              "AND TABLE_NAME='PublicStoreBindings'").splitlines())
          binding_unique = {
              "UX_PublicStoreBindings_Host_Key:0:1:Host",
              "UX_PublicStoreBindings_Host_Key:0:2:StoreKey"
          }.issubset(binding_indexes)
          out(f"MYSQL_BINDING_UNIQUE_INDEX={'PASS' if binding_unique else 'FAIL'}")
          if not binding_unique:
              security_failures.append("binding_unique_index")
          out(f"MYSQL_READBACK=OBSERVED migrations={migrations} ledger={ledger} bindings={count_bindings}")
          raw = sql("SELECT b.Host,b.StoreKey,b.EmpresaId,e.Activa "
                    "FROM PublicStoreBindings b JOIN Empresas e ON e.Id=b.EmpresaId "
                    "WHERE b.Activa=1 AND b.StoreKey<>'' "
                    "ORDER BY b.EmpresaId,b.StoreKey LIMIT 100")
          entries = []
          for line in raw.splitlines():
              cols = line.split('\t')
              if len(cols) == 4:
                  host, key, company, active = cols
                  if host == "solqaryn-dev.vercel.app" and re.fullmatch(r'[a-z][a-z0-9-]{0,46}[a-z0-9]', key):
                      entries.append((key, int(company), active == "1"))
          active = {}
          suspended = []
          for key, company, enabled in entries:
              if enabled:
                  active.setdefault(company, key)
              else:
                  suspended.append(key)
          out(f"ACTIVE_DEV_COMPANIES_WITH_STORE={len(active)}")
          out(f"SUSPENDED_COMPANIES_WITH_ACTIVE_BINDING={len(suspended)}")

          checks = [
              (public_origin, "/api/tienda/bootstrap", 200, None, False, "legacy"),
              (public_origin, "/api/tiendas/cert-unknown-m1/tienda/binding",
               503, "TENANT_DATA_ISOLATION_REQUIRED", True, "unknown_host_key"),
              (public_origin, "/api/tiendas/cert-unknown-m1/tienda/checkout",
               503, "STORE_ROUTE_NOT_YET_CERTIFIED", False, "closed_checkout"),
              (api_origin, "/tienda/binding",
               503, "TENANT_DATA_ISOLATION_REQUIRED", True, "unsigned_direct_backend")
          ]
          def response_json(body):
              try:
                  value = json.loads(body)
                  return value if isinstance(value, dict) else {}
              except (ValueError, TypeError):
                  return {}
          
          # Render FREE may be waking while the first request exceeds Vercel's 30s
          # upstream timeout. Readiness is a separate bounded prerequisite, not proof
          # of store security. Do not retry business-changing requests.
          render_ready = False
          for attempt in range(1, 7):
              try:
                  status, body = http(api_origin, "/health/ready")
                  data = response_json(body)
                  if status == 200 and data.get("status") == "ready" and data.get("database") == "connected":
                      render_ready = True
                      break
              except RuntimeError:
                  pass
              if attempt != 6:
                  time.sleep(12)
          out(f"HTTP_RENDER_HEALTH={'200' if render_ready else 'UNAVAILABLE'}")
          if not render_ready:
              blockers.append("render_readiness")
          for host, path, expected, expected_code, hostile, name in checks:
              if not render_ready:
                  out(f"HTTP_{name.upper()}=BLOCKED_UPSTREAM")
                  continue
              try:
                  code, body = http(host, path, hostile)
                  payload = response_json(body)
                  code_name = payload.get("code", "NONE")
                  out(f"HTTP_{name.upper()}={code} CODE={code_name}")
                  if code_name == "API_UPSTREAM_UNAVAILABLE":
                      blockers.append("upstream_" + name)
                      continue
                  if name == "legacy":
                      if code == 200 and payload.get("success") is True and isinstance(payload.get("data"), dict):
                          continue
                      if code == 503 and code_name == "TENANT_DATA_ISOLATION_REQUIRED":
                          blockers.append("legacy_owner_or_binding")
                      else:
                          security_failures.append("legacy_contract")
                  elif code != expected or code_name != expected_code:
                      security_failures.append("unexpected_denial_" + name)
              except RuntimeError:
                  blockers.append("network_" + name)
                  out(f"HTTP_{name.upper()}=UNAVAILABLE")
          
          validated = 0
          if len(active) < 2:
              blockers.append("two_authorized_companies_required")
          for company, key in list(active.items())[:2]:
              if not render_ready:
                  blockers.append("binding_upstream")
                  break
              try:
                  code, body = http(public_origin, "/api/tiendas/" + key + "/tienda/binding")
                  data = response_json(body)
                  binding_data = data.get("data") or {}
                  if code == 200 and data.get("success") is True and (
                      binding_data.get("empresaId") == company and binding_data.get("verificada") is True
                  ):
                      validated += 1
                  elif data.get("code") == "API_UPSTREAM_UNAVAILABLE":
                      blockers.append("binding_upstream")
                  else:
                      security_failures.append("positive_binding")
              except RuntimeError:
                  blockers.append("network_positive_binding")
          out(f"POSITIVE_AB_BINDINGS_VERIFIED={validated}")
          
          if suspended and render_ready:
              try:
                  status, body = http(public_origin, "/api/tiendas/" + suspended[0] + "/tienda/binding")
                  data = response_json(body)
                  out(f"HTTP_SUSPENDED={status} CODE={data.get('code', 'NONE')}")
                  if data.get("code") == "API_UPSTREAM_UNAVAILABLE":
                      blockers.append("suspended_upstream")
                  elif status != 503 or data.get("code") != "TENANT_DATA_ISOLATION_REQUIRED":
                      security_failures.append("suspended_binding")
              except RuntimeError:
                  blockers.append("network_suspended")
                  out("HTTP_SUSPENDED=UNAVAILABLE")
          elif attested and render_ready and len(active) >= 2:
              # The prior real suspension was observed in a different authorized
              # state. DO NOT force-suspend an active company to make one run green.
              out("HTTP_SUSPENDED=PASS_ATTESTED SOURCE=GH_RUN_39084418982_ATTEMPT_5")
          else:
              blockers.append("suspended_fixture_or_upstream")
              out("HTTP_SUSPENDED=NOT_TESTED_NO_AUTHORIZED_FIXTURE_OR_UPSTREAM")
          # Vercel creates a NEW v2 HMAC proof for each GET. Repeating a public
          # HTTP request is not replay evidence. Proof equality, MySQL insertion
          # and 200/503/200 were witnessed in Render on the attested SHA, checked
          # by the reviewed evidence gate and unchanged signer/guard sources.
          if attested and render_ready:
              out("HMAC_REPLAY_LIVE=PASS_ATTESTED SOURCE=RENDER_DEV_SIGNED_PROOF")
          else:
              blockers.append("hmac_replay_live_evidence")
              out("HMAC_REPLAY_LIVE=BLOCKED_UNVERIFIED")
          if security_failures:
              out("MICROFASE1_SECURITY_SMOKE=FAIL")
          else:
              out("MICROFASE1_SECURITY_SMOKE=PASS_ON_EXECUTED_CASES")
          if security_failures:
              out("MICROFASE1_LIVE_CERT=FAIL")
          elif blockers:
              out("MICROFASE1_LIVE_CERT=BLOCKED")
          else:
              out("MICROFASE1_LIVE_CERT=PASS_ATTESTED")
              out("MICROFASE1_EVIDENCE_MODE=LIVE_DEV_HTTP_MYSQL_PLUS_REVIEWED_HISTORICAL_ATTESTATION")
          out(f"BLOCKER_COUNT={len(set(blockers))} SECURITY_FAILURE_COUNT={len(set(security_failures))}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("## DEV Microfase 1 — readback de solo lectura\n\n")
              for line in report:
                  output.write("- " + line + "\n")
          if blockers or security_failures:
              sys.exit(1)
          PY
