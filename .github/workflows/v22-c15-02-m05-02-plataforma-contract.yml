name: V22 C15-02.M05.02 - contrato Angular API DTO errores seguros
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/features/plataforma/c15-02-m05-02-plataforma-session-contract.spec.ts'
      - 'frontend/src/app/core/auth/plataforma-sesion.service.ts'
      - '.github/workflows/v22-c15-02-m05-02-plataforma-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c1502-m0502-${{ github.sha }}
  cancel-in-progress: false
jobs:
  contract:
    name: C15-02.M05.02 - 6 contratos DTO y errores seguros
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm 11
        run: npm install --global npm@11.19.0
      - name: Instalar lockfile
        run: npm ci
      - name: Tipado y build
        run: |
          npm run lint
          npm run build:prod
      - name: Seis contratos unitarios con HttpTestingController
        run: npx ng test --watch=false --no-progress --include='src/app/features/plataforma/c15-02-m05-02-plataforma-session-contract.spec.ts'
