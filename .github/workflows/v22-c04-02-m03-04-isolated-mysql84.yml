name: V22 C04-02.M03.04 real isolated MySQL 8.4 contract snapshot
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Infrastructure/AutomationV5/C0402IsolatedMySqlContractSnapshotAdapter.cs'
      - 'backend/tests/Solqaryn.Tests/Integration/C0402M0304IsolatedMySqlContractSnapshotTests.cs'
      - '.github/workflows/v22-c04-02-m03-04-isolated-mysql84.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0402-m0304-${{ github.sha }}
  cancel-in-progress: false
jobs:
  real-isolated-mysql:
    name: C04-02.M03.04 - isolated real MySQL 8.4 snapshot and negatives
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v22-only
          MYSQL_DATABASE: c0402_m0304_bootstrap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v22-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0402_M0304_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=c0402_m0304_bootstrap;User=root;Password=ephemeral-v22-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Exact HEAD and scope lock STRICT
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: MySQL 8.4 actual isolated contract snapshot TRX
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0402M0304IsolatedMySqlContractSnapshotTests' --logger 'trx;LogFileName=C0402M0304Mysql84.trx' --verbosity normal
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = list(Path('tests/Solqaryn.Tests').rglob('C0402M0304Mysql84.trx'))
          if len(paths) != 1: raise SystemExit('Missing unique TRX')
          counters = ET.parse(paths[0]).getroot().find('.//{*}Counters')
          if counters is None: raise SystemExit('Missing counters')
          stats = {k: int(counters.attrib.get(k, -1)) for k in ('total','passed','failed','notExecuted')}
          print('C0402_M0304_MYSQL84_REAL_TRX', stats)
          if stats['total'] < 1 or stats['passed'] != stats['total'] or stats['failed'] != 0 or stats['notExecuted'] != 0:
              raise SystemExit('FAIL_MYSQL84_REAL_C0402_M0304')
          PY
