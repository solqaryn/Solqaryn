name: V22 C06-01.M03.04 real isolated MySQL 8.4 landing drafts
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Infrastructure/AutomationV5/C0601IsolatedLandingMySqlSnapshotAdapter.cs'
      - 'backend/tests/Solqaryn.Tests/Integration/C0601M0304IsolatedLandingMysqlTests.cs'
      - '.github/workflows/v22-c06-01-m03-04-isolated-mysql84.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0601-m0304-${{ github.sha }}
  cancel-in-progress: false
jobs:
  real-isolated-mysql:
    name: C06-01.M03.04 - real MySQL 8.4 isolated draft and tenant negatives
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v22-only
          MYSQL_DATABASE: c0601_m0304_bootstrap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v22-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0601_M0304_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=c0601_m0304_bootstrap;User=root;Password=ephemeral-v22-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Exact SHA and Scope Lock STRICT
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Physical MySQL 8.4 isolated draft and adversarial TRX
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0601M0304IsolatedLandingMysqlTests' --logger 'trx;LogFileName=C0601M0304Mysql84.trx' --verbosity normal
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = list(Path('tests/Solqaryn.Tests').rglob('C0601M0304Mysql84.trx'))
          if len(paths) != 1:
              raise SystemExit('MISSING_SINGLE_MYSQL84_TRX')
          node = ET.parse(paths[0]).getroot().find('.//{*}Counters')
          if node is None:
              raise SystemExit('MISSING_TEST_COUNTERS')
          stats = {k: int(node.attrib.get(k, -1))
                   for k in ('total','passed','failed','notExecuted')}
          print('C0601_M0304_REAL_MYSQL84_TRX', stats)
          if stats['total'] < 1 or stats['passed'] != stats['total'] or stats['failed'] != 0 or stats['notExecuted'] != 0:
              raise SystemExit('FAIL_MYSQL84_REAL_C0601_M0304')
          PY
