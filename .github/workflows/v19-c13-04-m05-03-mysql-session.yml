name: V19 C13-04.M05.03 - session MySQL 8.4 real aislado
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/C1304M0503MySqlPlataformaSesionIntegrationTests.cs'
      - '.github/workflows/v19-c13-04-m05-03-mysql-session.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c1304-m0503-${{ github.sha }}
  cancel-in-progress: false
jobs:
  mysql-platform-session:
    name: C13-04.M05.03 - Oracle EF MySQL 8.4 sesion global A/B
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=v19_c1304_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Verificar Scope Lock estricto
        run: node scripts/verify-project-scope.mjs
      - name: Version MySQL 8.4 real del servicio efimero
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION();' | grep -E '^8[.]4[.]'
      - name: Ejecutar integracion real de sesion global y denegaciones A B
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --filter 'FullyQualifiedName~C1304M0503MySqlPlataformaSesionIntegrationTests&Category=Integration' --logger 'trx;LogFileName=c1304-m0503.trx' --logger 'console;verbosity=normal'
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          paths = list(Path('tests/Solqaryn.Tests/TestResults').rglob('c1304-m0503.trx'))
          assert paths, 'No TRX; no acreditar PASS'
          root = ET.parse(paths[-1]).getroot()
          counters = next((node.attrib for node in root.iter() if node.tag.endswith('Counters')), None)
          assert counters, 'No contadores TRX'
          assert int(counters['executed']) >= 1, counters
          assert int(counters['passed']) >= 1, counters
          assert int(counters['failed']) == 0, counters
          assert int(counters['notExecuted']) == 0, counters
          print('C13_04_M05_03_MYSQL84_REAL_INTEGRATION_PASS=TRUE')
          PY
