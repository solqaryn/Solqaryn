name: P0-008.A metadata registry negatives
on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/baselines/P0-008-A-DEV-METADATA-20261029.json'
      - 'docs/P0-008-A-REGISTRO-SECRETOS-METADATOS-DEV.md'
      - 'scripts/verify-p0-008-a-secret-metadata.mjs'
      - '.github/workflows/p0-008-a-secret-metadata.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata-only-self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate latest bounded metadata and reject 12 unsafe claims
        run: node scripts/verify-p0-008-a-secret-metadata.mjs --self-test
