name: V23 C01-04.M03.06 directed casefile QA MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Application/AutomationV5/V5UniversalCaseFileQaEvidenceAudit.cs'
      - 'backend/src/Infrastructure/AutomationV5/V5UniversalCaseFileQaDurableMySqlAuditSink.cs'
      - 'backend/tests/Solqaryn.Tests/Integration/C0104M0306DurableQaAuditMysql84Tests.cs'
      - '.github/workflows/v23-c01-04-m03-06-durable-qa-mysql84.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v23-c0104-m0306-${{ github.sha }}
  cancel-in-progress: false
jobs:
  real-mysql84-casefile-qa:
    name: C01-04.M03.06 - directed durable MySQL 8.4 QA proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v23-only
          MYSQL_DATABASE: solqaryn_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v23-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0104_M0306_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=ephemeral-v23-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Enforce exact-SHA Scope Lock
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Run only the real C01-04.M03.06 MySQL 8.4 test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'Category=Integration&FullyQualifiedName~C0104M0306DurableQaAuditMysql84Tests' --logger 'trx;LogFileName=C0104M0306Mysql84.trx' --verbosity normal
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = list(Path('tests/Solqaryn.Tests').rglob('C0104M0306Mysql84.trx'))
          if len(paths) != 1:
              raise SystemExit('NO_UNIQUE_TRX')
          root = ET.parse(paths[0]).getroot()
          counters = root.find('.//{*}Counters')
          if counters is None:
              raise SystemExit('NO_TRX_COUNTERS')
          stats = {k: int(counters.attrib.get(k, -1)) for k in ('total', 'passed', 'failed', 'notExecuted')}
          names = [el.attrib.get('testName', '') for el in root.findall('.//{*}UnitTestResult')]
          expected = 'C0104M0306DurableQaAuditMysql84Tests.DurableSinkCommitsTenantAAndBWithoutLeakingPayloadAndRejectsReplay'
          print('REAL_C0104_M0306_MYSQL84_TRX', stats)
          print('DIRECTED_C0104_M0306_CASE', names)
          if stats != dict(total=1, passed=1, failed=0, notExecuted=0):
              raise SystemExit('REAL_MYSQL84_TEST_NOT_FULLY_PASSED')
          if len(names) != 1 or expected not in names[0]:
              raise SystemExit('WRONG_OR_SKIPPED_TEST_CASE')
          PY
