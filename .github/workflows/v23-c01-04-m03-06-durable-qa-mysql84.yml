name: V23 C01-04.M03.06 directed casefile QA MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Application/AutomationV5/V5UniversalCaseFileQaEvidenceAudit.cs'
      - 'backend/src/Infrastructure/AutomationV5/V5UniversalCaseFileQaDurableMySqlAuditSink.cs'
      - 'backend/src/Infrastructure/AutomationV5/V5UniversalCaseFileQaGitHubJobReader.cs'
      - 'backend/src/API/Controllers/PlataformaQaEvidenciasController.cs'
      - 'backend/tests/Solqaryn.Tests/API/Controllers/C0204M0502QaHttpContractTests.cs'
      - 'backend/tests/Solqaryn.Tests/Integration/C0104M0306DurableQaAuditMysql84Tests.cs'
      - '.github/ci/c0104-github-live-proof.cs'
      - '.github/ci/c0104-global-http-live-proof.py'
      - '.github/ci/c0104-r11-lab.sh'
      - '.github/ci/c0104-r11-bootstrap-recipe.json'
      - '.github/workflows/v23-c01-04-m03-06-durable-qa-mysql84.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v23-c0104-m0306-${{ github.sha }}
  cancel-in-progress: false
jobs:
  real-mysql84-casefile-qa:
    name: C01-04.M03.06 - directed durable MySQL 8.4 QA proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v23-only
          MYSQL_DATABASE: solqaryn_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v23-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0104_M0306_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_ci;User=root;Password=ephemeral-v23-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Enforce exact-SHA Scope Lock
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Run only the real C01-04.M03.06 MySQL 8.4 test
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'Category=Integration&FullyQualifiedName~C0104M0306DurableQaAuditMysql84Tests' --logger 'trx;LogFileName=C0104M0306Mysql84.trx' --verbosity normal
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          paths = list(Path('tests/Solqaryn.Tests').rglob('C0104M0306Mysql84.trx'))
          if len(paths) != 1:
              raise SystemExit('NO_UNIQUE_TRX')
          root = ET.parse(paths[0]).getroot()
          counters = root.find('.//{*}Counters')
          if counters is None:
              raise SystemExit('NO_TRX_COUNTERS')
          stats = {k: int(counters.attrib.get(k, -1)) for k in ('total', 'passed', 'failed', 'notExecuted')}
          names = [el.attrib.get('testName', '') for el in root.findall('.//{*}UnitTestResult')]
          expected = 'C0104M0306DurableQaAuditMysql84Tests.DurableSinkCommitsTenantAAndBWithoutLeakingPayloadAndRejectsReplay'
          print('REAL_C0104_M0306_MYSQL84_TRX', stats)
          print('DIRECTED_C0104_M0306_CASE', names)
          if stats != dict(total=1, passed=1, failed=0, notExecuted=0):
              raise SystemExit('REAL_MYSQL84_TEST_NOT_FULLY_PASSED')
          if len(names) != 1 or expected not in names[0]:
              raise SystemExit('WRONG_OR_SKIPPED_TEST_CASE')
          PY
      - name: Verify production GitHub reader against immutable public QA fixture
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          proof="$(mktemp -d "$RUNNER_TEMP/c0104-live-proof.XXXXXX")"
          trap 'rm -rf -- "$proof"' EXIT
          cp .github/ci/c0104-github-live-proof.cs "$proof/Program.cs"
          cat > "$proof/Proof.csproj" <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <FrameworkReference Include="Microsoft.AspNetCore.App" />
              <ProjectReference Include="$GITHUB_WORKSPACE/backend/src/Infrastructure/Solqaryn.Infrastructure.csproj" />
            </ItemGroup>
          </Project>
          EOF
          dotnet run --project "$proof/Proof.csproj" --configuration Release

      - name: Verify real global controller JWT GitHub and MySQL in one isolated request
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          export SOLQARYN_C0204_MYSQL_TEST_CONNECTION="$C0104_M0306_MYSQL_TEST"
          target="backend/tests/Solqaryn.Tests/API/Controllers/C0204M0502QaHttpContractTests.cs"
          backup="$(mktemp "$RUNNER_TEMP/c0104-http-source.XXXXXX")"
          cp "$target" "$backup"
          trap 'cp "$backup" "$target"; rm -f "$backup"' EXIT
          python3 .github/ci/c0104-global-http-live-proof.py
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0104GlobalHttpLiveProviderProof' --logger 'trx;LogFileName=C0104GlobalHttpLiveProviderProof.trx' --results-directory "$RUNNER_TEMP/c0104-global-http"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = ET.parse(Path(os.environ['RUNNER_TEMP']) / 'c0104-global-http/C0104GlobalHttpLiveProviderProof.trx').getroot()
          counters = root.find('.//{*}Counters')
          if counters is None or any(int(counters.attrib.get(k, -1)) != v for k, v in dict(total=1, passed=1, failed=0, notExecuted=0).items()):
              raise SystemExit('GLOBAL_HTTP_REAL_TEST_NOT_FULLY_PASSED')
          names = [x.attrib.get('testName', '') for x in root.findall('.//{*}UnitTestResult')]
          if len(names) != 1 or 'C0104GlobalHttpLiveProviderProof' not in names[0]:
              raise SystemExit('WRONG_OR_SKIPPED_TEST')
          print('GLOBAL_HTTP_JWT_GITHUB_MYSQL_TRX_PASS')
          PY
      - name: Upload global controller live proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0104-global-http-live-proof
          path: ${{ runner.temp }}/c0104-global-http/
          if-no-files-found: warn
          retention-days: 14

  r11-ownership-migration-lab:
    name: C01-04.M03.06 - R11 isolated P01/P02 migration and rollback
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && contains(github.event.head_commit.message, '[c0104-r11-lab]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v44-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v44-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Verify exact SHA and isolated runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
          bash -n .github/ci/c0104-r11-lab.sh
      - name: Run isolated Oracle EF and MySQL migration lab
        shell: bash
        env:
          MYSQL_SERVICE_ID: ${{ job.services.mysql.id }}
          LAB_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash .github/ci/c0104-r11-lab.sh
      - name: Upload isolated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0104-r11-ownership-migration
          path: ${{ runner.temp }}/c0104-r11-artifacts/
          retention-days: 14
          if-no-files-found: warn
