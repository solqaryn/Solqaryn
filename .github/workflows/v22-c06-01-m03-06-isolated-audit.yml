name: V22 C06-01.M03.06 isolated MySQL 8.4 durable audit
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Infrastructure/AutomationV5/C0601IsolatedLandingReviewAuditWorker.cs'
      - 'backend/tests/Solqaryn.Tests/Integration/C0601M0306LandingReviewAuditMysqlTests.cs'
      - '.github/workflows/v22-c06-01-m03-06-isolated-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0601-m0306-${{ github.sha }}
  cancel-in-progress: false
jobs:
  isolated-audit:
    name: C06-01.M03.06 - transactional MySQL 8.4 isolated audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v22-only
          MYSQL_DATABASE: c0601_m0306_bootstrap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v22-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0601_M0306_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=c0601_m0306_bootstrap;User=root;Password=ephemeral-v22-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Exact SHA Scope Lock and skill governance
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
          node scripts/verify-solqaryn-skills.mjs --self-test
      - name: Real MySQL 8.4 atomic audit rollback and tenant isolation TRX
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0601M0306LandingReviewAuditMysqlTests' --logger 'trx;LogFileName=C0601M0306Mysql84.trx' --verbosity normal
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('tests/Solqaryn.Tests').rglob('C0601M0306Mysql84.trx'))
          if len(files)!=1: raise SystemExit('missing unique audit MySQL TRX')
          root=ET.parse(files[0]).getroot()
          node=root.find('.//{*}Counters')
          if node is None: raise SystemExit('missing audit TRX counters')
          stats={k:int(node.attrib.get(k,-1)) for k in ('total','passed','failed','notExecuted','executed')}
          print('C0601_M0306_REAL_AUDIT_MYSQL84_TRX',stats)
          if stats['total']<2 or stats['passed']!=stats['total'] or stats['failed'] or stats['notExecuted'] or stats['executed']!=stats['total']:
              raise SystemExit('audit integration tests incomplete')
          PY
