name: Storefront Fase 6 - checkout y pedido

on:
  push:
    branches:
      - dev
      - chatgpt/storefront-fase6-checkout
    paths:
      - 'frontend/src/app/features/storefront/**'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/e2e/storefront-fase1.spec.ts'
      - 'frontend/e2e/storefront-fase2.spec.ts'
      - 'frontend/e2e/storefront-fase3.spec.ts'
      - 'frontend/e2e/storefront-fase4.spec.ts'
      - 'frontend/e2e/storefront-fase5.spec.ts'
      - 'frontend/e2e/storefront-fase6.spec.ts'
      - 'frontend/scripts/validate-storefront-fase1.mjs'
      - 'frontend/scripts/validate-storefront-fase2.mjs'
      - 'frontend/scripts/validate-storefront-fase3.mjs'
      - 'frontend/scripts/validate-storefront-fase4.mjs'
      - 'frontend/scripts/validate-storefront-fase5.mjs'
      - 'frontend/scripts/validate-storefront-fase6.mjs'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/src/API/Controllers/TiendaController.cs'
      - 'backend/src/Application/DTOs/TiendaCheckoutDto.cs'
      - 'backend/tests/Solqaryn.Tests/API/Controllers/TiendaControllerCheckoutTests.cs'
      - '.github/workflows/storefront-fase6-regression.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'frontend/src/app/features/storefront/**'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/e2e/storefront-fase1.spec.ts'
      - 'frontend/e2e/storefront-fase2.spec.ts'
      - 'frontend/e2e/storefront-fase3.spec.ts'
      - 'frontend/e2e/storefront-fase4.spec.ts'
      - 'frontend/e2e/storefront-fase5.spec.ts'
      - 'frontend/e2e/storefront-fase6.spec.ts'
      - 'frontend/scripts/validate-storefront-fase1.mjs'
      - 'frontend/scripts/validate-storefront-fase2.mjs'
      - 'frontend/scripts/validate-storefront-fase3.mjs'
      - 'frontend/scripts/validate-storefront-fase4.mjs'
      - 'frontend/scripts/validate-storefront-fase5.mjs'
      - 'frontend/scripts/validate-storefront-fase6.mjs'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - 'backend/src/API/Controllers/TiendaController.cs'
      - 'backend/src/Application/DTOs/TiendaCheckoutDto.cs'
      - 'backend/tests/Solqaryn.Tests/API/Controllers/TiendaControllerCheckoutTests.cs'
      - '.github/workflows/storefront-fase6-regression.yml'

permissions:
  contents: read

concurrency:
  group: storefront-fase6-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Fase 6 - contrato backend checkout
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restore
        run: dotnet restore Solqaryn.sln

      - name: Build Release
        run: dotnet build Solqaryn.sln --configuration Release --no-restore

      - name: Pruebas quirurgicas de checkout publico
        run: dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~TiendaControllerCheckoutTests" --logger "trx;LogFileName=storefront-fase6.trx"

      - name: Publicar resultados backend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-fase6-backend
          path: backend/tests/Solqaryn.Tests/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Fase 6 - regresion publica acumulada
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint TypeScript y guardas Fases 1-6
        run: npm run lint

      - name: Build de produccion
        run: npm run build:prod

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Iniciar Angular
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > storefront-fase6-regression.log 2>&1 &

      - name: Esperar Angular
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/tienda/checkout > /dev/null; then
              echo 'Angular listo para la regresion publica de Fase 6.'
              exit 0
            fi
            sleep 2
          done
          echo 'Angular no respondio dentro del tiempo esperado.' >&2
          cat storefront-fase6-regression.log >&2 || true
          exit 1

      - name: Regresion Fase 1
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:storefront-fase1

      - name: Regresion Fase 2
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:storefront-fase2

      - name: Regresion Fase 3
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:storefront-fase3

      - name: Regresion Fase 4
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:storefront-fase4

      - name: Regresion Fase 5
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:storefront-fase5

      - name: Playwright Fase 6
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:storefront-fase6

      - name: Publicar evidencia frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-fase6-frontend
          path: |
            frontend/storefront-fase6-regression.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
