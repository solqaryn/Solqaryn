name: V20 C07-04.M04.06 - Densidad y carga progresiva
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v20-c07-04-m04-06-density.yml'
      - 'frontend/e2e/c07-04-m04-06-density.spec.ts'
      - 'frontend/src/app/features/pedidos-venta/pedidos-venta.components.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c0704-m0406-${{ github.sha }}
  cancel-in-progress: false
jobs:
  density:
    name: C07-04.M04.06 - Angular y Chromium cinco pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm fijo
        run: npm install --global npm@11.19.0
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Lint y build Angular
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Servir aplicación local
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c07-04-m04-06.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c07-04-m04-06.log >&2
          exit 1
      - name: Browser real - densidad progreso error y control adversarial
        working-directory: frontend
        run: npx playwright test e2e/c07-04-m04-06-density.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v20-c0704-m0406
          path: |
            frontend/c07-04-m04-06.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
