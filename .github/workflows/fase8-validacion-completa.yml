name: Fase 8 - Validación completa automatizada

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Autorización explícita del propietario: AUTORIZADO_REABRIR'
        required: true
        type: string
permissions:
  contents: read

concurrency:
  group: fase8-validacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Autorizar reapertura cerrada
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exigir administrador, DEV y token literal
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          TARGET_REF: ${{ github.ref }}
          AUTHORIZATION: ${{ inputs.authorization }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = workflow_dispatch
          test "$REPOSITORY" = solqaryn/Solqaryn
          test "$TARGET_REF" = refs/heads/dev
          test "$ACTOR" = "$TRIGGERING_ACTOR"
          test "$AUTHORIZATION" = AUTORIZADO_REABRIR
          admin="$(gh api "repos/$REPOSITORY/collaborators/$ACTOR/permission" --jq '.user.permissions.admin')"
          test "$admin" = "true"
          echo 'REOPEN_AUTHORIZATION=PASS'

  validation:
    needs: authorize
    name: Regresión, seguridad, accesibilidad, rendimiento y runtime
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventoryapp_fase8
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      ASPNETCORE_ENVIRONMENT: Staging
      PORT: '5005'
      AllowedHosts: '127.0.0.1;localhost'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=inventoryapp_fase8;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'
      Jwt__Secret: 'Fase8-E2E-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'Solqaryn.Fase8.API'
      Jwt__Audience: 'Solqaryn.Fase8.Frontend'
      Jwt__ExpiraMinutos: '120'
      Security__LoginRateLimitPerMinute: '300'
      SeedAdmin__Username: 'e2e_admin'
      SeedAdmin__Password: 'E2E.Admin#2026!'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      Cors__AllowedOrigins__1: 'http://localhost:4200'
      Swagger__Enabled: 'false'
      AppSettings__BackendPublicUrl: 'https://preview.solqaryn.invalid'
      AppSettings__LogoPublicUrl: 'https://solqaryn-dev.vercel.app/assets/varistorehn-logo.png'
      AppSettings__EnlacePublicoFacturaHorasValidez: '1'
      AppSettings__EnlacePublicoFacturaMaximoAccesos: '5'
      AppSettings__CorreoFacturaIdempotenciaMinutos: '15'
      Cloudinary__CloudName: 'fase8-not-used'
      Cloudinary__ApiKey: 'fase8-not-used'
      Cloudinary__ApiSecret: 'fase8-not-used'
      Cloudinary__EnvironmentPrefix: 'solqaryn_dev'
      Smtp__Host: '127.0.0.1'
      Smtp__Port: '1025'
      Smtp__UsuarioSmtp: 'smtp-user'
      Smtp__UsarSsl: 'false'
      Smtp__RequiereAutenticacion: 'false'
      Smtp__CorreoRemitente: 'facturas@fase8.test'
      Smtp__CorreoRespuesta: 'soporte@fase8.test'
      Smtp__NombreRemitente: 'Solqaryn Fase 8'
      Smtp__TimeoutSeconds: '10'
      Smtp__MaxAttempts: '3'
      Smtp__RetryBaseDelayMilliseconds: '100'
      SMTP_CAPTURE_DIR: '/tmp/solqaryn-fase8-smtp'
      SMTP_CAPTURE_HOST: '127.0.0.1'
      SMTP_CAPTURE_PORT: '1025'
      SMTP_CAPTURE_REQUIRE_AUTH: 'false'
      SMTP_CAPTURE_USERNAME: 'smtp-user'
      SMTP_CAPTURE_PASSWORD: 'smtp-pass'
      SMTP_FAIL_FIRST_MESSAGES: '1'
      PHASE7_API_URL: 'http://127.0.0.1:5005'
      PHASE7_ADMIN_USERNAME: 'e2e_admin'
      PHASE7_ADMIN_PASSWORD: 'E2E.Admin#2026!'
      PHASE8_EXPECT_SWAGGER_DISABLED: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'

    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restaurar, compilar y probar backend
        working-directory: backend
        run: |
          dotnet restore InventoryApp.sln
          dotnet build InventoryApp.sln --configuration Release --no-restore
          dotnet test InventoryApp.sln --configuration Release --no-build --logger "trx;LogFileName=fase8-tests.trx"

      - name: Auditar dependencias .NET
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet list InventoryApp.sln package --vulnerable --include-transitive | tee fase8-dotnet-vulnerabilities.txt
          if grep -q 'has the following vulnerable packages' fase8-dotnet-vulnerabilities.txt; then
            echo 'Se detectaron paquetes .NET vulnerables.' >&2
            exit 1
          fi

      - name: Iniciar SMTP efímero con captura
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SMTP_CAPTURE_DIR"
          mkdir -p "$SMTP_CAPTURE_DIR"
          nohup python3 scripts/fase7_fake_smtp.py > fase8-smtp.log 2>&1 &
          echo $! > fase8-smtp.pid
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1025) >/dev/null 2>&1; then
              echo 'SMTP efímero disponible.'
              exit 0
            fi
            sleep 1
          done
          cat fase8-smtp.log >&2 || true
          exit 1

      - name: Iniciar API Staging con MySQL descartable
        shell: bash
        run: |
          set -euo pipefail
          nohup dotnet run \
            --project backend/src/API/InventoryApp.API.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            > backend/fase8-api.log 2>&1 &
          echo $! > backend/fase8-api.pid

      - name: Esperar API y migraciones
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5005/health > /dev/null && \
               curl --fail --silent http://127.0.0.1:5005/health/ready > /dev/null; then
              echo 'API Staging lista y base conectada.'
              exit 0
            fi
            sleep 2
          done
          cat backend/fase8-api.log >&2 || true
          exit 1

      - name: Validar seguridad HTTP y superficie pública
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --dump-header fase8-health-headers.txt \
            --output fase8-health-body.json \
            http://127.0.0.1:5005/health
          grep -qi '^X-Content-Type-Options: nosniff' fase8-health-headers.txt
          grep -qi '^X-Frame-Options: DENY' fase8-health-headers.txt
          grep -qi '^Referrer-Policy: no-referrer' fase8-health-headers.txt
          grep -qi '^Permissions-Policy:.*camera=()' fase8-health-headers.txt

          swagger_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:5005/swagger/index.html)"
          test "$swagger_status" = '404'
          unauthorized_status="$(curl --silent --output /dev/null --write-out '%{http_code}' 'http://127.0.0.1:5005/productos?page=1&pageSize=1')"
          test "$unauthorized_status" = '401'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Instalar, auditar y compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run build:prod
          npx playwright install --with-deps chromium

      - name: Iniciar Angular
        shell: bash
        run: |
          set -euo pipefail
          nohup npm --prefix frontend start -- --host 127.0.0.1 --port 4200 > frontend/fase8-frontend.log 2>&1 &
          echo $! > frontend/fase8-frontend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/login > /dev/null; then
              echo 'Angular listo.'
              exit 0
            fi
            sleep 2
          done
          cat frontend/fase8-frontend.log >&2 || true
          exit 1

      - name: Ejecutar pruebas especializadas de Fase 8 y correo
        working-directory: frontend
        run: |
          npx playwright test \
            e2e/fase8-validacion-completa.spec.ts \
            e2e/fase7-correo.spec.ts \
            --config=playwright.config.ts

      - name: Validar correo SMTP y PDF adjunto
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fase7_validate_email.py
          mkdir -p frontend/test-results/fase8-smtp
          cp -a "$SMTP_CAPTURE_DIR"/. frontend/test-results/fase8-smtp/
          cp fase8-smtp.log frontend/test-results/fase8-smtp/server.log

      - name: Auditar logs y exposición de secretos
        env:
          PHASE8_ADMIN_PASSWORD: 'E2E.Admin#2026!'
          PHASE8_JWT_SECRET: 'Fase8-E2E-Only-Secret-With-More-Than-32-Characters-2026'
          PHASE8_SMTP_PASSWORD: 'smtp-pass'
          PHASE8_DATABASE_PASSWORD: 'root'
        run: python3 scripts/fase8_validate_runtime.py

      - name: Crear manifiesto de certificación
        if: always()
        shell: bash
        run: |
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "branch=$(git branch --show-current)"
            echo "dotnet=$(dotnet --version)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "fecha_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > fase8-manifest.txt

      - name: Publicar evidencia de Fase 8
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase8-validacion-completa
          path: |
            backend/fase8-api.log
            backend/fase8-dotnet-vulnerabilities.txt
            backend/**/TestResults/*.trx
            frontend/fase8-frontend.log
            frontend/playwright-report/
            frontend/test-results/
            fase8-smtp.log
            fase8-health-headers.txt
            fase8-health-body.json
            fase8-runtime-report.json
            fase8-manifest.txt
          if-no-files-found: warn
          retention-days: 21
