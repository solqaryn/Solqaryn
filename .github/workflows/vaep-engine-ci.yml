name: Legacy VAEP retirement compatibility check

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/vaep-engine-ci.yml'
      - 'scripts/vaep/**'
      - 'vaep/control/**'
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    # Transitional check name retained because dev ruleset 22829243 still
    # requires it. Retire that requirement before deleting this workflow.
    name: VAEP engine TASKS_ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify obsolete ten-task state remains retired
        shell: bash
        run: |
          set -euo pipefail
          test ! -f scripts/vaep/logical_lease_dispatch.py
          test ! -f vaep/control/logical-lease-candidate.json
          test ! -f .github/workflows/vaep-checkpoints.yml
          test ! -f .github/workflows/vaep-admission-open-guard.yml
          echo 'RETIRED_VAEP_STATE=PASS; NO_DISPATCH; NO_TASKS_CREATED'
