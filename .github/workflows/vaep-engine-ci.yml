name: VAEP engine lightweight checks

on:
  push:
    branches: [dev]
    paths:
      - '.github/scripts/vaep-*.sh'
      - '.github/workflows/vaep-*.yml'
      - 'scripts/vaep/**'
      - 'vaep/**'
      - 'docs/VAEP_AUTHORITY.md'
      - 'docs/VAEP_HANDOFF_CURRENT.md'
      - 'AGENTS.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: VAEP engine TASKS_ONLY
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - name: Validate Tasks-only authority and syntax
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('vaep/control/dispatch-admission.json')); console.log('json valid')"
          python3 -m py_compile scripts/vaep/state_sync.py scripts/vaep/parent_transition.py
          bash -n .github/scripts/vaep-policy-parser.sh .github/scripts/vaep-checkpoint.sh
          bash .github/scripts/vaep-policy-parser.sh --self-test
          bash .github/scripts/vaep-policy-parser.sh --validate docs/VAEP_AUTHORITY.md
          bash .github/scripts/vaep-checkpoint.sh --self-test
          grep -Fq 'EXECUTION_MODEL=TASKS_ONLY' docs/VAEP_AUTHORITY.md
          grep -Fq 'DIRECT_EXECUTION_DEFAULT=TRUE' docs/VAEP_AUTHORITY.md
          grep -Fq 'TASK_SCOPE_LEASE_SINGLE_WRITER=TRUE' docs/VAEP_AUTHORITY.md
          grep -Fq 'RECOVERY_MUST_RESOLVE_SAME_RUN=TRUE' docs/VAEP_AUTHORITY.md

      - name: Verify external-worker runtime is absent
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(
            .github/scripts/vaep-jules-autorefill.sh
            .github/scripts/vaep-jules-catalog-floor.sh
            .github/scripts/vaep-jules-master.sh
            .github/scripts/vaep-jules-worker.sh
            .github/scripts/vaep-parent-close.sh
            .github/workflows/vaep-jules-diagnostic.yml
            .github/workflows/vaep-jules-feedback.yml
            .github/workflows/vaep-jules-j1.yml
            .github/workflows/vaep-jules-j2.yml
            .github/workflows/vaep-jules-j3.yml
            .github/workflows/vaep-jules-j4.yml
            .github/workflows/vaep-jules-j5.yml
            .github/workflows/vaep-jules-j6.yml
            .github/workflows/vaep-jules-runtime-certification.yml
            .github/workflows/vaep-jules-session-health.yml
            .github/workflows/vaep-jules-stop.yml
            .github/workflows/vaep-catalog-throughput.yml
            scripts/vaep/jules_integration_metrics.py
            scripts/vaep/jules_registry_check.py
            scripts/vaep/jules_runtime_contract.py
            scripts/vaep/terminal_handoff.py
            scripts/vaep/test_terminal_handoff.py
            scripts/vaep/dispatch-preflight.mjs
            scripts/vaep/dispatch-preflight-self-test.mjs
            vaep/control/jules-autorefill-catalog.json
            vaep/control/jules-completed-semantic-facets.json
            vaep/control/jules-integration-receipt-quarantine.json
            vaep/control/jules-workers.json
            vaep/schemas/jules-dispatch.schema.json
            vaep/metrics/baseline.json
          )
          for path in "${forbidden[@]}"; do test ! -e "$path" || { echo "RETIRED_RUNTIME_PATH_FOUND=$path" >&2; exit 1; }; done
          test ! -d vaep/jules || { echo 'RETIRED_RUNTIME_DIR_FOUND=vaep/jules' >&2; exit 1; }
          external_worker_pattern='secrets\.'JULES_'|jules.'googleapis'\.com|VAEP J''[1-6] Trusted Worker'
          if grep -R -En "$external_worker_pattern" .github/workflows .github/scripts scripts/vaep vaep/control 2>/dev/null; then
            echo 'EXTERNAL_WORKER_RUNTIME_REFERENCE_FOUND' >&2
            exit 1
          fi
          echo 'VAEP_EXTERNAL_WORKER_RUNTIME=ABSENT'

      - name: Verify generic state synchronization guards
        run: |
          python3 -m pip install 'PyYAML==6.0.2'
          python3 -m unittest discover -s scripts/vaep -p test_state_sync.py
          python3 -m unittest discover -s scripts/vaep -p test_reopen_authorization.py
          git diff --check
