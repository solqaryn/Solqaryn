name: V22 C04-01.M05.04 positive acceptance private plans Chromium
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v22-c04-01-m05-04-positive-acceptance.yml'
      - 'frontend/e2e/c04-01-m05-04-positive-acceptance.spec.ts'
      - 'frontend/src/app/features/plataforma/c04-01-m04-01-planes-readonly.component.ts'
      - 'frontend/src/app/app.routes.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0401-m0504-${{ github.sha }}
  cancel-in-progress: false
jobs:
  positive-acceptance:
    name: C04-01.M05.04 - Chromium positive reference acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify exact SHA and project Scope Lock
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Install Angular dependencies locked
        working-directory: frontend
        run: |
          npm install -g npm@11.19.0
          npm ci
      - name: Angular typecheck and production build
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Install real Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Execute four positive acceptance cases on Angular browser
        working-directory: frontend
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c0401-m0504-ng.log 2>&1 &
          ready=0
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:4200/login >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then tail -n 100 c0401-m0504-ng.log; exit 1; fi
          npx playwright test e2e/c04-01-m05-04-positive-acceptance.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: c0401-m0504-positive-acceptance
          path: |
            frontend/c0401-m0504-ng.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7
