name: PROD - Reconciliar stock historico autoritativo (temporal)

on:
  push:
    branches: [main]
    paths:
      - .github/checkpoints/prod-stock-reconcile-temp
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: PROD
    env:
      DB_HOST: ${{ vars.SOLQARYN_PROD_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_PROD_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_PROD_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_PROD_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_PROD_DB_PASSWORD }}
    steps:
      - name: Instalar cliente MySQL y DNS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y mysql-client dnsutils >/dev/null

      - name: Reconciliar ProductoVariante hacia ExistenciasVariante
        shell: bash
        run: |
          set -euo pipefail
          test "$DB_NAME" = "solqaryn_prod"
          test "$DB_USER" = "solqaryn_prod_user"
          test -n "$DB_PASSWORD"
          export MYSQL_PWD="$DB_PASSWORD"

          connect_host="$DB_HOST"
          if ! getent ahostsv4 "$DB_HOST" >/dev/null 2>&1; then
            fallback_ip="$(dig +short A "$DB_HOST" @1.1.1.1 | grep -E '^[0-9]+([.][0-9]+){3}$' | head -n 1 || true)"
            test -n "$fallback_ip"
            connect_host="$fallback_ip"
            echo "PROD_DB_DNS_FALLBACK=USED"
          else
            echo "PROD_DB_DNS_FALLBACK=NOT_NEEDED"
          fi

          mysql_cmd=(mysql --protocol=TCP -h "$connect_host" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME")

          "${mysql_cmd[@]}" <<'SQL'
          DROP PROCEDURE IF EXISTS sp_solqaryn_prod_reconcile_stock;
          DELIMITER $$

          CREATE PROCEDURE sp_solqaryn_prod_reconcile_stock()
          BEGIN
              DECLARE v_db VARCHAR(128);
              DECLARE v_empresa_count INT DEFAULT 0;
              DECLARE v_empresa_id INT DEFAULT NULL;
              DECLARE v_sucursal_count INT DEFAULT 0;
              DECLARE v_sucursal_id INT DEFAULT NULL;
              DECLARE v_almacen_count INT DEFAULT 0;
              DECLARE v_almacen_id INT DEFAULT NULL;
              DECLARE v_total_existencias INT DEFAULT 0;
              DECLARE v_negativas INT DEFAULT 0;
              DECLARE v_missing_before INT DEFAULT 0;
              DECLARE v_inserted INT DEFAULT 0;
              DECLARE v_missing_after INT DEFAULT 0;
              DECLARE v_mismatch_after INT DEFAULT 0;
              DECLARE v_legacy_total BIGINT DEFAULT 0;
              DECLARE v_physical_total BIGINT DEFAULT 0;
              DECLARE v_created_sucursal BOOLEAN DEFAULT FALSE;
              DECLARE v_created_almacen BOOLEAN DEFAULT FALSE;

              DECLARE EXIT HANDLER FOR SQLEXCEPTION
              BEGIN
                  ROLLBACK;
                  RESIGNAL;
              END;

              SELECT DATABASE() INTO v_db;
              IF v_db <> 'solqaryn_prod' THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT='Abortado: destino distinto de solqaryn_prod';
              END IF;

              SELECT COUNT(*), MIN(Id)
                INTO v_empresa_count, v_empresa_id
                FROM Empresas
               WHERE Activa=1;

              IF v_empresa_count <> 1 OR v_empresa_id IS NULL THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT='Abortado: se requiere exactamente una Empresa activa';
              END IF;

              SELECT COUNT(*), MIN(Id)
                INTO v_sucursal_count, v_sucursal_id
                FROM Sucursales
               WHERE EmpresaId=v_empresa_id
                 AND Activa=1
                 AND Eliminado=0;

              IF v_sucursal_count > 1 THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT='Abortado: multiples sucursales activas impiden asignacion historica determinista';
              END IF;

              SELECT COUNT(*) INTO v_total_existencias FROM ExistenciasVariante;
              IF v_total_existencias <> 0 THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT='Abortado: PROD ya contiene existencias canonicas; no se mezclara el backfill';
              END IF;

              SELECT COUNT(*)
                INTO v_negativas
                FROM ProductoVariantes pv
                JOIN Productos p ON p.Id=pv.ProductoId
               WHERE pv.Eliminado=0
                 AND p.Eliminado=0
                 AND p.Activo=1
                 AND pv.Cantidad < 0;

              IF v_negativas <> 0 THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT='Abortado: existen cantidades legacy negativas';
              END IF;

              SELECT COUNT(*)
                INTO v_missing_before
                FROM ProductoVariantes pv
                JOIN Productos p ON p.Id=pv.ProductoId
               WHERE pv.Eliminado=0
                 AND p.Eliminado=0
                 AND p.Activo=1;

              SELECT COALESCE(SUM(pv.Cantidad),0)
                INTO v_legacy_total
                FROM ProductoVariantes pv
                JOIN Productos p ON p.Id=pv.ProductoId
               WHERE pv.Eliminado=0
                 AND p.Eliminado=0
                 AND p.Activo=1;

              IF v_missing_before <> 73 OR v_legacy_total <> 101 THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT='Abortado: la base cambio desde el diagnostico certificado (esperado 73 variantes / 101 unidades)';
              END IF;

              START TRANSACTION;

              IF v_sucursal_count = 0 THEN
                  INSERT INTO Sucursales (
                      EmpresaId, Codigo, Nombre, Direccion, Telefono, Correo, ZonaHoraria,
                      Activa, Eliminado, FechaEliminacion, EliminadoPorUsuarioId,
                      FechaCreacion, FechaActualizacion,
                      CreadoPorUsuarioId, CreadoPorNombreUsuario,
                      ActualizadoPorUsuarioId, ActualizadoPorNombreUsuario
                  ) VALUES (
                      v_empresa_id, 'MIG-PROD', 'Migracion historica PROD - ubicacion heredada no disponible',
                      NULL, NULL, NULL, 'America/Tegucigalpa',
                      1, 0, NULL, NULL,
                      UTC_TIMESTAMP(6), UTC_TIMESTAMP(6),
                      NULL, 'SOLQARYN PROD stock reconciliation 2026-09-27',
                      NULL, NULL
                  );
                  SET v_sucursal_id = LAST_INSERT_ID();
                  SET v_created_sucursal = TRUE;
              END IF;

              SELECT COUNT(*), MIN(a.Id)
                INTO v_almacen_count, v_almacen_id
                FROM Almacenes a
                JOIN Sucursales s ON s.Id=a.SucursalId
               WHERE s.Id=v_sucursal_id
                 AND a.Activo=1
                 AND a.Eliminado=0
                 AND a.Tipo IN (1,2)
                 AND s.Activa=1
                 AND s.Eliminado=0;

              IF v_almacen_count > 1 THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT='Abortado: multiples almacenes operativos impiden asignacion historica determinista';
              END IF;

              IF v_almacen_count = 0 THEN
                  INSERT INTO Almacenes (
                      SucursalId, Codigo, Nombre, Tipo, Activo, Eliminado,
                      FechaEliminacion, EliminadoPorUsuarioId,
                      FechaCreacion, FechaActualizacion,
                      CreadoPorUsuarioId, CreadoPorNombreUsuario,
                      ActualizadoPorUsuarioId, ActualizadoPorNombreUsuario
                  ) VALUES (
                      v_sucursal_id, 'MIG-PROD-INV',
                      'Inventario historico migrado - ubicacion heredada no disponible',
                      2, 1, 0,
                      NULL, NULL,
                      UTC_TIMESTAMP(6), UTC_TIMESTAMP(6),
                      NULL, 'SOLQARYN PROD stock reconciliation 2026-09-27',
                      NULL, NULL
                  );
                  SET v_almacen_id = LAST_INSERT_ID();
                  SET v_created_almacen = TRUE;
              END IF;

              INSERT INTO ExistenciasVariante (
                  ProductoVarianteId,
                  AlmacenId,
                  UbicacionAlmacenId,
                  StockFisico,
                  StockReservado,
                  StockTransito,
                  StockMinimo,
                  StockMaximo,
                  FechaCreacion,
                  FechaActualizacion,
                  CreadoPorUsuarioId,
                  CreadoPorNombreUsuario,
                  ActualizadoPorUsuarioId,
                  ActualizadoPorNombreUsuario
              )
              SELECT
                  pv.Id,
                  v_almacen_id,
                  NULL,
                  pv.Cantidad,
                  0,
                  0,
                  GREATEST(COALESCE(pv.UmbralStockBajo,0),0),
                  NULL,
                  UTC_TIMESTAMP(6),
                  UTC_TIMESTAMP(6),
                  NULL,
                  'SOLQARYN PROD stock reconciliation 2026-09-27',
                  NULL,
                  NULL
                FROM ProductoVariantes pv
                JOIN Productos p ON p.Id=pv.ProductoId
               WHERE pv.Eliminado=0
                 AND p.Eliminado=0
                 AND p.Activo=1
               ORDER BY pv.Id;

              SET v_inserted = ROW_COUNT();

              SELECT COUNT(*)
                INTO v_missing_after
                FROM ProductoVariantes pv
                JOIN Productos p ON p.Id=pv.ProductoId
                LEFT JOIN ExistenciasVariante ev ON ev.ProductoVarianteId=pv.Id
               WHERE pv.Eliminado=0
                 AND p.Eliminado=0
                 AND p.Activo=1
                 AND ev.Id IS NULL;

              SELECT COUNT(*)
                INTO v_mismatch_after
                FROM (
                    SELECT pv.Id, pv.Cantidad, COALESCE(SUM(ev.StockFisico),0) AS StockFisico
                      FROM ProductoVariantes pv
                      JOIN Productos p ON p.Id=pv.ProductoId
                      LEFT JOIN ExistenciasVariante ev ON ev.ProductoVarianteId=pv.Id
                     WHERE pv.Eliminado=0
                       AND p.Eliminado=0
                       AND p.Activo=1
                     GROUP BY pv.Id,pv.Cantidad
                    HAVING pv.Cantidad <> COALESCE(SUM(ev.StockFisico),0)
                ) x;

              SELECT COALESCE(SUM(ev.StockFisico),0)
                INTO v_physical_total
                FROM ExistenciasVariante ev
                JOIN ProductoVariantes pv ON pv.Id=ev.ProductoVarianteId
                JOIN Productos p ON p.Id=pv.ProductoId
               WHERE pv.Eliminado=0
                 AND p.Eliminado=0
                 AND p.Activo=1;

              IF v_inserted <> v_missing_before
                 OR v_missing_after <> 0
                 OR v_mismatch_after <> 0
                 OR v_physical_total <> v_legacy_total THEN
                  SIGNAL SQLSTATE '45000' SET MESSAGE_TEXT='Abortado: postcheck de reconciliacion no coincide';
              END IF;

              COMMIT;

              SELECT
                  'SUCCESS' AS Status,
                  v_empresa_id AS EmpresaId,
                  v_sucursal_id AS SucursalId,
                  v_almacen_id AS AlmacenId,
                  v_created_sucursal AS SucursalCreada,
                  v_created_almacen AS AlmacenCreado,
                  v_inserted AS ExistenciasCreadas,
                  v_legacy_total AS StockLegacy,
                  v_physical_total AS StockFisico,
                  v_missing_after AS VariantesSinExistencia,
                  v_mismatch_after AS VariantesConDiferencia,
                  FALSE AS RollbackTriggered;
          END$$

          DELIMITER ;
          CALL sp_solqaryn_prod_reconcile_stock();
          DROP PROCEDURE IF EXISTS sp_solqaryn_prod_reconcile_stock;
          SQL

          echo "PROD_STOCK_RECONCILIATION=PASS"
