name: Priority 3 - ERP security and isolated restore

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - 'scripts/security/**'
      - '.github/workflows/priority3-erp-security.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: priority3-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorization-files-secrets:
    name: Authorization, files, secrets and tenant gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - name: Restore backend
        working-directory: backend
        run: dotnet restore Solqaryn.sln
      - name: Build backend Release
        working-directory: backend
        run: dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: Verify controller authorization and file-security regressions
        working-directory: backend
        run: >-
          dotnet test Solqaryn.sln --configuration Release --no-build
          --filter "FullyQualifiedName~Priority3AuthorizationSurfaceTests|FullyQualifiedName~Priority3FileSecurityTests"
      - name: Verify multi-tenant certification state without false claims
        run: python3 scripts/security/priority3_tenant_isolation_audit.py --require-certified
      - name: Export recent completed Actions logs and artifacts for secret scanning
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/priority3-actions"
          mkdir -p "$export_dir"
          mapfile -t run_ids < <(gh run list --repo "$GITHUB_REPOSITORY" --branch DEV --limit 20 --json databaseId,status --jq '.[] | select(.status=="completed") | .databaseId' | head -n 5)
          for run_id in "${run_ids[@]}"; do
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log > "$export_dir/run-$run_id.log" 2>/dev/null || true
            mkdir -p "$export_dir/artifacts-$run_id"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --dir "$export_dir/artifacts-$run_id" >/dev/null 2>&1 || true
          done
          echo "PRIORITY3_ACTIONS_RUNS_EXPORTED=${#run_ids[@]}"
      - name: Scan current tree, full reachable history, recent logs and artifacts for high-confidence secrets
        run: python3 scripts/security/priority3_secret_audit.py --external-dir "$RUNNER_TEMP/priority3-actions"

  backup-restore:
    name: MySQL 8.4 isolated backup and restore proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_p3_source
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=solqaryn_p3_source;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: Priority3-CI-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: Solqaryn.Priority3.CI
      Jwt__Audience: Solqaryn.Priority3.CI.Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restore and build backend
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: Materialize current schema with canonical Oracle bootstrap
        working-directory: backend
        env:
          SOLQARYN_DATABASE_BOOTSTRAP_MODE: fresh
        run: |
          set -euo pipefail
          dotnet run \
            --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj \
            --configuration Release \
            --no-build
      - name: Seed deterministic backup probe
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot solqaryn_p3_source -e "
            CREATE TABLE Priority3BackupProbe (
              Id INT NOT NULL PRIMARY KEY,
              Marker VARCHAR(64) NOT NULL,
              Amount DECIMAL(18,2) NOT NULL,
              UNIQUE KEY UX_Priority3BackupProbe_Marker (Marker)
            );
            INSERT INTO Priority3BackupProbe (Id, Marker, Amount) VALUES
              (1, 'priority3-alpha', 10.25),
              (2, 'priority3-beta', 20.50),
              (3, 'priority3-gamma', 30.75);"
      - name: Create transactional backup and restore into a different isolated database
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          backup="$RUNNER_TEMP/priority3-backup.sql"
          docker exec "$mysql_container" mysqldump -uroot -proot \
            --single-transaction --routines --triggers --events --no-tablespaces \
            solqaryn_p3_source > "$backup"
          test -s "$backup"
          docker exec "$mysql_container" mysql -uroot -proot -e "DROP DATABASE IF EXISTS solqaryn_p3_restore; CREATE DATABASE solqaryn_p3_restore CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          docker exec -i "$mysql_container" mysql -uroot -proot solqaryn_p3_restore < "$backup"
          rm -f "$backup"
      - name: Verify restored schema, constraints, indexes, migration history and data
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          q() { docker exec "$mysql_container" mysql -uroot -proot -Nse "$1"; }
          metric() {
            local db="$1" sql="$2"
            q "SELECT $sql FROM information_schema.TABLES WHERE TABLE_SCHEMA='$db';"
          }

          source_tables="$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='solqaryn_p3_source';")"
          restore_tables="$(q "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='solqaryn_p3_restore';")"
          source_migrations="$(q "SELECT COUNT(*) FROM solqaryn_p3_source.__EFMigrationsHistory;")"
          restore_migrations="$(q "SELECT COUNT(*) FROM solqaryn_p3_restore.__EFMigrationsHistory;")"
          source_fks="$(q "SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema='solqaryn_p3_source' AND constraint_type='FOREIGN KEY';")"
          restore_fks="$(q "SELECT COUNT(*) FROM information_schema.table_constraints WHERE constraint_schema='solqaryn_p3_restore' AND constraint_type='FOREIGN KEY';")"
          source_indexes="$(q "SELECT COUNT(DISTINCT CONCAT(table_name, ':', index_name)) FROM information_schema.statistics WHERE table_schema='solqaryn_p3_source';")"
          restore_indexes="$(q "SELECT COUNT(DISTINCT CONCAT(table_name, ':', index_name)) FROM information_schema.statistics WHERE table_schema='solqaryn_p3_restore';")"
          source_probe="$(q "SELECT CONCAT(COUNT(*),':',SUM(Id),':',FORMAT(SUM(Amount),2)) FROM solqaryn_p3_source.Priority3BackupProbe;")"
          restore_probe="$(q "SELECT CONCAT(COUNT(*),':',SUM(Id),':',FORMAT(SUM(Amount),2)) FROM solqaryn_p3_restore.Priority3BackupProbe;")"

          test "$source_tables" -gt 20
          test "$source_migrations" -gt 0
          test "$source_fks" -gt 0
          test "$source_tables" = "$restore_tables"
          test "$source_migrations" = "$restore_migrations"
          test "$source_fks" = "$restore_fks"
          test "$source_indexes" = "$restore_indexes"
          test "$source_probe" = "$restore_probe"
          test "$restore_probe" = "3:6:61.50"

          echo "PRIORITY3_BACKUP_RESTORE=PASS tables=$restore_tables migrations=$restore_migrations foreignKeys=$restore_fks indexes=$restore_indexes probe=$restore_probe"
      - name: Remove isolated databases
        if: always()
        shell: bash
        run: |
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot -e "DROP DATABASE IF EXISTS solqaryn_p3_restore; DROP DATABASE IF EXISTS solqaryn_p3_source;" || true
