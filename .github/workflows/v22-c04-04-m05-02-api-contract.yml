name: V22 C04-04.M05.02 - signed JWT HTTP API contract
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/C0404M0502PaymentApiDtoContractTests.cs'
      - '.github/workflows/v22-c04-04-m05-02-api-contract.yml'
      - 'backend/src/API/Controllers/PagosOnlineController.cs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0404-m0502-${{ github.sha }}
  cancel-in-progress: false
jobs:
  api-contract:
    name: C04-04.M05.02 - ASP.NET10 signed JWT TestServer DTO safe errors
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Verify exact SHA and Scope Lock
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
          node scripts/verify-solqaryn-skills.mjs --self-test
      - name: Restore and Release build
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: Signed JWT and MVC HTTP xUnit TRX no skips
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c0404-m0502"
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~C0404M0502PaymentApiDtoContractTests' --logger 'trx;LogFileName=contract.trx' --results-directory "$RUNNER_TEMP/c0404-m0502"
          python3 - <<'PY'
          import os,sys,xml.etree.ElementTree as ET
          p=os.path.join(os.environ['RUNNER_TEMP'],'c0404-m0502','contract.trx')
          c=ET.parse(p).getroot().find('.//{*}Counters')
          if c is None:sys.exit('NO_TRX')
          n=int(c.get('total','0'));passed=int(c.get('passed','0'))
          failed=int(c.get('failed','0'));skipped=int(c.get('notExecuted','0'))
          if n<6 or passed!=n or failed or skipped:
              sys.exit(f'NO_GO n={n} pass={passed} fail={failed} skip={skipped}')
          print(f'REAL_ASPNET_TESTSERVER_SIGNED_JWT_API_DTO_SUCCESS {passed}/{n} SHA={os.environ["GITHUB_SHA"]}')
          PY
