name: V17 C14-02.M04.05 - accesibilidad de guia privada
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v17-c14-02-m04-05-a11y.yml'
      - 'frontend/src/app/features/plataforma/revision-amenazas-v5.component.ts'
      - 'frontend/e2e/c14-02-m04-05-a11y.spec.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v17-c1402-m0405-${{ github.sha }}
  cancel-in-progress: false
jobs:
  a11y:
    name: C14-02.M04.05 - Chromium responsive y teclado
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm fijo
        run: npm install --global npm@11.19.0
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Lint y build
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Servir app sin proveedores reales
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > v17-c1402-m0405.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat v17-c1402-m0405.log >&2
          exit 1
      - name: Cinco Chromium reales con sesion sintetica
        working-directory: frontend
        run: npx playwright test e2e/c14-02-m04-05-a11y.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-c1402-m0405
          path: |
            frontend/v17-c1402-m0405.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
