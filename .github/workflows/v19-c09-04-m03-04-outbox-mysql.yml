name: V19 C09-04.M03.04 - Outbox MySQL 8.4 causal
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Infrastructure/Repositories/MensajeOutboxRepository.cs'
      - 'backend/tests/Solqaryn.Tests/C0904M0304MySqlOutboxPersistenceTests.cs'
      - '.github/workflows/v19-c09-04-m03-04-outbox-mysql.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c0904-m0304-${{ github.sha }}
  cancel-in-progress: false
jobs:
  mysql-ephemeral:
    name: C09-04.M03.04 - Oracle EF MySQL 8.4 tenant/idempotencia
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=v19_outbox_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Scope Lock estricto
        run: node scripts/verify-project-scope.mjs
      - name: Acreditar MySQL 8.4 efimero local
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION();' | grep -E '^8\\.4\\.'
      - name: Build y prueba real EF tenant A/B e idempotencia
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --filter 'FullyQualifiedName~C0904M0304MySqlOutboxPersistenceTests&Category=Integration' --logger 'console;verbosity=normal'
