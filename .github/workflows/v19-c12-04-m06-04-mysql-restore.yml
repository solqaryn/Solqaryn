name: V19 C12-04.M06.04 - MySQL 8.4 isolated restore evidence
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/quality/verify-c12-04-m06-04-mysql-restore.sh'
      - '.github/workflows/v19-c12-04-m06-04-mysql-restore.yml'
      - 'docs/evidencias/C12-04.M06.04-V19.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c1204-m0604-mysql-${{ github.sha }}
  cancel-in-progress: false
jobs:
  isolated-mysql:
    name: C12-04.M06.04 - MySQL 8.4 synthetic restore real
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Scope Lock exact checkout
        run: node scripts/verify-project-scope.mjs
      - name: Execute real isolated SQL backup, restore, and negative rollback
        shell: bash
        run: bash scripts/quality/verify-c12-04-m06-04-mysql-restore.sh "${{ job.services.mysql.id }}"

  oracle-ef-sandbox:
    name: C12-04.M06.04 - Oracle EF migrations MySQL 8.4 sandbox
    needs: isolated-mysql
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=c1204_ef_sandbox;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: 'C1204-Local-CI-Only-OracleEF-Secret-Not-Production-2026'
      Jwt__Issuer: 'Solqaryn.CI.C1204'
      Jwt__Audience: 'Solqaryn.CI.C1204.Frontend'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Verificar Scope Lock y MySQL 8.4 solo loopback
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-project-scope.mjs
          [[ "$ConnectionStrings__DefaultConnection" == 'Server=127.0.0.1;Port=3306;Database=c1204_ef_sandbox;'* ]] || { echo 'REMOTE_OR_UNEXPECTED_DB_REJECTED'; exit 1; }
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION()' | grep -E '^8[.]4[.]'
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -e "CREATE DATABASE c1204_ef_sandbox CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"
      - name: Oracle EF 10 migraciones reales e idempotencia en base aislada
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
          dotnet tool restore
          dotnet tool run dotnet-ef --version | grep -F '10.0.12'
          # OracleBaseline altera Empresas; la base vacia necesita el bootstrap
          # canonico que verifica fisicamente el esquema antes de adoptar historia EF.
          SOLQARYN_DATABASE_BOOTSTRAP_MODE=fresh dotnet run \
            --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj \
            --configuration Release --no-build
          dotnet tool run dotnet-ef database update \
            --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext --configuration Release --no-build
          first="$(docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT COUNT(*) FROM c1204_ef_sandbox.__EFMigrationsHistory;')"
          [[ "$first" =~ ^[0-9]+$ && "$first" -gt 0 ]] || { echo 'NO_APPLIED_EF_MIGRATIONS'; exit 1; }
          dotnet tool run dotnet-ef database update \
            --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext --configuration Release --no-build
          second="$(docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT COUNT(*) FROM c1204_ef_sandbox.__EFMigrationsHistory;')"
          [[ "$first" == "$second" ]] || { echo 'NON_IDEMPOTENT_EF_MIGRATIONS'; exit 1; }
          echo "C1204_EF_ORACLE_MYSQL84_SANDBOX_PASS=TRUE APPLIED_MIGRATIONS=$first REAPPLY_IDEMPOTENT=TRUE"
      - name: Oracle EF / tenant A-B integracion real y TRX
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build \
            --filter 'FullyQualifiedName~C1204M0503MySqlCutoverProviderIntegrationTests&Category=Integration' \
            --logger 'trx;LogFileName=c1204-m0604-oracle-ab.trx' --logger 'console;verbosity=normal'
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          found=list(Path('tests/Solqaryn.Tests/TestResults').rglob('c1204-m0604-oracle-ab.trx'))
          assert found, 'TRX_MISSING'
          root=ET.parse(found[-1]).getroot()
          counters=next((e.attrib for e in root.iter() if e.tag.endswith('Counters')), None)
          assert counters, 'COUNTERS_MISSING'
          assert int(counters['executed'])>=3, counters
          assert int(counters['passed'])>=3, counters
          assert int(counters['failed'])==0, counters
          assert int(counters['notExecuted'])==0, counters
          print('C1204_M0604_ORACLE_EF_TENANT_AB_TRX_PASS=TRUE')
          PY
      - name: Comprobar dump-restauracion de esquema Oracle EF y detectar drift adversarial
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          cid="${{ job.services.mysql.id }}"
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          sql() { docker exec -e MYSQL_PWD=root "$cid" mysql -uroot -Nse "$1"; }
          schema_fingerprint() {
            sql "SELECT CONCAT_WS('|', TABLE_NAME, COLUMN_NAME, COLUMN_TYPE, IS_NULLABLE, IFNULL(COLUMN_DEFAULT,'<NULL>'), COLUMN_KEY, EXTRA) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='$1' ORDER BY TABLE_NAME, ORDINAL_POSITION;" | sha256sum | awk '{print $1}'
          }
          history_fingerprint() {
            sql "SELECT MigrationId, ProductVersion FROM $1.__EFMigrationsHistory ORDER BY MigrationId;" | sha256sum | awk '{print $1}'
          }
          source_count="$(sql 'SELECT COUNT(*) FROM c1204_ef_sandbox.__EFMigrationsHistory;')"
          [[ "$source_count" =~ ^[0-9]+$ && "$source_count" -gt 0 ]] || { echo 'NO_CANONICAL_EF_HISTORY'; exit 1; }
          source_schema="$(schema_fingerprint c1204_ef_sandbox)"
          source_history="$(history_fingerprint c1204_ef_sandbox)"
          docker exec -e MYSQL_PWD=root "$cid" mysqldump -uroot --single-transaction --skip-lock-tables --no-tablespaces --skip-comments c1204_ef_sandbox > "$work/c1204-ef.sql"
          [[ -s "$work/c1204-ef.sql" ]] || { echo 'EMPTY_EF_BACKUP'; exit 1; }
          original_dump_sha="$(sha256sum "$work/c1204-ef.sql" | awk '{print $1}')"
          sql 'CREATE DATABASE c1204_ef_restored CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;'
          docker exec -i -e MYSQL_PWD=root "$cid" mysql -uroot c1204_ef_restored < "$work/c1204-ef.sql"
          [[ "$(sha256sum "$work/c1204-ef.sql" | awk '{print $1}')" == "$original_dump_sha" ]] || { echo 'EF_DUMP_MUTATED'; exit 1; }
          restored_count="$(sql 'SELECT COUNT(*) FROM c1204_ef_restored.__EFMigrationsHistory;')"
          [[ "$restored_count" == "$source_count" ]] || { echo 'EF_MIGRATION_COUNT_DRIFT'; exit 1; }
          [[ "$(history_fingerprint c1204_ef_restored)" == "$source_history" ]] || { echo 'EF_MIGRATION_IDS_DRIFT'; exit 1; }
          [[ "$(schema_fingerprint c1204_ef_restored)" == "$source_schema" ]] || { echo 'EF_SCHEMA_RESTORE_DRIFT'; exit 1; }
          sql 'CREATE TABLE c1204_ef_restored.__C1204UnexpectedTable (id INT PRIMARY KEY);'
          [[ "$(schema_fingerprint c1204_ef_restored)" != "$source_schema" ]] || { echo 'UNEXPECTED_TABLE_NOT_DETECTED'; exit 1; }
          sql 'DROP TABLE c1204_ef_restored.__C1204UnexpectedTable;'
          [[ "$(schema_fingerprint c1204_ef_restored)" == "$source_schema" ]] || { echo 'SCHEMA_NOT_RECOVERED_AFTER_NEGATIVE'; exit 1; }
          echo "C1204_ORACLE_EF_FULL_SCHEMA_RESTORE_PASS=TRUE MIGRATIONS=$source_count STRUCTURE_SHA256=$source_schema HISTORY_SHA256=$source_history UNEXPECTED_TABLE_DETECTED=TRUE"
          echo "SYNTHETIC_MYSQL_ONLY=TRUE AIVEN_PROD=NOT_USED OLD_SCHEMA_UPGRADE=NOT_PROVEN PROD_RTO_RPO=NOT_MEASURED"
      - name: Descartar base de ensayo y verificar ausencia
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -e 'DROP DATABASE IF EXISTS c1204_ef_restored; DROP DATABASE IF EXISTS c1204_ef_sandbox;'
          remaining="$(docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse "SELECT COUNT(*) FROM INFORMATION_SCHEMA.SCHEMATA WHERE SCHEMA_NAME IN ('c1204_ef_sandbox','c1204_ef_restored');")"
          [[ "$remaining" == "0" ]] || { echo 'SANDBOX_NOT_CLEANED'; exit 1; }
