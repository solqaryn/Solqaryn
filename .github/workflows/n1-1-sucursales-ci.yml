name: ERP-N1.1 - Certificación Sucursales

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/n1-1-sucursales-ci.yml
      - backend/src/API/Controllers/SucursalesController.cs
      - backend/src/API/Filters/MedirRendimientoBusquedaFilter.cs
      - backend/src/API/Program.cs
      - backend/src/Application/Common/CatalogoPermisosBase.cs
      - backend/src/Application/DTOs/Sucursal*.cs
      - backend/src/Application/Interfaces/ISucursal*.cs
      - backend/src/Application/Services/SucursalService.cs
      - backend/src/Application/Validators/SucursalValidators.cs
      - backend/src/Domain/Entities/Sucursal.cs
      - backend/src/Domain/Enums/ModuloSistema.cs
      - backend/src/Infrastructure/Migrations/*N1_1_Sucursal*.cs
      - backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs
      - backend/src/Infrastructure/Persistence/Configurations/SucursalConfiguration.cs
      - backend/src/Infrastructure/Repositories/SucursalRepository.cs
      - backend/src/Infrastructure/Repositories/AuditoriaRepository.cs
      - backend/tests/Solqaryn.Tests/Sucursal*.cs
      - frontend/src/app/app.component.ts
      - frontend/src/app/app.routes.ts
      - frontend/src/app/core/models/sucursal.model.ts
      - frontend/src/app/features/sucursales/**
      - frontend/src/app/services/sucursal.service.ts
      - frontend/e2e/n1-1-sucursales.spec.ts
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/n1-1-sucursales-ci.yml
      - backend/src/**/Sucursal*.cs
      - backend/src/API/Controllers/SucursalesController.cs
      - backend/src/API/Filters/MedirRendimientoBusquedaFilter.cs
      - backend/src/Infrastructure/Repositories/AuditoriaRepository.cs
      - backend/tests/Solqaryn.Tests/Sucursal*.cs
      - frontend/src/app/features/sucursales/**
      - frontend/src/app/core/models/sucursal.model.ts
      - frontend/src/app/services/sucursal.service.ts
      - frontend/e2e/n1-1-sucursales.spec.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n1-1-sucursales-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sucursales:
    name: API, RBAC, auditoría, MySQL, Angular y E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_n11_sucursales
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: '5005'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=solqaryn_n11_sucursales;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'
      Jwt__Secret: 'N11-Sucursales-E2E-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'Solqaryn.API'
      Jwt__Audience: 'Solqaryn.Frontend'
      Jwt__ExpiraMinutos: '120'
      Security__LoginRateLimitPerMinute: '300'
      SeedAdmin__Username: 'e2e_admin'
      SeedAdmin__Password: 'E2E.Admin#2026!'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      Cors__AllowedOrigins__1: 'http://localhost:4200'
      AppSettings__BackendPublicUrl: 'https://preview.solqaryn.invalid'
      AppSettings__LogoPublicUrl: 'https://solqaryn-dev.vercel.app/assets/storefront-logo.png'
      Cloudinary__CloudName: 'e2e-not-used'
      Cloudinary__ApiKey: 'e2e-not-used'
      Cloudinary__ApiSecret: 'e2e-not-used'
      PHASE7_API_URL: 'http://127.0.0.1:5005'
      PHASE7_ADMIN_USERNAME: 'e2e_admin'
      PHASE7_ADMIN_PASSWORD: 'E2E.Admin#2026!'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'

    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restaurar, compilar y probar backend
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore -warnaserror
          dotnet test Solqaryn.sln --configuration Release --no-build --filter "Category!=Integration"

      - name: Iniciar API con migraciones MySQL
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          nohup dotnet run \
            --project src/API/Solqaryn.API.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            > n11-sucursales-api.log 2>&1 &
          echo $! > n11-sucursales-api.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5005/health > /dev/null && \
               curl --fail --silent http://127.0.0.1:5005/health/ready > /dev/null; then
              echo 'API N1.1 lista y MySQL conectado.'
              exit 0
            fi
            sleep 2
          done
          cat n11-sucursales-api.log >&2 || true
          exit 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Instalar, lint y build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build:prod
          npx playwright install --with-deps chromium

      - name: Iniciar Angular
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > n11-sucursales-frontend.log 2>&1 &
          echo $! > n11-sucursales-frontend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/login > /dev/null; then
              echo 'Angular N1.1 listo.'
              exit 0
            fi
            sleep 2
          done
          cat n11-sucursales-frontend.log >&2 || true
          exit 1

      - name: Ejecutar E2E Sucursales
        working-directory: frontend
        run: npx playwright test e2e/n1-1-sucursales.spec.ts --config=playwright.config.ts

      - name: Publicar evidencia N1.1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n1-1-sucursales-evidence
          path: |
            backend/n11-sucursales-api.log
            frontend/n11-sucursales-frontend.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
