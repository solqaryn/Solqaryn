name: V19 C12-04.M04.06 - densidad y progreso privado
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c12-04-m04-06-lightness.spec.ts'
      - '.github/workflows/v19-c12-04-m04-06-lightness.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c1204-m0406-${{ github.sha }}
  cancel-in-progress: false
jobs:
  private-cutover-lightness:
    name: C12-04.M04.06 - 18 Vitest y 3 Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm institucional
        run: npm install --global npm@11.19.0
      - name: Dependencias reproducibles
        working-directory: frontend
        run: npm ci
      - name: Vitest previos de sesion, roles, revocacion y branding
        working-directory: frontend
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c12-04-m04-01-cutover-readonly.component.spec.ts
      - name: Lint y build Angular
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend local efimero
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > v19-c1204-m0406.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat v19-c1204-m0406.log >&2
          exit 1
      - name: Chromium con sesion sintetica
        working-directory: frontend
        run: npx playwright test e2e/c12-04-m04-06-lightness.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Logs de fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v19-c1204-m0406-failure
          path: |
            frontend/v19-c1204-m0406.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7
