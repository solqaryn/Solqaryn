name: V19 - C10-04.M05.02 safe DTO error contract
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Application/AutomationV5/C1004CacheJobsApplicationService.cs'
      - 'backend/tests/Solqaryn.Tests/Application/C1004CacheJobsM0502DtoSafetyTests.cs'
      - 'backend/tests/Solqaryn.Tests/Application/C1004CacheJobsApplicationServiceTests.cs'
      - '.github/workflows/v19-c10-04-m05-02-dto-errors.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c1004-m0502-${{ github.sha }}
  cancel-in-progress: false
jobs:
  dto-contract:
    name: C10-04.M05.02 - .NET 10 DTO provider errors
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj
      - name: xUnit DTO contract and existing application regression
        run: >-
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          --configuration Release --no-restore
          --filter 'FullyQualifiedName~C1004CacheJobsM0502DtoSafetyTests|FullyQualifiedName~C1004CacheJobsApplicationServiceTests'
          --logger 'console;verbosity=normal'
