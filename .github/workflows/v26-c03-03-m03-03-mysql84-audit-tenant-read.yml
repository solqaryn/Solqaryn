name: V26 - C03-03.M03.03 audit JWT tenant A B MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Infrastructure/Repositories/AuditoriaRepository.cs'
      - 'backend/tests/Solqaryn.Tests/C0303M0303VerifiedAuditMysql84IntegrationTests.cs'
      - 'backend/tests/Solqaryn.Tests/Application/Security/AuditoriaTenantOwnershipTests.cs'
      - 'backend/src/API/Security/C0303AuditReadOnlyProbeEndpoint.cs'
      - '.github/workflows/v26-c03-03-m03-03-mysql84-audit-tenant-read.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v26-c0303-m0303-mysql84-read-isolation
  cancel-in-progress: false
jobs:
  audit-tenant-mysql:
    name: C03-03.M03.03 - real JWT RBAC tenant A B MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v26-only
          MYSQL_DATABASE: solqaryn_c1502_m0503
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v26-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      ConnectionStrings__DefaultConnection: "Server=127.0.0.1;Port=3306;Database=solqaryn_c1502_m0503;User=root;Password=ephemeral-v26-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Exact SHA project Scope Lock and canonical skill
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
          node scripts/verify-solqaryn-skills.mjs --self-test
      - name: Real Oracle EF MySQL 8.4 JWT RBAC A B negative and audit read isolation
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0303M0303VerifiedAuditMysql84IntegrationTests|FullyQualifiedName~AuditoriaTenantOwnershipTests' --logger 'trx;LogFileName=C0303AuditTenantMysql84.trx' --verbosity normal
      - name: Preserve causal test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0303-real-mysql84-tenant-read-${{ github.sha }}
          path: backend/tests/Solqaryn.Tests/TestResults/**/*.trx
          if-no-files-found: warn
