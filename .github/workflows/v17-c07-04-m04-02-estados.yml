name: V17 C07-04.M04.02 - estados de pedidos ERP
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c07-04-m04-02-pedidos-estados.spec.ts'
      - 'frontend/e2e/c07-04-m04-04-pedidos-interacciones.spec.ts'
      - 'frontend/src/app/features/pedidos-venta/pedidos-venta.components.ts'
      - '.github/workflows/v17-c07-04-m04-02-estados.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v17-c0704-m0402-${{ github.sha }}
  cancel-in-progress: false
jobs:
  browser:
    name: C07-04.M04.02 Chromium estados y permisos
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm compatible
        run: npm install --global npm@11.19.0
      - name: Dependencias reproducibles
        run: npm ci
      - name: Lint y build Angular real
        run: |
          npm run lint
          npm run build:prod
      - name: Preparar Chromium
        run: npx playwright install --with-deps chromium
      - name: Servir Angular local sin datos productivos
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c0704-m0402-angular.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then
              echo 'ANGULAR_LOCAL_READY=PASS'
              exit 0
            fi
            sleep 2
          done
          cat c0704-m0402-angular.log >&2
          exit 1
      - name: Playwright casos positivos negativos error permisos frontera
        run: npx playwright test e2e/c07-04-m04-02-pedidos-estados.spec.ts e2e/c07-04-m04-04-pedidos-interacciones.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Evidencia CI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-c0704-m0402-chromium
          path: |
            frontend/c0704-m0402-angular.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
