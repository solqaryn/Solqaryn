name: ERP-N0.5 - Certificación MetodoPago histórico

on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/**/*MetodoPago*.cs'
      - 'backend/src/**/*CompraMetodoPagoResolver*.cs'
      - 'backend/src/Infrastructure/Migrations/*N0_5*.cs'
      - 'backend/src/Infrastructure/Migrations/*ERP_N05*.cs'
      - 'backend/tests/Solqaryn.Tests/*MetodoPago*.cs'
      - 'backend/tests/Solqaryn.Tests/CompraMetodoPagoResolverTests.cs'
      - 'backend/scripts/*erp-n0-5*'
      - 'frontend/e2e/n0-5-metodos-pago-regresion.spec.ts'
      - '.github/workflows/erp-n0-5-ci.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/src/**/*MetodoPago*.cs'
      - 'backend/src/**/*CompraMetodoPagoResolver*.cs'
      - 'backend/src/Infrastructure/Migrations/*N0_5*.cs'
      - 'backend/src/Infrastructure/Migrations/*ERP_N05*.cs'
      - 'backend/tests/Solqaryn.Tests/*MetodoPago*.cs'
      - 'backend/tests/Solqaryn.Tests/CompraMetodoPagoResolverTests.cs'
      - 'backend/scripts/*erp-n0-5*'
      - 'frontend/e2e/n0-5-metodos-pago-regresion.spec.ts'
      - '.github/workflows/erp-n0-5-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-n0-5-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metodo-pago-historico:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_n05_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=solqaryn_n05_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: ERP-N0-5-CI-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: Solqaryn.CI
      Jwt__Audience: Solqaryn.CI.Frontend

    steps:
      - uses: actions/checkout@v4
      - name: Gobierno SOLQARYN
        run: node scripts/verify-project-scope.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restaurar, compilar y probar backend
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln -c Release --no-restore -warnaserror
          dotnet test Solqaryn.sln -c Release --no-build --filter "Category!=Integration"
          dotnet tool restore
          dotnet tool run dotnet-ef --version | grep -F '10.0.12'
      - name: Esquema Oracle EF10 fisico final en MySQL descartable
        working-directory: backend
        env:
          SOLQARYN_DATABASE_BOOTSTRAP_MODE: fresh
        run: |
          set -euo pipefail
          dotnet run --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj --configuration Release --no-build
          echo 'N05_ORACLE_SCHEMA_BOOTSTRAP=PASS'
      - name: Certificar dependencias relacionales reales
        shell: bash
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -Nse "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE' AND TABLE_NAME <> '__EFMigrationsHistory';")" = 136
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -Nse "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")" = 1
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -Nse "SELECT COUNT(*) FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN ('Ventas','FacturaPagos','MovimientosFinancieros') AND COLUMN_NAME='MetodoPagoId' AND REFERENCED_TABLE_NAME='MetodosPago';")" = 3
          echo 'N05_ORACLE_RELATIONAL_FKS=PASS'
      - name: Sembrar historia representativa y desacoplar Id de enum
        shell: bash
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -e "
            INSERT INTO MetodosPago
              (Codigo,Nombre,Tipo,Activo,RequiereReferencia,RequiereBanco,PermiteCambio,Orden,Metadata,Eliminado,FechaCreacion,FechaActualizacion)
            VALUES
              ('ChequeExterno','Cheque externo','Externo',1,0,0,0,5,'{\"ci\":true}',0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));

            INSERT INTO Ventas
              (Id,NumeroVenta,Fecha,ClienteNombre,Estado,EstadoPago,MetodoPago,
               ImporteBruto,ImporteProductos,Subtotal,Descuento,Impuesto,CostoEnvio,
               EnvioExonerado,Total,CostoTotal,UtilidadBruta,Eliminado,FechaCreacion,FechaActualizacion)
            VALUES
              (9501,'N05-V-1',UTC_TIMESTAMP(6),'N05 Cliente 1','Confirmada','Pagado','Efectivo',100,100,100,0,0,0,0,100,60,40,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)),
              (9502,'N05-V-2',UTC_TIMESTAMP(6),'N05 Cliente 2','Confirmada','Pagado','Transferencia',100,100,100,0,0,0,0,100,60,40,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)),
              (9503,'N05-V-3',UTC_TIMESTAMP(6),'N05 Cliente 3','Confirmada','Pagado','Tarjeta',100,100,100,0,0,0,0,100,60,40,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)),
              (9504,'N05-V-4',UTC_TIMESTAMP(6),'N05 Cliente 4','Confirmada','Pagado','Otro',100,100,100,0,0,0,0,100,60,40,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));

            INSERT INTO Facturas
              (Id,VentaId,NumeroFactura,FechaEmision,Estado,Moneda,EmpresaNombre,ClienteNombre,
               VendedorUsuarioId,VendedorNombreUsuario,ImporteBruto,Subtotal,Descuento,Impuesto,
               CostoEnvio,EnvioExonerado,Total,TotalPagado,SaldoPendiente)
            VALUES
              (9511,9501,'N05-F-1',UTC_TIMESTAMP(6),'Emitida','HNL','Solqaryn CI','N05 Cliente 1',1,'n05.ci',100,100,0,0,0,0,100,100,0),
              (9512,9502,'N05-F-2',UTC_TIMESTAMP(6),'Emitida','HNL','Solqaryn CI','N05 Cliente 2',1,'n05.ci',100,100,0,0,0,0,100,100,0),
              (9513,9503,'N05-F-3',UTC_TIMESTAMP(6),'Emitida','HNL','Solqaryn CI','N05 Cliente 3',1,'n05.ci',100,100,0,0,0,0,100,100,0),
              (9514,9504,'N05-F-4',UTC_TIMESTAMP(6),'Emitida','HNL','Solqaryn CI','N05 Cliente 4',1,'n05.ci',100,100,0,0,0,0,100,100,0);

            INSERT INTO FacturaPagos
              (Id,FacturaId,FechaPago,Monto,MetodoPago,Anulado,FechaCreacion,FechaActualizacion)
            VALUES
              (9521,9511,UTC_TIMESTAMP(6),100,1,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)),
              (9522,9512,UTC_TIMESTAMP(6),100,2,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)),
              (9523,9513,UTC_TIMESTAMP(6),100,3,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)),
              (9524,9514,UTC_TIMESTAMP(6),100,4,0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));

            INSERT INTO MovimientosFinancieros
              (Id,Fecha,Tipo,Categoria,Concepto,Monto,Estado,MetodoPago,MetodoPagoId,EsAutomatico,ModuloOrigen)
            VALUES
              (9531,UTC_TIMESTAMP(6),'Ingreso','Venta','N05 Efectivo',100,'Pagado','Efectivo',NULL,0,'Manual'),
              (9532,UTC_TIMESTAMP(6),'Ingreso','Venta','N05 Transferencia',100,'Pagado','Transferencia',NULL,0,'Manual'),
              (9533,UTC_TIMESTAMP(6),'Ingreso','Venta','N05 Tarjeta',100,'Pagado','Tarjeta',NULL,0,'Manual'),
              (9534,UTC_TIMESTAMP(6),'Ingreso','Venta','N05 Otro',100,'Pagado','Otro',NULL,0,'Manual'),
              (9535,UTC_TIMESTAMP(6),'Ajuste','Ajuste','N05 sin método',0,'Pagado',NULL,NULL,0,'Manual');
          "

      - name: Probar rechazo de metodo historico desconocido (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -e "
            INSERT INTO MovimientosFinancieros
              (Id,Fecha,Tipo,Categoria,Concepto,Monto,Estado,MetodoPago,MetodoPagoId,EsAutomatico,ModuloOrigen)
            VALUES (9599,UTC_TIMESTAMP(6),'Ajuste','Otro','N05 dato inválido',0,'Pagado','Cheque',NULL,0,'Manual');"
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -Nse "SELECT COUNT(*) FROM MovimientosFinancieros WHERE Id=9599 AND MetodoPago NOT IN ('Efectivo','Transferencia','Tarjeta','Otro') AND MetodoPagoId IS NULL;")" = 1
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -Nse "SELECT COUNT(*) FROM MetodosPago WHERE Codigo IN ('Efectivo','Transferencia','Tarjeta','Otro');")" = 0
          docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -e "DELETE FROM MovimientosFinancieros WHERE Id=9599;"
          echo 'N05_UNKNOWN_LEGACY_PAYMENT_FAIL_CLOSED=PASS'
      - name: Reconciliar relaciones de pago en MySQL EF10 efimero, sin asumir IDs enum
        shell: bash
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -e "
            START TRANSACTION;
            INSERT INTO MetodosPago
              (Codigo,Nombre,Tipo,Activo,RequiereReferencia,RequiereBanco,PermiteCambio,Orden,Metadata,Eliminado,FechaCreacion,FechaActualizacion)
            VALUES
              ('Efectivo','Efectivo','Efectivo',1,0,0,0,10,'{}',0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)),
              ('Transferencia','Transferencia','Transferencia',1,0,0,0,20,'{}',0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)),
              ('Tarjeta','Tarjeta','Tarjeta',1,0,0,0,30,'{}',0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)),
              ('Otro','Otro','Otro',1,0,0,0,40,'{}',0,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6));
            UPDATE Ventas v JOIN MetodosPago m ON BINARY m.Codigo=BINARY v.MetodoPago
              SET v.MetodoPagoId=m.Id WHERE v.Id BETWEEN 9501 AND 9504;
            UPDATE FacturaPagos fp JOIN MetodosPago m ON BINARY m.Codigo=BINARY
              (CASE fp.MetodoPago WHEN 1 THEN 'Efectivo' WHEN 2 THEN 'Transferencia'
                WHEN 3 THEN 'Tarjeta' WHEN 4 THEN 'Otro' END)
              SET fp.MetodoPagoId=m.Id WHERE fp.Id BETWEEN 9521 AND 9524;
            UPDATE MovimientosFinancieros mf JOIN MetodosPago m ON BINARY m.Codigo=BINARY mf.MetodoPago
              SET mf.MetodoPagoId=m.Id WHERE mf.Id BETWEEN 9531 AND 9534;
            COMMIT;"
      - name: Verificar integridad y mapeo semantico sin IDs ordinales
        shell: bash
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -Nse "SELECT COUNT(*) FROM MetodosPago WHERE Codigo='ChequeExterno' AND Id=1;")" = 1
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -Nse "SELECT COUNT(*) FROM MetodosPago WHERE Codigo='Efectivo' AND Id=1;")" = 0
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -Nse "SELECT COUNT(*) FROM Ventas v JOIN MetodosPago m ON v.MetodoPagoId=m.Id AND BINARY v.MetodoPago=BINARY m.Codigo WHERE v.Id BETWEEN 9501 AND 9504;")" = 4
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -Nse "SELECT COUNT(*) FROM FacturaPagos fp JOIN MetodosPago m ON fp.MetodoPagoId=m.Id AND BINARY m.Codigo=BINARY(CASE fp.MetodoPago WHEN 1 THEN 'Efectivo' WHEN 2 THEN 'Transferencia' WHEN 3 THEN 'Tarjeta' WHEN 4 THEN 'Otro' END) WHERE fp.Id BETWEEN 9521 AND 9524;")" = 4
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -Nse "SELECT COUNT(*) FROM MovimientosFinancieros mf JOIN MetodosPago m ON mf.MetodoPagoId=m.Id AND BINARY mf.MetodoPago=BINARY m.Codigo WHERE mf.Id BETWEEN 9531 AND 9534;")" = 4
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n05_ci -Nse "SELECT COUNT(*) FROM MovimientosFinancieros WHERE Id=9535 AND MetodoPago IS NULL AND MetodoPagoId IS NULL;")" = 1
          echo 'N05_ORACLE_PAYMENT_INTEGRITY=PASS'
      - name: Verificar modelo Oracle sin drift
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj --startup-project src/API/Solqaryn.API.csproj --context AppDbContext --configuration Release --no-build
          echo 'N05_ORACLE_EF_PENDING_MODEL=0'
      - name: Configurar Node.js para regresión frontend N0.5
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Instalar frontend y Chromium
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build:prod
          npx playwright install --with-deps chromium

      - name: Iniciar Angular para regresión N0.5
        shell: bash
        run: |
          set -euo pipefail
          nohup npm --prefix frontend start -- --host 127.0.0.1 --port 4200 > frontend/n0-5-frontend.log 2>&1 &
          echo $! > frontend/n0-5-frontend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/login > /dev/null; then
              echo 'Angular N0.5 listo.'
              exit 0
            fi
            sleep 2
          done
          cat frontend/n0-5-frontend.log >&2 || true
          exit 1

      - name: Ejecutar regresión frontend/E2E N0.5
        working-directory: frontend
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npx playwright test e2e/n0-5-metodos-pago-regresion.spec.ts --config=playwright.config.ts

      - name: Publicar evidencia E2E N0.5
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-n0-5-e2e
          path: |
            frontend/n0-5-frontend.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
