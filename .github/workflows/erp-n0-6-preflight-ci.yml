name: ERP-N0.6 - contrato final referencias polimorficas

on:
  push:
    branches: [dev]
    paths:
      - 'backend/scripts/preflight-erp-n0-6-origen-movimiento-inventario.sql'
      - 'backend/scripts/validar-erp-n0-6-c2-backfill.sql'
      - 'backend/scripts/postcheck-erp-n0-6-c3-origen-tipado.sql'
      - 'backend/src/Infrastructure.Migrations/**'
      - 'backend/src/Infrastructure.Migrations.History/**'
      - 'backend/tests/Solqaryn.Tests/MovimientoInventarioOrigenTipadoIntegrationTests.cs'
      - '.github/workflows/erp-n0-6-preflight-ci.yml'
  pull_request:
    branches: [dev]
    paths:
      - 'backend/scripts/preflight-erp-n0-6-origen-movimiento-inventario.sql'
      - 'backend/scripts/validar-erp-n0-6-c2-backfill.sql'
      - 'backend/scripts/postcheck-erp-n0-6-c3-origen-tipado.sql'
      - 'backend/src/Infrastructure.Migrations/**'
      - 'backend/src/Infrastructure.Migrations.History/**'
      - 'backend/tests/Solqaryn.Tests/MovimientoInventarioOrigenTipadoIntegrationTests.cs'
      - '.github/workflows/erp-n0-6-preflight-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-n0-6-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  origen-inventario-final:
    name: N0.6 - origen tipado final Oracle EF10
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_n06_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=solqaryn_n06_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: ERP-N0-6-CI-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: Solqaryn.CI
      Jwt__Audience: Solqaryn.CI.Frontend

    steps:
      - uses: actions/checkout@v4

      - name: Scope lock SOLQARYN
        run: node scripts/verify-project-scope.mjs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Restore build y toolchain
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet tool restore
          dotnet tool run dotnet-ef --version | grep -F '10.0.12'
          dotnet build Solqaryn.sln --configuration Release --no-restore

      - name: Materializar contrato físico final
        working-directory: backend
        env:
          SOLQARYN_DATABASE_BOOTSTRAP_MODE: fresh
        run: |
          set -euo pipefail
          dotnet run \
            --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj \
            --configuration Release \
            --no-build

      - name: Certificar scripts de lectura sobre esquema final
        shell: bash
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          test "$(docker exec -i "$c" mysql -uroot -proot solqaryn_n06_ci --batch --skip-column-names < backend/scripts/preflight-erp-n0-6-origen-movimiento-inventario.sql | tail -n 1)" = '0'
          test "$(docker exec -i "$c" mysql -uroot -proot solqaryn_n06_ci --batch --skip-column-names < backend/scripts/validar-erp-n0-6-c2-backfill.sql | tail -n 1)" = '0'
          test "$(docker exec -i "$c" mysql -uroot -proot solqaryn_n06_ci --batch --skip-column-names < backend/scripts/postcheck-erp-n0-6-c3-origen-tipado.sql | tail -n 1)" = '0'

      - name: Certificar integración final del origen tipado
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj \
            --configuration Release \
            --no-build \
            --filter "FullyQualifiedName~MovimientoInventarioOrigenTipadoIntegrationTests"

      - name: Certificar constraints y triggers permanentes
        shell: bash
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n06_ci -Nse "
            SELECT COUNT(*) FROM information_schema.table_constraints
             WHERE constraint_schema=DATABASE()
               AND table_name='MovimientosInventario'
               AND constraint_type='CHECK'
               AND constraint_name='CK_MovimientosInventario_OrigenTipado_Exclusivo_N06';")" = 1
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n06_ci -Nse "
            SELECT COUNT(*) FROM information_schema.referential_constraints
             WHERE constraint_schema=DATABASE()
               AND constraint_name IN (
                 'FK_MovimientosInventario_Compras_CompraId_N06',
                 'FK_MovimientosInventario_Ventas_VentaId_N06',
                 'FK_MovimientosInventario_ConsumosInsumos_ConsumoInsumoId_N06');")" = 3
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_n06_ci -Nse "
            SELECT COUNT(*) FROM information_schema.triggers
             WHERE trigger_schema=DATABASE()
               AND event_object_table='MovimientosInventario'
               AND trigger_name IN (
                 'TR_MovimientosInventario_N06_OrigenTipado_BI',
                 'TR_MovimientosInventario_N06_OrigenTipado_BU');")" = 2

      - name: Verificar modelo Oracle sin drift
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext \
            --configuration Release \
            --no-build
          echo 'ERP_N06_FINAL_CONTRACT=PASS'
