name: N6.1.E - Empresa frontend exact-head gate

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/n61e-empresa-frontend-gate.yml
      - frontend/src/app/features/configuracion/empresa-administracion-card.component.ts
      - frontend/src/app/features/configuracion/empresa-administracion-card.component.spec.ts
      - frontend/src/app/features/configuracion/configuracion.component.ts
      - frontend/src/app/features/configuracion/configuracion.component.html
      - frontend/src/app/app.routes.ts
      - frontend/package.json
      - frontend/package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n61e-empresa-frontend-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  empresa-frontend:
    name: Empresa frontend directed tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Ejecutar pruebas frontend incl. Empresa
        working-directory: frontend
        run: npm test -- --no-watch

      - name: Ejecutar lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Compilar frontend producción
        working-directory: frontend
        run: npm run build:prod
