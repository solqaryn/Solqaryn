name: V20 C02-02.M06.04 - Oracle EF MySQL 8.4 rollback isolation
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/C0202M0604MySqlRollbackSafetyTests.cs'
      - '.github/workflows/v20-c02-02-m06-04-mysql-rollback.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c0202-m0604-${{ github.sha }}
  cancel-in-progress: false
jobs:
  mysql-rollback:
    name: C02-02.M06.04 - MySQL 8.4 real rollback and tenant preservation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: v20_c0202_seed
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=v20_c0202_seed;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Verify project Scope Lock
        run: node scripts/verify-project-scope.mjs
      - name: Restore and build Release
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: Execute actual EF and MySQL 8.4 Category Integration rollback
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~C0202M0604MySqlRollbackSafetyTests&Category=Integration" --logger "console;verbosity=normal"
          echo "C0202_M0604_ORACLE_EF_MYSQL84_ROLLBACK_TESTS_COMPLETED"
