name: M12 - Automatización transversal

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/m12-automatizacion-transversal.yml
      - backend/src/API/Controllers/AutomatizacionesController.cs
      - backend/src/Application/DTOs/AutomatizacionDto.cs
      - backend/src/Application/Interfaces/IAutomatizacionService.cs
      - backend/src/Infrastructure/Services/AutomatizacionService.cs
      - backend/src/Infrastructure/Migrations/20260810174200_M12AutomatizacionTransversal.cs
      - backend/tests/Solqaryn.Tests/M12AutomatizacionTransversalTests.cs
      - frontend/src/app/core/models/automatizacion.model.ts
      - frontend/src/app/services/automatizacion.service.ts
      - frontend/src/app/features/dashboard/**
      - frontend/src/app/features/configuracion/**
      - frontend/e2e/m12-automatizacion-transversal.spec.ts
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/m12-automatizacion-transversal.yml
      - backend/src/API/Controllers/AutomatizacionesController.cs
      - backend/src/Application/DTOs/AutomatizacionDto.cs
      - backend/src/Application/Interfaces/IAutomatizacionService.cs
      - backend/src/Infrastructure/Services/AutomatizacionService.cs
      - backend/src/Infrastructure/Migrations/20260810174200_M12AutomatizacionTransversal.cs
      - backend/tests/Solqaryn.Tests/M12AutomatizacionTransversalTests.cs
      - frontend/src/app/core/models/automatizacion.model.ts
      - frontend/src/app/services/automatizacion.service.ts
      - frontend/src/app/features/dashboard/**
      - frontend/src/app/features/configuracion/**
      - frontend/e2e/m12-automatizacion-transversal.spec.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m12-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m12:
    name: MySQL, backend, Angular y Playwright M12
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_m12_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: '5005'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=solqaryn_m12_e2e;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'
      Jwt__Secret: 'M12-E2E-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'Solqaryn.API'
      Jwt__Audience: 'Solqaryn.Frontend'
      Jwt__ExpiraMinutos: '120'
      Security__LoginRateLimitPerMinute: '300'
      SeedAdmin__Username: 'e2e_admin'
      SeedAdmin__Password: 'E2E.Admin#2026!'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      Cors__AllowedOrigins__1: 'http://localhost:4200'
      AppSettings__BackendPublicUrl: 'https://preview.solqaryn.invalid'
      AppSettings__LogoPublicUrl: 'https://solqaryn-dev.vercel.app/assets/storefront-logo.png'
      Cloudinary__CloudName: 'e2e-not-used'
      Cloudinary__ApiKey: 'e2e-not-used'
      Cloudinary__ApiSecret: 'e2e-not-used'
      PHASE7_API_URL: 'http://127.0.0.1:5005'
      PHASE7_ADMIN_USERNAME: 'e2e_admin'
      PHASE7_ADMIN_PASSWORD: 'E2E.Admin#2026!'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - name: Exigir política MySQL administrada
        run: mysql -h127.0.0.1 -uroot -proot -e "SET GLOBAL sql_require_primary_key=ON;"
      - name: Compilar y probar backend M12
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
          dotnet test Solqaryn.sln --configuration Release --no-build --filter "FullyQualifiedName~M12AutomatizacionTransversalTests" --logger "trx;LogFileName=m12-tests.trx"
      - name: Iniciar API y migrar MySQL real
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          nohup dotnet run --project src/API/Solqaryn.API.csproj --configuration Release --no-build --no-launch-profile > m12-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5005/health/ready > /dev/null; then
              mysql -h127.0.0.1 -uroot -proot solqaryn_m12_e2e -e "SELECT * FROM AutomatizacionConfiguraciones WHERE Id=1;"
              mysql -h127.0.0.1 -uroot -proot solqaryn_m12_e2e -e "SELECT MigrationId FROM __EFMigrationsHistory WHERE MigrationId='20260810174200_M12AutomatizacionTransversal';" | grep -q M12AutomatizacionTransversal
              exit 0
            fi
            sleep 2
          done
          cat m12-api.log >&2 || true
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Lint, build e instalar navegador
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build:prod
          npx playwright install --with-deps chromium
      - name: Iniciar Angular
        working-directory: frontend
        shell: bash
        run: |
          nohup npm start -- --host 127.0.0.1 --port 4200 > m12-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do curl --fail --silent http://127.0.0.1:4200/login > /dev/null && exit 0; sleep 2; done
          cat m12-frontend.log >&2 || true; exit 1
      - name: Ejecutar Playwright M12
        working-directory: frontend
        run: npx playwright test e2e/m12-automatizacion-transversal.spec.ts --config=playwright.config.ts
      - name: Publicar evidencia M12
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m12-automatizacion-transversal
          path: |
            backend/m12-api.log
            backend/**/m12-tests.trx
            frontend/m12-frontend.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
