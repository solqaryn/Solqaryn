name: V20 C07-04.M05.05 - negativas de permisos y tenant en pedidos
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/API/Filters/V20C0704M0505PedidoVentaTenantNegativeTests.cs'
      - 'backend/src/API/Filters/TenantPermissionContext.cs'
      - 'backend/src/API/Filters/RequierePermisoAttribute.cs'
      - '.github/workflows/v20-c07-04-m05-05-tenant-negative.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c0704-m0505-${{ github.sha }}
  cancel-in-progress: false
jobs:
  gate:
    name: C07-04.M05.05 - filtros tenant permisos negativos .NET 10
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Verificar Scope Lock exacto
        run: node scripts/verify-project-scope.mjs
      - name: Restaurar tests
        run: dotnet restore backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj
      - name: Ejecutar filtro real con selector adversarial y grant negado
        run: dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-restore --filter FullyQualifiedName~V20C0704M0505PedidoVentaTenantNegativeTests --logger 'console;verbosity=normal'
