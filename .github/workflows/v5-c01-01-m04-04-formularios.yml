name: V5 C01-01.M04.04 - Formularios usuarios y doble accion
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/features/usuarios/usuario-form.v5.spec.ts'
      - 'frontend/src/app/features/usuarios/usuario-form.component.ts'
      - 'frontend/src/app/features/usuarios/usuario-form.component.html'
      - '.github/workflows/v5-c01-01-m04-04-formularios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-c01-01-m04-04-${{ github.sha }}
  cancel-in-progress: false

jobs:
  formularios:
    name: V5 C01-01.M04.04 - Vitest, lint y Angular production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
      - name: Node 24 fijo
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm fijo
        run: npm install --global npm@11.19.0
      - name: Dependencias reproducibles
        run: npm ci
      - name: Vitest positivo y negativo de formularios
        run: npm test -- --no-watch --no-progress --include=src/app/features/usuarios/usuario-form.v5.spec.ts
      - name: Lint, tipado y reglas de frontend
        run: npm run lint
      - name: Build Angular produccion
        run: npm run build:prod
