name: P0-011.A - Frontera comercial inicial (read-only)

on:
  pull_request:
    branches: [dev]
    paths:
      - 'docs/P0-011-A-FRONTERA-VERSION-INICIAL-DEV.md'
      - 'scripts/verify-p0-011-a-initial-scope.mjs'
      - '.github/workflows/p0-011-a-initial-scope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope-classification:
    name: P0-011.A - Matriz y cinco negativos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Matriz normativa exact-HEAD
        run: node scripts/verify-p0-011-a-initial-scope.mjs --self-test
