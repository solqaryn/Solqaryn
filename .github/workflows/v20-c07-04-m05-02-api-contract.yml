name: V20 C07-04.M05.02 - API DTO pedidos
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/API/Controllers/V20C0704M0502PedidoVentaApiContractTests.cs'
      - 'backend/src/API/Controllers/PedidosVentaController.cs'
      - 'backend/src/Application/DTOs/PedidoVentaDto.cs'
      - 'backend/src/Application/Interfaces/IPedidoVentaService.cs'
      - '.github/workflows/v20-c07-04-m05-02-api-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c0704-m0502-${{ github.sha }}
  cancel-in-progress: false
jobs:
  contrato:
    name: C07-04.M05.02 - contratos API DTO .NET 10
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restaurar tests reales
        run: dotnet restore backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj
      - name: Contrato de pedidos con oraculos positivos y negativos
        run: dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-restore --filter FullyQualifiedName~V20C0704M0502PedidoVentaApiContractTests --logger 'console;verbosity=normal'
