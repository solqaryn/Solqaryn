name: V17 C14-04.M04.03 - branding privado de readiness
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v17-c14-04-m04-03-branding.yml'
      - 'frontend/src/app/features/plataforma/plataforma.component.ts'
      - 'frontend/src/app/features/plataforma/c14-04-m04-03-release-branding.component.ts'
      - 'frontend/src/app/features/plataforma/c14-04-m04-03-release-branding.spec.ts'
      - 'frontend/e2e/c14-04-m04-03-branding.spec.ts'
permissions:
  contents: read
concurrency:
  group: v17-c1404-m0403-${{ github.sha }}
  cancel-in-progress: false
jobs:
  c1404-branding:
    name: C14-04.M04.03 - Vitest Angular Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm fijo
        run: npm install --global npm@11.19.0
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Seis Vitest de marca segura y revocación
        working-directory: frontend
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c14-04-m04-03-release-branding.spec.ts
      - name: Lint build Angular
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Chromium oficial
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Servir aplicación local
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c14-04-m04-03.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c14-04-m04-03.log >&2
          exit 1
      - name: Tres Chromium privados a 320 y 403
        working-directory: frontend
        run: npx playwright test e2e/c14-04-m04-03-branding.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Evidencia de regresión
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-c1404-m0403
          path: |
            frontend/c14-04-m04-03.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
