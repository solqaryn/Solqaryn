name: V17 C02-04.M04.04 - consola global interacciones seguras
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c02-04-m04-04-interactions.spec.ts'
      - 'frontend/src/app/features/plataforma/consola-global-auditada-v5.component.ts'
      - '.github/workflows/v17-c02-04-m04-04-interactions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v17-c0204-m0404-${{ github.sha }}
  cancel-in-progress: false
jobs:
  chromium:
    name: C02-04.M04.04 Chromium navegacion errores y single-flight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm compatible
        run: npm install --global npm@11.19.0
      - name: Instalar dependencias
        run: npm ci
      - name: Lint y build Angular
        run: |
          npm run lint
          npm run build:prod
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Angular local aislado
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c0204-m0404-angular.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then
              echo 'ANGULAR_LOOPBACK_READY=PASS'
              exit 0
            fi
            sleep 2
          done
          cat c0204-m0404-angular.log >&2
          exit 1
      - name: Playwright real positivos negativos mensajes single-flight
        run: npx playwright test e2e/c02-04-m04-04-interactions.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-c0204-m0404
          path: |
            frontend/c0204-m0404-angular.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
