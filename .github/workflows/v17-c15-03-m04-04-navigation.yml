name: V17 C15-03.M04.04 - navegación mensajes sin mutaciones
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v17-c15-03-m04-04-navigation.yml'
      - 'frontend/e2e/c15-03-m04-04-navigation.spec.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v17-c1503-m0404-${{ github.sha }}
  cancel-in-progress: false
jobs:
  browser:
    name: C15-03.M04.04 - Chromium navegación y acciones negativas
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm reproducible
        run: npm install --global npm@11.19.0
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Lint y build Angular
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend local
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > v17-c1503-m0404.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat v17-c1503-m0404.log >&2
          exit 1
      - name: Chromium denegaciones navegación y no-mutaciones
        working-directory: frontend
        run: npx playwright test e2e/c15-03-m04-04-navigation.spec.ts --config=playwright.config.ts --workers=1 --reporter=list
