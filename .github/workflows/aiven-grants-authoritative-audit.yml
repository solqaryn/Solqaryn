name: DEV - Aiven grants authoritative audit

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/aiven-grants-authoritative-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Leer grants efectivos con avnadmin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV
    env:
      AIVEN_TOKEN: ${{ secrets.SOLQARYN_AIVEN_TOKEN }}
      DB_HOST: ${{ vars.SOLQARYN_DEV_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_DEV_DB_PORT }}
      AIVEN_PROJECT: solqaryn
      AIVEN_SERVICE: solqaryn-mysql
    steps:
      - name: Instalar cliente MySQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Resolver avnadmin sin exponer secreto
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request

          token=os.environ['AIVEN_TOKEN'].strip()
          project=urllib.parse.quote(os.environ['AIVEN_PROJECT'], safe='')
          service=urllib.parse.quote(os.environ['AIVEN_SERVICE'], safe='')
          url=f'https://api.aiven.io/v1/project/{project}/service/{service}/user/avnadmin?include_secrets=true'
          req=urllib.request.Request(
              url,
              headers={
                  'Authorization': f'aivenv1 {token}',
                  'Accept': 'application/json',
                  'User-Agent': 'SOLQARYN-Aiven-Authoritative-Grants-Audit/1.0'
              }
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              payload=json.load(resp)

          def find_password(v):
              if isinstance(v, dict):
                  for k, x in v.items():
                      if k.lower() == 'password' and isinstance(x, str) and x and x != '<redacted>':
                          return x
                  for x in v.values():
                      found=find_password(x)
                      if found:
                          return found
              elif isinstance(v, list):
                  for x in v:
                      found=find_password(x)
                      if found:
                          return found
              return None

          password=find_password(payload)
          if not password:
              raise SystemExit('No se pudo resolver avnadmin con include_secrets=true.')
          print(f'::add-mask::{password}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'AVNADMIN_PASSWORD={password}\n')
          PY

      - name: Leer grants efectivos DEV QA PROD
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$AVNADMIN_PASSWORD"

          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u avnadmin --ssl-mode=REQUIRED mysql --batch --skip-column-names <<'SQL'
          SHOW GRANTS FOR 'solqaryn_dev_user'@'%';
          SHOW GRANTS FOR 'solqaryn_qa_user'@'%';
          SHOW GRANTS FOR 'solqaryn_prod_user'@'%';
          SQL
