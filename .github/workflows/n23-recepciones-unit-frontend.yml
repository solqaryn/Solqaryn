name: N2.3 - RecepcionCompra unit frontend

on:
  push:
    branches:
      - dev
    paths:
      - "frontend/angular.json"
      - "frontend/tsconfig.spec.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src/app/features/recepciones-compra/**/*.spec.ts"
      - ".github/workflows/n23-recepciones-unit-frontend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/angular.json"
      - "frontend/tsconfig.spec.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/src/app/features/recepciones-compra/**/*.spec.ts"
      - ".github/workflows/n23-recepciones-unit-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n23-recepciones-unit-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4

      - name: Setup Node 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run RecepcionCompra unit tests
        working-directory: frontend
        run: npm test -- --no-watch

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend production
        working-directory: frontend
        run: npm run build:prod
