name: V22 C03-01.M02.04 - Typed login display policy
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/core/models/login-inteligente-config.model.ts'
      - 'frontend/src/app/core/models/login-inteligente-config.model.spec.ts'
      - 'docs/v5/c03-01-m02-04-login-config-flags.md'
      - '.github/workflows/v22-c03-01-m02-04-login-config.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c03-01-m02-04-${{ github.sha }}
  cancel-in-progress: false
jobs:
  typed-config:
    name: V22 config typed tests 13 cases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked frontend restore
        working-directory: frontend
        run: npm ci
      - name: Execute 13 focused Vitest cases
        working-directory: frontend
        run: npx vitest run src/app/core/models/login-inteligente-config.model.spec.ts --reporter=verbose
      - name: Typecheck specs
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.spec.json
