name: V20 C15-02.M04.03 - branding allowlisted
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/features/plataforma/c15-02-m04-01-revision-arquitectura.component.ts'
      - 'frontend/src/app/features/plataforma/c15-02-m04-03-branding.spec.ts'
      - 'frontend/e2e/c15-02-m04-03-branding.spec.ts'
      - '.github/workflows/v20-c15-02-m04-03-branding.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c15-02-m04-03-${{ github.sha }}
  cancel-in-progress: false
jobs:
  branding:
    name: C15-02.M04.03 - tres Vitest y dos Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Unitarios con sanitizacion adversarial
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c15-02-m04-03-branding.spec.ts
      - name: Angular lint y build
        run: |
          npm run lint
          npm run build:prod
      - run: npx playwright install --with-deps chromium
      - name: Angular efimero loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c1502m0403.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c1502m0403.log >&2
          exit 1
      - name: Chromium responsive y rechazos
        run: npx playwright test e2e/c15-02-m04-03-branding.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v20-c15-02-m04-03-branding
          path: |
            frontend/c1502m0403.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
