name: V22 C07-01.M03.03 signed JWT HTTP MySQL 8.4

on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/API/Security/C0701CatalogVerifiedActorSource.cs'
      - 'backend/src/API/Program.cs'
      - 'backend/tests/Solqaryn.Tests/Integration/C0701M0303SignedJwtMysql84HttpIntegrationTests.cs'
      - '.github/workflows/v22-c07-01-m03-03-jwt-mysql84-http.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v22-c0701-m0303-mysql
  cancel-in-progress: false

jobs:
  signed-jwt-http-mysql:
    name: C07-01.M03.03 - real signed JWT HTTP MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v22-only
          MYSQL_DATABASE: c0701_m0303_bootstrap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v22-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0701_M0303_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=c0701_m0303_bootstrap;User=root;Password=ephemeral-v22-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Exact-SHA ScopeLock
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Real signed JWT HTTP Oracle EF MySQL 8.4 and TRX
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0701M0303SignedJwtMysql84HttpIntegrationTests' --logger 'trx;LogFileName=C0701M0303JwtHttpMysql84.trx' --verbosity normal
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as ET
          paths=list(pathlib.Path('tests/Solqaryn.Tests').rglob('C0701M0303JwtHttpMysql84.trx'))
          if len(paths)!=1:raise SystemExit("Missing unique integration TRX")
          node=ET.parse(paths[0]).getroot().find('.//{*}Counters')
          if node is None:raise SystemExit("Missing test counters")
          counts={k:int(node.attrib.get(k,-1)) for k in ('total','passed','failed','notExecuted')}
          print('C0701_REAL_JWT_MYSQL84_HTTP_TRX',counts)
          if counts['total']<1 or counts['passed']!=counts['total'] or counts['failed'] or counts['notExecuted']:
              raise SystemExit("FAIL_REAL_C0701_M0303")
          PY
