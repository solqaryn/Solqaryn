name: V17 C03-04.M04.01 - respuesta privada a incidentes
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v17-c03-04-m04-01-incidentes.yml'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/src/app/features/plataforma/respuesta-incidentes-v5.component.ts'
      - 'frontend/src/app/features/plataforma/respuesta-incidentes-v5.component.spec.ts'
      - 'frontend/e2e/c03-04-m04-01-incidentes.spec.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v17-c0304-m0401-${{ github.sha }}
  cancel-in-progress: false
jobs:
  incident-ui:
    name: C03-04.M04.01 - Vitest y Chromium de incidentes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm reproducible
        run: npm install --global npm@11.19.0
      - name: Dependencias
        working-directory: frontend
        run: npm ci
      - name: Cinco Vitest de guard y revocacion
        working-directory: frontend
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/respuesta-incidentes-v5.component.spec.ts
      - name: Lint y build
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Levantar frontend local
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > v17-c0304-m0401.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat v17-c0304-m0401.log >&2
          exit 1
      - name: Chromium positivo negativo responsive con API simulada
        working-directory: frontend
        run: npx playwright test e2e/c03-04-m04-01-incidentes.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-c0304-m0401
          path: |
            frontend/v17-c0304-m0401.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
