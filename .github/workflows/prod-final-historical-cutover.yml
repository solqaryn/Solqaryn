name: PROD - Final historical cutover

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-final-historical-cutover.yml

permissions:
  contents: read
  actions: read

jobs:
  prod-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: PROD
    env:
      DB_HOST: ${{ vars.SOLQARYN_PROD_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_PROD_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_PROD_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_PROD_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_PROD_DB_PASSWORD }}
      PROD_BACKUP_PASSPHRASE: ${{ secrets.SOLQARYN_PROD_BACKUP_PASSPHRASE }}
    steps:
      - name: Install preflight tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y mysql-client gnupg jq >/dev/null

      - name: Revalidate exact canonical target
        shell: bash
        run: |
          set -euo pipefail
          test "$DB_NAME" = "solqaryn_prod"
          test "$DB_USER" = "solqaryn_prod_user"
          test -n "$DB_PASSWORD"
          test -n "$PROD_BACKUP_PASSPHRASE"
          export MYSQL_PWD="$DB_PASSWORD"
          mysqlc=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" --batch --skip-column-names)
          test "$("${mysqlc[@]}" -e 'SELECT DATABASE();')" = "solqaryn_prod"
          test "$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';")" = "137"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM __EFMigrationsHistory;')" = "107"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Empresas;')" = "0"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Productos;')" = "0"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Usuarios;')" = "1"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM ProductoImagenes;')" = "0"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Usuarios u JOIN Roles r ON r.Id=u.RolId WHERE u.Activo=1 AND u.Eliminado=0 AND r.EsAdministrador=1 AND r.Activo=1 AND r.Eliminado=0;')" = "1"
          grants="$("${mysqlc[@]}" -e 'SHOW GRANTS FOR CURRENT_USER();' | tr '\n' ' ')"
          printf '%s' "$grants" | grep -Eq 'ALL PRIVILEGES|(^|[, ])TRIGGER([, ]| ON)'
          echo "PROD_CUTOVER_PREFLIGHT=PASS"

      - name: Download certified rollback artifact
        uses: actions/download-artifact@v4
        with:
          name: solqaryn-prod-empty-rollback-36298199171
          run-id: 36298199171
          github-token: ${{ github.token }}
          path: /tmp/rollback

      - name: Verify rollback artifact and bootstrap overlay
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/rollback/solqaryn-prod-empty.sql.gz.gpg
          test -s /tmp/rollback/solqaryn-prod-empty.sql.gz.sha256
          test -s /tmp/rollback/prod-bootstrap-auth.json.gpg
          test -s /tmp/rollback/prod-bootstrap-auth.json.gpg.sha256
          test "$(sha256sum /tmp/rollback/prod-bootstrap-auth.json.gpg | awk '{print $1}')" = "$(awk '{print $1}' /tmp/rollback/prod-bootstrap-auth.json.gpg.sha256)"
          printf '%s' "$PROD_BACKUP_PASSPHRASE" | gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output /tmp/rollback-test.sql.gz /tmp/rollback/solqaryn-prod-empty.sql.gz.gpg
          test "$(sha256sum /tmp/rollback-test.sql.gz | awk '{print $1}')" = "$(awk '{print $1}' /tmp/rollback/solqaryn-prod-empty.sql.gz.sha256)"
          rm -f /tmp/rollback-test.sql.gz
          echo "PROD_ROLLBACK_ARTIFACT=PASS"

      - name: Generate encrypted ephemeral bridge key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/bridge-private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/bridge-private.pem -pubout -out /tmp/bridge-public.pem >/dev/null 2>&1
          printf '%s' "$PROD_BACKUP_PASSPHRASE" | gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --digest-algo SHA256 \
            --output /tmp/bridge-private.pem.gpg /tmp/bridge-private.pem
          rm -f /tmp/bridge-private.pem

      - uses: actions/upload-artifact@v4
        with:
          name: prod-cutover-prep-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            /tmp/bridge-private.pem.gpg
            /tmp/bridge-public.pem

  legacy-payload:
    needs: prod-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: LEGACY_DEV_MIGRATION
    env:
      LEGACY_BACKUP_PASSPHRASE: ${{ secrets.LEGACY_DEV_BACKUP_PASSPHRASE }}
    steps:
      - name: Install bridge tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y gnupg jq >/dev/null

      - uses: actions/download-artifact@v4
        with:
          name: prod-cutover-prep-${{ github.run_id }}
          path: /tmp/prep

      - name: Download certified historical backup
        uses: actions/download-artifact@v4
        with:
          name: solqaryn-legacy-prod-defaultdb-backup-36228394479
          run-id: 36228394479
          github-token: ${{ github.token }}
          path: /tmp/legacy-backup

      - name: Verify historical source and build encrypted payload
        shell: bash
        run: |
          set -euo pipefail
          test -n "$LEGACY_BACKUP_PASSPHRASE"
          encrypted="$(find /tmp/legacy-backup -type f -name '*.tar.gz.gpg' | head -n1)"
          checksum="$(find /tmp/legacy-backup -type f -name '*.gpg.sha256' | head -n1)"
          test -n "$encrypted" && test -n "$checksum"
          test "$(sha256sum "$encrypted" | awk '{print $1}')" = "$(awk '{print $1}' "$checksum")"
          printf '%s' "$LEGACY_BACKUP_PASSPHRASE" | gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output /tmp/legacy.tar.gz "$encrypted"
          mkdir -p /tmp/legacy
          tar -C /tmp/legacy -xzf /tmp/legacy.tar.gz
          (cd /tmp/legacy && sha256sum -c MANIFEST.sha256)
          test "$(jq -r '.sourceDatabase' /tmp/legacy/metadata.json)" = "defaultdb"
          test "$(jq -r '.baseTableCount' /tmp/legacy/metadata.json)" = "132"
          test "$(jq -r '.efMigrationCount' /tmp/legacy/metadata.json)" = "104"
          test "$(jq -r '.triggerCount' /tmp/legacy/metadata.json)" = "16"
          if grep -Eiq '^[[:space:]]*USE[[:space:]]+|CREATE[[:space:]]+DATABASE' /tmp/legacy/defaultdb.sql; then
            echo "Unsafe database selector in historical SQL" >&2
            exit 1
          fi
          perl -0pi -e 's@/\*!50017 DEFINER=[^*]*\*/[[:space:]]*@@g' /tmp/legacy/defaultdb.sql
          sed -i '/SET @@GLOBAL\.GTID_PURGED/d' /tmp/legacy/defaultdb.sql
          umask 077
          openssl rand -hex 32 > /tmp/payload-key.txt
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass file:/tmp/payload-key.txt \
            -in /tmp/legacy/defaultdb.sql -out /tmp/legacy-defaultdb.sql.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/prep/bridge-public.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/payload-key.txt -out /tmp/payload-key.enc
          rm -rf /tmp/legacy /tmp/legacy.tar.gz /tmp/payload-key.txt
          echo "LEGACY_SOURCE_VERIFIED=PASS"
          echo "LEGACY_PAYLOAD_ENCRYPTED=PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: prod-cutover-payload-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: |
            /tmp/legacy-defaultdb.sql.enc
            /tmp/payload-key.enc

  prod-cutover:
    needs: legacy-payload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: PROD
    env:
      DB_HOST: ${{ vars.SOLQARYN_PROD_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_PROD_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_PROD_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_PROD_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_PROD_DB_PASSWORD }}
      PROD_BACKUP_PASSPHRASE: ${{ secrets.SOLQARYN_PROD_BACKUP_PASSPHRASE }}
      ConnectionStrings__DefaultConnection: Server=${{ vars.SOLQARYN_PROD_DB_HOST }};Port=${{ vars.SOLQARYN_PROD_DB_PORT }};Database=${{ vars.SOLQARYN_PROD_DB_NAME }};User=${{ vars.SOLQARYN_PROD_DB_USER }};Password=${{ secrets.SOLQARYN_PROD_DB_PASSWORD }};SslMode=Required;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.8
      Database__ApplyMigrationsOnStartup: "false"
      Jwt__Secret: Migration-Only-JWT-Secret-At-Least-32-Characters-2026
      Cloudinary__CloudName: migration-not-used
      Cloudinary__ApiKey: migration-not-used
      Cloudinary__ApiSecret: migration-not-used
      Cloudinary__EnvironmentPrefix: solqaryn_prod
      Smtp__Host: 127.0.0.1
      Smtp__Port: "2525"
      Smtp__OAuth2ClientId: migration-not-used
      Smtp__OAuth2RefreshToken: migration-not-used
      Smtp__UsuarioSmtp: migration@example.invalid
      Smtp__NombreRemitente: SOLQARYN MIGRATION
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install cutover tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y mysql-client gnupg jq xxd >/dev/null
          dotnet tool install --global dotnet-ef --version 8.0.8 >/dev/null

      - uses: actions/download-artifact@v4
        with:
          name: prod-cutover-prep-${{ github.run_id }}
          path: /tmp/prep

      - uses: actions/download-artifact@v4
        with:
          name: prod-cutover-payload-${{ github.run_id }}
          path: /tmp/payload

      - name: Download certified rollback artifact
        uses: actions/download-artifact@v4
        with:
          name: solqaryn-prod-empty-rollback-36298199171
          run-id: 36298199171
          github-token: ${{ github.token }}
          path: /tmp/rollback

      - name: Decrypt payload and current bootstrap overlay
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$PROD_BACKUP_PASSPHRASE" | gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output /tmp/bridge-private.pem /tmp/prep/bridge-private.pem.gpg
          openssl pkeyutl -decrypt -inkey /tmp/bridge-private.pem \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/payload/payload-key.enc -out /tmp/payload-key.txt
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass file:/tmp/payload-key.txt \
            -in /tmp/payload/legacy-defaultdb.sql.enc -out /tmp/legacy-defaultdb.sql
          printf '%s' "$PROD_BACKUP_PASSPHRASE" | gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output /tmp/bootstrap-auth.json /tmp/rollback/prod-bootstrap-auth.json.gpg
          rm -f /tmp/bridge-private.pem /tmp/payload-key.txt
          test -s /tmp/legacy-defaultdb.sql
          test -s /tmp/bootstrap-auth.json
          echo "PROD_CUTOVER_PAYLOAD_DECRYPT=PASS"

      - name: Recheck exact target before first persistent write
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$DB_PASSWORD"
          mysqlc=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" --batch --skip-column-names)
          test "$("${mysqlc[@]}" -e 'SELECT DATABASE();')" = "solqaryn_prod"
          test "$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';")" = "137"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM __EFMigrationsHistory;')" = "107"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Empresas;')" = "0"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Productos;')" = "0"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Usuarios;')" = "1"
          echo "PROD_TARGET_RECHECK=PASS"

      - name: Replace empty canonical schema with historical source
        shell: bash
        run: |
          set -euo pipefail
          touch /tmp/destructive-started
          export MYSQL_PWD="$DB_PASSWORD"
          mysqlc=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" --batch --skip-column-names)
          {
            echo 'SET FOREIGN_KEY_CHECKS=0;'
            "${mysqlc[@]}" -e "SELECT TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';" \
              | while IFS= read -r table; do printf 'DROP TABLE IF EXISTS \`%s\`;\n' "$table"; done
            echo 'SET FOREIGN_KEY_CHECKS=1;'
          } > /tmp/drop-current.sql
          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED "$DB_NAME" < /tmp/drop-current.sql
          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" < /tmp/legacy-defaultdb.sql
          echo "PROD_HISTORICAL_RESTORE=PASS"

      - name: Apply current SOLQARYN migrations
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore InventoryApp.sln >/dev/null
          dotnet ef database update \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext >/dev/null
          echo "PROD_EF_UPDATE=PASS"

      - name: Reapply bootstrap authentication overlay
        shell: bash
        run: |
          set -euo pipefail
          username="$(jq -r '.username' /tmp/bootstrap-auth.json)"
          password_hash="$(jq -r '.passwordHash' /tmp/bootstrap-auth.json)"
          activo="$(jq -r '.activo' /tmp/bootstrap-auth.json)"
          bloqueado="$(jq -r '.bloqueado' /tmp/bootstrap-auth.json)"
          test -n "$username"
          test -n "$password_hash"
          username_hex="$(printf '%s' "$username" | xxd -p -c 100000)"
          password_hex="$(printf '%s' "$password_hash" | xxd -p -c 100000)"
          export MYSQL_PWD="$DB_PASSWORD"
          mysqlc=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" --batch --skip-column-names)
          test "$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM Usuarios WHERE LOWER(NombreUsuario)=LOWER(CONVERT(UNHEX('$username_hex') USING utf8mb4));")" = "1"
          "${mysqlc[@]}" -e "UPDATE Usuarios SET PasswordHash=CONVERT(UNHEX('$password_hex') USING utf8mb4), Activo=$activo, Bloqueado=$bloqueado WHERE LOWER(NombreUsuario)=LOWER(CONVERT(UNHEX('$username_hex') USING utf8mb4));"
          test "$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM Usuarios u JOIN Roles r ON r.Id=u.RolId WHERE LOWER(u.NombreUsuario)=LOWER(CONVERT(UNHEX('$username_hex') USING utf8mb4)) AND u.Activo=1 AND u.Eliminado=0 AND r.EsAdministrador=1 AND r.Activo=1 AND r.Eliminado=0;")" = "1"
          rm -f /tmp/bootstrap-auth.json
          echo "PROD_BOOTSTRAP_AUTH_RECONCILED=PASS"

      - name: Verify exact migrated state
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$DB_PASSWORD"
          mysqlc=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" --batch --skip-column-names)
          tables="$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';")"
          migrations="$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM __EFMigrationsHistory;')"
          empresas="$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Empresas;')"
          productos="$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Productos;')"
          usuarios="$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Usuarios;')"
          imagenes="$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM ProductoImagenes;')"
          legacy_urls="$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM ProductoImagenes WHERE Url LIKE '%res.cloudinary.com/vyijnqzq/%';")"
          test "$tables" = "137"
          test "$migrations" = "107"
          test "$empresas" = "1"
          test "$productos" = "73"
          test "$usuarios" = "6"
          test "$imagenes" = "351"
          test "$legacy_urls" = "351"
          jq -n --argjson tables "$tables" --argjson migrations "$migrations" --argjson empresas "$empresas" --argjson productos "$productos" --argjson usuarios "$usuarios" --argjson imagenes "$imagenes" --argjson legacyUrls "$legacy_urls" \
            '{status:"PASS",database:"solqaryn_prod",baseTables:$tables,efMigrations:$migrations,empresas:$empresas,productos:$productos,usuarios:$usuarios,productoImagenes:$imagenes,legacyCloudinaryUrls:$legacyUrls}' > /tmp/prod-cutover-result.json
          cat /tmp/prod-cutover-result.json
          rm -f /tmp/destructive-started /tmp/legacy-defaultdb.sql
          echo "PROD_FINAL_HISTORICAL_DB_CUTOVER=PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: prod-final-cutover-result-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: /tmp/prod-cutover-result.json

      - name: Automatic rollback on cutover failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f /tmp/destructive-started ]; then
            echo "PROD_ROLLBACK_NOT_REQUIRED"
            exit 0
          fi
          export MYSQL_PWD="$DB_PASSWORD"
          printf '%s' "$PROD_BACKUP_PASSPHRASE" | gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output /tmp/rollback.sql.gz /tmp/rollback/solqaryn-prod-empty.sql.gz.gpg
          test "$(sha256sum /tmp/rollback.sql.gz | awk '{print $1}')" = "$(awk '{print $1}' /tmp/rollback/solqaryn-prod-empty.sql.gz.sha256)"
          mysqlc=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" --batch --skip-column-names)
          {
            echo 'SET FOREIGN_KEY_CHECKS=0;'
            "${mysqlc[@]}" -e "SELECT TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';" \
              | while IFS= read -r table; do printf 'DROP TABLE IF EXISTS \`%s\`;\n' "$table"; done
            echo 'SET FOREIGN_KEY_CHECKS=1;'
          } > /tmp/drop-failed.sql
          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED "$DB_NAME" < /tmp/drop-failed.sql
          gunzip -c /tmp/rollback.sql.gz | mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME"
          test "$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE';")" = "137"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM __EFMigrationsHistory;')" = "107"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Empresas;')" = "0"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Productos;')" = "0"
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Usuarios;')" = "1"
          echo "PROD_AUTOMATIC_ROLLBACK=PASS"

      - name: Cleanup plaintext material
        if: always()
        shell: bash
        run: |
          rm -f /tmp/legacy-defaultdb.sql /tmp/bootstrap-auth.json /tmp/bridge-private.pem /tmp/payload-key.txt /tmp/rollback.sql.gz

  runtime-smoke:
    needs: prod-cutover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify PROD API after cutover
        shell: bash
        run: |
          set -euo pipefail
          check_json() {
            url="$1"; file="$2"
            for i in $(seq 1 24); do
              code="$(curl -L -sS --connect-timeout 10 --max-time 30 -o "$file" -w '%{http_code}' "$url" || true)"
              [ "$code" = "200" ] && return 0
              sleep 5
            done
            return 1
          }
          check_json "https://solqaryn-api-prod.onrender.com/health" /tmp/health.json
          jq -e '.status=="ok"' /tmp/health.json >/dev/null
          check_json "https://solqaryn-api-prod.onrender.com/health/ready" /tmp/ready.json
          jq -e '.status=="ready" and .database=="connected"' /tmp/ready.json >/dev/null
          check_json "https://solqaryn-api-prod.onrender.com/empresa-configuracion/publica" /tmp/company.json
          jq -e '.success==true' /tmp/company.json >/dev/null
          check_json "https://solqaryn-api-prod.onrender.com/tienda/productos?pagina=1&tamano=100" /tmp/products.json
          jq -e '.success==true' /tmp/products.json >/dev/null
          echo "PROD_RUNTIME_AFTER_DB_CUTOVER=PASS"
