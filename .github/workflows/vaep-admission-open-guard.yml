name: VAEP OPEN-only admission invariant

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vaep-open-only-admission-invariant
  cancel-in-progress: false

jobs:
  enforce-open-only:
    name: Enforce canonical OPEN-only admission
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BRANCH: dev
      ADMISSION_PATH: vaep/control/dispatch-admission.json
      POLICY_PATH: docs/VAEP_AUTHORITY.md
    steps:
      - name: Verify canonical authority
        shell: bash
        run: |
          set -euo pipefail
          policy="$(gh api "repos/$REPO/contents/$POLICY_PATH?ref=$BRANCH" --jq '.content' | tr -d '\n' | base64 -d)"
          grep -q '^GLOBAL_DISPATCH_ADMISSION=OPEN_ONLY$' <<<"$policy"
          grep -q '^GLOBAL_FROZEN_PROHIBITED=TRUE$' <<<"$policy"
          grep -q '^CAUSAL_HOLD_SCOPE=TASK_OR_EXECUTION_ONLY$' <<<"$policy"
          ! grep -q 'Solo se permiten dos estados' <<<"$policy"
          echo 'VAEP_POLICY_OPEN_ONLY=PASS'

      - name: Repair any non-OPEN global admission state
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            payload="$(gh api "repos/$REPO/contents/$ADMISSION_PATH?ref=$BRANCH")"
            sha="$(jq -r '.sha' <<<"$payload")"
            decoded="$(jq -r '.content' <<<"$payload" | tr -d '\n' | base64 -d)"
            if jq -e '
              type=="object" and
              ((keys|sort)==["allowExistingActiveSessions","newDispatchAdmission","reason","updatedAtUtc"]) and
              .newDispatchAdmission=="OPEN" and
              .allowExistingActiveSessions==true and
              (.reason|type=="string" and length>0) and
              (.updatedAtUtc|type=="string" and length>0)
            ' <<<"$decoded" >/dev/null 2>&1; then
              echo 'VAEP_GLOBAL_ADMISSION=OPEN'
              exit 0
            fi

            now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            fixed="$(jq -n --arg now "$now" '{newDispatchAdmission:"OPEN",allowExistingActiveSessions:true,reason:"OPEN_ONLY_INVARIANT_REPAIR__TASK_EXECUTION_GATES_ONLY",updatedAtUtc:$now}')"
            encoded="$(printf '%s\n' "$fixed" | base64 -w0)"
            if jq -n \
              --arg message "fix(vaep): repair non-open global admission state" \
              --arg content "$encoded" \
              --arg sha "$sha" \
              --arg branch "$BRANCH" \
              '{message:$message,content:$content,sha:$sha,branch:$branch}' \
              | gh api "repos/$REPO/contents/$ADMISSION_PATH" --method PUT --input - >/dev/null 2>&1; then
              echo 'VAEP_GLOBAL_ADMISSION=REPAIRED_TO_OPEN'
              exit 0
            fi
            sleep "$attempt"
          done

          admission="$(gh api "repos/$REPO/contents/$ADMISSION_PATH?ref=$BRANCH" --jq '.content' | tr -d '\n' | base64 -d)"
          jq -e '.newDispatchAdmission=="OPEN" and .allowExistingActiveSessions==true' <<<"$admission" >/dev/null
          echo 'VAEP_GLOBAL_ADMISSION=OPEN_AFTER_RACE'
