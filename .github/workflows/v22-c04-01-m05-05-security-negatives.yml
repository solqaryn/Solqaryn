name: V22 C04-01.M05.05 signed JWT tenant negative security MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Integration/C0401M0303SignedJwtMysql84HttpIntegrationTests.cs'
      - '.github/workflows/v22-c04-01-m05-05-security-negatives.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0401-m0505-jwt-${{ github.sha }}
  cancel-in-progress: false
jobs:
  signed-jwt-negative-mysql84:
    name: C04-01.M05.05 - signed JWT HTTP MySQL 8.4 security negatives
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v22-only
          MYSQL_DATABASE: solqaryn_c0401_m0505
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v22-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0401_M0303_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_c0401_m0505;User=root;Password=ephemeral-v22-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Exact SHA and strict scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
          grep -q 'C04-01.M05.05: real JWT' backend/tests/Solqaryn.Tests/Integration/C0401M0303SignedJwtMysql84HttpIntegrationTests.cs
      - name: Signed JWT negative HTTP contract on ephemeral MySQL 8.4
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0401M0303SignedJwtMysql84HttpIntegrationTests' --logger 'trx;LogFileName=C0401M0505NegativeJwtMySql84.trx' --verbosity normal
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path("tests/Solqaryn.Tests/TestResults").rglob("C0401M0505NegativeJwtMySql84.trx"))
          assert len(files)==1, f"Exactly one TRX required: {files}"
          root=ET.parse(files[0]).getroot()
          ns={"t":"http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          counts=root.find(".//t:Counters",ns)
          assert counts is not None
          c=counts.attrib
          assert int(c["total"]) >= 1, c
          assert int(c["executed"]) == int(c["total"]), c
          assert int(c["passed"]) == int(c["total"]), c
          assert int(c["failed"]) == 0 and int(c["notExecuted"]) == 0, c
          print("C0401_M0505_REAL_SIGNED_JWT_MYSQL84_NEGATIVES_ALL_PASS",c)
          PY
