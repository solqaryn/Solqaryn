name: V18 C08-04.M04.05 - accesibilidad y contraste
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v18-c08-04-m04-05-accessibility.yml'
      - 'frontend/e2e/c08-04-m04-05-accessibility.spec.ts'
      - 'frontend/src/app/features/extensiones-sectoriales/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v18-c0804-m0405-${{ github.sha }}
  cancel-in-progress: false
jobs:
  accessibility-chromium:
    name: V18 C08-04.M04.05 - Angular build y Chromium real
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.0
      - name: Reproducible dependencies
        working-directory: frontend
        run: npm ci
      - name: Existing component regressions
        working-directory: frontend
        run: npm test -- --watch=false --include=src/app/features/extensiones-sectoriales/sector-modules-readonly.component.spec.ts
      - name: Typecheck lint and production build
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start isolated Angular
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c0804-m0405.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c0804-m0405.log >&2
          exit 1
      - name: Actual keyboard responsive and WCAG contrast
        working-directory: frontend
        run: npx playwright test e2e/c08-04-m04-05-accessibility.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c0804-m0405-chromium
          path: |
            frontend/c0804-m0405.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
