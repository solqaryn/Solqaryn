name: QA - FN-05 operacion administrativa autenticada
on:
  workflow_dispatch:
    inputs:
      expected_deployed_sha:
        description: 'SHA Render QA verificado externamente'
        required: true
        type: string
  push:
    branches: [qa]
    paths:
      - '.github/workflows/qa-fn-05-live-auth.yml'
      - '.github/qa/qa-fn-05-live-auth.py'

permissions:
  contents: read
concurrency:
  group: qa-fn-05-live-admin
  cancel-in-progress: false
jobs:
  authenticated:
    if: github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: QA
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verificar scope QA
        run: |
          test "$GITHUB_REF" = refs/heads/qa
          node scripts/verify-project-scope.mjs
      - name: Preparar cliente SQL y BCrypt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mysql-client apache2-utils
      - name: Preflight comercial de solo lectura y administración A/B real
        env:
          EXPECTED_DEPLOYED_SHA: ${{ inputs.expected_deployed_sha || 'c4abbcf60de611e80534e5c9094524aca763800e' }}
          DB_HOST: ${{ vars.SOLQARYN_QA_DB_HOST }}
          DB_PORT: ${{ vars.SOLQARYN_QA_DB_PORT }}
          DB_NAME: ${{ vars.SOLQARYN_QA_DB_NAME }}
          DB_USER: ${{ vars.SOLQARYN_QA_DB_USER }}
          DB_PASSWORD: ${{ secrets.SOLQARYN_QA_DB_PASSWORD }}
        run: python3 .github/qa/qa-fn-05-live-auth.py
