name: V22 C06-04.M03.05 isolated durable MySQL 8.4 queue
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Infrastructure/AutomationV5/C0604IsolatedMySqlDurableQueue.cs'
      - 'backend/tests/Solqaryn.Tests/Integration/C0604DurableMySqlQueueIntegrationTests.cs'
      - '.github/workflows/v22-c06-04-m03-05-durable-mysql84.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0604-durable-mysql84
  cancel-in-progress: false
jobs:
  mysql84-durable-queue:
    name: C06-04.M03.05 - InnoDB tenant idempotency lease retry deadletter
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: v22-ephemeral-only
          MYSQL_DATABASE: solqaryn_c0604_v22
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pv22-ephemeral-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0604_MYSQL84_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_c0604_v22;User=root;Password=v22-ephemeral-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Assert exact SHA and real MySQL 8.4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$C0604_MYSQL84_TEST"
          mysql -h127.0.0.1 -uroot -pv22-ephemeral-only -Nse 'SELECT VERSION()' | grep -E '^8\.4\.'
      - name: Run isolated InnoDB queue adversarial integration
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0604DurableMySqlQueueIntegrationTests' --logger 'trx;LogFileName=C0604DurableMysql84.trx'
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          reports=list(pathlib.Path('tests/Solqaryn.Tests').rglob('C0604DurableMysql84.trx'))
          if len(reports)!=1: raise SystemExit('C0604_NO_UNIQUE_TRX')
          counters=ET.parse(reports[0]).getroot().find('.//{*}Counters')
          if counters is None: raise SystemExit('C0604_NO_TEST_COUNTERS')
          n={k:int(counters.attrib.get(k,-1)) for k in ('total','passed','failed','notExecuted')}
          print('C0604_REAL_MYSQL84_COUNTS',n)
          if n['total']<1 or n['passed']!=n['total'] or n['failed'] or n['notExecuted']:
              raise SystemExit('C0604_MYSQL84_FAIL')
          PY
