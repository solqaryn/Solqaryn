name: V19 C12-04.M05.02 - contrato cutover privado HTTP DTO
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/features/plataforma/c12-04-m05-02-cutover-contract.spec.ts'
      - '.github/workflows/v19-c12-04-m05-02-cutover-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c1204-m0502-${{ github.sha }}
  cancel-in-progress: false
jobs:
  cutover-dto-contract:
    name: C12-04.M05.02 - siete contratos DTO cutover Angular
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Siete pruebas causales HTTP DTO del cutover
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c12-04-m05-02-cutover-contract.spec.ts
      - name: Lint y build Angular
        run: |
          npm run lint
          npm run build:prod
