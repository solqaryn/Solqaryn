name: V19 C09-04.M05.03 - Outbox integracion MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Infrastructure/Repositories/MensajeOutboxRepository.cs'
      - 'backend/src/Infrastructure/Persistence/Configurations/MensajeOutboxConfiguration.cs'
      - 'backend/tests/Solqaryn.Tests/C0904M0503MySqlOutboxIntegrationTests.cs'
      - '.github/workflows/v19-c09-04-m05-03-outbox-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: c0904-m0503-${{ github.sha }}
  cancel-in-progress: false
jobs:
  mysql-ephemeral:
    name: C09-04.M05.03 - EF Oracle MySQL 8.4 real A/B y CAS
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=v19_outbox_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Scope Lock estricto
        run: node scripts/verify-project-scope.mjs
      - name: Acreditar MySQL 8.4 efimero
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION();' | grep -E '^8[.]4[.]'
      - name: Integration xUnit real y TRX no vacio
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --filter 'FullyQualifiedName~C0904M0503MySqlOutboxIntegrationTests&Category=Integration' --logger 'trx;LogFileName=c0904m0503.trx' --logger 'console;verbosity=normal'
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path('tests/Solqaryn.Tests/TestResults').glob('**/c0904m0503.trx'))
          if len(files) != 1:
              raise SystemExit('No hay un TRX unico y real de integracion')
          root=ET.parse(files[0]).getroot()
          ns={'t':'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          counters=root.find('.//t:Counters',ns)
          if counters is None:
              raise SystemExit('TRX sin contadores reales')
          total=int(counters.attrib['total']); passed=int(counters.attrib['passed'])
          failed=int(counters.attrib['failed'])
          if (total,passed,failed)!=(3,3,0):
              raise SystemExit(f'No PASS causal: total={total} passed={passed} failed={failed}')
          print(f'INTEGRATION_REAL 3/3 PASS; MySQL 8.4 efimero; {files[0]}')
          PY
