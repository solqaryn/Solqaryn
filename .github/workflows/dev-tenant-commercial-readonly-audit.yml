name: DEV - Tenant commercial readiness read-only

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/dev-tenant-commercial-readonly-audit.yml

permissions:
  contents: read

jobs:
  tenant-audit:
    name: Conteos anonimos Empresas y tablas comerciales - DEV
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV
    env:
      DB_HOST: ${{ vars.SOLQARYN_DEV_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_DEV_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_DEV_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_DEV_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_DEV_DB_PASSWORD }}
    steps:
      - name: Verificar identidad canónica antes de consultar
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "solqaryn/Solqaryn"
          test "$GITHUB_REF_NAME" = "dev"
          test "$DB_HOST" = "solqaryn-mysql-solqaryn.h.aivencloud.com"
          test "$DB_PORT" = "14402"
          test "$DB_NAME" = "solqaryn_dev"
          test "$DB_USER" = "solqaryn_dev_user"
          test -n "$DB_PASSWORD"
      - name: Instalar cliente MySQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq mysql-client >/dev/null
      - name: Auditoría estricta de conteos sin PII ni modificaciones
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$DB_PASSWORD"
          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED "$DB_NAME" --batch --skip-column-names <<'SQL'
          SET SESSION TRANSACTION READ ONLY;
          START TRANSACTION READ ONLY;
          SELECT CONCAT('DB_IDENTITY=',DATABASE(),';USER=',SUBSTRING_INDEX(CURRENT_USER(),'@',1));
          SELECT CONCAT('EMPRESAS_TOTAL=',COUNT(*),';EMPRESAS_ACTIVAS=',COALESCE(SUM(CASE WHEN Activa=1 THEN 1 ELSE 0 END),0)) FROM Empresas;
          SELECT CONCAT('REGISTROS_PRODUCTOS=',COUNT(*)) FROM Productos;
          SELECT CONCAT('REGISTROS_CLIENTES=',COUNT(*)) FROM Clientes;
          SELECT CONCAT('REGISTROS_PROVEEDORES=',COUNT(*)) FROM Proveedores;
          SELECT CONCAT('REGISTROS_COMPRAS=',COUNT(*)) FROM Compras;
          SELECT CONCAT('REGISTROS_VENTAS=',COUNT(*)) FROM Ventas;
          SELECT CONCAT('TABLAS_RAIZ_CON_EMPRESA_ID=',COUNT(*)) FROM information_schema.columns
            WHERE table_schema=DATABASE()
              AND table_name IN ('Productos','Clientes','Proveedores','Compras','Ventas')
              AND column_name='EmpresaId';
          COMMIT;
          SQL
          unset MYSQL_PWD

      - name: N0.4 - readback roles empresariales en Aiven DEV (solo lectura)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "solqaryn/Solqaryn"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$DB_HOST" = "solqaryn-mysql-solqaryn.h.aivencloud.com"
          test "$DB_PORT" = "14402"
          test "$DB_NAME" = "solqaryn_dev"
          test "$DB_USER" = "solqaryn_dev_user"
          test -n "$DB_PASSWORD"
          export MYSQL_PWD="$DB_PASSWORD"
          readback="$(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED "$DB_NAME" --batch --skip-column-names <<'SQL'
          SET SESSION TRANSACTION READ ONLY;
          START TRANSACTION READ ONLY;
          SELECT CONCAT('N04_DB=', DATABASE());
          SELECT CONCAT('N04_MYSQL_USER=', SUBSTRING_INDEX(CURRENT_USER(),'@',1));
          SELECT CONCAT('N04_MYSQL_VERSION=', VERSION());
          SELECT CONCAT('N04_COMPANIES=', COUNT(*)) FROM Empresas;
          SELECT CONCAT('N04_MIGRATION_MARKER=', COUNT(*)) FROM __EFMigrationsHistory
            WHERE MigrationId='20261018200000_TenantRoleOwnershipDeterministicBackfill';
          SELECT CONCAT('N04_ACTIVE_CUSTOM_ORPHANS=', COUNT(*)) FROM Roles
            WHERE Ambito=1 AND EsSistema=0 AND EmpresaId IS NULL AND Activo=1 AND Eliminado=0;
          SELECT CONCAT('N04_ALL_CUSTOM_ORPHANS=', COUNT(*)) FROM Roles
            WHERE Ambito=1 AND EsSistema=0 AND EmpresaId IS NULL;
          SELECT CONCAT('N04_GRANT_OWNER_CONFLICTS=', COUNT(*))
            FROM RolPermisos rp INNER JOIN Roles r ON r.Id=rp.RolId
            WHERE rp.EmpresaId IS NOT NULL AND r.EmpresaId IS NOT NULL
              AND rp.EmpresaId<>r.EmpresaId;
          SELECT CONCAT('N04_PLATFORM_OWNER_CONFLICTS=', COUNT(*))
            FROM Roles WHERE Ambito=2 AND EmpresaId IS NOT NULL;
          SELECT CONCAT('N04_MEMBERSHIP_CUSTOM_OWNER_CONFLICTS=', COUNT(*))
            FROM UsuarioEmpresas ue INNER JOIN Roles r ON r.Id=ue.RolId
            WHERE r.Ambito=1 AND r.EsSistema=0 AND r.EmpresaId IS NOT NULL
              AND ue.EmpresaId<>r.EmpresaId;
          COMMIT;
          SQL
          )"
          unset MYSQL_PWD
          printf '%s\n' "$readback"
          metric() { printf '%s\n' "$readback" | awk -F= -v key="$1" '$1==key {print $2}'; }
          test "$(metric N04_DB)" = "solqaryn_dev"
          test "$(metric N04_MYSQL_USER)" = "solqaryn_dev_user"
          case "$(metric N04_MYSQL_VERSION)" in 8.4.8*) ;; *) echo "N04_VERSION=BLOCKED" >&2; exit 1;; esac
          test "$(metric N04_COMPANIES)" -ge 2
          test "$(metric N04_MIGRATION_MARKER)" = 1
          test "$(metric N04_GRANT_OWNER_CONFLICTS)" = 0
          test "$(metric N04_PLATFORM_OWNER_CONFLICTS)" = 0
          test "$(metric N04_MEMBERSHIP_CUSTOM_OWNER_CONFLICTS)" = 0
          echo "N04_AIVEN_READBACK=PASS_READ_ONLY"
          {
            echo "## N0.4 - MySQL Aiven DEV (solo lectura)"
            echo "Commit: \`$GITHUB_SHA\`"
            printf '%s\n' "$readback" | sed 's/^/- /'
            echo "- Dictamen estructural: PASS_READ_ONLY"
            echo "- Usuarios, roles, grants y empresas: ninguna escritura"
            echo "- JWT A/B en runtime real: requiere prueba HTTP autenticada independiente"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnosticar autorizacion empresa 6 - Administrador Prueba B (solo lectura)
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "solqaryn/Solqaryn"
          test "$GITHUB_REF" = "refs/heads/dev"
          test "$DB_HOST" = "solqaryn-mysql-solqaryn.h.aivencloud.com"
          test "$DB_PORT" = "14402"
          test "$DB_NAME" = "solqaryn_dev"
          test "$DB_USER" = "solqaryn_dev_user"
          test -n "$DB_PASSWORD"
          export MYSQL_PWD="$DB_PASSWORD"
          diagnostic="$(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED "$DB_NAME" --batch --skip-column-names <<'SQL'
          SET SESSION TRANSACTION READ ONLY;
          START TRANSACTION READ ONLY;
          SELECT CONCAT('B_ACCOUNT_MATCHES=',COUNT(*)) FROM Usuarios
            WHERE NombreCompleto='Administrador Prueba B';
          SELECT CONCAT('B_ACCOUNT_ELIGIBLE=',COUNT(*)) FROM Usuarios
            WHERE NombreCompleto='Administrador Prueba B' AND Activo=1 AND Bloqueado=0 AND Eliminado=0;
          SELECT CONCAT('B_COMPANY6_PRESENT=',COUNT(*)) FROM Empresas WHERE Id=6;
          SELECT CONCAT('B_COMPANY6_ACTIVE=',COUNT(*)) FROM Empresas WHERE Id=6 AND Activa=1;
          SELECT CONCAT('B_MEMBERSHIPS_TOTAL=',COUNT(*))
            FROM UsuarioEmpresas m JOIN Usuarios u ON u.Id=m.UsuarioId
            WHERE u.NombreCompleto='Administrador Prueba B';
          SELECT CONCAT('B_MEMBERSHIP_COMPANY_IDS=',COALESCE(GROUP_CONCAT(DISTINCT m.EmpresaId ORDER BY m.EmpresaId SEPARATOR ','),'NONE'))
            FROM UsuarioEmpresas m JOIN Usuarios u ON u.Id=m.UsuarioId
            WHERE u.NombreCompleto='Administrador Prueba B';
          SELECT CONCAT('B_COMPANY6_MEMBERSHIPS=',COUNT(*))
            FROM UsuarioEmpresas m JOIN Usuarios u ON u.Id=m.UsuarioId
            WHERE u.NombreCompleto='Administrador Prueba B' AND m.EmpresaId=6;
          SELECT CONCAT('B_COMPANY6_ACTIVE_MEMBERSHIPS=',COUNT(*))
            FROM UsuarioEmpresas m JOIN Usuarios u ON u.Id=m.UsuarioId
            WHERE u.NombreCompleto='Administrador Prueba B' AND m.EmpresaId=6 AND m.Activa=1;
          SELECT CONCAT('B_COMPANY6_VALID_ROLE=',COUNT(*))
            FROM UsuarioEmpresas m JOIN Usuarios u ON u.Id=m.UsuarioId
            JOIN Roles r ON r.Id=m.RolId
            WHERE u.NombreCompleto='Administrador Prueba B' AND m.EmpresaId=6
              AND r.Activo=1 AND r.Eliminado=0 AND r.Ambito=1
              AND (r.EmpresaId=6 OR (r.EmpresaId IS NULL AND r.EsSistema=1));
          SELECT CONCAT('B_COMPANY6_VALID_AUTH_CONTEXTS=',COUNT(*))
            FROM UsuarioEmpresas m JOIN Usuarios u ON u.Id=m.UsuarioId
            JOIN Empresas e ON e.Id=m.EmpresaId
            JOIN Roles r ON r.Id=m.RolId
            WHERE u.NombreCompleto='Administrador Prueba B' AND m.EmpresaId=6
              AND u.Activo=1 AND u.Bloqueado=0 AND u.Eliminado=0
              AND m.Activa=1 AND e.Activa=1
              AND r.Activo=1 AND r.Eliminado=0 AND r.Ambito=1
              AND (r.EmpresaId=e.Id OR (r.EmpresaId IS NULL AND r.EsSistema=1));
          SELECT CONCAT('B_VALID_AUTH_COMPANY_IDS=',COALESCE(GROUP_CONCAT(DISTINCT e.Id ORDER BY e.Id SEPARATOR ','),'NONE'))
            FROM UsuarioEmpresas m JOIN Usuarios u ON u.Id=m.UsuarioId
            JOIN Empresas e ON e.Id=m.EmpresaId
            JOIN Roles r ON r.Id=m.RolId
            WHERE u.NombreCompleto='Administrador Prueba B'
              AND u.Activo=1 AND u.Bloqueado=0 AND u.Eliminado=0
              AND m.Activa=1 AND e.Activa=1
              AND r.Activo=1 AND r.Eliminado=0 AND r.Ambito=1
              AND (r.EmpresaId=e.Id OR (r.EmpresaId IS NULL AND r.EsSistema=1));
          COMMIT;
          SQL
          )"
          unset MYSQL_PWD
          printf '%s\n' "$diagnostic"
          {
            echo "## Diagnostico DEV — ingreso cuenta prueba B / empresa 6"
            echo "Lectura de datos agregados sin PII y sin DML."
            printf '%s\n' "$diagnostic" | sed 's/^/- /'
            echo "Resultado informativo: no asigna ni activa membresias automaticamente."
          } >> "$GITHUB_STEP_SUMMARY"
