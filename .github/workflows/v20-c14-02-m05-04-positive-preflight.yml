name: V20 C14-02.M05.04 - positive security preflight acceptance
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Application/C1402M0504PositiveSecurityAcceptancePreflightTests.cs'
      - 'backend/src/Application/AutomationV5/C1402SecurityAcceptanceAuthorizationGate.cs'
      - '.github/workflows/v20-c14-02-m05-04-positive-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c1402-m0504-${{ github.sha }}
  cancel-in-progress: false
jobs:
  positive-preflight:
    name: C14-02.M05.04 - nine xUnit positive and negative preflight cases
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Strict project scope
        run: node scripts/verify-project-scope.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restore and build .NET 10 Release
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln -c Release --no-restore
      - name: Execute real Application xUnit
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~C1402M0504PositiveSecurityAcceptancePreflightTests' --logger 'trx;LogFileName=c1402-m0504-positive.trx' --logger 'console;verbosity=normal'
      - name: Retain TRX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c14-02-m05-04-positive-preflight-trx
          path: backend/tests/Solqaryn.Tests/TestResults/**/c1402-m0504-positive.trx
          if-no-files-found: warn
          retention-days: 14
