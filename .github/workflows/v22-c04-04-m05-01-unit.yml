name: V22 C04-04.M05.01 - unit payment rules
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Application/C0404M0501PaymentDomainUnitTests.cs'
      - '.github/workflows/v22-c04-04-m05-01-unit.yml'
      - 'backend/src/Domain/AutomationV5/C0404PaymentDomainRules.cs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0404-m0501-${{ github.sha }}
  cancel-in-progress: false
jobs:
  unit-rules:
    name: C04-04.M05.01 - .NET10 xUnit payment boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Exact SHA Scope Lock
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Restore Release build
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: xUnit directed TRX must pass with real cases
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c0404-m0501"
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~C0404M0501PaymentDomainUnitTests' --logger 'trx;LogFileName=unit.trx' --results-directory "$RUNNER_TEMP/c0404-m0501"
          python3 - <<'PY'
          import os,sys,xml.etree.ElementTree as ET
          path=os.path.join(os.environ['RUNNER_TEMP'],'c0404-m0501','unit.trx')
          c=ET.parse(path).getroot().find('.//{*}Counters')
          if c is None:sys.exit('NO_TRX')
          n=int(c.get('total','0'));p=int(c.get('passed','0'));f=int(c.get('failed','0'));s=int(c.get('notExecuted','0'))
          if n<14 or p!=n or f or s:sys.exit(f'NO_GO n={n} pass={p} fail={f} skip={s}')
          print(f'GITHUB_HOSTED_REAL_UNIT_PASS {p}/{n} SHA={os.environ["GITHUB_SHA"]}')
          PY
