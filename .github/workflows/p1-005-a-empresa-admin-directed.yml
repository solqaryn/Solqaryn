name: DEV - P1-005.A roles empresariales negativos dirigidos
on:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/p1-005-a-empresa-admin-directed.yml
      - backend/src/API/Controllers/UsuariosController.cs
      - backend/src/API/Security/CommercialTenantUiCapabilities.cs
      - backend/tests/Solqaryn.Tests/API/CommercialTenantUiCapabilitiesTests.cs
      - backend/src/API/Middleware/UnscopedCommercialTenantGuardMiddleware.cs
      - backend/src/API/Program.cs
      - backend/src/Application/Interfaces/IUsuarioAdministracionEmpresaService.cs
      - backend/src/Application/Services/PermisoService.cs
      - backend/src/Infrastructure/Services/UsuarioAdministracionEmpresaService.cs
      - backend/tests/Solqaryn.Tests/P1005AEmpresaAdminScopeTests.cs
      - backend/tests/Solqaryn.Tests/API/P1005AEmpresaAdminMiddlewareTests.cs
      - backend/tests/Solqaryn.Tests/API/UnscopedCommercialTenantGuardTests.cs
  push:
    branches: [dev]
    paths:
      - .github/workflows/p1-005-a-empresa-admin-directed.yml
      - backend/src/API/Controllers/UsuariosController.cs
      - backend/src/API/Security/CommercialTenantUiCapabilities.cs
      - backend/tests/Solqaryn.Tests/API/CommercialTenantUiCapabilitiesTests.cs
      - backend/src/API/Middleware/UnscopedCommercialTenantGuardMiddleware.cs
      - backend/src/API/Program.cs
      - backend/src/Application/Interfaces/IUsuarioAdministracionEmpresaService.cs
      - backend/src/Application/Services/PermisoService.cs
      - backend/src/Infrastructure/Services/UsuarioAdministracionEmpresaService.cs
      - backend/tests/Solqaryn.Tests/P1005AEmpresaAdminScopeTests.cs
      - backend/tests/Solqaryn.Tests/API/P1005AEmpresaAdminMiddlewareTests.cs
      - backend/tests/Solqaryn.Tests/API/UnscopedCommercialTenantGuardTests.cs
permissions:
  contents: read
concurrency:
  group: solqaryn-p1005a-directed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  directed:
    name: P1-005.A - aislamiento roles usuarios admin A B
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Scope Lock y tests dirigidos sin secretos
        run: |
          set -euo pipefail
          node scripts/verify-project-scope.mjs
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --filter 'FullyQualifiedName~P1005AEmpresaAdminScopeTests|FullyQualifiedName~P1005AEmpresaAdminMiddlewareTests|FullyQualifiedName~CommercialTenantUiCapabilitiesTests|FullyQualifiedName~UnscopedCommercialTenantGuardTests' --verbosity minimal
