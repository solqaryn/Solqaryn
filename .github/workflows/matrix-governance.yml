name: DEV - Gobierno de matrices

on:
  push:
    branches: [dev]
    paths:
      - 'docs/matrices-evaluacion/**'
      - 'scripts/validate_matrix_governance.py'
      - 'scripts/validate_n8_17_c_data_contracts.py'
      - 'scripts/validate_n8_17_d_backend_contracts.py'
      - 'scripts/validate_n8_17_e_frontend_contracts.py'
      - 'scripts/validate_n8_17_g_traceability.py'
      - 'scripts/validate_n8_17_h_certification.py'
      - 'scripts/validate_n8_18_b_domain_boundaries.py'
      - 'scripts/validate_n8_18_c_db_mig.py'
      - 'scripts/validate_n8_18_d_backend_refactor.py'
      - 'scripts/validate_n8_18_e_frontend_refactor.py'
      - 'backend/tests/Solqaryn.Tests/Application/N818BackendArchitectureTests.cs'
      - 'frontend/src/app/app.component.ts'
      - 'frontend/src/app/shared/alerts/**'
      - 'frontend/src/app/shared/navigation/**'
      - '.github/workflows/matrix-governance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: matrix-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-matrix-governance:
    name: MATRIX_ID, catálogo y plantilla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar gobierno canónico de matrices
        run: python scripts/validate_matrix_governance.py
      - name: Validar contratos de datos N8.17.C
        run: python scripts/validate_n8_17_c_data_contracts.py
      - name: Validar contratos backend N8.17.D
        run: python scripts/validate_n8_17_d_backend_contracts.py
      - name: Validar contratos frontend N8.17.E
        run: python scripts/validate_n8_17_e_frontend_contracts.py
      - name: Validar trazabilidad exhaustiva N8.17.G
        run: python scripts/validate_n8_17_g_traceability.py
      - name: Validar certificación documental N8.17.H
        run: python scripts/validate_n8_17_h_certification.py
      - name: Validar límites y ownership de dominio N8.18.B
        run: python scripts/validate_n8_18_b_domain_boundaries.py
      - name: Validar integridad/migraciones no destructivas N8.18.C
        run: python scripts/validate_n8_18_c_db_mig.py
      - name: Validar reorganización backend N8.18.D
        run: python scripts/validate_n8_18_d_backend_refactor.py
      - name: Validar reorganización frontend N8.18.E
        run: python scripts/validate_n8_18_e_frontend_refactor.py
