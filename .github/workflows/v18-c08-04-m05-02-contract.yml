name: V18 C08-04.M05.02 - Contrato DTO y errores opacos
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v18-c08-04-m05-02-contract.yml'
      - 'backend/src/Application/AutomationV5/C0804SectorModuleApplicationGate.cs'
      - 'backend/tests/Solqaryn.Tests/Application/C0804SectorModuleApplicationGateTests.cs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v18-c0804-m0502-${{ github.sha }}
  cancel-in-progress: false
jobs:
  application-dto-contract:
    name: C08-04.M05.02 - xUnit contratos y errores Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Pruebas reales de contrato DTO y errores seguros
        run: dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --filter 'FullyQualifiedName~C0804SectorModuleApplicationGateTests' --logger 'console;verbosity=normal'
