name: P0-008.B - Reject secret values in DEV metadata evidence

on:
  push:
    branches: [work/solqaryn-p0-008-b]
    paths:
      - 'scripts/verify-p0-008-b-secret-evidence.mjs'
      - '.github/workflows/p0-008-b-secret-evidence.yml'
      - 'docs/P0-008-B-PRUEBA-NEGATIVA-SECRETOS-DEV.md'
  pull_request:
    branches: [dev]
    paths:
      - 'scripts/verify-p0-008-b-secret-evidence.mjs'
      - '.github/workflows/p0-008-b-secret-evidence.yml'
      - 'docs/P0-008-B-PRUEBA-NEGATIVA-SECRETOS-DEV.md'

permissions:
  contents: read

jobs:
  reject-secret-values:
    name: P0-008.B - Metadata-only evidence negatives
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject synthetic leaks without contacting providers
        run: node scripts/verify-p0-008-b-secret-evidence.mjs
