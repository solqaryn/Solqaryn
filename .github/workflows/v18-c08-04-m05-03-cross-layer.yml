name: V18 C08-04.M05.03 - Integracion real de adaptador aislado
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v18-c08-04-m05-03-cross-layer.yml'
      - 'backend/tests/Solqaryn.Tests/Infrastructure/C0804SectorModuleRealAdapterContractIntegrationTests.cs'
      - 'backend/src/Application/AutomationV5/C0804SectorModuleAuthorizationFence.cs'
      - 'backend/src/Application/AutomationV5/C0804SectorModuleReadOnlyIntegrationBoundary.cs'
      - 'backend/src/Infrastructure/AutomationV5/C0804IsolatedTenantModuleSnapshotAdapter.cs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v18-c0804-m0503-${{ github.sha }}
  cancel-in-progress: false
jobs:
  real-adapter-contract:
    name: C08-04.M05.03 - xUnit cross-layer Release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Pruebas reales de adaptador y fence
        run: dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --filter 'FullyQualifiedName~C0804SectorModuleRealAdapterContractIntegrationTests' --logger 'console;verbosity=normal'
