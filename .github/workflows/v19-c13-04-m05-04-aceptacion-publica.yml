name: V19 C13-04.M05.04 - Aceptacion publica sin mocks
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c13-04-m05-04-aceptacion-publica.spec.ts'
      - '.github/workflows/v19-c13-04-m05-04-aceptacion-publica.yml'
      - 'frontend/src/app/features/login/login.component.html'
      - 'frontend/src/app/features/storefront/storefront.component.html'
      - 'frontend/src/app/features/storefront/storefront-productos.component.html'
      - 'frontend/src/app/features/storefront/storefront-categorias.component.html'
      - 'frontend/src/app/features/storefront/storefront-carrito.component.html'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c13-04-m05-04-${{ github.sha }}
  cancel-in-progress: false
jobs:
  e2e:
    name: C13-04.M05.04 - siete Chromium sin mocks de red
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Npm fijado
        run: npm install --global npm@11.19.0
      - name: Dependencias fijas
        run: npm ci
      - name: Lint y build
        run: |
          npm run lint
          npm run build:prod
      - name: Chromium GitHub-hosted
        run: npx playwright install --with-deps chromium
      - name: Angular local loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c1304m0504.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then
              echo 'ANGULAR_LOCAL_READY=PASS'
              exit 0
            fi
            sleep 2
          done
          cat c1304m0504.log >&2
          exit 1
      - name: Cuatro recorridos públicos y tres rechazos privados sin HTTP interceptado
        run: npx playwright test e2e/c13-04-m05-04-aceptacion-publica.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v19-c13-04-m05-04-evidence
          path: |
            frontend/c1304m0504.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
