name: V20 C07-04.M05.01 - reglas unitarias pedidos
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/features/pedidos-venta/c07-04-m05-01-pedidos-reglas.spec.ts'
      - 'frontend/src/app/features/pedidos-venta/pedido-venta.service.ts'
      - '.github/workflows/v20-c07-04-m05-01-unit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c0704-m0501-${{ github.sha }}
  cancel-in-progress: false
jobs:
  reglas:
    name: C07-04.M05.01 - cinco contratos HTTP Angular
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm institucional
        run: npm install --global npm@11.19.0
      - name: Dependencias bloqueadas
        run: npm ci
      - name: Cinco casos positivos negativos fronteras y error HTTP
        run: npm test -- --no-watch --no-progress --include=src/app/features/pedidos-venta/c07-04-m05-01-pedidos-reglas.spec.ts
      - name: Tipado lint y Angular produccion
        run: |
          npm run lint
          npm run build:prod
