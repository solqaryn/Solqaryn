name: DEV - Evidencia temporal de pertenencia comercial
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/dev-tenant-commercial-temporal-provenance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solqaryn-dev-tenant-temporal-readonly
  cancel-in-progress: false
jobs:
  historical-provenance:
    name: Aiven DEV - pertenencia temporal agregada y solo lectura
    if: github.repository == 'solqaryn/Solqaryn' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: DEV
    env:
      DB_HOST: ${{ vars.SOLQARYN_DEV_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_DEV_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_DEV_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_DEV_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_DEV_DB_PASSWORD }}
    steps:
      - name: Preflight del origen y entorno canónicos
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'solqaryn/Solqaryn'
          test "$GITHUB_REF" = 'refs/heads/dev'
          test "$DB_HOST" = 'solqaryn-mysql-solqaryn.h.aivencloud.com'
          test "$DB_PORT" = '14402'
          test "$DB_NAME" = 'solqaryn_dev'
          test "$DB_USER" = 'solqaryn_dev_user'
          test -n "$DB_PASSWORD"
      - name: Instalar cliente MySQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq mysql-client >/dev/null
      - name: Diagnóstico sin PII ni escritura
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$DB_PASSWORD"
          q() {
            mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" \
              --ssl-mode=REQUIRED "$DB_NAME" --batch --skip-column-names -e "$1"
          }
          test "$(q 'SELECT DATABASE();')" = 'solqaryn_dev'
          test "$(q "SELECT SUBSTRING_INDEX(CURRENT_USER(),'@',1);")" = 'solqaryn_dev_user'
          version="$(q 'SELECT VERSION();')"
          case "$version" in 8.4.8*) ;; *) echo 'STOP: versión MySQL DEV no aprobada' >&2; exit 1 ;; esac
          test "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name IN ('Productos','Clientes','Proveedores','Compras','Ventas') AND column_name='EmpresaId';")" = 5
          test "$(q "SELECT COUNT(*) FROM Empresas;")" = 1
          echo 'TEMPORAL_TENANT_READONLY_PREFLIGHT=PASS project=SOLQARYN branch=dev database=solqaryn_dev'
          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" \
            --ssl-mode=REQUIRED "$DB_NAME" --batch --skip-column-names <<'SQL'
          SET TRANSACTION READ ONLY;
          START TRANSACTION WITH CONSISTENT SNAPSHOT, READ ONLY;
          WITH raices AS (
              SELECT 'Productos' AS Tabla, EmpresaId, CreadoPorUsuarioId, FechaCreacion, FechaActualizacion FROM Productos
              UNION ALL SELECT 'Clientes', EmpresaId, CreadoPorUsuarioId, FechaCreacion, FechaActualizacion FROM Clientes
              UNION ALL SELECT 'Proveedores', EmpresaId, CreadoPorUsuarioId, FechaCreacion, FechaActualizacion FROM Proveedores
              UNION ALL SELECT 'Compras', EmpresaId, CreadoPorUsuarioId, FechaCreacion, FechaActualizacion FROM Compras
              UNION ALL SELECT 'Ventas', EmpresaId, CreadoPorUsuarioId, FechaCreacion, FechaActualizacion FROM Ventas
          ), evidencia AS (
              SELECT r.*,
                (
                  SELECT COUNT(DISTINCT m.EmpresaId)
                  FROM UsuarioEmpresas m
                  JOIN Empresas e ON e.Id = m.EmpresaId
                  WHERE m.UsuarioId = r.CreadoPorUsuarioId
                    AND m.FechaCreacion <= r.FechaCreacion
                    AND e.FechaCreacion <= r.FechaCreacion
                ) AS MembresiasDocumentadasAntes,
                (
                  SELECT COUNT(DISTINCT m.EmpresaId)
                  FROM UsuarioEmpresas m
                  WHERE m.UsuarioId = r.CreadoPorUsuarioId
                ) AS MembresiasRegistradas,
                (
                  SELECT COUNT(*)
                  FROM UsuarioEmpresas m
                  WHERE m.UsuarioId = r.CreadoPorUsuarioId
                    AND m.FechaCreacion > r.FechaCreacion
                ) AS MembresiasCreadasDespues,
                (
                  SELECT COUNT(*)
                  FROM UsuarioEmpresas m
                  WHERE m.UsuarioId = r.CreadoPorUsuarioId
                    AND m.FechaActualizacion > r.FechaCreacion
                ) AS MembresiasModificadasDespues,
                (
                  SELECT COUNT(*)
                  FROM Empresas e
                  WHERE e.FechaCreacion > r.FechaCreacion
                ) AS EmpresasRegistradasDespues
              FROM raices r
          )
          SELECT CONCAT('TABLA=',Tabla,
            ';TOTAL=',COUNT(*),
            ';SIN_OWNER=',COALESCE(SUM(EmpresaId IS NULL),0),
            ';SIN_AUTOR=',COALESCE(SUM(CreadoPorUsuarioId IS NULL),0),
            ';SIN_MEMBRESIA_PREEXISTENTE=',COALESCE(SUM(MembresiasDocumentadasAntes = 0),0),
            ';MULTIPLE_PREEXISTENTE=',COALESCE(SUM(MembresiasDocumentadasAntes > 1),0),
            ';MEMBRESIA_CREADA_DESPUES=',COALESCE(SUM(MembresiasCreadasDespues > 0),0),
            ';MEMBRESIA_MODIFICADA_DESPUES=',COALESCE(SUM(MembresiasModificadasDespues > 0),0),
            ';EMPRESA_CREADA_DESPUES=',COALESCE(SUM(EmpresasRegistradasDespues > 0),0),
            ';FECHAS_INCOHERENTES=',COALESCE(SUM(FechaActualizacion < FechaCreacion),0))
          FROM evidencia
          GROUP BY Tabla ORDER BY Tabla;
          SELECT CONCAT('AUDITORIA_EMPRESAID=',
            COALESCE(SUM(EmpresaId IS NOT NULL),0),
            ';AUDITORIA_TOTAL=',COUNT(*))
          FROM RegistrosAuditoria;
          COMMIT;
          SQL
          unset MYSQL_PWD
          echo 'TEMPORAL_TENANT_READONLY=PASS sin_backfill=YES sin_ids_ni_pii=YES'

      - name: Contrastar fuentes empresariales directas sin exponer registros
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$DB_PASSWORD"
          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" \
            --ssl-mode=REQUIRED "$DB_NAME" --batch --skip-column-names <<'SQL'
          SET SESSION TRANSACTION READ ONLY;
          START TRANSACTION READ ONLY;
          -- Auditoria explícita: una coincidencia por usuario o membresia no es prueba.
          -- La clave exacta es Entidad + ReferenciaId + EmpresaId no nulo.
          WITH raices AS (
              SELECT 'Producto' AS Tipo, Id FROM Productos WHERE EmpresaId IS NULL
              UNION ALL SELECT 'Cliente', Id FROM Clientes WHERE EmpresaId IS NULL
              UNION ALL SELECT 'Proveedor', Id FROM Proveedores WHERE EmpresaId IS NULL
              UNION ALL SELECT 'Compra', Id FROM Compras WHERE EmpresaId IS NULL
              UNION ALL SELECT 'Venta', Id FROM Ventas WHERE EmpresaId IS NULL
          ), pruebas AS (
              SELECT r.Tipo, r.Id, COUNT(DISTINCT a.EmpresaId) AS EmpresasAuditoria
              FROM raices r
              LEFT JOIN RegistrosAuditoria a ON a.Entidad=r.Tipo
                  AND a.ReferenciaId=r.Id AND a.EmpresaId>0 AND a.Resultado='Exito'
              GROUP BY r.Tipo,r.Id
          )
          SELECT CONCAT('FUENTE_AUDITORIA_TABLA=',Tipo,';TOTAL=',COUNT(*),
              ';EMPRESA_UNICA=',COALESCE(SUM(EmpresasAuditoria=1),0),
              ';CONFLICTO=',COALESCE(SUM(EmpresasAuditoria>1),0),
              ';SIN_PRUEBA=',COALESCE(SUM(EmpresasAuditoria=0),0))
          FROM pruebas GROUP BY Tipo ORDER BY Tipo;

          -- Evidencia empresarial asociada a factura real mediante relacion FK.
          WITH fiscal AS (
              SELECT v.Id AS VentaId, COUNT(DISTINCT d.EmpresaId) AS EmpresasFiscales
              FROM Ventas v JOIN Facturas f ON f.VentaId=v.Id
              JOIN DocumentosFiscalesEmision d ON d.FacturaId=f.Id
              WHERE v.EmpresaId IS NULL GROUP BY v.Id
          )
          SELECT CONCAT('FUENTE_FISCAL_VENTAS;CON_DOCUMENTO=',COUNT(*),
              ';EMPRESA_UNICA=',COALESCE(SUM(EmpresasFiscales=1),0),
              ';CONFLICTO=',COALESCE(SUM(EmpresasFiscales>1),0))
          FROM fiscal;

          -- RTN legal de la factura vs RTN de Empresas. Requiere RTN no vacío
          -- y coincidencia estricta, nunca solo nombre/telefono/dominio.
          WITH legal AS (
              SELECT v.Id AS VentaId, COUNT(DISTINCT e.Id) AS EmpresasRtn
              FROM Ventas v
              JOIN Facturas f ON f.VentaId=v.Id
              JOIN Empresas e ON e.Rtn IS NOT NULL
                AND LENGTH(TRIM(e.Rtn))>=8
                AND UPPER(REPLACE(REPLACE(TRIM(f.EmpresaRTN),'-',''),' ','')) =
                    UPPER(REPLACE(REPLACE(TRIM(e.Rtn),'-',''),' ',''))
              WHERE v.EmpresaId IS NULL AND f.EmpresaRTN IS NOT NULL
              GROUP BY v.Id
          )
          SELECT CONCAT('FUENTE_RTN_FACTURAS_VENTAS;CON_COINCIDENCIA=',COUNT(*),
              ';EMPRESA_UNICA=',COALESCE(SUM(EmpresasRtn=1),0),
              ';CONFLICTO=',COALESCE(SUM(EmpresasRtn>1),0))
          FROM legal;
          COMMIT;
          SQL
          unset MYSQL_PWD
          echo 'FUENTES_DE_OWNER_DEV_READONLY=PASS write_count=0 pii=0'
