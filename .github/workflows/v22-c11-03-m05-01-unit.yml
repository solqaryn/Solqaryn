name: V22 C11-03.M05.01 - scoped outbox application unit
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Application/C1103M0501OutboxApplicationUnitTests.cs'
      - '.github/workflows/v22-c11-03-m05-01-unit.yml'
      - 'backend/src/Application/AutomationV5/C1103OutboxApplicationService.cs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c1103-m0501-${{ github.sha }}
  cancel-in-progress: false
jobs:
  unit-rules:
    name: C11-03.M05.01 - .NET10 xUnit outbox trust and replay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Verify exact SHA Scope Lock
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Restore and build Release
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: Directed xUnit TRX fail closed
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c1103-m0501"
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~C1103M0501OutboxApplicationUnitTests' --logger 'trx;LogFileName=unit.trx' --results-directory "$RUNNER_TEMP/c1103-m0501"
          python3 - <<'PY'
          import os,sys,xml.etree.ElementTree as ET
          path=os.path.join(os.environ['RUNNER_TEMP'],'c1103-m0501','unit.trx')
          c=ET.parse(path).getroot().find('.//{*}Counters')
          if c is None: sys.exit('NO_TRX')
          n=int(c.get('total','0'));p=int(c.get('passed','0'));f=int(c.get('failed','0'));s=int(c.get('notExecuted','0'))
          if n<15 or p!=n or f or s:sys.exit(f'NO_GO total={n} pass={p} fail={f} skipped={s}')
          print(f'REAL_XUNIT_EXACT_SHA={os.environ["GITHUB_SHA"]} PASSED={p}/{n}')
          PY
