name: TEMP DEV CI routing hardening

on:
  push:
    branches:
      - fix/dev-ci-routing-hardening-20260930

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dev-ci-routing-hardening-20260930
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Refresh exact Angular lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Install frontend exact dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Frontend lint and routing contracts
        working-directory: frontend
        run: npm run lint

      - name: Frontend production build
        working-directory: frontend
        run: npm run build:prod

      - name: Matrix governance
        run: |
          python scripts/validate_matrix_governance.py
          python scripts/validate_n8_17_e_frontend_contracts.py

      - name: Priority 4 quality contract
        run: python scripts/quality/priority4_quality_audit.py

      - name: VAEP policy parser
        run: bash .github/scripts/vaep-policy-parser.sh --validate docs/VAEP_AUTHORITY.md

      - name: Project scope lock
        run: node scripts/verify-project-scope.mjs

      - name: EF canonical snapshot
        working-directory: backend
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Jwt__Secret: SOLQARYN_CI_DESIGN_TIME_ONLY_0123456789ABCDEF
          Jwt__Issuer: SOLQARYN-CI
          Jwt__Audience: SOLQARYN-CI
          Cors__AllowedOrigins__0: http://localhost
        run: |
          dotnet restore Solqaryn.sln
          dotnet tool install --global dotnet-ef --version 8.0.8
          dotnet ef migrations has-pending-model-changes --project src/Infrastructure/Solqaryn.Infrastructure.csproj --startup-project src/API/Solqaryn.API.csproj --context AppDbContext
          dotnet build Solqaryn.sln --configuration Release --no-restore

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SOLQARYN CI"
          git config user.email "solqaryn.platform@outlook.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "LOCKFILE_ALREADY_CURRENT=1"
            exit 0
          fi
          git commit -m "chore(frontend): refresh Angular 20.3.33 lockfile"
          git push origin HEAD:fix/dev-ci-routing-hardening-20260930
