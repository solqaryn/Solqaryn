name: V23 C06-01.M05.05 negative public Angular Chromium
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c06-01-m05-05-negative.spec.ts'
      - 'frontend/playwright.c0601-negative.config.ts'
      - '.github/workflows/v23-c06-01-m05-05-negative.yml'
      - 'frontend/src/app/features/landing/c0601-public-saas-landing.component.ts'
      - 'frontend/src/app/features/landing/c0601-public-status.component.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v23-c0601-m0505-negative
  cancel-in-progress: false
jobs:
  chromium:
    name: C06-01.M05.05 - negative public Chromium 7 cases
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify exact SHA governance and Scope Lock
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
          node scripts/verify-solqaryn-skills.mjs --self-test
      - name: Angular22 actual typecheck and build
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install -g npm@11.19.0
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npm run build
      - name: Chromium browser actual
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Local public health fixture and real Angular negative acceptance
        working-directory: frontend
        env:
          CI: 'true'
        run: |
          set -euo pipefail
          node scripts/c0601-health-fixture.mjs >/tmp/c0601-m0505-health.log 2>&1 &
          npx ng serve --host 127.0.0.1 --port 4200 >/tmp/c0601-m0505-angular.log 2>&1 &
          ready=0
          for i in $(seq 1 120); do
            if curl --silent --fail http://localhost:5005/health >/dev/null && curl --silent --fail http://127.0.0.1:4200/conoce-solqaryn >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then tail -n 100 /tmp/c0601-m0505-angular.log; tail -n 60 /tmp/c0601-m0505-health.log; exit 1; fi
          npx playwright test e2e/c06-01-m05-05-negative.spec.ts --config=playwright.c0601-negative.config.ts --workers=1 --retries=0
      - name: Verify actual PNG before and after denied state for five widths
        if: success()
        working-directory: frontend
        run: |
          set -euo pipefail
          for width in 320 390 768 1280 1440; do
            test -s "v23-artifacts/c0601-m0505/antes-idle-$width.png"
            test -s "v23-artifacts/c0601-m0505/despues-403-$width.png"
          done
          test "$(find v23-artifacts/c0601-m0505 -type f -name '*.png' | wc -l)" -eq 10
      - name: Publish JUnit and ten Chromium PNGs, not private JWT/MySQL proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v23-c0601-m0505-public-negative-chromium
          path: |
            frontend/v23-artifacts/c0601-m0505/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
