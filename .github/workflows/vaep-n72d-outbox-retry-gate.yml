name: N7.2.D - Outbox retry exact-head

on:
  push:
    branches:
      - dev
    paths:
      - "backend/src/Application/Interfaces/IMensajeOutboxRepository.cs"
      - "backend/src/Application/Services/OutboxRetryPolicy.cs"
      - "backend/src/Application/Services/OutboxRetryProcessor.cs"
      - "backend/src/Infrastructure/Repositories/MensajeOutboxRepository.cs"
      - "backend/tests/Solqaryn.Tests/N71DOutboxApplicationApiTests.cs"
      - "backend/tests/Solqaryn.Tests/N72DOutboxRetryPolicyTests.cs"
      - "backend/tests/Solqaryn.Tests/N72DOutboxRetryProcessorTests.cs"
      - "backend/tests/Solqaryn.Tests/N72DOutboxRepositoryClaimTests.cs"
      - "backend/tests/Solqaryn.Tests/N72DOutboxMySqlConcurrencyTests.cs"
      - ".github/workflows/vaep-n72d-outbox-retry-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaep-n72d-outbox-retry-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-retry:
    name: Build and directed retry tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Record exact candidate SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"
      - name: Restore
        run: dotnet restore backend/Solqaryn.sln
      - name: Build Release
        run: dotnet build backend/Solqaryn.sln -c Release --no-restore
      - name: Directed N7.2.D tests including MySQL concurrency
        run: dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~N72DOutbox" --logger "console;verbosity=normal"
