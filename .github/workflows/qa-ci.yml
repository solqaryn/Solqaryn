name: QA - Compilación y pruebas

on:
  push:
    branches: [qa]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'render.yaml'
      - '.github/workflows/qa-ci.yml'
      - '.github/workflows/promotion-source-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Higiene y scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar scope SOLQARYN
        run: node scripts/verify-project-scope.mjs
      - name: Bloquear temporales, conflictos y diffs inválidos
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(node_modules|bin|obj|dist|\.angular|TestResults|playwright-report|test-results|coverage|tmp|temp)(/|$)|\.(log|tmp|temp|bak|swp|swo)$' || true)"
          test -z "$forbidden" || { echo "$forbidden" >&2; exit 1; }
          git diff --check HEAD~1 HEAD || git diff --check
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md'

  backend:
    name: Backend Release y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - run: dotnet restore Solqaryn.sln
      - run: dotnet build Solqaryn.sln --configuration Release --no-restore
      - run: dotnet test Solqaryn.sln --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=qa-tests.trx"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-backend-tests
          path: backend/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend producción y routing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build:prod
      - run: node scripts/validate-environment-routing.mjs
