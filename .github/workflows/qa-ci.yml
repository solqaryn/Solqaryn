name: QA - Compilación y pruebas

on:
  push:
    branches: [qa]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'render.yaml'
      - '.github/workflows/qa-ci.yml'
      - '.github/workflows/qa-live-certification.yml'
      - '.github/workflows/promotion-source-guard.yml'
  pull_request:
    branches: [qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Higiene y scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar scope SOLQARYN
        run: node scripts/verify-project-scope.mjs
      - name: Bloquear temporales, conflictos y diffs inválidos
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(node_modules|bin|obj|dist|\.angular|TestResults|playwright-report|test-results|coverage|tmp|temp)(/|$)|\.(log|tmp|temp|bak|swp|swo)$' || true)"
          test -z "$forbidden" || { echo "$forbidden" >&2; exit 1; }
          git diff --check HEAD~1 HEAD || git diff --check
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!*.md'

  backend:
    name: Backend Release y pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - run: dotnet restore Solqaryn.sln
      - run: dotnet build Solqaryn.sln --configuration Release --no-restore
      - run: dotnet test Solqaryn.sln --configuration Release --no-build --filter "Category!=Integration" --logger "trx;LogFileName=qa-tests.trx"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-backend-tests
          path: backend/**/TestResults/*.trx
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend producción y routing
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Regresión de nombres de tallas
        run: npm run test:unit -- --include=src/app/features/catalogos-producto/catalogo-producto-list.component.spec.ts
      - name: Regresión de tabla única de Clientes
        run: npm run test:unit -- --include=src/app/features/clientes/clientes-list.component.spec.ts
      - name: Regresión de edición y stock inicial de variantes
        run: npm run test:unit -- --include=src/app/features/productos/producto-variantes.component.spec.ts
      - name: Regresión de consulta de registros y catálogo de permisos
        run: npm run test:unit -- --include=src/app/shared/consulta-registro/consulta-registro.spec.ts --include=src/app/shared/modal-institucional/modal-institucional.spec.ts --include=src/app/shared/modal-institucional/acciones-institucionales.spec.ts --include=src/app/features/permisos/permisos-matrix.component.spec.ts
      - run: npm run build:prod
      - run: node scripts/validate-environment-routing.mjs
      - name: Regresión de portadas de categorías
        run: npm run test:unit -- --include=src/app/features/storefront/storefront-categorias.catalog.spec.ts
      - name: Instalar Chromium para regresión dirigida de Storefront
        run: npx playwright install --with-deps chromium
      - name: Regresión QA de galería y destacados
        shell: bash
        run: |
          set -euo pipefail
          npm start -- --host 127.0.0.1 --port 4200 > /tmp/solqaryn-qa-storefront.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/tienda > /dev/null; then
              npx playwright test e2e/storefront-fase4.spec.ts e2e/storefront-fase7.spec.ts --grep 'QA visual:'
              exit 0
            fi
            sleep 2
          done
          cat /tmp/solqaryn-qa-storefront.log
          exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-storefront-browser-regression
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
