name: Modernización - Fase 6 MySQL EF Provider Gate DEV

on:
  push:
    branches: [dev]
    paths:
      - 'backend/**'
      - 'scripts/security/priority3_tenant_isolation_audit.py'
      - '.github/workflows/modernization-phase6-mysql-ef-provider.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modernization-phase6-mysql-ef-provider-dev
  cancel-in-progress: true

jobs:
  pomelo-baseline:
    name: Pomelo actual - migraciones SQL modelo integración y contratos MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phase6_pomelo
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=phase6_pomelo;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: Phase6-CI-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: Solqaryn.Phase6
      Jwt__Audience: Solqaryn.Phase6.Frontend
    outputs:
      stable: ${{ steps.result.outputs.stable }}
      migration_count: ${{ steps.schema.outputs.migration_count }}
      table_count: ${{ steps.schema.outputs.table_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Scope, rama y matriz exacta
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "dev"
          node scripts/verify-project-scope.mjs
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p=Path("backend/src/Infrastructure/Solqaryn.Infrastructure.csproj")
          root=ET.parse(p).getroot()
          tfm=root.find(".//TargetFramework").text
          refs={x.attrib["Include"]:x.attrib.get("Version") for x in root.findall(".//PackageReference")}
          expected={
            "Microsoft.EntityFrameworkCore":"8.0.2",
            "Microsoft.EntityFrameworkCore.Design":"8.0.2",
            "Pomelo.EntityFrameworkCore.MySql":"8.0.2",
            "MySqlConnector":"2.3.7",
          }
          assert tfm=="net8.0", tfm
          for name,want in expected.items():
              got=refs.get(name)
              assert got==want, f"{name}: {got} != {want}"
          print("PHASE6_BASELINE_MATRIX=PASS")
          PY
          test -z "$(git status --porcelain)"

      - name: Restaurar, compilar e instalar EF CLI
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
          dotnet tool install --global dotnet-ef --version 8.0.8

      - name: Aplicar todas las migraciones Pomelo
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet ef database update \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext \
            --no-build
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext \
            --no-build
          dotnet ef migrations list \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext \
            --no-build | tee ../phase6-pomelo-migrations.txt
          dotnet ef migrations script \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext \
            --no-build \
            --output ../phase6-pomelo-forward.sql
          test -s ../phase6-pomelo-forward.sql

      - name: Certificar historial, tipos, collation, índices y constraints
        id: schema
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          q(){ docker exec "$mysql_container" mysql -uroot -proot phase6_pomelo -Nse "$1"; }

          migration_count="$(q 'SELECT COUNT(*) FROM __EFMigrationsHistory;')"
          table_count="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA='phase6_pomelo' AND TABLE_TYPE='BASE TABLE';")"
          json_count="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='phase6_pomelo' AND DATA_TYPE='json';")"
          decimal_18_2="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='phase6_pomelo' AND DATA_TYPE='decimal' AND NUMERIC_PRECISION=18 AND NUMERIC_SCALE=2;")"
          decimal_18_4="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='phase6_pomelo' AND DATA_TYPE='decimal' AND NUMERIC_PRECISION=18 AND NUMERIC_SCALE=4;")"
          datetime6="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA='phase6_pomelo' AND DATA_TYPE='datetime' AND DATETIME_PRECISION=6;")"
          index_count="$(q "SELECT COUNT(*) FROM (SELECT DISTINCT TABLE_NAME,INDEX_NAME FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA='phase6_pomelo') x;")"
          fk_count="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.REFERENTIAL_CONSTRAINTS WHERE CONSTRAINT_SCHEMA='phase6_pomelo';")"
          check_count="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS WHERE CONSTRAINT_SCHEMA='phase6_pomelo' AND CONSTRAINT_TYPE='CHECK';")"
          utf8mb4_tables="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA='phase6_pomelo' AND TABLE_TYPE='BASE TABLE' AND TABLE_COLLATION LIKE 'utf8mb4%';")"
          unique_default="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA='phase6_pomelo' AND INDEX_NAME='IX_TipoClientes_EsPredeterminadoUnico' AND NON_UNIQUE=0;")"

          test "$migration_count" -gt 100
          test "$table_count" -gt 100
          test "$json_count" -ge 3
          test "$decimal_18_2" -gt 0
          test "$decimal_18_4" -gt 0
          test "$datetime6" -gt 0
          test "$index_count" -gt 100
          test "$fk_count" -gt 20
          test "$check_count" -gt 0
          test "$utf8mb4_tables" -gt 0
          test "$unique_default" -eq 1

          printf 'migration_count=%s\n' "$migration_count" >> "$GITHUB_OUTPUT"
          printf 'table_count=%s\n' "$table_count" >> "$GITHUB_OUTPUT"

          {
            echo "POMELO_MIGRATIONS=$migration_count"
            echo "POMELO_TABLES=$table_count"
            echo "POMELO_JSON_COLUMNS=$json_count"
            echo "POMELO_DECIMAL_18_2=$decimal_18_2"
            echo "POMELO_DECIMAL_18_4=$decimal_18_4"
            echo "POMELO_DATETIME6=$datetime6"
            echo "POMELO_INDEXES=$index_count"
            echo "POMELO_FKS=$fk_count"
            echo "POMELO_CHECKS=$check_count"
            echo "POMELO_UTF8MB4_TABLES=$utf8mb4_tables"
          } | tee phase6-pomelo-schema.env

      - name: Semántica MySQL transacción decimal fecha JSON collation y 1062
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot phase6_pomelo -e "
            DROP TABLE IF EXISTS Phase6ProviderContract;
            CREATE TABLE Phase6ProviderContract (
              Id INT NOT NULL AUTO_INCREMENT,
              Code VARCHAR(40) CHARACTER SET utf8mb4 COLLATE utf8mb4_bin NOT NULL,
              Amount DECIMAL(18,4) NOT NULL,
              AtUtc DATETIME(6) NOT NULL,
              Payload JSON NOT NULL,
              PRIMARY KEY (Id),
              UNIQUE KEY UX_Phase6ProviderContract_Code (Code)
            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;
            START TRANSACTION;
            INSERT INTO Phase6ProviderContract(Code,Amount,AtUtc,Payload)
            VALUES ('ROLLBACK',1234567890.1234,'2026-10-04 12:34:56.123456',JSON_OBJECT('tenant',1,'ok',true));
            ROLLBACK;
          "
          test "$(docker exec "$mysql_container" mysql -uroot -proot phase6_pomelo -Nse "SELECT COUNT(*) FROM Phase6ProviderContract WHERE Code='ROLLBACK';")" = "0"

          docker exec "$mysql_container" mysql -uroot -proot phase6_pomelo -e "
            INSERT INTO Phase6ProviderContract(Code,Amount,AtUtc,Payload)
            VALUES ('ExactCase',1234567890.1234,'2026-10-04 12:34:56.123456',JSON_OBJECT('tenant',1,'ok',true));
          "
          test "$(docker exec "$mysql_container" mysql -uroot -proot phase6_pomelo -Nse "SELECT CAST(Amount AS CHAR) FROM Phase6ProviderContract WHERE Code='ExactCase';")" = "1234567890.1234"
          test "$(docker exec "$mysql_container" mysql -uroot -proot phase6_pomelo -Nse "SELECT DATE_FORMAT(AtUtc,'%Y-%m-%d %H:%i:%s.%f') FROM Phase6ProviderContract WHERE Code='ExactCase';")" = "2026-10-04 12:34:56.123456"
          test "$(docker exec "$mysql_container" mysql -uroot -proot phase6_pomelo -Nse "SELECT JSON_UNQUOTE(JSON_EXTRACT(Payload,'$.tenant')) FROM Phase6ProviderContract WHERE Code='ExactCase';")" = "1"
          test "$(docker exec "$mysql_container" mysql -uroot -proot phase6_pomelo -Nse "SELECT COUNT(*) FROM Phase6ProviderContract WHERE Code='exactcase';")" = "0"

          set +e
          duplicate_output="$(docker exec "$mysql_container" mysql -uroot -proot phase6_pomelo -e "INSERT INTO Phase6ProviderContract(Code,Amount,AtUtc,Payload) VALUES ('ExactCase',1.0000,UTC_TIMESTAMP(6),JSON_OBJECT('x',1));" 2>&1)"
          duplicate_rc=$?
          set -e
          test "$duplicate_rc" -ne 0
          echo "$duplicate_output" | grep -q '1062'
          echo 'POMELO_MYSQL_SEMANTICS=PASS'

      - name: Tests de retry y excepción MySqlConnector
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~UnitOfWorkRetryTests" \
            --logger "trx;LogFileName=phase6-retry.trx"

      - name: Todos los tests de integración MySQL
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet test Solqaryn.sln \
            --configuration Release --no-build \
            --filter "Category=Integration" \
            --logger "trx;LogFileName=phase6-integration.trx"

      - name: Auditoría tenant fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/security/priority3_tenant_isolation_audit.py
          test -z "$(git status --porcelain)"

      - name: Inventario de acoplamiento provider
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee phase6-provider-lockin.json
          import json
          from pathlib import Path
          root=Path("backend")
          texts=[]
          for p in root.rglob("*.cs"):
              try: texts.append((p,p.read_text(encoding="utf-8-sig")))
              except UnicodeDecodeError: pass
          def count(token): return sum(t.count(token) for _,t in texts)
          data={
            "useMySqlCalls":count("UseMySql("),
            "pomeloMigrationBuilderLiterals":count('MigrationBuilder("Pomelo.EntityFrameworkCore.MySql")'),
            "mySqlModelBuilderExtensions":count("MySqlModelBuilderExtensions"),
            "mySqlPropertyBuilderExtensions":count("MySqlPropertyBuilderExtensions"),
            "mySqlConnectorUsings":count("using MySqlConnector;"),
            "jsonColumnMappings":count('HasColumnType("json")'),
            "decimal18_2Mappings":count('decimal(18,2)'),
            "decimal18_4Mappings":count('decimal(18,4)'),
            "datetime6Mappings":count('datetime(6)'),
          }
          assert data["useMySqlCalls"] > 10
          assert data["mySqlModelBuilderExtensions"] > 10
          assert data["mySqlPropertyBuilderExtensions"] > 100
          assert data["mySqlConnectorUsings"] > 0
          assert data["jsonColumnMappings"] > 0
          print(json.dumps(data,indent=2))
          PY

      - name: Resultado Pomelo
        id: result
        shell: bash
        run: |
          set -euo pipefail
          echo 'stable=true' >> "$GITHUB_OUTPUT"
          {
            echo '## Fase 6 - Pomelo baseline'
            echo ''
            echo '- EF Core 8.0.2 + Pomelo 8.0.2 + MySqlConnector 2.3.7: PASS'
            echo '- MySQL 8.4 migrations/schema/SQL: PASS'
            echo '- Integración completa: PASS'
            echo '- Retry 1205/1213 + 1062: PASS'
            echo '- Decimal/datetime(6)/JSON/collation/index/FK/CHECK: PASS'
            echo '- Tenant isolation audit: PASS'
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-pomelo-baseline-${{ github.run_id }}
          path: |
            phase6-pomelo-*.*
            backend/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

  oracle-comparison:
    name: Oracle Connector NET - compatibilidad con historia y runtime SOLQARYN
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phase6_oracle_runtime
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: Phase6-Oracle-CI-Only-Secret-With-More-Than-32-Characters
      Jwt__Issuer: Solqaryn.Phase6
      Jwt__Audience: Solqaryn.Phase6.Frontend
    outputs:
      dropin: ${{ steps.classify.outputs.dropin }}
      fresh_migrations: ${{ steps.classify.outputs.fresh_migrations }}
      exception_contract: ${{ steps.classify.outputs.exception_contract }}
      schema_equivalent: ${{ steps.classify.outputs.schema_equivalent }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Preparar esquema runtime con Pomelo
        working-directory: backend
        env:
          ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=phase6_oracle_runtime;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
          dotnet tool install --global dotnet-ef --version 8.0.8
          dotnet ef database update \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext \
            --no-build
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -e \
            "DROP DATABASE IF EXISTS phase6_oracle_fresh; CREATE DATABASE phase6_oracle_fresh CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"

      - name: Crear probe Oracle actual EF8
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/oracle-probe"
          dotnet new console --framework net8.0 --name Phase6OracleProbe --output "$probe" --force
          dotnet add "$probe/Phase6OracleProbe.csproj" reference "$GITHUB_WORKSPACE/backend/src/Infrastructure/Solqaryn.Infrastructure.csproj"
          dotnet add "$probe/Phase6OracleProbe.csproj" package MySql.EntityFrameworkCore --version 8.0.28
          cat > "$probe/Program.cs" <<'CS'
          using System.Text.Json;
          using Microsoft.EntityFrameworkCore;
          using MySQL.EntityFrameworkCore.Extensions;
          using Solqaryn.Application.Exceptions;
          using Solqaryn.Infrastructure.Persistence;
          using Solqaryn.Infrastructure.Services;

          static IEnumerable<Exception> Chain(Exception ex)
          {
              for (Exception? current=ex; current is not null; current=current.InnerException)
                  yield return current;
          }

          static int? ErrorNumber(Exception ex)
          {
              foreach (var item in Chain(ex))
              {
                  var property=item.GetType().GetProperty("Number");
                  if (property?.GetValue(item) is int number) return number;
              }
              return null;
          }

          var freshConnection=Environment.GetEnvironmentVariable("ORACLE_FRESH_CONNECTION")!;
          var runtimeConnection=Environment.GetEnvironmentVariable("ORACLE_RUNTIME_CONNECTION")!;
          var output=Environment.GetEnvironmentVariable("ORACLE_RESULT")!;

          bool freshMigration=false, runtimeConnect=false, pendingZero=false, linq=false, transactionRollback=false;
          bool duplicateTranslated=false, exceptionTypeCompatible=false;
          bool jsonModel=false, decimalModel=false, datetimeModel=false, indexModel=false;
          string? freshError=null, runtimeError=null, duplicateException=null;
          int? duplicateNumber=null;
          string? providerName=null;
          int freshApplied=0;

          try
          {
              var freshOptions=new DbContextOptionsBuilder<AppDbContext>().UseMySQL(freshConnection).Options;
              await using var fresh=new AppDbContext(freshOptions);
              await fresh.Database.MigrateAsync();
              freshApplied=(await fresh.Database.GetAppliedMigrationsAsync()).Count();
              freshMigration=freshApplied > 100;
          }
          catch(Exception ex)
          {
              freshError=$"{ex.GetType().FullName}: {ex.Message}";
          }

          try
          {
              var runtimeOptions=new DbContextOptionsBuilder<AppDbContext>().UseMySQL(runtimeConnection).Options;
              await using var db=new AppDbContext(runtimeOptions);
              providerName=db.Database.ProviderName;
              runtimeConnect=await db.Database.CanConnectAsync();
              pendingZero=!(await db.Database.GetPendingMigrationsAsync()).Any();

              var model=db.Model;
              var properties=model.GetEntityTypes().SelectMany(e=>e.GetProperties()).ToArray();
              jsonModel=properties.Count(p=>string.Equals(p.GetColumnType(),"json",StringComparison.OrdinalIgnoreCase)) >= 3;
              decimalModel=properties.Any(p=>p.GetColumnType()?.Contains("decimal(18,2)",StringComparison.OrdinalIgnoreCase)==true)
                           && properties.Any(p=>p.GetColumnType()?.Contains("decimal(18,4)",StringComparison.OrdinalIgnoreCase)==true);
              datetimeModel=properties.Any(p=>p.GetColumnType()?.Contains("datetime(6)",StringComparison.OrdinalIgnoreCase)==true);
              indexModel=model.GetEntityTypes().SelectMany(e=>e.GetIndexes()).Count() > 100;

              var sql=db.Productos.AsNoTracking()
                  .Where(p=>p.Id>0)
                  .OrderBy(p=>p.Id)
                  .Select(p=>new { p.Id,p.Nombre,p.Costo,p.FechaCreacion })
                  .Take(5)
                  .ToQueryString();
              linq=sql.Contains("SELECT",StringComparison.OrdinalIgnoreCase);
              _=await db.Productos.AsNoTracking().OrderBy(p=>p.Id).Take(1).ToListAsync();

              await db.Database.ExecuteSqlRawAsync("DROP TABLE IF EXISTS Phase6OracleContract;");
              await db.Database.ExecuteSqlRawAsync("""
                  CREATE TABLE Phase6OracleContract (
                    Id INT NOT NULL AUTO_INCREMENT,
                    Code VARCHAR(40) CHARACTER SET utf8mb4 COLLATE utf8mb4_bin NOT NULL,
                    Amount DECIMAL(18,4) NOT NULL,
                    AtUtc DATETIME(6) NOT NULL,
                    Payload JSON NOT NULL,
                    PRIMARY KEY (Id),
                    UNIQUE KEY IX_TipoClientes_EsPredeterminadoUnico (Code)
                  ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;
                  """);

              await using (var tx=await db.Database.BeginTransactionAsync())
              {
                  await db.Database.ExecuteSqlRawAsync(
                      "INSERT INTO Phase6OracleContract(Code,Amount,AtUtc,Payload) VALUES ('ROLLBACK',123.4567,'2026-10-04 12:34:56.123456',JSON_OBJECT('tenant',1));");
                  await tx.RollbackAsync();
              }
              var count=await db.Database.SqlQueryRaw<long>(
                  "SELECT COUNT(*) AS Value FROM Phase6OracleContract WHERE Code='ROLLBACK'").SingleAsync();
              transactionRollback=count==0;

              await db.Database.ExecuteSqlRawAsync(
                  "INSERT INTO Phase6OracleContract(Code,Amount,AtUtc,Payload) VALUES ('DUP',1.0000,UTC_TIMESTAMP(6),JSON_OBJECT('x',1));");
              var uow=new UnitOfWork(db);
              try
              {
                  await uow.ExecuteInTransactionAsync(async () =>
                      await db.Database.ExecuteSqlRawAsync(
                          "INSERT INTO Phase6OracleContract(Code,Amount,AtUtc,Payload) VALUES ('DUP',2.0000,UTC_TIMESTAMP(6),JSON_OBJECT('x',2));"));
              }
              catch(Exception ex)
              {
                  duplicateTranslated=ex is UniqueConstraintViolationException;
                  duplicateNumber=ErrorNumber(ex);
                  duplicateException=string.Join(" -> ",Chain(ex).Select(x=>x.GetType().FullName));
                  exceptionTypeCompatible=Chain(ex).Any(x=>x.GetType().FullName=="MySqlConnector.MySqlException");
              }
          }
          catch(Exception ex)
          {
              runtimeError=$"{ex.GetType().FullName}: {ex.Message}";
          }

          var result=new {
              oraclePackage="MySql.EntityFrameworkCore 8.0.28",
              providerName,
              freshMigration,
              freshApplied,
              freshError,
              runtimeConnect,
              pendingZero,
              linq,
              transactionRollback,
              jsonModel,
              decimalModel,
              datetimeModel,
              indexModel,
              duplicateTranslated,
              duplicateNumber,
              duplicateException,
              exceptionTypeCompatible,
              retryContractCompatible=exceptionTypeCompatible,
              runtimeError
          };
          await File.WriteAllTextAsync(output,JsonSerializer.Serialize(result,new JsonSerializerOptions{WriteIndented=true})+Environment.NewLine);
          Console.WriteLine(JsonSerializer.Serialize(result));
          CS
          dotnet restore "$probe/Phase6OracleProbe.csproj"
          dotnet build "$probe/Phase6OracleProbe.csproj" --configuration Release --no-restore

      - name: Ejecutar comparación Oracle
        shell: bash
        env:
          ORACLE_FRESH_CONNECTION: Server=127.0.0.1;Port=3306;Database=phase6_oracle_fresh;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
          ORACLE_RUNTIME_CONNECTION: Server=127.0.0.1;Port=3306;Database=phase6_oracle_runtime;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
          ORACLE_RESULT: ${{ runner.temp }}/phase6-oracle-result.json
        run: |
          set -euo pipefail
          dotnet run \
            --project "$RUNNER_TEMP/oracle-probe/Phase6OracleProbe.csproj" \
            --configuration Release --no-build
          cat "$ORACLE_RESULT"

      - name: Comparar esquema físico si Oracle migró historia
        id: schema
        shell: bash
        env:
          ORACLE_RESULT: ${{ runner.temp }}/phase6-oracle-result.json
        run: |
          set -euo pipefail
          equivalent=false
          if jq -e '.freshMigration == true' "$ORACLE_RESULT" >/dev/null; then
            for db in phase6_oracle_runtime phase6_oracle_fresh; do
              docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse "
                SELECT TABLE_NAME,COLUMN_NAME,COLUMN_TYPE,IS_NULLABLE,COALESCE(COLUMN_DEFAULT,'<NULL>'),EXTRA,COALESCE(COLLATION_NAME,'')
                FROM INFORMATION_SCHEMA.COLUMNS
                WHERE TABLE_SCHEMA='$db'
                  AND TABLE_NAME NOT IN ('__EFMigrationsHistory','Phase6OracleContract')
                ORDER BY TABLE_NAME,ORDINAL_POSITION;" > "$RUNNER_TEMP/$db-columns.tsv"
              docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse "
                SELECT TABLE_NAME,INDEX_NAME,NON_UNIQUE,SEQ_IN_INDEX,COALESCE(COLUMN_NAME,''),INDEX_TYPE
                FROM INFORMATION_SCHEMA.STATISTICS
                WHERE TABLE_SCHEMA='$db'
                  AND TABLE_NAME NOT IN ('__EFMigrationsHistory','Phase6OracleContract')
                ORDER BY TABLE_NAME,INDEX_NAME,SEQ_IN_INDEX;" > "$RUNNER_TEMP/$db-indexes.tsv"
              docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse "
                SELECT TABLE_NAME,CONSTRAINT_NAME,REFERENCED_TABLE_NAME,UNIQUE_CONSTRAINT_NAME
                FROM INFORMATION_SCHEMA.REFERENTIAL_CONSTRAINTS
                WHERE CONSTRAINT_SCHEMA='$db'
                ORDER BY TABLE_NAME,CONSTRAINT_NAME;" > "$RUNNER_TEMP/$db-fks.tsv"
            done
            if diff -u "$RUNNER_TEMP/phase6_oracle_runtime-columns.tsv" "$RUNNER_TEMP/phase6_oracle_fresh-columns.tsv" \
              && diff -u "$RUNNER_TEMP/phase6_oracle_runtime-indexes.tsv" "$RUNNER_TEMP/phase6_oracle_fresh-indexes.tsv" \
              && diff -u "$RUNNER_TEMP/phase6_oracle_runtime-fks.tsv" "$RUNNER_TEMP/phase6_oracle_fresh-fks.tsv"; then
              equivalent=true
            fi
          fi
          echo "equivalent=$equivalent" >> "$GITHUB_OUTPUT"
          echo "ORACLE_SCHEMA_EQUIVALENT=$equivalent"

      - name: Clasificar Oracle como drop-in o incompatibilidad
        id: classify
        shell: bash
        env:
          ORACLE_RESULT: ${{ runner.temp }}/phase6-oracle-result.json
          SCHEMA_EQUIVALENT: ${{ steps.schema.outputs.equivalent }}
        run: |
          set -euo pipefail
          fresh="$(jq -r '.freshMigration' "$ORACLE_RESULT")"
          exception="$(jq -r '.exceptionTypeCompatible and .duplicateTranslated and (.duplicateNumber == 1062)' "$ORACLE_RESULT")"
          runtime="$(jq -r '.runtimeConnect and .pendingZero and .linq and .transactionRollback and .jsonModel and .decimalModel and .datetimeModel and .indexModel' "$ORACLE_RESULT")"
          dropin=false
          if [ "$fresh" = true ] && [ "$runtime" = true ] && [ "$exception" = true ] && [ "$SCHEMA_EQUIVALENT" = true ]; then
            dropin=true
          fi
          echo "dropin=$dropin" >> "$GITHUB_OUTPUT"
          echo "fresh_migrations=$fresh" >> "$GITHUB_OUTPUT"
          echo "exception_contract=$exception" >> "$GITHUB_OUTPUT"
          echo "schema_equivalent=$SCHEMA_EQUIVALENT" >> "$GITHUB_OUTPUT"
          {
            echo '## Fase 6 - Oracle comparison'
            echo ''
            echo "- Fresh migration compatibility: $fresh"
            echo "- Runtime/model/LINQ/transaction compatibility: $runtime"
            echo "- Existing MySqlConnector exception/retry contract compatibility: $exception"
            echo "- Physical schema equivalence: $SCHEMA_EQUIVALENT"
            echo "- Oracle drop-in result: $dropin"
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-oracle-comparison-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/phase6-oracle-result.json
            ${{ runner.temp }}/phase6_oracle_*.tsv
          if-no-files-found: warn
          retention-days: 14

  net10-probe:
    name: TargetFramework net10 aislado sin editar csproj
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: phase6_net10
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=phase6_net10;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: Phase6-Net10-CI-Only-Secret-With-More-Than-32-Characters
      Jwt__Issuer: Solqaryn.Phase6
      Jwt__Audience: Solqaryn.Phase6.Frontend
    outputs:
      compile_pass: ${{ steps.result.outputs.compile_pass }}
      integration_pass: ${{ steps.result.outputs.integration_pass }}
      pomelo10_available: ${{ steps.packages.outputs.pomelo10_available }}
      oracle10_available: ${{ steps.packages.outputs.oracle10_available }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Probar disponibilidad estable EF10
        id: packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/provider-packages"
          dotnet new classlib -f net10.0 -o "$RUNNER_TEMP/provider-packages/pomelo" --force >/dev/null
          set +e
          dotnet add "$RUNNER_TEMP/provider-packages/pomelo" package Pomelo.EntityFrameworkCore.MySql --version 10.0.0 >"$RUNNER_TEMP/pomelo10.log" 2>&1
          pomelo_rc=$?
          set -e
          if [ "$pomelo_rc" -eq 0 ]; then pomelo10=true; else pomelo10=false; fi

          dotnet new classlib -f net10.0 -o "$RUNNER_TEMP/provider-packages/oracle" --force >/dev/null
          dotnet add "$RUNNER_TEMP/provider-packages/oracle" package MySql.EntityFrameworkCore --version 10.0.9 >"$RUNNER_TEMP/oracle10.log" 2>&1
          oracle10=true

          echo "pomelo10_available=$pomelo10" >> "$GITHUB_OUTPUT"
          echo "oracle10_available=$oracle10" >> "$GITHUB_OUTPUT"
          echo "POMELO_EF10_STABLE_AVAILABLE=$pomelo10"
          echo "ORACLE_EF10_STABLE_AVAILABLE=$oracle10"

      - name: Compilar todo backend como net10 sin cambiar archivos
        id: compile
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln -p:TargetFramework=net10.0
          dotnet build Solqaryn.sln \
            --configuration Release \
            --no-restore \
            -p:TargetFramework=net10.0
          test -z "$(git status --porcelain)"

      - name: Migrar baseline con provider actual
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef --version 8.0.8
          dotnet ef database update \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext

      - name: Ejecutar unit y toda integración bajo TargetFramework net10 override
        id: tests
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet test Solqaryn.sln \
            --configuration Release \
            --no-restore \
            -p:TargetFramework=net10.0 \
            --filter "Category!=Integration" \
            --logger "trx;LogFileName=phase6-net10-unit.trx"
          dotnet test Solqaryn.sln \
            --configuration Release \
            --no-restore \
            -p:TargetFramework=net10.0 \
            --filter "Category=Integration" \
            --logger "trx;LogFileName=phase6-net10-integration.trx"

      - name: Resultado TargetFramework aislado
        id: result
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo 'compile_pass=true' >> "$GITHUB_OUTPUT"
          echo 'integration_pass=true' >> "$GITHUB_OUTPUT"
          {
            echo '## Fase 6 - net10 isolated probe'
            echo ''
            echo '- Repository TargetFramework files changed: false'
            echo '- Backend compile with MSBuild TargetFramework=net10.0: PASS'
            echo '- Unit tests under net10 override: PASS'
            echo '- MySQL integration tests under net10 override: PASS'
            echo "- Pomelo stable EF10 package 10.0.0 available: ${{ steps.packages.outputs.pomelo10_available }}"
            echo "- Oracle stable EF10 package 10.0.9 available: ${{ steps.packages.outputs.oracle10_available }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-net10-probe-${{ github.run_id }}
          path: |
            backend/**/TestResults/*.trx
            ${{ runner.temp }}/pomelo10.log
            ${{ runner.temp }}/oracle10.log
          if-no-files-found: warn
          retention-days: 14

  verdict:
    name: Dictamen Fase 6
    runs-on: ubuntu-latest
    needs: [pomelo-baseline, oracle-comparison, net10-probe]
    if: always()
    steps:
      - name: Exigir provider estable o STOP
        shell: bash
        env:
          POMELO_STABLE: ${{ needs.pomelo-baseline.outputs.stable }}
          ORACLE_DROPIN: ${{ needs.oracle-comparison.outputs.dropin }}
          ORACLE_FRESH: ${{ needs.oracle-comparison.outputs.fresh_migrations }}
          ORACLE_EXCEPTION: ${{ needs.oracle-comparison.outputs.exception_contract }}
          ORACLE_SCHEMA: ${{ needs.oracle-comparison.outputs.schema_equivalent }}
          NET10_COMPILE: ${{ needs.net10-probe.outputs.compile_pass }}
          NET10_INTEGRATION: ${{ needs.net10-probe.outputs.integration_pass }}
          POMELO10: ${{ needs.net10-probe.outputs.pomelo10_available }}
          ORACLE10: ${{ needs.net10-probe.outputs.oracle10_available }}
        run: |
          set -euo pipefail
          {
            echo '## Fase 6 - Dictamen'
            echo ''
            echo "- POMELO_CURRENT_STABLE=$POMELO_STABLE"
            echo "- ORACLE_DROP_IN=$ORACLE_DROPIN"
            echo "- ORACLE_FRESH_MIGRATIONS=$ORACLE_FRESH"
            echo "- ORACLE_EXCEPTION_CONTRACT=$ORACLE_EXCEPTION"
            echo "- ORACLE_SCHEMA_EQUIVALENT=$ORACLE_SCHEMA"
            echo "- NET10_OVERRIDE_COMPILE=$NET10_COMPILE"
            echo "- NET10_OVERRIDE_INTEGRATION=$NET10_INTEGRATION"
            echo "- POMELO_EF10_STABLE_AVAILABLE=$POMELO10"
            echo "- ORACLE_EF10_STABLE_AVAILABLE=$ORACLE10"
          } | tee phase6-verdict.txt

          if [ "$POMELO_STABLE" = true ] && [ "$NET10_COMPILE" = true ] && [ "$NET10_INTEGRATION" = true ]; then
            {
              echo 'FASE_6_MYSQL_EF_PROVIDER=PASS'
              echo 'SELECTED_PROVIDER=POMELO'
              echo 'TARGETFRAMEWORK_NET10_WITH_CURRENT_EF8_PROVIDER=ALLOWED_BY_ISOLATED_GATE'
              echo "ORACLE_DROP_IN=$ORACLE_DROPIN"
              if [ "$POMELO10" = true ]; then
                echo 'EF10_POMELO_PATH=AVAILABLE'
              else
                echo 'EF10_POMELO_PATH=STOP_UNTIL_STABLE_PROVIDER'
              fi
            } | tee -a phase6-verdict.txt
          else
            {
              echo 'FASE_6_MYSQL_EF_PROVIDER=STOP'
              echo 'TARGETFRAMEWORK_CHANGE=BLOCKED'
            } | tee -a phase6-verdict.txt
            cat phase6-verdict.txt >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          cat phase6-verdict.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: phase6-provider-verdict-${{ github.run_id }}
          path: phase6-verdict.txt
          retention-days: 30
