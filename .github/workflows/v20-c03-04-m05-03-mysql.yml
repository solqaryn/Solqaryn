name: V20 C03-04.M05.03 - real MySQL 8.4 incident integration
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/C0304M0503IncidentMySqlPersistenceIntegrationTests.cs'
      - '.github/workflows/v20-c03-04-m05-03-mysql.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c0304-m0503-${{ github.sha }}
  cancel-in-progress: false
jobs:
  mysql:
    name: C03-04.M05.03 - MySQL 8.4 tenant A/B and rollback
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=mysql;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Scope Lock
        run: node scripts/verify-project-scope.mjs
      - name: Require MySQL version 8.4
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION();' | grep -E '^8[.]4[.]'
      - name: Test real MySQL with TRX gate
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --filter 'FullyQualifiedName~C0304M0503IncidentMySqlPersistenceIntegrationTests&Category=Integration' --logger 'trx;LogFileName=c0304-m0503.trx' --logger 'console;verbosity=normal'
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths=list(Path('tests/Solqaryn.Tests/TestResults').rglob('c0304-m0503.trx'))
          assert paths, 'TRX missing'
          root=ET.parse(paths[-1]).getroot()
          c=next((e.attrib for e in root.iter() if e.tag.endswith('Counters')),None)
          assert c and int(c['executed'])>=3 and int(c['passed'])>=3, c
          assert int(c['failed'])==0 and int(c['notExecuted'])==0, c
          print('C0304_M0503_MYSQL84_REAL_INTEGRATION_PASS=TRUE')
          PY
