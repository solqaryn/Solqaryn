# Canonical read-only PROD snapshot after completed historical migration
name: PROD - Read-only canonical database snapshot

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-readonly-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: PROD
    env:
      DB_HOST: ${{ vars.SOLQARYN_PROD_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_PROD_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_PROD_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_PROD_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_PROD_DB_PASSWORD }}
    steps:
      - name: Instalar cliente MySQL y DNS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client dnsutils

      - name: Inventario SQL solo lectura
        shell: bash
        run: |
          set -euo pipefail
          test "$DB_NAME" = "solqaryn_prod"
          test "$DB_USER" = "solqaryn_prod_user"
          test -n "$DB_HOST"
          test -n "$DB_PORT"
          test -n "$DB_PASSWORD"
          export MYSQL_PWD="$DB_PASSWORD"

          connect_host="$DB_HOST"
          if ! getent ahostsv4 "$DB_HOST" >/dev/null 2>&1; then
            fallback_ip="$(dig +short A "$DB_HOST" @1.1.1.1 | grep -E '^[0-9]+([.][0-9]+){3}$' | head -n 1 || true)"
            test -n "$fallback_ip"
            connect_host="$fallback_ip"
            echo "PROD_DB_DNS_FALLBACK=USED"
          else
            echo "PROD_DB_DNS_FALLBACK=NOT_NEEDED"
          fi

          mysql_cmd=(mysql --protocol=TCP -h "$connect_host" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" --batch --skip-column-names)

          database="$("${mysql_cmd[@]}" -e "SET SESSION TRANSACTION READ ONLY; START TRANSACTION READ ONLY; SELECT DATABASE(); COMMIT;")"
          test "$database" = "solqaryn_prod"

          tables="$("${mysql_cmd[@]}" -e "SET SESSION TRANSACTION READ ONLY; START TRANSACTION READ ONLY; SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE'; COMMIT;")"

          count_if_table_exists() {
            local table="$1"
            local exists
            exists="$("${mysql_cmd[@]}" -e "SET SESSION TRANSACTION READ ONLY; START TRANSACTION READ ONLY; SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='${table}'; COMMIT;")"
            if [ "$exists" = "1" ]; then
              "${mysql_cmd[@]}" -e "SET SESSION TRANSACTION READ ONLY; START TRANSACTION READ ONLY; SELECT COUNT(*) FROM \`${table}\`; COMMIT;"
            else
              printf '0\n'
            fi
          }

          migrations="$(count_if_table_exists '__EFMigrationsHistory')"
          empresas="$(count_if_table_exists 'Empresas')"
          productos="$(count_if_table_exists 'Productos')"
          usuarios="$(count_if_table_exists 'Usuarios')"

          echo "PROD_DB=solqaryn_prod"
          echo "PROD_BASE_TABLES=$tables"
          echo "PROD_EF_MIGRATIONS=$migrations"
          echo "PROD_EMPRESAS=$empresas"
          echo "PROD_PRODUCTOS=$productos"
          echo "PROD_USUARIOS=$usuarios"
          echo "PROD_READ_ONLY_PREFLIGHT=PASS"
          echo "PROD_WRITES=0"
