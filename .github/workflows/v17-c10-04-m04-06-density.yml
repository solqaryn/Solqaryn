name: V17 - C10-04.M04.06 density progressive Chromium
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v17-c10-04-m04-06-density.yml'
      - 'frontend/e2e/c10-04-m04-06-density-progressive.spec.ts'
      - 'frontend/src/app/features/plataforma/continuidad-operativa-v5.component.ts'
      - 'frontend/src/app/features/plataforma/continuidad-presentacion-v5.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v17-c10-04-m04-06-${{ github.sha }}
  cancel-in-progress: false
jobs:
  density-progressive:
    name: C10-04.M04.06 - Angular Chromium density and progressive load
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm pinned
        run: npm install --global npm@11.19.0
      - name: dependencies
        run: npm ci
      - name: Angular lint and production build
        run: |
          npm run lint
          npm run build:prod
      - name: Chromium install
        run: npx playwright install --with-deps chromium
      - name: Start isolated Angular localhost
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c10-04-m04-06-density.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c10-04-m04-06-density.log >&2
          exit 1
      - name: Five Chromium responsive progressive denial tests
        run: npx playwright test e2e/c10-04-m04-06-density-progressive.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c10-04-m04-06-density
          path: |
            frontend/c10-04-m04-06-density.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
