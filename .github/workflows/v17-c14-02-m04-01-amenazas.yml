name: V17 C14-02.M04.01-M04.03 - estados privados de amenazas
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v17-c14-02-m04-01-amenazas.yml'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/src/app/features/plataforma/revision-amenazas-v5.component.ts'
      - 'frontend/src/app/features/plataforma/revision-amenazas-v5.component.spec.ts'
      - 'frontend/e2e/c14-02-m04-01-amenazas.spec.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v17-c1402-m0401-${{ github.sha }}
  cancel-in-progress: false
jobs:
  threats-ui:
    name: C14-02.M04.01-M04.03 - Vitest y Chromium de amenazas
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm fijo
        run: npm install --global npm@11.19.0
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Doce Vitest de guard, estados y presentación
        working-directory: frontend
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/revision-amenazas-v5.component.spec.ts
      - name: Lint y build
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Iniciar app sin servicios reales
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > v17-c1402-m0401.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat v17-c1402-m0401.log >&2
          exit 1
      - name: Seis Chromium sintéticos de acceso, errores y presentación
        working-directory: frontend
        run: npx playwright test e2e/c14-02-m04-01-amenazas.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Artefactos de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-c1402-m0401
          path: |
            frontend/v17-c1402-m0401.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
