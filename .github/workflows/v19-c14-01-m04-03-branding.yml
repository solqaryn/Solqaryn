name: V19 C14-01.M04.03 - Branding dinamico y aislamiento
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/services/empresa-identidad.c14-01-m04-03.spec.ts'
      - '.github/workflows/v19-c14-01-m04-03-branding.yml'
      - 'frontend/src/app/services/empresa-identidad.service.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c14-01-m04-03-${{ github.sha }}
  cancel-in-progress: false
jobs:
  branding:
    name: V19 C14-01.M04.03 - Cinco casos branding Angular
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Cinco regresiones de branding
        run: npm test -- --no-watch --no-progress --include=src/app/services/empresa-identidad.c14-01-m04-03.spec.ts
      - name: Tipado, lint y build
        run: |
          npm run lint
          npm run build:prod
