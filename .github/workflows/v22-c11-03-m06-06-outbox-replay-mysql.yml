name: V22 C11-03.M06.06 - outbox replay/order partial failure MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/C1103M0606ReplayOrderMysql84Tests.cs'
      - 'backend/tests/Solqaryn.Tests/C1103M0606ClaimBatchPreflightTests.cs'
      - 'backend/src/Infrastructure/Repositories/C1103OutboxIsolatedRelayWorker.cs'
      - '.github/workflows/v22-c11-03-m06-06-outbox-replay-mysql.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c1103-m0606-${{ github.sha }}
  cancel-in-progress: false
jobs:
  replay:
    name: C11-03.M06.06 - real Oracle EF MySQL 8.4 replay/rollback boundary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=c1103_m0606_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify Scope Lock
        run: node scripts/verify-project-scope.mjs
      - name: Verify physical MySQL 8.4
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION();' | grep -E '^8[.]4[.]'
      - name: Build Release and run both real replay and overflow MySQL integration tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet build backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-restore
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~C1103M0606ReplayOrderMysql84Tests&Category=Integration' --logger 'trx;LogFileName=c1103-m0606-replay.trx'
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          paths=list(Path('backend/tests/Solqaryn.Tests').rglob('c1103-m0606-replay.trx'))
          if len(paths)!=1: raise SystemExit('C1103_M0606_TRX_MISSING_OR_DUPLICATE')
          root=ET.parse(paths[0]).getroot()
          counters=next((e.attrib for e in root.iter() if e.tag.endswith('Counters')),None)
          if counters is None: raise SystemExit('C1103_M0606_NO_COUNTERS')
          counts={k:int(counters.get(k,-1)) for k in ('total','passed','failed','notExecuted')}
          print('C1103_M0606_REAL_ORACLE_EF_MYSQL84',counts)
          if counts!={'total':2,'passed':2,'failed':0,'notExecuted':0}:
              raise SystemExit('C1103_M0606_NOT_VERIFIED')
          PY
      - name: Verify fail-closed batch and uncertain SQL ACK adversarial xUnit
        shell: bash
        run: |
          set -euo pipefail
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~C1103M0606ClaimBatchPreflightTests' --logger 'trx;LogFileName=c1103-m0606-adversarial.trx'
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path('backend/tests/Solqaryn.Tests').rglob('c1103-m0606-adversarial.trx'))
          if len(files)!=1: raise SystemExit('C1103_M0606_ADVERSARIAL_TRX_MISSING')
          root=ET.parse(files[0]).getroot()
          counters=next((e.attrib for e in root.iter() if e.tag.endswith('Counters')),None)
          if counters is None: raise SystemExit('C1103_M0606_ADVERSARIAL_NO_COUNTERS')
          result={k:int(counters.get(k,-1)) for k in ('total','passed','failed','notExecuted')}
          print('C1103_M0606_ADVERSARIAL',result)
          if result!={'total':6,'passed':6,'failed':0,'notExecuted':0}:
              raise SystemExit('C1103_M0606_ADVERSARIAL_NOT_VERIFIED')
          PY
