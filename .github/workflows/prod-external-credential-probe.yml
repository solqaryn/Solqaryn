name: PROD - External credential availability probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-external-credential-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: PROD
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SOLQARYN_VERCEL_TOKEN: ${{ secrets.SOLQARYN_VERCEL_TOKEN }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      SOLQARYN_PROD_CLOUDINARY_CLOUD_NAME: ${{ secrets.SOLQARYN_PROD_CLOUDINARY_CLOUD_NAME }}
      SOLQARYN_PROD_CLOUDINARY_API_KEY: ${{ secrets.SOLQARYN_PROD_CLOUDINARY_API_KEY }}
      SOLQARYN_PROD_CLOUDINARY_API_SECRET: ${{ secrets.SOLQARYN_PROD_CLOUDINARY_API_SECRET }}
      SOLQARYN_PROD_SMTP_OAUTH2_REFRESH_TOKEN: ${{ secrets.SOLQARYN_PROD_SMTP_OAUTH2_REFRESH_TOKEN }}
      SMTP_OAUTH2_REFRESH_TOKEN: ${{ secrets.SMTP_OAUTH2_REFRESH_TOKEN }}
      SOLQARYN_PROD_BACKUP_PASSPHRASE: ${{ secrets.SOLQARYN_PROD_BACKUP_PASSPHRASE }}
    steps:
      - name: Report names-only availability
        shell: bash
        run: |
          set -euo pipefail
          check() { if [ -n "${!1:-}" ]; then echo "$1=PRESENT"; else echo "$1=ABSENT"; fi; }
          for name in VERCEL_TOKEN SOLQARYN_VERCEL_TOKEN CLOUDINARY_URL CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET SOLQARYN_PROD_CLOUDINARY_CLOUD_NAME SOLQARYN_PROD_CLOUDINARY_API_KEY SOLQARYN_PROD_CLOUDINARY_API_SECRET SOLQARYN_PROD_SMTP_OAUTH2_REFRESH_TOKEN SMTP_OAUTH2_REFRESH_TOKEN SOLQARYN_PROD_BACKUP_PASSPHRASE; do
            check "$name"
          done
          echo "SECRET_VALUES_PRINTED=FALSE"
