name: V22 C15-02.M05.06 - regresion rendimiento accesibilidad Chromium
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c15-02-m05-06-regression-perf-a11y.spec.ts'
      - 'frontend/src/app/features/plataforma/c15-02-m04-01-revision-arquitectura.component.ts'
      - '.github/workflows/v22-c15-02-m05-06-regression-perf-a11y.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c1502-m0506-${{ github.sha }}
  cancel-in-progress: false
jobs:
  regression:
    name: C15-02.M05.06 - 3 Playwright Chromium reales en GitHub-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
      - name: Node 24.21
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm 11 fijado
        run: npm install --global npm@11.19.0
      - name: Instalar dependencias fijadas
        run: npm ci
      - name: Tipado lint y build Angular produccion solo compilacion
        run: |
          npm run lint
          npm run build:prod
      - name: Instalar Chromium efimero
        run: npx playwright install --with-deps chromium
      - name: Angular dev solo loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c1502m0506-angular.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then
              echo 'ANGULAR_LOOPBACK_READY=PASS'
              exit 0
            fi
            sleep 2
          done
          cat c1502m0506-angular.log >&2
          exit 1
      - name: Ejecutar tres pruebas reales con Playwright Chromium sin reintentos
        run: npx playwright test e2e/c15-02-m05-06-regression-perf-a11y.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Evidencia y reportes de laboratorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-c1502-m0506-chromium-regression
          path: |
            frontend/c1502m0506-angular.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
