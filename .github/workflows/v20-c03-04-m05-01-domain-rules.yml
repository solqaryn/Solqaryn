name: V20 C03-04.M05.01 - incident continuity domain rules
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Domain/C0304M0501IncidentContinuityRuleTests.cs'
      - 'backend/src/Domain/AutomationV5/V5ContinuityIncidentDomainRules.cs'
      - '.github/workflows/v20-c03-04-m05-01-domain-rules.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c0304-m0501-${{ github.sha }}
  cancel-in-progress: false
jobs:
  incident-rules:
    name: C03-04.M05.01 - real incident domain xUnit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Strict Scope Lock
        run: node scripts/verify-project-scope.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restore and build .NET 10 Release
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln -c Release --no-restore
      - name: Real incident xUnit and TRX counts
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~C0304M0501IncidentContinuityRuleTests' --logger 'trx;LogFileName=c0304-m0501-domain.trx' --logger 'console;verbosity=normal'
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          paths=glob.glob('tests/Solqaryn.Tests/TestResults/**/c0304-m0501-domain.trx',recursive=True)
          assert len(paths)==1, f'exactly one TRX required: {len(paths)}'
          root=ET.parse(paths[0]).getroot()
          node=next((x for x in root.iter() if x.tag.endswith('}Counters') or x.tag=='Counters'),None)
          assert node is not None
          c=node.attrib
          print('C03-04.M05.01',c)
          assert int(c.get('executed','0'))>=20
          assert int(c.get('failed','-1'))==0
          assert int(c.get('error','-1'))==0
          assert int(c.get('notExecuted','-1'))==0
          PY
      - name: Preserve TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c03-04-m05-01-domain-xunit-trx
          path: backend/tests/Solqaryn.Tests/TestResults/**/c0304-m0501-domain.trx
          if-no-files-found: error
          retention-days: 14
