name: DEV - Certificación funcional final

on:
  push:
    branches: [dev]
    paths:
      - .github/checkpoints/dev-final-functional-certification
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - .github/workflows/dev-final-functional-certification.yml
      - scripts/ci/verify_dev_final_tenant_identity.py
      - scripts/ci/test_verify_dev_final_tenant_identity.py
      - scripts/ci/verify_dev_catalog_gate.py
      - scripts/ci/test_verify_dev_catalog_gate.py

permissions:
  contents: read

jobs:
  contract-tests:
    name: Contrato DEV tenant identity A/B (sin infraestructura)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Positivos y negativos del contrato fail-closed
        run: |
          python3 -m unittest discover -s scripts/ci -p 'test_verify_dev_final_tenant_identity.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_verify_dev_catalog_gate.py' -v

      - name: Clasificar catálogo público DEV (observación sin secretos, NO certificación)
        shell: bash
        env:
          FRONTEND: https://solqaryn-dev.vercel.app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts/ci")
          import verify_dev_catalog_gate as gate

          try:
              status, payload = gate.get_json(gate.FRONTEND + "/api/tienda/categorias", "CATEGORIES")
              cats = gate.categories_from_response(status, payload)
              print("DEV_PR_CATEGORIES_SHAPE=PASS count=" + str(len(cats)))
              status, payload = gate.get_json(
                  gate.FRONTEND + "/api/tienda/productos?pagina=1&tamano=100", "PRODUCTS")
              products = gate.products_from_response(status, payload)
              print("DEV_PR_PRODUCTS_SHAPE=PASS count=" + str(len(products)))
              images = gate.images_from_products(products)
              print("DEV_PR_CLOUDINARY_NAMESPACE=PASS count=" + str(len(images)))
          except gate.GateError as error:
              print("DEV_PR_CATALOG_OBSERVATION=" + str(error))
          print("DEV_PR_CATALOG_CERTIFICATION=NOT_PERFORMED")
          print("DEV_PR_IMAGE_HTTP=NOT_EXECUTED")
          PY

  certify:
    if: github.event_name != 'pull_request'
    name: Certificar DEV canónico extremo a extremo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: DEV
    env:
      FRONTEND: https://solqaryn-dev.vercel.app
      BACKEND: https://solqaryn-api-dev-fxx8.onrender.com
      DB_HOST: ${{ vars.SOLQARYN_DEV_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_DEV_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_DEV_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_DEV_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_DEV_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Instalar utilidades
        run: sudo apt-get update && sudo apt-get install -y mysql-client jq

      - name: Esperar readiness API DEV y proxy Vercel tras cold start Render Free
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            if curl --fail --silent --connect-timeout 5 --max-time 12 "$BACKEND/health/ready" -o "$RUNNER_TEMP/dev-direct-ready.json" &&
               jq -e '.status == "ready" and .database == "connected"' "$RUNNER_TEMP/dev-direct-ready.json" >/dev/null &&
               curl --fail --silent --connect-timeout 5 --max-time 12 "$FRONTEND/api/health/ready" -o "$RUNNER_TEMP/dev-proxy-ready.json" &&
               jq -e '.status == "ready" and .database == "connected"' "$RUNNER_TEMP/dev-proxy-ready.json" >/dev/null; then
              echo "DEV_RENDER_FREE_COLD_START_RECOVERED=PASS attempts=$attempt"
              exit 0
            fi
            if [ "$attempt" -eq 36 ]; then
              echo "DEV_RENDER_FREE_COLD_START=FAIL: API directa y proxy DEV no recuperaron readiness dentro del límite; sin certificación." >&2
              exit 1
            fi
            sleep 5
          done

      - name: Rutas y branding HTTP
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --fail --silent --show-error "$FRONTEND/login" -o "$RUNNER_TEMP/login.html"
          curl --retry 3 --fail --silent --show-error "$FRONTEND/dashboard" -o "$RUNNER_TEMP/dashboard.html"
          curl --retry 3 --fail --silent --show-error "$FRONTEND/tienda" -o "$RUNNER_TEMP/storefront.html"
          curl --retry 3 --fail --silent --show-error "$FRONTEND/tienda/productos" -o "$RUNNER_TEMP/products-page.html"
          grep -qi "SOLQARYN" "$RUNNER_TEMP/login.html"
          grep -qi "SOLQARYN" "$RUNNER_TEMP/dashboard.html"
          ! grep -qi "identidad-retirada-dev" "$RUNNER_TEMP/login.html"
          ! grep -qi "identidad-retirada-mysql-identidad-retirada.c.aivencloud.com" "$RUNNER_TEMP/login.html"
          echo "HTTP_ROUTE_CHECK=PASS"

      - name: Diagnóstico causal HTTP 503 y CORS DEV (solo observación)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$RUNNER_TEMP/solqaryn-causal-probe"
          mkdir -p "$probe_dir"

          ready_code="$(curl --silent --show-error --connect-timeout 8 --max-time 20 \
            --dump-header "$probe_dir/ready.headers" --output "$probe_dir/ready.body" \
            --write-out '%{http_code}' "$BACKEND/health/ready")" || ready_code="TRANSPORT_ERROR"
          echo "DEV_READY_HTTP=$ready_code"
          if [ "$ready_code" = "200" ] &&
             jq -e '.status == "ready" and .database == "connected"' "$probe_dir/ready.body" >/dev/null 2>&1; then
            echo "DEV_READY_DB=CONNECTED"
          elif jq -e '.status == "not_ready" and .database == "unavailable"' "$probe_dir/ready.body" >/dev/null 2>&1; then
            echo "DEV_READY_DB=UNAVAILABLE"
          else
            echo "DEV_READY_DB=UNCLASSIFIED"
          fi

          for source in backend proxy; do
            if [ "$source" = "backend" ]; then
              target="$BACKEND/empresa-configuracion/publica"
            else
              target="$FRONTEND/api/empresa-configuracion/publica"
            fi
            response_code="$(curl --silent --show-error --connect-timeout 8 --max-time 25 \
              --dump-header "$probe_dir/$source.headers" --output "$probe_dir/$source.body" \
              --write-out '%{http_code}' "$target")" || response_code="TRANSPORT_ERROR"
            printf 'DEV_PUBLIC_%s_HTTP=%s\n' "$source" "$response_code"
            if [ "$response_code" = "503" ]; then
              if jq -e '.code == "TENANT_DATA_ISOLATION_REQUIRED"' "$probe_dir/$source.body" >/dev/null 2>&1; then
                printf 'DEV_PUBLIC_%s_503_CLASS=TENANT_GUARD\n' "$source"
              elif jq -e '.title == "Servicio temporalmente en mantenimiento"' "$probe_dir/$source.body" >/dev/null 2>&1; then
                printf 'DEV_PUBLIC_%s_503_CLASS=MAINTENANCE\n' "$source"
              else
                printf 'DEV_PUBLIC_%s_503_CLASS=UNCLASSIFIED\n' "$source"
              fi
              if grep -Eqi '^retry-after:[[:space:]]*300([[:space:]]|$)' "$probe_dir/$source.headers"; then
                printf 'DEV_PUBLIC_%s_RETRY_AFTER_300=PRESENT\n' "$source"
              else
                printf 'DEV_PUBLIC_%s_RETRY_AFTER_300=ABSENT\n' "$source"
              fi
            fi
          done

          for case_name in allowed denied; do
            if [ "$case_name" = "allowed" ]; then
              origin="$FRONTEND"
            else
              origin="https://untrusted.invalid"
            fi
            cors_code="$(curl --silent --show-error --connect-timeout 8 --max-time 20 \
              --request OPTIONS --header "Origin: $origin" \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type' \
              --dump-header "$probe_dir/$case_name.headers" --output /dev/null \
              --write-out '%{http_code}' "$BACKEND/auth/login")" || cors_code="TRANSPORT_ERROR"
            printf 'DEV_CORS_%s_HTTP=%s\n' "$case_name" "$cors_code"
            if tr -d '\r' < "$probe_dir/$case_name.headers" | grep -Fxi "access-control-allow-origin: $origin" >/dev/null; then
              printf 'DEV_CORS_%s_ALLOW_ORIGIN=MATCH\n' "$case_name"
            else
              printf 'DEV_CORS_%s_ALLOW_ORIGIN=ABSENT_OR_DIFFERENT\n' "$case_name"
            fi
            if [ "$case_name" = "allowed" ]; then
              if [ "$cors_code" != "204" ] ||
                 ! tr -d '\r' < "$probe_dir/$case_name.headers" |
                   grep -Fxi "access-control-allow-origin: $origin" >/dev/null; then
                echo "::error title=DEV CORS::ALLOWED_ORIGIN_PREFLIGHT_NOT_CERTIFIED"
                exit 1
              fi
            else
              if [ "$cors_code" != "204" ] ||
                 tr -d '\r' < "$probe_dir/$case_name.headers" |
                   grep -Eqi '^access-control-allow-origin:'; then
                echo "::error title=DEV CORS::DENIED_ORIGIN_EXPOSED"
                exit 1
              fi
            fi
          done
          echo "DEV_CORS_ALLOWED_DENIED=PASS"
          echo "DEV_CAUSAL_PROBE=OBSERVATION_ONLY_NOT_CERTIFICATION"

      - name: Identidad pública DEV tenant-bound (positivo A/B y negativos)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/ci -p 'test_verify_dev_final_tenant_identity.py' -v
          python3 scripts/ci/verify_dev_final_tenant_identity.py

      # El catálogo legacy sólo se acepta con datos auténticos y contexto
      # empresarial verificado. No silenciar la cuarentena 503 ni fabricar
      # datos o imágenes. Emitir un código de diagnóstico sin mostrar PII.
      - name: Catálogo, productos e imágenes DEV (requiere contrato comercial seguro)
        id: catalog_gate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/verify_dev_catalog_gate.py

      # Solo cuando el gate anterior falla: contraste de estados en DEV
      # mediante SELECT agregado. No listar, atribuir, restaurar ni crear
      # categorías/productos. Es observabilidad, no certificación ni bypass.
      - name: Clasificar disponibilidad de categorías DEV (SQL agregado, sin PII)
        if: ${{ !cancelled() && steps.catalog_gate.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${DB_NAME:-}" != "solqaryn_dev" ] ||
             [ "${DB_HOST:-}" != "solqaryn-mysql-solqaryn.h.aivencloud.com" ] ||
             [ "${DB_PORT:-}" != "14402" ] ||
             [ "${DB_USER:-}" != "solqaryn_dev_user" ]; then
            echo "DEV_CATALOG_DB_STATE=DEV_DB_SCOPE_NOT_VERIFIED"
            exit 0
          fi
          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "DEV_CATALOG_DB_STATE=DEV_DB_SECRET_NOT_AVAILABLE"
            exit 0
          fi
          export MYSQL_PWD="$DB_PASSWORD"
          # Query fija, exclusivamente SELECT y sin valores empresariales.
          counts="$(mysql --protocol=TCP --ssl-mode=REQUIRED \
            -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" \
            --batch --skip-column-names --raw "$DB_NAME" \
            -e 'SELECT COUNT(*), COALESCE(SUM(Activa=1),0), COALESCE(SUM(Activa=1 AND Eliminada=0),0) FROM Categorias;' \
            2>/dev/null)" || {
            echo "DEV_CATALOG_DB_STATE=READ_ONLY_QUERY_UNAVAILABLE"
            exit 0
          }
          read -r total active active_not_deleted <<< "$counts"
          for count in "$total" "$active" "$active_not_deleted"; do
            case "$count" in
              ''|*[!0-9]*) echo "DEV_CATALOG_DB_STATE=INVALID_AGGREGATE_RESPONSE"; exit 0 ;;
            esac
          done
          if [ "$total" -eq 0 ]; then
            echo "DEV_CATALOG_DB_STATE=NO_CATEGORY_RECORDS"
          elif [ "$active" -eq 0 ]; then
            echo "DEV_CATALOG_DB_STATE=ALL_CATEGORIES_INACTIVE"
          elif [ "$active_not_deleted" -eq 0 ]; then
            echo "DEV_CATALOG_DB_STATE=ACTIVE_BUT_SOFT_DELETED"
          else
            echo "DEV_CATALOG_DB_STATE=GLOBAL_ACTIVE_CATEGORIES_PRESENT_PUBLIC_OWNER_UNPROVEN"
          fi
          echo "DEV_CATALOG_SQL_READBACK=SELECT_ONLY_REDACTED"

      - name: Render health
        run: |
          set -euo pipefail
          test "$(curl -sS -o /tmp/health.json -w '%{http_code}' "$BACKEND/health/ready")" = "200"
          echo "RENDER_HEALTH=PASS"

      - name: HTTP cache y ETag bootstrap
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/bootstrap.headers"
          trap 'echo "::group::bootstrap response headers"; cat "$headers" 2>/dev/null || true; echo "::endgroup::"' ERR
          curl --retry 3 --fail --silent --show-error -D "$headers" -o /dev/null "$BACKEND/tienda/bootstrap"
          normalized="$headers.normalized"
          tr -d '\r' < "$headers" > "$normalized"
          grep -Eqi '^cache-control:[[:space:]]*public, max-age=15, s-maxage=30, stale-while-revalidate=60$' "$normalized"
          etag="$(awk -F': ' 'tolower($1)=="etag"{print $2}' "$normalized" | tail -n 1)"
          test -n "$etag"
          code="$(curl --retry 3 --silent --show-error -o /dev/null -w '%{http_code}' -H "If-None-Match: $etag" "$BACKEND/tienda/bootstrap")"
          test "$code" = "304"
          echo "HTTP_BOOTSTRAP_CACHE_ETAG=PASS"

      - name: HTTP cache y ETag productos
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/products.headers"
          trap 'echo "::group::products response headers"; cat "$headers" 2>/dev/null || true; echo "::endgroup::"' ERR
          curl --retry 3 --fail --silent --show-error -D "$headers" -o /dev/null "$BACKEND/tienda/productos?page=1&pageSize=24"
          normalized="$headers.normalized"
          tr -d '\r' < "$headers" > "$normalized"
          grep -Eqi '^cache-control:[[:space:]]*public, max-age=5, s-maxage=15, must-revalidate$' "$normalized"
          grep -Eqi '^etag:[[:space:]]*W/"[0-9a-f]{64}"$' "$normalized"
          echo "HTTP_PRODUCTS_CACHE_ETAG=PASS"

      - name: Compresión Brotli
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/bootstrap-br.headers"
          trap 'echo "::group::brotli response headers"; cat "$headers" 2>/dev/null || true; echo "::endgroup::"' ERR
          curl --retry 3 --fail --silent --show-error -D "$headers" -o /dev/null -H 'Accept-Encoding: br' "$BACKEND/tienda/bootstrap"
          normalized="$headers.normalized"
          tr -d '\r' < "$headers" > "$normalized"
          grep -Eqi '^content-encoding:[[:space:]]*br$' "$normalized"
          grep -Eqi '^vary:.*Accept-Encoding' "$normalized"
          echo "HTTP_BROTLI=PASS"

      - name: Compresión Gzip
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/bootstrap-gzip.headers"
          trap 'echo "::group::gzip response headers"; cat "$headers" 2>/dev/null || true; echo "::endgroup::"' ERR
          curl --retry 3 --fail --silent --show-error -D "$headers" -o /dev/null -H 'Accept-Encoding: gzip' "$BACKEND/tienda/bootstrap"
          normalized="$headers.normalized"
          tr -d '\r' < "$headers" > "$normalized"
          grep -Eqi '^content-encoding:[[:space:]]*gzip$' "$normalized"
          echo "HTTP_GZIP=PASS"

      - name: No-store ruta no allowlisted
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/health.headers"
          trap 'echo "::group::health response headers"; cat "$headers" 2>/dev/null || true; echo "::endgroup::"' ERR
          curl --retry 3 --fail --silent --show-error -D "$headers" -o /dev/null "$BACKEND/health"
          normalized="$headers.normalized"
          tr -d '\r' < "$headers" > "$normalized"
          grep -Eqi '^cache-control:[[:space:]]*private, no-store, max-age=0$' "$normalized"
          ! grep -Eqi '^etag:' "$normalized"
          echo "HTTP_NOSTORE_DEFAULT=PASS"

      - name: No-store request con Authorization
        shell: bash
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/auth.headers"
          trap 'echo "::group::authorized response headers"; cat "$headers" 2>/dev/null || true; echo "::endgroup::"' ERR
          curl --retry 3 --fail --silent --show-error -D "$headers" -o /dev/null -H 'Authorization: Bearer runtime-probe' "$BACKEND/tienda/bootstrap"
          normalized="$headers.normalized"
          tr -d '\r' < "$headers" > "$normalized"
          grep -Eqi '^cache-control:[[:space:]]*private, no-store, max-age=0$' "$normalized"
          ! grep -Eqi '^etag:' "$normalized"
          echo "HTTP_NOSTORE_AUTH=PASS"

      - name: Escritura/lectura efímera en solqaryn_dev
        shell: bash
        run: |
          set -euo pipefail
          test "$DB_NAME" = "solqaryn_dev"
          export MYSQL_PWD="$DB_PASSWORD"
          marker="final-cert-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          readback="$(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED "$DB_NAME" --batch --skip-column-names <<SQL
          CREATE TEMPORARY TABLE _solqaryn_dev_final_probe (id VARCHAR(128) PRIMARY KEY, created_at DATETIME(6) NOT NULL);
          INSERT INTO _solqaryn_dev_final_probe(id,created_at) VALUES ('$marker',UTC_TIMESTAMP(6));
          SELECT id FROM _solqaryn_dev_final_probe WHERE id='$marker';
          DROP TEMPORARY TABLE _solqaryn_dev_final_probe;
          SQL
          )"
          test "$readback" = "$marker"
          echo "DB_TEMP_WRITE_READ=PASS"

      - name: Cero referencias operativas legacy en runtime
        run: node scripts/verify-project-scope.mjs

      - name: Resumen
        run: |
          echo "FINAL_DEV_CERTIFICATION=PASS"
          echo "PRODUCTION_TOUCHED=FALSE"
