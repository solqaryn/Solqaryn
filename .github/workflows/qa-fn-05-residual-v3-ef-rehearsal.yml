name: QA - FN-05 V3 migracion EF exacta

on:
  push:
    branches: [qa]
    paths:
      - '.github/workflows/qa-fn-05-residual-v3-ef-rehearsal.yml'
      - '.github/qa/qa-commercial-v3-ef-verify.py'
      - '.github/qa/qa-commercial-v3-ef-manifest.json'
      - 'backend/src/Infrastructure.Migrations/Migrations/20261126223000_QaCommercialOwnershipV3.cs'
      - 'backend/src/Infrastructure/Persistence/QaCommercialOwnershipV3.cs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-fn-05-live-admin
  cancel-in-progress: false

jobs:
  verify-restore:
    if: github.repository == 'solqaryn/Solqaryn' && github.ref_name == 'qa'
    name: QA backup read-only, restore, exact EF migration V3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: QA
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: solqaryn-ci-qa-disposable-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psolqaryn-ci-qa-disposable-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: ${{ vars.SOLQARYN_QA_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_QA_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_QA_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_QA_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_QA_DB_PASSWORD }}
      BACKUP_PASSPHRASE: ${{ secrets.SOLQARYN_QA_BACKUP_PASSPHRASE }}
    steps:
      - name: Checkout QA (identidad)
        uses: actions/checkout@v4

      - name: Guard QA solo Aiven 8.4.11 y secretos
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "qa"
          python3 -m py_compile .github/qa/qa-commercial-v3-ef-verify.py
          node scripts/verify-project-scope.mjs
          test "$DB_HOST" = "solqaryn-mysql-solqaryn.h.aivencloud.com"
          test "$DB_PORT" = "14402"
          test "$DB_NAME" = "solqaryn_qa"
          test "$DB_USER" = "solqaryn_qa_user"
          test -n "$DB_PASSWORD" && test -n "$BACKUP_PASSPHRASE"
          echo "QA_BACKUP_SCOPE=PASS"

      - name: Instalar cliente MySQL
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Backup transaccional de QA y cifrado AES-256 (sin dump en artefacto)
        id: backup
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          folder="$RUNNER_TEMP/solqaryn-qa-oracle-backup"
          mkdir -p "$folder"
          dump="$folder/qa.sql"
          enc="$folder/qa.sql.enc"
          trap 'rm -f "$dump"' EXIT
          export MYSQL_PWD="$DB_PASSWORD"
          version="$(mysql --protocol=TCP --ssl-mode=REQUIRED -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --batch --skip-column-names "$DB_NAME" -e 'SELECT VERSION();')"
          case "$version" in 8.4.11|8.4.11-*) ;; *) echo "QA_MYSQL_VERSION_INVALID: se exige 8.4.11; version observada: $version" >&2; exit 1;; esac
          echo "QA_BACKUP_AIVEN_MYSQL_VERSION=$version"
          mysqldump --protocol=TCP --ssl-mode=REQUIRED -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" \
            --single-transaction --skip-lock-tables --no-tablespaces --set-gtid-purged=OFF \
            --routines --triggers "$DB_NAME" > "$dump"
          test -s "$dump"
          sha256sum "$dump" | cut -d' ' -f1 > "$folder/qa-plaintext.sha256"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -pass env:BACKUP_PASSPHRASE -in "$dump" -out "$enc"
          test -s "$enc"
          sha256sum "$enc" > "$folder/qa-encrypted.sha256"
          rm -f "$dump"
          trap - EXIT
          echo "encrypted=$enc" >> "$GITHUB_OUTPUT"
          echo "QA_BACKUP_ENCRYPTED=PASS"
          echo "QA_DATABASE_WRITES=0"

      - name: Restore real del respaldo cifrado en MySQL local efímero
        shell: bash
        env:
          ENCRYPTED_FILE: ${{ steps.backup.outputs.encrypted }}
        run: |
          set -euo pipefail
          test -s "$ENCRYPTED_FILE"
          export MYSQL_PWD=solqaryn-ci-qa-disposable-only
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root \
            -e 'CREATE DATABASE solqaryn_qa_restore_ephemeral CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;'
          # El SQL descifrado fluye directamente a mysql local: no hay fichero SQL en disco.
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -pass env:BACKUP_PASSPHRASE -in "$ENCRYPTED_FILE" |
            mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root solqaryn_qa_restore_ephemeral
          qlocal(){ mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root -Nse "$1" solqaryn_qa_restore_ephemeral; }
          export MYSQL_PWD="$DB_PASSWORD"
          qsource(){ mysql --protocol=TCP --ssl-mode=REQUIRED -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -Nse "$1" "$DB_NAME"; }
          sql="SELECT TABLE_NAME FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE' ORDER BY TABLE_NAME;"
          tables="$(qsource "$sql")"
          count=0
          while IFS= read -r tbl; do
            test -n "$tbl" || continue
            [[ "$tbl" =~ ^[A-Za-z0-9_]+$ ]] || { echo 'QA_RESTORE_TABLE_NAME_INVALID' >&2; exit 1; }
            a="$(qsource "SELECT COUNT(*) FROM \`$tbl\`;")"
            export MYSQL_PWD=solqaryn-ci-qa-disposable-only
            b="$(qlocal "SELECT COUNT(*) FROM \`$tbl\`;")"
            export MYSQL_PWD="$DB_PASSWORD"
            test "$a" = "$b" || { echo 'QA_RESTORE_ROWCOUNT_MISMATCH' >&2; exit 1; }
            count=$((count+1))
          done <<< "$tables"
          export MYSQL_PWD=solqaryn-ci-qa-disposable-only
          marker="$(qlocal "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")"
          gallery_marker="$(qlocal "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261125212000_CategoriasGalerias';")"
          gallery_table="$(qlocal "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='CategoriasGalerias' AND TABLE_TYPE='BASE TABLE';")"
          history="$(qlocal "SELECT COUNT(*) FROM __EFMigrationsHistory;")"
          test "$marker" = "1"
          case "$gallery_marker:$gallery_table:$count:$history" in
            1:1:138:111) ;;
            *) echo 'QA_RESTORE_TABLECOUNT_OR_HISTORY_DRIFT' >&2; exit 1 ;;
          esac
          echo "QA_BACKUP_RESTORE=PASS tables=$count history=$history rows_exact=YES oracle_marker=$marker category_gallery=$gallery_marker"
          echo "QA_ORIGINAL_DB_WRITES=0"


      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Apply exact EF V3 only to disposable loopback copy
        shell: bash
        env:
          LOCAL_MYSQL_PASSWORD: solqaryn-ci-qa-disposable-only
        run: |
          set -euo pipefail
          unset DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD BACKUP_PASSPHRASE
          export ConnectionStrings__DefaultConnection='Server=127.0.0.1;Port=3306;Database=solqaryn_qa_restore_ephemeral;User=root;Password=solqaryn-ci-qa-disposable-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
          python3 .github/qa/qa-commercial-v3-ef-verify.py capture
          pushd backend
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj --startup-project src/API/Solqaryn.API.csproj --context AppDbContext --configuration Release
          dotnet ef database update 20261126223000_QaCommercialOwnershipV3 --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj --startup-project src/API/Solqaryn.API.csproj --context AppDbContext --configuration Release --connection "$ConnectionStrings__DefaultConnection"
          popd
          python3 .github/qa/qa-commercial-v3-ef-verify.py verify
      - name: Remove encrypted temporary backup and fingerprints
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/solqaryn-qa-oracle-backup" "$RUNNER_TEMP/qa-v3-fingerprints.json"
