name: Modernización - Diagnóstico Angular 21 DEV
# diagnostic-rerun-2026-10-03

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/modernization-phase3-angular21-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnóstico no publicador Angular 21
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Baseline
        working-directory: frontend
        run: |
          npm ci
          test "$(node -p "require('./package.json').dependencies['@angular/core']")" = "20.3.33"
      - name: Migrar Core y CLI
        working-directory: frontend
        run: npx ng update @angular/cli@^21 @angular/core@^21
      - name: Migrar Material y CDK
        working-directory: frontend
        run: npx ng update @angular/material@^21 --allow-dirty
      - name: Alinear builder TypeScript y Vitest
        working-directory: frontend
        run: |
          npm install --save-dev typescript@~5.9.3
          npm install --save-dev --save-exact @angular/build@21.2.24 vitest@4.1.11
      - name: Unit tests
        timeout-minutes: 20
        working-directory: frontend
        run: npm test -- --watch=false
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Audit productivo
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Build PROD
        working-directory: frontend
        run: npm run build:prod
