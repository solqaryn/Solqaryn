name: ERP-N0.4 - Certificación RBAC relacional

on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/**/*RbacN04*.cs'
      - 'backend/src/Infrastructure/Migrations/20260811174745_N0_4_ConsolidarRbacRelacional*.cs'
      - 'backend/tests/Solqaryn.Tests/N04AdministradorSemanticaTests.cs'
      - 'backend/tests/Solqaryn.Tests/N04CatalogoPermisosRuntimeTests.cs'
      - 'backend/tests/Solqaryn.Tests/N04RbacRelacionalTests.cs'
      - 'backend/scripts/*erp-n0-4*'
      - '.github/workflows/erp-n0-4-ci.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/src/**/*RbacN04*.cs'
      - 'backend/src/Infrastructure/Migrations/20260811174745_N0_4_ConsolidarRbacRelacional*.cs'
      - 'backend/tests/Solqaryn.Tests/N04AdministradorSemanticaTests.cs'
      - 'backend/tests/Solqaryn.Tests/N04CatalogoPermisosRuntimeTests.cs'
      - 'backend/tests/Solqaryn.Tests/N04RbacRelacionalTests.cs'
      - 'backend/scripts/*erp-n0-4*'
      - '.github/workflows/erp-n0-4-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: erp-n0-4-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rbac-relacional:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_n04_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=solqaryn_n04_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: ERP-N0-4-CI-Only-Secret-With-More-Than-32-Characters-2026
      Jwt__Issuer: Solqaryn.CI
      Jwt__Audience: Solqaryn.CI.Frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'

      - name: Restaurar, compilar y probar backend
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln -c Release --no-restore -warnaserror
          # N0.4 prueba su contrato causal. La suite .NET completa queda
          # cubierta por los gates globales; no repetir 2.926 pruebas aqui.
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj \
            -c Release --no-build \
            --filter 'FullyQualifiedName~N04|FullyQualifiedName~RolServiceTenantOwnership|FullyQualifiedName~UsuarioTenantRoleOwnership|FullyQualifiedName~TenantRoleOwnershipBackfill|FullyQualifiedName~CommercialTenantReadFilterTests'

      - name: Restaurar EF desde el manifiesto local
        working-directory: backend
        run: |
          dotnet tool restore
          dotnet ef --version

      # N0.3/N0.4 son historia Pomelo retirada de compilacion.
      # El runtime usa exclusivamente Oracle EF10; no ejecutar migraciones
      # excluidas en el backend para simular una certificacion inexistente.
      - name: Comprobar historial EF Oracle canónico (sin legacy)
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "solqaryn/Solqaryn"
          dotnet tool run dotnet-ef migrations list \
            --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext --configuration Release --no-build --no-connect \
            | tee /tmp/n04-oracle-migrations.txt
          grep -Fq "20261006111818_OracleBaseline" /tmp/n04-oracle-migrations.txt
          grep -Fq "20261018200000_TenantRoleOwnershipDeterministicBackfill" /tmp/n04-oracle-migrations.txt
          if grep -Eq '20260811032000_N0_3_|20260811174745_N0_4_' /tmp/n04-oracle-migrations.txt; then
            echo "ERROR: migrations legacy visibles en el ensamblado productivo" >&2
            exit 1
          fi

      - name: Bootstrap Oracle canónico en MySQL efímero
        working-directory: backend
        shell: bash
        env:
          SOLQARYN_DATABASE_BOOTSTRAP_MODE: fresh
        run: |
          set -euo pipefail
          node ../scripts/verify-project-scope.mjs
          test "$GITHUB_REPOSITORY" = "solqaryn/Solqaryn"
          test "$ASPNETCORE_ENVIRONMENT" = "Development"
          # El bootstrap rechaza DB existentes, valida FK/indices y pending=0.
          dotnet run --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj \
            --configuration Release --no-build | tee /tmp/n04-fresh-oracle.txt
          grep -Fq "SOLQARYN_ORACLE_BOOTSTRAP=PASS mode=fresh" /tmp/n04-fresh-oracle.txt
          grep -Fq "pending=0" /tmp/n04-fresh-oracle.txt

      - name: Comprobar RBAC físico y rechazo de grants huérfanos
        shell: bash
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          q() {
            docker exec "$c" mysql -uroot -proot solqaryn_n04_ci --batch --skip-column-names -e "$1"
          }
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")" = "1"
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261018200000_TenantRoleOwnershipDeterministicBackfill';")" = "1"
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId LIKE '20260811%N0_%';")" = "0"
          test "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='Roles' AND column_name IN ('EmpresaId','Ambito','EsSistema','EsAdministrador');")" = "4"
          test "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='RolPermisos' AND column_name IN ('EmpresaId','RolId','PermisoId');")" = "3"
          test "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='Usuarios' AND column_name='RolId';")" = "1"
          test "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='Usuarios' AND column_name='Rol';")" = "0"
          test "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='RolPermisos' AND column_name IN ('Rol','Modulo','Accion','Permitido');")" = "0"
          test "$(q "SELECT COUNT(DISTINCT referenced_table_name) FROM information_schema.key_column_usage WHERE table_schema=DATABASE() AND table_name='RolPermisos' AND referenced_table_name IN ('Roles','Permisos');")" = "2"
          test "$(q "SELECT COUNT(*) FROM information_schema.table_constraints WHERE table_schema=DATABASE() AND table_name='Roles' AND constraint_type='CHECK' AND constraint_name IN ('CK_Roles_Ambito','CK_Roles_Ambito_Empresa');")" = "2"

          # Denegacion real de INSERT en MySQL: nunca aceptar grant sin
          # RolId/PermisoId validos. No usa credenciales ni DB de DEV.
          test "$(q 'SELECT COUNT(*) FROM RolPermisos;')" = "0"
          if docker exec "$c" mysql -uroot -proot solqaryn_n04_ci \
              -e "INSERT INTO RolPermisos (RolId,PermisoId) VALUES (2147483647,2147483647);" \
              >/tmp/n04-invalid-grant.log 2>&1; then
            echo "ERROR: MySQL acepto grant sin rol y permiso validos" >&2
            exit 1
          fi
          grep -Eq 'ERROR 1452|foreign key constraint fails' /tmp/n04-invalid-grant.log
          test "$(q 'SELECT COUNT(*) FROM RolPermisos;')" = "0"
          echo "N04_RBAC_ORACLE=PASS mysql=fresh legacy_columns=0 orphan_grant=DENIED"

      - name: Snapshot EF Oracle actual sin drift
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool run dotnet-ef migrations has-pending-model-changes \
            --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext --configuration Release --no-build
