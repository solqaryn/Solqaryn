name: V19 C01-02.M04.02 - Estados seguros Angular
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/features/plataforma/c01-02-m04-02-capability-states.component*'
      - 'frontend/e2e/c01-02-m04-02-states.spec.ts'
      - 'frontend/src/app/app.routes.ts'
      - '.github/workflows/v19-c01-02-m04-02-states.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c0102-m0402-${{ github.sha }}
  cancel-in-progress: false
jobs:
  estados:
    name: V19 C01-02.M04.02 - TestBed, tipado y build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Npm fijado
        run: npm install --global npm@11.19.0
      - name: Dependencias
        run: npm ci
      - name: TestBed dirigido
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c01-02-m04-02-capability-states.component.spec.ts
      - name: Lint y Angular de produccion
        run: |
          npm run lint
          npm run build:prod
      - name: Chromium efimero
        run: npx playwright install --with-deps chromium
      - name: Angular localhost
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c0102m0402.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c0102m0402.log >&2
          exit 1
      - name: Chromium estados anonimo y denegacion
        run: npx playwright test e2e/c01-02-m04-02-states.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Artefactos Chromium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v19-c01-02-m04-02-chromium
          path: |
            frontend/c0102m0402.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
