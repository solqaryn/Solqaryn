name: V19 C01-02.M04.02 - Estados seguros Angular
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/features/plataforma/c01-02-m04-02-capability-states.component*'
      - 'frontend/src/app/app.routes.ts'
      - '.github/workflows/v19-c01-02-m04-02-states.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c0102-m0402-${{ github.sha }}
  cancel-in-progress: false
jobs:
  estados:
    name: V19 C01-02.M04.02 - TestBed, tipado y build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Npm fijado
        run: npm install --global npm@11.19.0
      - name: Dependencias
        run: npm ci
      - name: TestBed dirigido
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c01-02-m04-02-capability-states.component.spec.ts
      - name: Lint y Angular de produccion
        run: |
          npm run lint
          npm run build:prod
