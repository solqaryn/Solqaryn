name: V22 C02-01.M05.05 - signed JWT HTTP Oracle EF MySQL 8.4 negatives
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/C0201M0505SignedJwtMysqlNegativeTests.cs'
      - '.github/workflows/v22-c02-01-m05-05-adversarial-mysql.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0201-m0505-${{ github.sha }}
  cancel-in-progress: false
jobs:
  negative-tenant:
    name: C02-01.M05.05 - real signed JWT HTTP Oracle EF MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=mysql;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Verify Scope Lock
        run: node scripts/verify-project-scope.mjs
      - name: Verify genuine disposable MySQL 8.4
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION();' | grep -E '^8[.]4[.]'
      - name: Real JWT HTTP EF MySQL 8.4 negative TRX proof
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-restore --filter 'FullyQualifiedName~C0201M0505SignedJwtMysqlNegativeTests&Category=Integration' --logger 'trx;LogFileName=c0201-m0505.trx' --logger 'console;verbosity=normal'
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          files=list(Path('tests/Solqaryn.Tests/TestResults').rglob('c0201-m0505.trx'))
          if len(files)!=1: raise SystemExit('M0505_MISSING_OR_MULTIPLE_TRX')
          counters=next((e.attrib for e in ET.parse(files[0]).getroot().iter() if e.tag.endswith('Counters')),None)
          if counters is None: raise SystemExit('M0505_TRX_COUNTERS_ABSENT')
          result={k:int(counters.get(k,-1)) for k in ('total','passed','failed','notExecuted')}
          print('C0201_M0505_MYSQL84_SIGNED_JWT_HTTP',result)
          if result!={'total':1,'passed':1,'failed':0,'notExecuted':0}: raise SystemExit('M0505_REQUIRED_INTEGRATION_FAILED')
          PY
