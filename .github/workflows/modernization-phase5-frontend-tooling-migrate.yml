name: Modernización - Aplicar Fase 5 Tooling frontend DEV

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/modernization-phase5-frontend-tooling-migrate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modernization-phase5-frontend-tooling-migrate-dev
  cancel-in-progress: true

jobs:
  migrate:
    name: Upgrade Playwright Vitest jsdom en DEV
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Scope y baseline certificado
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-project-scope.mjs
          test -z "$(git status --porcelain)"
          cd frontend
          test "$(node -v)" = "v24.21.0"
          test "$(npm -v)" = "11.19.0"
          npm ci
          test "$(node -p "require('./package.json').dependencies['@angular/core']")" = "22.2.1"
          test "$(node -p "require('./package.json').devDependencies['@angular/cli']")" = "22.2.1"
          test "$(node -p "require('./package.json').devDependencies['@playwright/test']")" = "1.62.1"
          test "$(node -p "require('./package.json').devDependencies['vitest']")" = "4.1.11"
          test "$(node -p "require('./package.json').devDependencies['jsdom']")" = "^29.1.1"
          test "$(node -p "require('./package.json').dependencies['html5-qrcode']")" = "2.3.8"

      - name: Aplicar tooling exacto Fase 5
        timeout-minutes: 12
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev --save-exact \
            @playwright/test@1.63.0 \
            vitest@5.0.3 \
            jsdom@30.1.1
          npm install --save-exact html5-qrcode@2.3.8

      - name: Reinstalación limpia y matriz exacta
        timeout-minutes: 12
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci
          npm run verify:toolchain
          node <<'NODE'
          const p=require('./package.json');
          const expected={
            '@playwright/test':'1.63.0',
            'vitest':'5.0.3',
            'jsdom':'30.1.1',
            'html5-qrcode':'2.3.8',
            '@angular/core':'22.2.1',
            '@angular/cli':'22.2.1',
            'typescript':'6.0.3',
            'rxjs':'7.8.2',
            'tslib':'2.8.1',
            'zone.js':'0.16.3'
          };
          for (const [name,want] of Object.entries(expected)) {
            const got=p.dependencies?.[name] ?? p.devDependencies?.[name];
            if (got !== want) throw new Error(`${name}: expected ${want}, got ${got}`);
          }
          console.log('PHASE5_TOOLING_EXACT_MATRIX=PASS');
          NODE
          test "$(node -p "require('./node_modules/@playwright/test/package.json').version")" = "1.63.0"
          test "$(node -p "require('./node_modules/vitest/package.json').version")" = "5.0.3"
          test "$(node -p "require('./node_modules/jsdom/package.json').version")" = "30.1.1"
          test "$(node -p "require('./node_modules/html5-qrcode/package.json').version")" = "2.3.8"
          npx playwright --version
          npx vitest --version
          npm ls @playwright/test vitest jsdom html5-qrcode --depth=0

      - name: Audit completo y productivo
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Unit tests pre-publicación
        timeout-minutes: 6
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 180s ./node_modules/.bin/ng test --watch=false --no-progress 2>&1 | tee /tmp/phase5-unit.log
          sed -E 's/\x1B\[[0-9;]*[mK]//g' /tmp/phase5-unit.log > /tmp/phase5-unit.clean.log
          grep -Eq 'Test Files[[:space:]]+58 passed.*\(58\)' /tmp/phase5-unit.clean.log
          grep -Eq 'Tests[[:space:]]+217 passed.*\(217\)' /tmp/phase5-unit.clean.log
          ! grep -Eq '([0-9]+ failed|FAIL |Unhandled Error|Unhandled Rejection)' /tmp/phase5-unit.clean.log
          echo 'PHASE5_UNIT_PREPUBLISH=PASS files=58/58 tests=217/217'

      - name: Lint pre-publicación
        working-directory: frontend
        run: npm run lint

      - name: Build production-mode pre-publicación sin deploy
        timeout-minutes: 5
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run build:prod 2>&1 | tee /tmp/phase5-build-prepush.log
          grep -q 'Output location:' /tmp/phase5-build-prepush.log
          ! grep -Eq 'Application bundle generation failed|An unhandled exception occurred' /tmp/phase5-build-prepush.log

      - name: Registrar evidencia y deuda no bloqueante html5-qrcode
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const evidence=[
            '# Modernización — Fase 5 Tooling frontend — 2026-10-04',
            '',
            '## Alcance',
            '',
            '- Repositorio: `solqaryn/Solqaryn`.',
            '- Rama: `dev`.',
            '- Entorno autorizado: DEV exclusivamente.',
            '- QA, `main`, PROD, datos, secretos e infraestructura productiva: fuera de alcance y no modificados.',
            '',
            '## Precondición',
            '',
            '- Fase 4 Angular 22.2.1 certificada exact-head.',
            '- Angular/TypeScript/RxJS/tslib/Zone.js permanecen sin cambios.',
            '',
            '## Matriz aplicada',
            '',
            '- Playwright Test: `1.63.0`.',
            '- Vitest: `5.0.3`.',
            '- jsdom: `30.1.1`.',
            '- html5-qrcode: `2.3.8` (sin cambio).',
            '',
            'La propuesta inicial citaba jsdom `30.0.1`; al ejecutar la fase npm ya publicaba `30.1.1` como estable más reciente. Se adopta `30.1.1` porque la regresión completa la valida y evita certificar una dependencia ya desactualizada.',
            '',
            '## Política html5-qrcode',
            '',
            '`html5-qrcode@2.3.8` continúa siendo la última versión publicada y se mantiene sin cambios funcionales. Su antigüedad se registra como deuda técnica no bloqueante para evaluación futura de mantenimiento, alternativas, compatibilidad de navegador/cámara, seguridad y costo de migración.',
            '',
            '## Gates pre-publicación',
            '',
            '- scope SOLQARYN;',
            '- reinstalación limpia con `npm ci`;',
            '- matriz exacta de versiones;',
            '- audit completo high+;',
            '- audit productivo high+;',
            '- 58/58 archivos + 217/217 unit tests;',
            '- lint/contratos;',
            '- build production-mode sin deploy.',
            '',
            '## Cierre exact-head',
            '',
            'El certifier permanente de Fase 5 exige aceptación Playwright integral DEV 100/100 sobre el mismo HEAD y emite `FASE_5_TOOLING_FRONTEND=PASS`.',
            ''
          ].join('\n');
          fs.writeFileSync('docs/evidencias/modernizacion/FASE_5_TOOLING_FRONTEND_2026-10-04.md',evidence);

          const ac='ARCHITECTURE_CHANGELOG.md';
          let arch=fs.readFileSync(ac,'utf8');
          const archEntry=[
            '## 2026-10-04 — Tooling frontend Fase 5',
            '',
            '- Playwright Test pasa de 1.62.1 a 1.63.0.',
            '- Vitest pasa de 4.1.11 a 5.0.3 sobre el target canónico `@angular/build:unit-test`.',
            '- jsdom pasa de 29.1.1 a 30.1.1; 30.0.1 quedó superado antes de ejecutar la fase.',
            '- html5-qrcode se conserva exactamente en 2.3.8; su mantenibilidad futura queda como deuda no bloqueante y no se sustituye en esta fase.',
            '- Se preservan Angular 22.2.1, TypeScript 6.0.3, RxJS 7.8.2, tslib 2.8.1, Zone.js 0.16.3, Node 24.21.0 y npm 11.19.0.',
            '- Alcance exclusivo dev; QA, main y PROD no se modifican.',
            '',
            ''
          ].join('\n');
          if (!arch.startsWith('## 2026-10-04 — Tooling frontend Fase 5')) fs.writeFileSync(ac,archEntry+arch);

          const ch='CHANGELOG_AI.md';
          let changelog=fs.readFileSync(ch,'utf8');
          const changeEntry=[
            '## 2026-10-04 — Modernización Fase 5 Tooling frontend DEV',
            '',
            '- Playwright Test actualizado 1.62.1 -> 1.63.0.',
            '- Vitest actualizado 4.1.11 -> 5.0.3.',
            '- jsdom actualizado 29.1.1 -> 30.1.1; el 30.0.1 propuesto inicialmente ya no era latest al ejecutar la fase.',
            '- html5-qrcode permanece en 2.3.8; se registra evaluación futura de mantenibilidad sin reemplazo actual.',
            '- Angular 22.2.1 y su matriz asociada se preservan.',
            '- Cierre condicionado a audit completo/productivo, unit 58/58 + 217/217, lint, build y Playwright canónico 100/100 exact-head.',
            '- Alcance exclusivo dev; QA, main y PROD no se modifican.',
            '',
            ''
          ].join('\n');
          if (!changelog.startsWith('## 2026-10-04 — Modernización Fase 5 Tooling frontend DEV')) fs.writeFileSync(ch,changeEntry+changelog);

          const pp='docs/DETALLES_PENDIENTES.md';
          let pending=fs.readFileSync(pp,'utf8');
          pending=pending.replace('Última reconciliación: **2026-10-02**.','Última reconciliación: **2026-10-04**.');
          pending=pending.replace('Los cinco puntos siguientes son los únicos pendientes vigentes conocidos fuera del trabajo normal del roadmap.','Los seis puntos siguientes son los únicos pendientes vigentes conocidos fuera del trabajo normal del roadmap.');
          if (!pending.includes('## 6. Evaluación futura de html5-qrcode')) {
            pending += [
              '',
              '## 6. Evaluación futura de html5-qrcode',
              '',
              '**Estado:** DEUDA TÉCNICA NO BLOQUEANTE / SIN REEMPLAZO ACTUAL',
              '',
              '**Versión vigente:** `html5-qrcode@2.3.8`, última publicación estable disponible al ejecutar Fase 5.',
              '',
              '**Decisión vigente:** mantener la librería sin cambios porque Fase 5 certifica compatibilidad funcional completa y no existe una actualización publicada que aplicar.',
              '',
              '**Motivo de seguimiento:** la ausencia prolongada de nuevas releases justifica evaluar mantenimiento upstream, compatibilidad futura de navegador/cámara, postura de seguridad, alternativas activamente mantenidas y costo/riesgo de migración.',
              '',
              '**Acción actual:** ninguna sustitución ni rediseño del escáner.',
              '',
              '**Se retoma cuando:** exista una incompatibilidad real, una vulnerabilidad relevante, un cambio de APIs web/cámara o una alternativa claramente superior que justifique migración controlada.',
              '',
              '**Al retomar, validar:** contratos de escaneo, permisos de cámara, dispositivos móviles, códigos QR/barra soportados, accesibilidad, rendimiento, privacidad, bundle y Playwright E2E.',
              ''
            ].join('\n');
          }
          fs.writeFileSync(pp,pending);
          NODE

      - name: Scope final y publicar sólo dev
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/node_modules frontend/dist
          node scripts/verify-project-scope.mjs
          git fetch origin dev
          BASE_SHA="$(git rev-parse HEAD)"
          test "$(git rev-parse origin/dev)" = "$BASE_SHA"
          git config user.name "solqaryn-platform"
          git config user.email "solqaryn.platform@outlook.com"
          git add frontend/package.json frontend/package-lock.json \
            docs/evidencias/modernizacion/FASE_5_TOOLING_FRONTEND_2026-10-04.md \
            docs/DETALLES_PENDIENTES.md ARCHITECTURE_CHANGELOG.md CHANGELOG_AI.md
          git commit -m "feat(modernization): upgrade frontend tooling phase 5"
          git push origin HEAD:dev
