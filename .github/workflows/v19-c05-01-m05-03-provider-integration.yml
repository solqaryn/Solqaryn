name: V19 C05-01.M05.03 - integracion del proveedor CSS Angular
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c05-01-m05-03-provider-integration.spec.ts'
      - '.github/workflows/v19-c05-01-m05-03-provider-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c0501-m0503-${{ github.sha }}
  cancel-in-progress: false
jobs:
  provider-integration:
    name: V19 C05-01.M05.03 - tres Chromium proveedor CSS
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
      - name: Node24 npm11
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Npm fijado
        run: npm install --global npm@11.19.0
      - name: Dependencias fijas
        run: npm ci
      - name: Lint y build Angular Release
        run: |
          npm run lint
          npm run build:prod
      - name: Chromium oficial efimero
        run: npx playwright install --with-deps chromium
      - name: Angular efimero en loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c0501m0503-angular.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then
              echo 'LOCAL_ANGULAR_READY=PASS'
              exit 0
            fi
            sleep 2
          done
          cat c0501m0503-angular.log >&2
          exit 1
      - name: Tres integraciones Angular CSS/Signals Chromium
        run: npx playwright test e2e/c05-01-m05-03-provider-integration.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v19-c0501-m0503-provider
          path: |
            frontend/c0501m0503-angular.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
