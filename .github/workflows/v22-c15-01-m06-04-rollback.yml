name: V22 C15-01.M06.04 real isolated Git rollback
on:
  push:
    branches: [dev]
    paths:
      - 'scripts/quality/v22-c15-01-m06-04-rollback.test.mjs'
      - '.github/workflows/v22-c15-01-m06-04-rollback.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c15-01-m06-04-rollback-${{ github.sha }}
  cancel-in-progress: false
jobs:
  rollback-coverage-isolated:
    name: c15-rollback-2340-preservation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run real isolated git revert and adverse cases
        run: node --test scripts/quality/v22-c15-01-m06-04-rollback.test.mjs
