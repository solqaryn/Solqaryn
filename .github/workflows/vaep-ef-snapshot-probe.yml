name: VAEP EF Snapshot Probe

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/vaep-ef-snapshot-probe.yml'
      - 'backend/src/Domain/Entities/DashboardKpiConfiguracion.cs'
      - 'backend/src/Infrastructure/Persistence/Configurations/DashboardKpiConfiguracionConfiguration.cs'
      - 'backend/src/Infrastructure/Persistence/AppDbContextFactory.cs'
      - 'backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs'
      - 'backend/src/Infrastructure/Migrations/AppDbContextModelSnapshot.N57C.cs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Secret: SOLQARYN_CI_DESIGN_TIME_ONLY_0123456789ABCDEF
      Jwt__Issuer: SOLQARYN-CI
      Jwt__Audience: SOLQARYN-CI
      Cors__AllowedOrigins__0: http://localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - run: dotnet restore Solqaryn.sln
      - run: dotnet tool install --global dotnet-ef --version 10.0.12
      - name: Verify canonical snapshot has no pending model changes
        run: |
          set -euo pipefail
          dotnet ef migrations has-pending-model-changes \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext
      - name: Verify N5.7.C canonical snapshot contract
        run: |
          set -euo pipefail
          snapshot=src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs
          grep -q 'DashboardKpiConfiguracion' "$snapshot"
          grep -q 'DashboardKpiConfiguraciones' "$snapshot"
          grep -q 'CK_DashboardKpiConfiguraciones_Owner' "$snapshot"
          grep -q 'UX_DashboardKpiConfiguraciones_Usuario_MetricKey' "$snapshot"
          grep -q 'UX_DashboardKpiConfiguraciones_Rol_MetricKey' "$snapshot"
      - name: Build snapshot-aligned model
        run: dotnet build Solqaryn.sln --configuration Release --no-restore
