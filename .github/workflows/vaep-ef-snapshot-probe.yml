name: VAEP EF Snapshot Probe

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/vaep-ef-snapshot-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore Solqaryn.sln
      - run: dotnet tool install --global dotnet-ef --version 8.0.8
      - name: Generate verified canonical snapshot
        run: |
          set -euo pipefail
          dotnet ef migrations add VAEP_N5_7_C_SnapshotProbe \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext \
            --output-dir Migrations
          generated="$(ls src/Infrastructure/Migrations/*VAEP_N5_7_C_SnapshotProbe.cs | grep -v Designer | head -n 1)"
          test -n "$generated"
          grep -q 'CreateTable' "$generated"
          grep -q 'DashboardKpiConfiguraciones' "$generated"
          grep -q 'CK_DashboardKpiConfiguraciones_Owner' "$generated"
          grep -q 'UX_DashboardKpiConfiguraciones_Usuario_MetricKey' "$generated"
          grep -q 'UX_DashboardKpiConfiguraciones_Rol_MetricKey' "$generated"
          grep -q 'DashboardKpiConfiguracion' src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs
          rm -f src/Infrastructure/Migrations/*VAEP_N5_7_C_SnapshotProbe*.cs
      - name: Build snapshot-aligned model
        run: dotnet build Solqaryn.sln --configuration Release
      - name: Publish snapshot only
        run: |
          set -euo pipefail
          git config user.name 'VAEP Controller'
          git config user.email 'actions@users.noreply.github.com'
          git add src/Infrastructure/Migrations/AppDbContextModelSnapshot.cs
          cached="$(git diff --cached --name-only)"
          test "$(printf '%s\n' "$cached" | sed '/^$/d' | wc -l | tr -d ' ')" = '1'
          printf '%s\n' "$cached" | grep -Eq '(^|/)AppDbContextModelSnapshot\.cs$'
          git commit -m 'fix(vaep): align canonical EF snapshot for N5.7.C'
          git push origin HEAD:dev
