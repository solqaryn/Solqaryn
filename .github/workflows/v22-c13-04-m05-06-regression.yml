name: V22 C13-04.M05.06 - global public responsive Chromium matrix
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v22-c13-04-m05-06-regression.yml'
      - 'frontend/e2e/c13-04-m05-06-regression.spec.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c13-04-m05-06
  cancel-in-progress: false
jobs:
  browser:
    name: C13-04.M05.06 - five public surfaces real Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.0
      - name: Install pinned Angular/Playwright
        working-directory: frontend
        run: npm ci
      - name: Lint and build release UI
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Install real Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start real Angular localhost
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c13-04-m05-06.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c13-04-m05-06.log >&2
          exit 1
      - name: Run five Chromium cases without test retries
        working-directory: frontend
        run: npx playwright test e2e/c13-04-m05-06-regression.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Archive screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-c13-04-m05-06-chromium
          path: |
            frontend/c13-04-m05-06.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
