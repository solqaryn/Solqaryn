name: PROD - Encrypted DB connection bridge

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-render-db-secret-bridge.yml

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: PROD
    env:
      DB_HOST: ${{ vars.SOLQARYN_PROD_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_PROD_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_PROD_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_PROD_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_PROD_DB_PASSWORD }}
    steps:
      - name: Build and encrypt canonical PROD connection
        shell: bash
        run: |
          set -euo pipefail
          test "$DB_NAME" = "solqaryn_prod"
          test "$DB_USER" = "solqaryn_prod_user"
          test -n "$DB_HOST"
          test -n "$DB_PORT"
          test -n "$DB_PASSWORD"

          cat > /tmp/bridge-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA7rat3gySjP9DcVm87Bcy
          5k5jyFatkY6P3L4vhxGXINFkBPtaYRcI0AlzzJ0cg6ij+qGMobQhJcCYiW+Xs0Bj
          3vHtFffMfjc+hzAdweERWFO7uQrxxINqtV/Qivdl5iPb44ceAaP5tbiRndZM0rjf
          VGzcZSvh0WHDtY4LF5uoo4jBljg/4NRkFMfJ+k1bMQxJYARkKPK2egE7yToylmcn
          EDxTN+TkXgIN9NMi25QItAilTYl9fydWdC44Du5toZEEnqI2tJauLWVBPpFK35fr
          VHd860QNXpzTM7zKPGbAuV6UN5W0wNzh5xadu37LM2KdzrEXgoWna7XlRK+2rq1o
          0MWZypyW5lMfkwYUFujbXOYDfG7ud7nV6W8nA+mbr+mCpZryMSbTsYrOO3lu3O+K
          FumeTvurwon6tWPyacpPEQOsdisu0zqrcKarK3qrRNoflx1G0TenvLSd6EnWXD8r
          Y2A8rz+cdgCZA2i5Q2dlwcLApu0azBeKTy+n+0H9Ki15JEXcG2+NyUY1lK58rfdi
          5tcimvQ0AGlGDOMEvYtvSnJjHzFBaAnn4+KpZWLkjBy+7mfqY5grkwoQtU0EtbnG
          LvZ1OpKbE5uRjADtH/aBN0XsPMCxBTcs641C4DrohB3jVqCEvvDoiaDNKvtl3hrN
          Ntr2CYNh7l6OzwB5oHZWK6ECAwEAAQ==
          -----END PUBLIC KEY-----
          PEM
          sed -i 's/^          //' /tmp/bridge-public.pem

          connection="Server=${DB_HOST};Port=${DB_PORT};Database=${DB_NAME};User=${DB_USER};Password=${DB_PASSWORD};SslMode=Required;AllowPublicKeyRetrieval=True;"
          printf '%s' "$connection" > /tmp/connection.txt

          openssl pkeyutl -encrypt -pubin -inkey /tmp/bridge-public.pem             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256             -in /tmp/connection.txt             -out /tmp/connection.enc

          ciphertext="$(base64 -w0 /tmp/connection.enc)"
          echo "PROD_DB_CONNECTION_CIPHERTEXT_B64=$ciphertext"
          echo "PROD_DB_CONNECTION_BRIDGE=PASS"
          echo "PLAINTEXT_SECRET_LOGGED=FALSE"
