name: V22 C04-01.M05.03 physical MySQL 8.4 persistence test
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Integration/C0401M0503Mysql84PlanPersistenceTests.cs'
      - '.github/workflows/v22-c04-01-m05-03-mysql84-persistence.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0401-m0503-mysql84-${{ github.sha }}
  cancel-in-progress: false
jobs:
  physical-tenant-persistence:
    name: C04-01.M05.03 - physical MySQL 8.4 tenant rollback and revocation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v22-only
          MYSQL_DATABASE: solqaryn_c0401_m0503
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v22-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0401_M0503_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_c0401_m0503;User=root;Password=ephemeral-v22-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Verify exact SHA and project scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
          test -f backend/tests/Solqaryn.Tests/Integration/C0401M0503Mysql84PlanPersistenceTests.cs
      - name: Real isolated MySQL 8.4 xUnit and TRX evidence
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0401M0503Mysql84PlanPersistenceTests' --logger 'trx;LogFileName=C0401M0503PhysicalMysql84.trx' --verbosity normal
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path("tests/Solqaryn.Tests/TestResults").rglob("C0401M0503PhysicalMysql84.trx"))
          assert len(files)==1, files
          root=ET.parse(files[0]).getroot()
          ns={"t":"http://microsoft.com/schemas/VisualStudio/TeamTest/2010"}
          counters=root.find(".//t:Counters",ns)
          assert counters is not None
          values=counters.attrib
          assert int(values["total"])==1, values
          assert int(values["executed"])==1, values
          assert int(values["passed"])==1, values
          assert int(values["failed"])==0, values
          assert int(values["notExecuted"])==0, values
          print("C0401_M0503_REAL_MYSQL84_PERSISTENCE_ROLLBACK_PASS",values)
          PY
