name: V22 C07-01.M05.03 real ephemeral MySQL 8.4 acceptance
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Integration/C0701M0503CatalogPersistenceAcceptanceTests.cs'
      - '.github/workflows/v22-c07-01-m05-03-mysql84-acceptance.yml'
      - 'backend/src/Infrastructure/AutomationV5/C0701IsolatedMySqlResourceReader.cs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0701-m0503-${{ github.sha }}
  cancel-in-progress: false
jobs:
  isolated-mysql-catalog:
    name: C07-01.M05.03 - real MySQL 8.4 tenant A B rollback
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v22-only
          MYSQL_DATABASE: c0701_m0503_bootstrap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v22-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0701_M0503_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=c0701_m0503_bootstrap;User=root;Password=ephemeral-v22-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Verify exact SHA Scope Lock and skill self-test
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
          node scripts/verify-solqaryn-skills.mjs --self-test
      - name: Real MySQL 8.4 isolated physical integration with TRX counters
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0701M0503CatalogPersistenceAcceptanceTests' --logger 'trx;LogFileName=C0701M0503Mysql84Acceptance.trx' --verbosity normal
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          found=list(Path('tests/Solqaryn.Tests').rglob('C0701M0503Mysql84Acceptance.trx'))
          if len(found)!=1:raise SystemExit("missing unique C0701 M05.03 TRX")
          cnode=ET.parse(found[0]).getroot().find('.//{*}Counters')
          if cnode is None:raise SystemExit("missing TRX counters")
          c={key:int(cnode.attrib.get(key,-1)) for key in ('total','passed','failed','notExecuted','executed')}
          print('C0701_M0503_REAL_MYSQL84_TRX',c)
          if c['total']<1 or c['passed']!=c['total'] or c['failed'] or c['notExecuted'] or c['executed']!=c['total']:
              raise SystemExit("C0701 M05.03 MySQL physical integration FAIL")
          PY
