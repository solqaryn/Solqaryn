name: V19 C15-04.M05.04 - aceptacion UX incremental
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c15-04-m05-04-global-ux.spec.ts'
      - 'frontend/src/app/features/storefront/storefront-header.component.ts'
      - 'frontend/src/app/features/storefront/storefront-header.component.html'
      - 'frontend/src/app/features/storefront/storefront-producto.component.ts'
      - 'frontend/src/app/features/storefront/storefront-producto.component.html'
      - 'frontend/src/app/features/storefront/storefront-producto.component.scss'
      - '.github/workflows/v19-c15-04-m05-04-global-ux.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c15-04-m05-04-${{ github.sha }}
  cancel-in-progress: false
jobs:
  chromium:
    name: C15-04.M05.04 - Chromium UX incremental y capturas V23
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Tipado y build
        run: |
          npm run lint
          npm run build:prod
      - run: npx playwright install --with-deps chromium
      - name: Preflight de captura X11 antes de ejecutar UX
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v xvfb-run
          ffmpeg -hide_banner -devices 2>&1 | grep -w x11grab
          xvfb-run -a -s '-screen 0 1600x1200x24' bash -c 'ffmpeg -nostdin -hide_banner -loglevel error -f x11grab -video_size 1600x1200 -i "$DISPLAY" -frames:v 1 -threads 1 -f null -'
      - name: Angular efimero localhost
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c1504m0504.log 2>&1 &
          for i in $(seq 1 70); do
            if curl -fsS http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c1504m0504.log >&2
          exit 1
      - name: UX en browser real
        run: npx playwright test e2e/c15-04-m05-04-global-ux.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Zoom nativo Chromium de paginas publicas 100 y 200 por ciento
        shell: bash
        run: |
          set -euo pipefail
          cat > .c1504-native-zoom.mjs <<'NODE'
          import { chromium } from '@playwright/test';
          import assert from 'node:assert/strict';
          import { mkdtemp, mkdir, writeFile, readFile, rm } from 'node:fs/promises';
          import { execFile } from 'node:child_process';
          import { promisify } from 'node:util';
          const exec = promisify(execFile);
          import { tmpdir } from 'node:os';
          import { join, resolve } from 'node:path';

          // Browser page zoom, not CSS zoom, pinch, deviceScaleFactor or resized viewport.
          // The extension is local to a disposable CI browser profile, with no external endpoints.
          const root = await mkdtemp(join(tmpdir(), 'c1504-native-'));
          const extension = join(root, 'extension');
          const out = resolve('test-results/c1504-native-zoom');
          const origin = 'http://127.0.0.1:4200';
          const routes = [
            ['/login', '#login-title'],
            ['/tienda', '#contenido-principal'],
            ['/tienda/productos', '#catalogo-productos'],
            ['/tienda/categorias', '#contenido-categorias'],
            ['/tienda/producto/demo-producto-1', '#detalle-producto .product-info h1'],
          ];
          const evidence = [];
          let context;
          try {
            await mkdir(extension);
            await mkdir(out, { recursive: true });
            await writeFile(join(extension, 'manifest.json'), JSON.stringify({
              manifest_version: 3,
              name: 'SOLQARYN local native zoom evidence',
              version: '1.0.0',
              permissions: ['tabs'],
              background: { service_worker: 'background.js' }
            }));
            await writeFile(join(extension, 'background.js'),
              'chrome.runtime.onInstalled.addListener(() => {});');
            context = await chromium.launchPersistentContext(join(root, 'profile'), {
              headless: false,
              viewport: null,
              args: [
                '--window-size=1440,1000',
                '--disable-extensions-except=' + extension,
                '--load-extension=' + extension
              ]
            });
            const worker = context.serviceWorkers()[0] ??
              await context.waitForEvent('serviceworker', { timeout: 15000 });
            const page = context.pages()[0] ?? await context.newPage();
            // Capture the physical Xvfb desktop independently of Chromium's failed CDP surface.
            const metrics = () => page.evaluate(() => ({
              inner: window.innerWidth,
              innerHeight: window.innerHeight,
              client: document.documentElement.clientWidth,
              scroll: Math.max(document.documentElement.scrollWidth, document.body.scrollWidth),
              dpr: window.devicePixelRatio,
              visualScale: window.visualViewport?.scale ?? 1,
              outerWidth: window.outerWidth, outerHeight: window.outerHeight,
              screenX: window.screenX, screenY: window.screenY
            }));
            // Capture the real X11 desktop (including browser chrome), not a CSS clip.
            // Xvfb is isolated, 1600x1200; screenshots are not claimed as page-only images.
            async function captureViewport(filename, geometry) {
              await page.bringToFront();
              await page.evaluate(() => new Promise(resolve => requestAnimationFrame(
                () => requestAnimationFrame(resolve))));
              assert.ok(process.env.DISPLAY, 'X11 DISPLAY is required');
              const file = join(out, filename);
              await exec('ffmpeg', ['-nostdin', '-hide_banner', '-loglevel', 'error',
                '-f', 'x11grab', '-draw_mouse', '0', '-video_size', '1600x1200',
                '-i', process.env.DISPLAY, '-frames:v', '1', '-threads', '1', '-y', file],
                { timeout: 15000 });
              const png = await readFile(file);
              assert.ok(png.length >= 24 && png.subarray(0, 8).equals(
                Buffer.from([137, 80, 78, 71, 13, 10, 26, 10])), 'Invalid PNG');
              const width = png.readUInt32BE(16);
              const height = png.readUInt32BE(20);
              assert.equal(width, 1600, 'Physical X11 screen width');
              assert.equal(height, 1200, 'Physical X11 screen height');
              const physicalViewportWidth = geometry.inner * geometry.dpr;
              assert.ok(physicalViewportWidth > 0 && physicalViewportWidth <= width,
                'Browser viewport must fit physical screen');
              return { filename, width, height, physicalViewportWidth,
                capture: 'X11 full desktop, browser chrome included' };
            }
            async function horizontalGeometry(selector) {
              const rect = await page.locator(selector).evaluate(el => {
                const box = el.getBoundingClientRect();
                return { left: box.left, right: box.right, width: box.width,
                  viewport: document.documentElement.clientWidth };
              });
              assert.ok(rect.width > 0 && rect.left >= -2 && rect.right <= rect.viewport + 2,
                selector + ': actual element outside horizontal viewport: ' + JSON.stringify(rect));
              return rect;
            }
            async function zoom(factor) {
              const actual = await worker.evaluate(async ({ url, factor }) => {
                const tabs = await chrome.tabs.query({});
                const tab = tabs.find(t => t.url === url);
                if (tab?.id == null) throw Error('CI tab not found');
                await chrome.tabs.setZoomSettings(tab.id, { mode: 'automatic', scope: 'per-tab' });
                await chrome.tabs.setZoom(tab.id, factor);
                return await chrome.tabs.getZoom(tab.id);
              }, { url: page.url(), factor });
              assert.ok(Math.abs(actual - factor) < 0.001, 'Native Chrome zoom mismatch');
              return actual;
            }
            for (const [route, selector] of routes) {
              const isDetail = route === '/tienda/producto/demo-producto-1';
              if (isDetail) {
                const empresaBase = {
                  id: 901,
                  nombreComercial: 'Storefront Audit',
                  nombreVisibleSistema: 'Storefront Audit',
                  eslogan: 'Compra simple y segura',
                  descripcionSistema: 'Tienda pública de auditoría',
                  mensajeLogin: 'Administración',
                  copyright: '© 2026 Storefront Audit',
                  mostrarCopyright: true,
                  usarAnioAutomaticoCopyright: true,
                  encabezadoActivo: true,
                  encabezadoTexto: 'Atención pública de auditoría',
                  piePaginaActivo: true,
                  piePaginaTexto: 'Pie de auditoría',
                  moneda: 'HNL',
                  zonaHoraria: 'America/Tegucigalpa',
                  formatoFecha: 'dd/MM/yyyy',
                  whatsApp: '9876-5432'
                };
                await page.route(/^http:\/\/localhost:5005\/(?:empresa-configuracion\/publica|tienda\/configuracion)$/, r => r.fulfill({ status: 200, contentType: 'application/json', headers: { 'Access-Control-Allow-Origin': '*' }, body: JSON.stringify({ success: true, data: empresaBase }) }));
              }
              await page.goto(origin + route, { waitUntil: 'domcontentloaded' });
              if (isDetail) {
                await page.getByRole('heading', { level: 1, name: 'Laptop Pro 14', exact: true }).waitFor({ state: 'visible' });
                await page.locator('.add-main:enabled').waitFor({ state: 'visible' });
              }
              await page.locator(selector).waitFor({ state: 'visible', timeout: 20000 });
              const actual100 = await zoom(1);
              await page.waitForFunction(() => Math.abs(window.devicePixelRatio - 1) < 0.1);
              const detailControls = [];
              if (isDetail) for (const control of ['#cantidad-producto', '.add-main']) {
                detailControls.push({ zoom: 100, control, bounds: await horizontalGeometry(control) });
              }
              const before = await metrics();
              const slug = route.slice(1).replaceAll('/', '-');
              const image100 = await captureViewport(slug + '-100.png', before);
              const actual200 = await zoom(2);
              await page.waitForFunction(b => {
                const ratio = window.devicePixelRatio / b.dpr;
                return ratio > 1.95 && ratio < 2.05 &&
                  Math.abs(window.innerWidth * 2 - b.inner) <= 12;
              }, before, { timeout: 10000 });
              await page.locator(selector).waitFor({ state: 'visible', timeout: 20000 });
              const after = await metrics();
              const image200 = await captureViewport(slug + '-200.png', after);
              const horizontal = await horizontalGeometry(selector);
              const loginControls = [];
              if (route === '/login') {
                for (const control of ['input[autocomplete="username"]',
                    'input[autocomplete="current-password"]', 'button.submit-button']) {
                  const bounds = await horizontalGeometry(control);
                  loginControls.push({ control, bounds });
                }
                await page.locator('button.submit-button').scrollIntoViewIfNeeded();
                const submitImage = await captureViewport(slug + '-200-submit.png', await metrics());
                loginControls.push({ submitImage });
              }
              if (isDetail) {
                await page.locator('.add-main:enabled').waitFor({ state: 'visible' });
                for (const control of ['#cantidad-producto', '.add-main']) {
                  detailControls.push({ zoom: 200, control, bounds: await horizontalGeometry(control) });
                }
                await page.locator('.add-main').scrollIntoViewIfNeeded();
                const quantity = page.getByRole('spinbutton', { name: 'Cantidad de producto' });
                const increase = page.getByRole('button', { name: 'Aumentar cantidad', exact: true });
                const add = page.locator('.add-main');
                await quantity.focus();
                await page.keyboard.press('Control+A');
                await page.keyboard.type('2');
                await page.keyboard.press('Tab');
                assert.equal(await quantity.inputValue(), '2', 'Quantity remains editable at native 200%');
                assert.ok(await increase.evaluate(el => document.activeElement === el && el.matches(':focus-visible')), 'Tab must reach the increase control');
                await page.keyboard.press('Tab');
                assert.ok(await add.evaluate(el => {
                  const css = getComputedStyle(el);
                  return document.activeElement === el && el.matches(':focus-visible') &&
                    css.outlineStyle !== 'none' && parseFloat(css.outlineWidth) >= 2;
                }), 'Tab must reach the purchase CTA with a visible focus outline');
                detailControls.push({ ctaImage: await captureViewport(slug + '-200-cta.png', await metrics()) });
                await page.keyboard.press('Enter');
                await page.locator('app-storefront-header').getByRole('button', { name: 'Abrir carrito con 2 unidades' }).waitFor({ state: 'visible' });
                const cart = await page.evaluate(() => JSON.parse(localStorage.getItem('storefront:carrito:v2:901:demo') ?? '[]'));
                assert.equal(cart.length, 1, 'Only the chosen demo product may be added');
                assert.equal(cart[0].productoId, 1);
                assert.equal(cart[0].unidades, 2);
                detailControls.push({ keyboardActivation: true, zoom: 200, quantity: 2, cartVerified: true });
              }
              evidence.push({ route, actual100, actual200, before, after, image100,
                image200, horizontal, loginControls, detailControls });
              assert.ok(Math.abs(after.visualScale - 1) < 0.01, route + ': unexpected pinch scale');
              assert.ok(before.scroll <= before.client + 2, route + ': overflow at 100%');
              assert.ok(after.scroll <= after.client + 2, route + ': overflow at 200%');
              await zoom(1);
            }
          } finally {
            await writeFile(join(out, 'metrics.json'), JSON.stringify({
              sha: process.env.GITHUB_SHA, mechanism: 'chrome.tabs.setZoom/getZoom',
              scope: 'public viewport captures only; no private JWT, historical before/after or WCAG-wide certification', evidence
            }, null, 2));
            await context?.close();
            await rm(root, { recursive: true, force: true });
          }
          assert.equal(evidence.length, routes.length);
          NODE
          command -v ffmpeg
          node --check .c1504-native-zoom.mjs
          xvfb-run -a -s '-screen 0 1600x1200x24' node .c1504-native-zoom.mjs
      - name: Evidencia zoom nativo Chromium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1504-native-zoom-public
          path: frontend/test-results/c1504-native-zoom/
          if-no-files-found: warn
          retention-days: 14
      - name: Evidencia V23 de 15 capturas Chromium publicas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1504-m0504-v23-a091-screenshots
          path: frontend/test-results/**/v23-a091-*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Evidencia V23 A092 de 15 capturas Chromium publicas adicionales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1504-m0504-v23-a092-screenshots
          path: frontend/test-results/**/v23-a092-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Evidencia V23 A093 texto 200 por ciento - 10 capturas Chromium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1504-m0504-v23-a093-text200-screenshots
          path: frontend/test-results/**/v23-a093-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Evidencia V23 A097 texto 200 por ciento - 15 capturas Chromium
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1504-m0504-v23-a097-text200-screenshots
          path: frontend/test-results/**/v23-a097-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Evidencia causal de marca login sin imagen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c1504-login-brand-after
          path: frontend/test-results/c1504-login-brand-after-*.png
          if-no-files-found: error
          retention-days: 14
      - name: Evidencia de falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: c1504m0504-failure
          path: |
            frontend/c1504m0504.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7
