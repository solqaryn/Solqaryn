name: V24 C01-03.M04.01 - private config JWT MySQL Chromium
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/API/Security/CommercialTenantUiCapabilities.cs'
      # The private browser authenticates against live tenant/session authority.
      - 'backend/src/Infrastructure/Services/UsuarioScopeService.cs'
      - 'backend/tests/Solqaryn.Tests/API/CommercialTenantUiCapabilitiesTests.cs'
      - '.github/workflows/v24-c01-03-m04-01-dynamic-config.yml'
      - 'frontend/e2e/c01-03-m04-01-dynamic-config.spec.ts'
      - 'frontend/e2e/c01-03-m04-02-states.spec.ts'
      - 'frontend/e2e/c01-03-m04-02-native-zoom.mjs'
      - 'frontend/e2e/c01-03-m04-04-forms.spec.ts'
      - 'frontend/e2e/c01-03-m04-04-editor-native-zoom.mjs'
      - 'frontend/e2e/c01-03-m04-04-readonly.spec.ts'
      - 'frontend/src/app/features/configuracion/empresa-configuracion-tenant-card.component.ts'
      - 'frontend/src/app/app.routes.ts'
      # These live auth/session consumers can change private-route acceptance without changing the page.
      - 'frontend/src/app/core/guards/auth.guard.ts'
      - 'frontend/src/app/core/guards/permiso.guard.ts'
      - 'frontend/src/app/core/auth/tenant-context.service.ts'
      - 'frontend/src/app/core/auth/permisos-runtime.service.ts'
      - 'frontend/src/app/core/auth/session-activity.service.ts'
      - 'frontend/src/app/core/interceptors/auth.interceptor.ts'
      - 'backend/src/API/Middleware/UnscopedCommercialTenantGuardMiddleware.cs'
      - 'frontend/src/app/features/configuracion/c0103-configuracion-dinamica-page.component.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c01-02-m04-01-${{ github.sha }}
  cancel-in-progress: false
jobs:
  jwt-private-browser:
    name: C01-03.M04.01 - configuracion tenant JWT MySQL y Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_c1504_real_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      CI: 'true'
      ASPNETCORE_ENVIRONMENT: Development
      PORT: '5005'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=solqaryn_c1504_real_ci;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'

      Jwt__Issuer: 'Solqaryn.API'
      Jwt__Audience: 'Solqaryn.Frontend'
      Jwt__ExpiraMinutos: '120'
      SeedAdmin__Username: 'c1504_admin_a'
      # Solo CI aislada, sin cambiar entornos productivos.
      MultiEmpresa__PrivateReadPilotEnabled: 'true'
      Security__LoginRateLimitPerMinute: '300'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      Cors__AllowedOrigins__1: 'http://localhost:4200'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
      C1504_API_URL: 'http://127.0.0.1:5005'
      Cloudinary__CloudName: 'c1504-ci-unused'
      Cloudinary__ApiKey: 'c1504-ci-unused'
      Cloudinary__ApiSecret: 'c1504-ci-unused'
    steps:
      - name: Checkout SHA
        uses: actions/checkout@v4
      - name: Crear claves aleatorias solo en CI
        shell: bash
        run: |
          set -euo pipefail
          pass="$(openssl rand -hex 24)"
          jwt="$(openssl rand -hex 40)"
          echo "::add-mask::$pass"
          echo "::add-mask::$jwt"
          {
            echo "SeedAdmin__Password=$pass"
            echo "C1504_TEST_PASSWORD=$pass"
            echo "Jwt__Secret=$jwt"
          } >> "$GITHUB_ENV"
      - name: SDK .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - name: Compilar API Release
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: Crear baseline MySQL 8.4 aislado
        working-directory: backend
        env:
          SOLQARYN_DATABASE_BOOTSTRAP_MODE: fresh
        run: |
          set -euo pipefail
          dotnet run --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj --configuration Release --no-build --no-launch-profile
      - name: Levantar API real local
        working-directory: backend
        run: |
          set -euo pipefail
          nohup dotnet run --project src/API/Solqaryn.API.csproj --configuration Release --no-build --no-launch-profile > c1504-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5005/health >/dev/null && curl --fail --silent http://127.0.0.1:5005/health/ready >/dev/null; then
              echo 'C1504_API_READY'
              exit 0
            fi
            sleep 2
          done
          cat c1504-api.log >&2
          exit 1
      - name: Sembrar identidades CI con autoridad real en MySQL
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="$(docker ps --filter 'ancestor=mysql:8.4' --format '{{.ID}}' | head -n 1)"
          test -n "$mysql_container"
          docker exec -i "$mysql_container" mysql -uroot -proot solqaryn_c1504_real_ci <<'SQL'
          INSERT INTO Empresas (Id, Nombre, Activa, FechaCreacion, FechaActualizacion)
          VALUES (1, 'Empresa A efimera C15', TRUE, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6))
          ON DUPLICATE KEY UPDATE Activa=TRUE, FechaActualizacion=UTC_TIMESTAMP(6);
          INSERT INTO Empresas (Id, Nombre, Activa, FechaCreacion, FechaActualizacion)
          VALUES (2, 'Empresa B efimera C15', TRUE, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6))
          ON DUPLICATE KEY UPDATE Activa=TRUE, FechaActualizacion=UTC_TIMESTAMP(6);
          INSERT INTO UsuarioEmpresas (UsuarioId, EmpresaId, RolId, Activa, FechaCreacion, FechaActualizacion)
          SELECT u.Id, 1, u.RolId, TRUE, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6)
          FROM Usuarios u WHERE u.NombreUsuario='c1504_admin_a'
            AND NOT EXISTS (SELECT 1 FROM UsuarioEmpresas ue WHERE ue.UsuarioId=u.Id AND ue.EmpresaId=1);
          -- Persona B exclusivamente CI, contraseña efimera y solo Empresa 2.
          INSERT INTO Usuarios (NombreUsuario, NombreCompleto, PasswordHash, RolId, Activo, Bloqueado, Eliminado, FechaCreacion)
          SELECT 'c1504_admin_b', 'Empresa B efimera C15', a.PasswordHash, a.RolId, TRUE, FALSE, FALSE, UTC_TIMESTAMP(6)
          FROM Usuarios a WHERE a.NombreUsuario='c1504_admin_a'
            AND NOT EXISTS (SELECT 1 FROM Usuarios b WHERE b.NombreUsuario='c1504_admin_b');
          INSERT INTO UsuarioEmpresas (UsuarioId, EmpresaId, RolId, Activa, FechaCreacion, FechaActualizacion)
          SELECT u.Id, 2, u.RolId, TRUE, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6)
          FROM Usuarios u WHERE u.NombreUsuario='c1504_admin_b'
            AND NOT EXISTS (SELECT 1 FROM UsuarioEmpresas ue WHERE ue.UsuarioId=u.Id AND ue.EmpresaId=2);
          INSERT INTO Roles
            (Nombre, NombreNormalizado, Descripcion, EsSistema, EsAdministrador, Ambito, EmpresaId, Activo, Eliminado, FechaCreacion)
          VALUES ('Global CI C1504', 'C1504_GLOBAL_CI', 'Rol efimero para aceptacion real', 1, 1, 2, NULL, 1, 0, UTC_TIMESTAMP(6));
          INSERT INTO Usuarios
            (NombreUsuario, NombreCompleto, PasswordHash, RolId, Activo, Bloqueado, Eliminado, FechaCreacion)
          SELECT 'c1504_platform_only', 'Plataforma CI', u.PasswordHash, u.RolId,
                 TRUE, FALSE, FALSE, UTC_TIMESTAMP(6)
          FROM Usuarios u WHERE u.NombreUsuario='c1504_admin_a';
          INSERT INTO UsuarioRolesPlataforma (UsuarioId, RolId, Activa, FechaCreacion, FechaActualizacion)
          SELECT u.Id, r.Id, TRUE, UTC_TIMESTAMP(6), UTC_TIMESTAMP(6)
          FROM Usuarios u CROSS JOIN Roles r
          WHERE u.NombreUsuario='c1504_platform_only' AND r.NombreNormalizado='C1504_GLOBAL_CI';
          SQL
          members="$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_c1504_real_ci -Nse "SELECT COUNT(*) FROM UsuarioRolesPlataforma ur JOIN Usuarios u ON u.Id=ur.UsuarioId WHERE u.NombreUsuario='c1504_platform_only' AND ur.Activa=TRUE;")"
          company="$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_c1504_real_ci -Nse "SELECT COUNT(*) FROM UsuarioEmpresas ue JOIN Usuarios u ON u.Id=ue.UsuarioId WHERE u.NombreUsuario='c1504_admin_a' AND ue.EmpresaId=1 AND ue.Activa=TRUE;")"
          company_b="$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_c1504_real_ci -Nse "SELECT COUNT(*) FROM UsuarioEmpresas ue JOIN Usuarios u ON u.Id=ue.UsuarioId WHERE u.NombreUsuario='c1504_admin_b' AND ue.EmpresaId=2 AND ue.Activa=TRUE;")"
          test "$members" = '1'
          test "$company" = '1'
          test "$company_b" = '1'
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm y build Angular
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --global npm@11.19.0
          npm ci
          npm run lint
          npm run build:prod
      # Targeted Angular Vitest regression, before browser E2E and without JWT/MySQL mocks.
      - name: Vitest formulario tenant - revocacion reactiva y respuesta tardia
        working-directory: frontend
        run: npx ng test --watch=false --include=src/app/features/configuracion/empresa-configuracion-tenant-card.component.spec.ts
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Preflight sintaxis y captura X11 del editor
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node --check e2e/c01-03-m04-04-editor-native-zoom.mjs
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v xvfb-run
          ffmpeg -hide_banner -devices 2>&1 | grep -w x11grab
          xvfb-run -a -s '-screen 0 1600x1200x24' bash -c 'ffmpeg -nostdin -hide_banner -loglevel error -f x11grab -video_size 1600x1200 -i "$DISPLAY" -frames:v 1 -threads 1 -f null -'
      - name: Levantar Angular local
        working-directory: frontend
        run: |
          set -euo pipefail
          PORT=4200 nohup npm start -- --host 127.0.0.1 --port 4200 > c1504-angular.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then
              echo 'C1504_ANGULAR_READY'
              exit 0
            fi
            sleep 2
          done
          cat c1504-angular.log >&2
          exit 1
      # Preflight A/B first: the real private multi-company gate is READ ONLY.
      - name: Chromium tenant A/B JWT real, estados y denegacion de editar
        working-directory: frontend
        run: npx playwright test e2e/c01-03-m04-01-dynamic-config.spec.ts e2e/c01-03-m04-02-states.spec.ts e2e/c01-03-m04-04-readonly.spec.ts --config=playwright.c15-04-m05-04-real.config.ts --workers=1 --retries=0
      # Playwright's second invocation cleans test-results; preserve the real
      # A/B screenshots before that invocation. Pinch is not desktop zoom.
      - name: Preservar 20 PNG reales A/B antes de reiniciar Playwright
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p v24-c0103-m0401-screenshots
          for tenant in c1504_admin_a c1504_admin_b; do
            for width in 320 390 768 1280 1440; do
              for zoom in zoom100 zoom200-pinch; do
                src="test-results/c0103-m0401-${tenant}-${width}-${zoom}.png"
                if [ ! -s "$src" ]; then
                  echo "::error::Missing or empty real Chromium PNG: $src"
                  exit 1
                fi
                type="$(file --brief --mime-type "$src")"
                if [ "$type" != image/png ]; then
                  echo "::error::Not a PNG screenshot: $src ($type)"
                  exit 1
                fi
                cp -- "$src" v24-c0103-m0401-screenshots/
              done
            done
          done
          count="$(find v24-c0103-m0401-screenshots -maxdepth 1 -type f -name '*.png' | wc -l)"
          test "$count" -eq 20
          (cd v24-c0103-m0401-screenshots && sha256sum -- *.png > SHA256SUMS.txt)
          echo "V24_C0103_M0401_20_REAL_CHROMIUM_PNG_PRESERVED"

      # Native browser toolbar-equivalent zoom, not root-font scaling/pinch.
      # Run while the real A/B JWT/MySQL fixture is present; no data writes.
      - name: Preflight M04.02 native zoom syntax
        working-directory: frontend
        run: node --check e2e/c01-03-m04-02-native-zoom.mjs
      - name: M04.02 Chromium native zoom 200 - five states and Tab
        working-directory: frontend
        shell: bash
        run: xvfb-run -a -s '-screen 0 1600x1200x24' node e2e/c01-03-m04-02-native-zoom.mjs
      # This database/container only exists on this GitHub-hosted runner. The
      # second phase tests the ACTUAL pre-existing single-tenant edit grant;
      # no runtime feature flag or production RBAC rule is loosened.
      - name: Preparar edicion de tenant unico en MySQL 8.4 efimero
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="$(docker ps --filter 'ancestor=mysql:8.4' --format '{{.ID}}' | head -n 1)"
          test -n "$mysql_container"
          before="$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_c1504_real_ci -Nse 'SELECT COUNT(*) FROM Empresas;')"
          test "$before" = '2'
          # B was seeded solely for the preceding negative A/B browser phase.
          # Stop on foreign-key/authority inconsistency, never disable FK checks.
          docker exec -i "$mysql_container" mysql -uroot -proot solqaryn_c1504_real_ci <<'SQL'
          -- FK RESTRICT is part of the real tenancy contract. GET /tenant/2
          -- creates ConfigEmpresas(2), and optional templates also reference B.
          -- Delete ONLY B's ephemeral dependent rows in child-to-parent order.
          DELETE FROM PlantillasCorreoEmpresa WHERE EmpresaId = 2;
          DELETE FROM ConfigEmpresas WHERE EmpresaId = 2;
          DELETE FROM UsuarioEmpresas WHERE EmpresaId = 2;
          DELETE FROM Empresas WHERE Id = 2;
          SQL
          after="$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_c1504_real_ci -Nse 'SELECT COUNT(*) FROM Empresas;')"
          test "$after" = '1'
      - name: Chromium formularios con RBAC real en tenant unico
        working-directory: frontend
        run: npx playwright test e2e/c01-03-m04-04-forms.spec.ts --config=playwright.c15-04-m05-04-real.config.ts --workers=1 --retries=0
      - name: Editor real a zoom nativo 100 y 200 con evidencia X11
        working-directory: frontend
        shell: bash
        run: xvfb-run -a -s '-screen 0 1600x1200x24' node e2e/c01-03-m04-04-editor-native-zoom.mjs
      - name: Evidencia de fallos y capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c01-03-m04-01-dynamic-config-v22
          path: |
            frontend/c1504-angular.log
            backend/c1504-api.log
            frontend/test-results/
            frontend/v24-c0103-m0401-screenshots/
            frontend/v24-c0103-m0402-native-zoom/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
