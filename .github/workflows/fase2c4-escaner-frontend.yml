name: Fase 2C.4 - Frontend del escáner
# Recertificación sobre el HEAD vigente de DEV tras correcciones transversales de backend.

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/fase2c4-escaner-frontend.yml
      - frontend/src/app/shared/codigo-scanner-*/**
      - frontend/src/app/features/ventas/venta-form.component.*
      - frontend/src/app/features/compras/compra-form.component.*
      - frontend/src/app/services/venta.service.ts
      - frontend/src/app/services/compra.service.ts
      - frontend/src/app/core/models/producto.model.ts
      - frontend/e2e/fase2c4-escaner-frontend.spec.ts
      - backend/src/API/Controllers/VentasController.cs
      - backend/src/API/Controllers/ComprasController.cs
      - backend/src/Application/DTOs/ProductoEscanerDto.cs
      - backend/src/Application/Services/ProductoEscanerService.cs
      - backend/src/Infrastructure/Repositories/ProductoVarianteRepository.cs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fase2c4-escaner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: USB Bluetooth cámara e integración exacta
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_fase2c4
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: '5005'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=solqaryn_fase2c4;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'
      Jwt__Secret: 'Fase-2C4-CI-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'Solqaryn.API'
      Jwt__Audience: 'Solqaryn.Frontend'
      Jwt__ExpiraMinutos: '120'
      Security__LoginRateLimitPerMinute: '300'
      SeedAdmin__Username: 'e2e_admin'
      SeedAdmin__Password: 'E2E.Admin#2026!'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      Cors__AllowedOrigins__1: 'http://localhost:4200'
      Cloudinary__CloudName: 'e2e-not-used'
      Cloudinary__ApiKey: 'e2e-not-used'
      Cloudinary__ApiSecret: 'e2e-not-used'
      PHASE7_API_URL: 'http://127.0.0.1:5005'
      PHASE7_ADMIN_USERNAME: 'e2e_admin'
      PHASE7_ADMIN_PASSWORD: 'E2E.Admin#2026!'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'

    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Compilar backend
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore

      - name: Iniciar API sobre MySQL descartable
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          nohup dotnet run --project src/API/Solqaryn.API.csproj --configuration Release --no-build --no-launch-profile > fase2c4-api.log 2>&1 &
          echo $! > fase2c4-api.pid

      - name: Esperar API y migraciones
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5005/health/ready >/dev/null; then
              echo 'API y MySQL listos.'
              exit 0
            fi
            sleep 2
          done
          cat fase2c4-api.log >&2 || true
          exit 1

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Instalar frontend y Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validar frontend
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod

      - name: Iniciar Angular
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > fase2c4-frontend.log 2>&1 &
          echo $! > fase2c4-frontend.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then
              echo 'Angular listo.'
              exit 0
            fi
            sleep 2
          done
          cat fase2c4-frontend.log >&2 || true
          exit 1

      - name: Ejecutar aceptación específica 2C.4
        working-directory: frontend
        run: npx playwright test e2e/fase2c4-escaner-frontend.spec.ts --config=playwright.config.ts

      - name: Publicar evidencia 2C.4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase2c4-escaner-frontend
          path: |
            backend/fase2c4-api.log
            frontend/fase2c4-frontend.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
