name: V22 C04-01.M03.06 isolated audit MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Infrastructure/AutomationV5/C0401IsolatedStructuredAuditSink.cs'
      - 'backend/tests/Solqaryn.Tests/Integration/C0401M0306IsolatedAuditMysql84Tests.cs'
      - '.github/workflows/v22-c04-01-m03-06-isolated-audit-mysql84.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0401-m0306-${{ github.sha }}
  cancel-in-progress: false
jobs:
  isolated-mysql-audit:
    name: C04-01.M03.06 - MySQL 8.4 isolated structured audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v22-only
          MYSQL_DATABASE: c0401_m0306_bootstrap
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v22-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0401_M0306_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=c0401_m0306_bootstrap;User=root;Password=ephemeral-v22-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Scope Lock exact SHA
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Real MySQL 8.4 audited events and rollback
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0401M0306IsolatedAuditMysql84Tests' --logger 'trx;LogFileName=C0401M0306AuditMysql84.trx' --verbosity normal
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          f=list(Path('tests/Solqaryn.Tests').rglob('C0401M0306AuditMysql84.trx'))
          assert len(f)==1, f
          c=ET.parse(f[0]).getroot().find('.//{*}Counters')
          assert c is not None
          d={k:int(c.attrib.get(k,-1)) for k in ('total','passed','failed','notExecuted','executed')}
          assert d['total']>=1 and d['passed']==d['total'] and d['failed']==0 and d['notExecuted']==0 and d['executed']==d['total'], d
          print('C0401_ISOLATED_AUDIT_MYSQL84_PASS',d)
          PY
