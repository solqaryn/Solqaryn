name: DEV - Reconcile QA residual Aiven grants

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/aiven-qa-residual-grants-reconcile.yml'

permissions:
  contents: read

jobs:
  reconcile:
    name: Retirar privilegios administrativos residuales QA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: DEV
    env:
      AIVEN_TOKEN: ${{ secrets.SOLQARYN_AIVEN_TOKEN }}
      DB_HOST: ${{ vars.SOLQARYN_DEV_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_DEV_DB_PORT }}
      AIVEN_PROJECT: solqaryn
      AIVEN_SERVICE: solqaryn-mysql
    steps:
      - name: Instalar cliente MySQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Resolver avnadmin sin exponer secreto
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=os.environ['AIVEN_TOKEN'].strip()
          project=urllib.parse.quote(os.environ['AIVEN_PROJECT'], safe='')
          service=urllib.parse.quote(os.environ['AIVEN_SERVICE'], safe='')
          url=f'https://api.aiven.io/v1/project/{project}/service/{service}/user/avnadmin?include_secrets=true'
          req=urllib.request.Request(
              url,
              headers={
                  'Authorization': f'aivenv1 {token}',
                  'Accept': 'application/json',
                  'User-Agent': 'SOLQARYN-Aiven-QA-Residual-Grants/1.0'
              }
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              payload=json.load(resp)

          def find_password(v):
              if isinstance(v, dict):
                  for k, x in v.items():
                      if k.lower() == 'password' and isinstance(x, str) and x and x != '<redacted>':
                          return x
                  for x in v.values():
                      found=find_password(x)
                      if found:
                          return found
              elif isinstance(v, list):
                  for x in v:
                      found=find_password(x)
                      if found:
                          return found
              return None

          password=find_password(payload)
          if not password:
              raise SystemExit('No se pudo resolver avnadmin.')
          print(f'::add-mask::{password}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'AVNADMIN_PASSWORD={password}\n')
          PY

      - name: Retirar grants administrativos residuales QA
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$AVNADMIN_PASSWORD"

          mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u avnadmin --ssl-mode=REQUIRED mysql <<'SQL'
          REVOKE REPLICATION_APPLIER, ROLE_ADMIN ON *.* FROM 'solqaryn_qa_user'@'%';
          REVOKE GRANT OPTION ON *.* FROM 'solqaryn_qa_user'@'%';
          SQL

          grants="$(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u avnadmin --ssl-mode=REQUIRED mysql --batch --skip-column-names -e "SHOW GRANTS FOR 'solqaryn_qa_user'@'%';")"
          echo "$grants"

          echo "$grants" | grep -Fq 'GRANT ALL PRIVILEGES ON `solqaryn_qa`.* TO "solqaryn_qa_user"@"%"'
          ! echo "$grants" | grep -Eq 'ROLE_ADMIN|REPLICATION_APPLIER|WITH GRANT OPTION'
          ! echo "$grants" | grep -Fq '`solqaryn_dev`.*'
          ! echo "$grants" | grep -Fq '`solqaryn_prod`.*'
          echo "AIVEN_QA_RESIDUAL_GRANTS_RECONCILED=PASS"
