name: DEV - recuperación de migración MySQL parcial

on:
  push:
    branches:
      - dev
    paths:
      - backend/src/Infrastructure.Migrations/**
      - backend/src/API/Program.cs
      - backend/tools/Solqaryn.DatabaseBootstrap/**
      - .github/workflows/migration-recovery-dev.yml
  pull_request:
    branches:
      - dev
    paths:
      - backend/src/Infrastructure.Migrations/**
      - backend/src/API/Program.cs
      - backend/tools/Solqaryn.DatabaseBootstrap/**
      - .github/workflows/migration-recovery-dev.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: Recuperar adoption Oracle sin DDL físico
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_migration_recovery
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: '5005'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=solqaryn_migration_recovery;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'
      Jwt__Secret: 'Migration-Recovery-CI-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'Solqaryn.API'
      Jwt__Audience: 'Solqaryn.Frontend'
      Jwt__ExpiraMinutos: '120'
      Security__LoginRateLimitPerMinute: '300'
      SeedAdmin__Username: 'migration_recovery_admin'
      SeedAdmin__Password: 'Migration.Recovery#2026!'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      AppSettings__BackendPublicUrl: 'https://preview.solqaryn.invalid'
      AppSettings__LogoPublicUrl: 'https://solqaryn-dev.vercel.app/assets/storefront-logo.png'
      Cloudinary__CloudName: 'ci-not-used'
      Cloudinary__ApiKey: 'ci-not-used'
      Cloudinary__ApiSecret: 'ci-not-used'

    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restaurar solución y herramientas
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet tool restore
          dotnet build Solqaryn.sln --configuration Release --no-restore

      - name: Activar restricción de primary key equivalente a Aiven
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot -e "SET GLOBAL sql_require_primary_key=ON;"
          test "$(docker exec "$mysql_container" mysql -uroot -proot -Nse "SELECT @@GLOBAL.sql_require_primary_key;")" = 1

      - name: Materializar baseline físico Oracle
        working-directory: backend
        env:
          SOLQARYN_DATABASE_BOOTSTRAP_MODE: fresh
        run: |
          set -euo pipefail
          dotnet run \
            --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj \
            --configuration Release \
            --no-build

      - name: Simular adoption interrumpida sin tocar DDL
        id: before
        shell: bash
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          schema_hash() {
            docker exec "$c" mysql -uroot -proot solqaryn_migration_recovery -Nse "
              SET SESSION group_concat_max_len=16777216;
              SELECT MD5(CONCAT(
                COALESCE((SELECT GROUP_CONCAT(CONCAT_WS('|',TABLE_NAME,COLUMN_NAME,ORDINAL_POSITION,COLUMN_TYPE,IS_NULLABLE,COALESCE(COLUMN_DEFAULT,'<NULL>'),EXTRA,COALESCE(COLLATION_NAME,'<NULL>')) ORDER BY TABLE_NAME,ORDINAL_POSITION SEPARATOR '#') FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA=DATABASE()),''),
                '::IDX::',
                COALESCE((SELECT GROUP_CONCAT(CONCAT_WS('|',TABLE_NAME,INDEX_NAME,NON_UNIQUE,SEQ_IN_INDEX,COLUMN_NAME) ORDER BY TABLE_NAME,INDEX_NAME,SEQ_IN_INDEX SEPARATOR '#') FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE()),''),
                '::FK::',
                COALESCE((SELECT GROUP_CONCAT(CONCAT_WS('|',TABLE_NAME,CONSTRAINT_NAME,COLUMN_NAME,REFERENCED_TABLE_NAME,REFERENCED_COLUMN_NAME) ORDER BY TABLE_NAME,CONSTRAINT_NAME,ORDINAL_POSITION SEPARATOR '#') FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA=DATABASE() AND REFERENCED_TABLE_NAME IS NOT NULL),'')
              ));"
          }
          before="$(schema_hash)"
          test -n "$before"
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_migration_recovery -Nse "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")" = 1
          docker exec "$c" mysql -uroot -proot solqaryn_migration_recovery -e "DELETE FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';"
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_migration_recovery -Nse "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")" = 0
          echo "schema_hash=$before" >> "$GITHUB_OUTPUT"

      - name: Arrancar API y recuperar marker Oracle
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          nohup dotnet run \
            --project src/API/Solqaryn.API.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            > migration-recovery-api.log 2>&1 &
          echo $! > migration-recovery-api.pid

          for attempt in $(seq 1 75); do
            if curl --fail --silent http://127.0.0.1:5005/health > /dev/null && \
               curl --fail --silent http://127.0.0.1:5005/health/ready > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat migration-recovery-api.pid)" 2>/dev/null; then
              cat migration-recovery-api.log >&2 || true
              exit 1
            fi
            sleep 2
          done
          cat migration-recovery-api.log >&2 || true
          exit 1

      - name: Verificar recovery sin DDL físico
        shell: bash
        env:
          BEFORE_HASH: ${{ steps.before.outputs.schema_hash }}
        run: |
          set -euo pipefail
          c="${{ job.services.mysql.id }}"
          test "$(docker exec "$c" mysql -uroot -proot solqaryn_migration_recovery -Nse "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")" = 1
          after="$(docker exec "$c" mysql -uroot -proot solqaryn_migration_recovery -Nse "
            SET SESSION group_concat_max_len=16777216;
            SELECT MD5(CONCAT(
              COALESCE((SELECT GROUP_CONCAT(CONCAT_WS('|',TABLE_NAME,COLUMN_NAME,ORDINAL_POSITION,COLUMN_TYPE,IS_NULLABLE,COALESCE(COLUMN_DEFAULT,'<NULL>'),EXTRA,COALESCE(COLLATION_NAME,'<NULL>')) ORDER BY TABLE_NAME,ORDINAL_POSITION SEPARATOR '#') FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA=DATABASE()),''),
              '::IDX::',
              COALESCE((SELECT GROUP_CONCAT(CONCAT_WS('|',TABLE_NAME,INDEX_NAME,NON_UNIQUE,SEQ_IN_INDEX,COLUMN_NAME) ORDER BY TABLE_NAME,INDEX_NAME,SEQ_IN_INDEX SEPARATOR '#') FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE()),''),
              '::FK::',
              COALESCE((SELECT GROUP_CONCAT(CONCAT_WS('|',TABLE_NAME,CONSTRAINT_NAME,COLUMN_NAME,REFERENCED_TABLE_NAME,REFERENCED_COLUMN_NAME) ORDER BY TABLE_NAME,CONSTRAINT_NAME,ORDINAL_POSITION SEPARATOR '#') FROM INFORMATION_SCHEMA.KEY_COLUMN_USAGE WHERE TABLE_SCHEMA=DATABASE() AND REFERENCED_TABLE_NAME IS NOT NULL),'')
            ));")"
          test "$after" = "$BEFORE_HASH"
          echo 'ORACLE_BASELINE_RECOVERY_NO_DDL=PASS'

      - name: Verificar segundo arranque idempotente
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          kill "$(cat migration-recovery-api.pid)"
          wait "$(cat migration-recovery-api.pid)" 2>/dev/null || true

          nohup dotnet run \
            --project src/API/Solqaryn.API.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            > migration-recovery-second-start.log 2>&1 &
          echo $! > migration-recovery-second.pid

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5005/health/ready > /dev/null; then
              echo 'ORACLE_BASELINE_RECOVERY_IDEMPOTENT=PASS'
              exit 0
            fi
            if ! kill -0 "$(cat migration-recovery-second.pid)" 2>/dev/null; then
              cat migration-recovery-second-start.log >&2 || true
              exit 1
            fi
            sleep 2
          done
          cat migration-recovery-second-start.log >&2 || true
          exit 1

      - name: Publicar evidencia de recuperación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-recovery-dev
          path: |
            backend/migration-recovery-api.log
            backend/migration-recovery-second-start.log
          if-no-files-found: warn
          retention-days: 14
