name: DEV - recuperación de migración MySQL parcial

on:
  push:
    branches:
      - dev
    paths:
      - backend/src/Infrastructure/Migrations/**
      - backend/src/API/Program.cs
      - .github/workflows/migration-recovery-dev.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: Reanudar DDL parcial con restricciones Aiven
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_migration_recovery
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: '5005'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=solqaryn_migration_recovery;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'
      Jwt__Secret: 'Migration-Recovery-CI-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'Solqaryn.API'
      Jwt__Audience: 'Solqaryn.Frontend'
      Jwt__ExpiraMinutos: '120'
      Security__LoginRateLimitPerMinute: '300'
      SeedAdmin__Username: 'migration_recovery_admin'
      SeedAdmin__Password: 'Migration.Recovery#2026!'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      AppSettings__BackendPublicUrl: 'https://preview.solqaryn.invalid'
      AppSettings__LogoPublicUrl: 'https://solqaryn-dev.vercel.app/assets/storefront-logo.png'
      Cloudinary__CloudName: 'ci-not-used'
      Cloudinary__ApiKey: 'ci-not-used'
      Cloudinary__ApiSecret: 'ci-not-used'

    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restaurar e instalar EF
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet tool install --global dotnet-ef --version 8.0.8

      - name: Activar restricción de primary key equivalente a Aiven
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot -e "SET GLOBAL sql_require_primary_key=ON;"
          test "$(docker exec "$mysql_container" mysql -uroot -proot -Nse "SELECT @@GLOBAL.sql_require_primary_key;")" = 1
          echo 'sql_require_primary_key=ON certificado para todas las conexiones nuevas.'

      - name: Crear baseline inmediatamente anterior a M1 endurecido
        working-directory: backend
        run: |
          dotnet ef database update 20260808164317_M1NormalizarMaestrosProducto \
            --project src/Infrastructure/Solqaryn.Infrastructure.csproj \
            --startup-project src/API/Solqaryn.API.csproj \
            --context AppDbContext

      - name: Preparar configuración empresarial del baseline efímero
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          q(){ docker exec "$mysql_container" mysql -uroot -proot solqaryn_migration_recovery -Nse "$1"; }

          activas="$(q "SELECT COUNT(*) FROM EmpresaConfiguraciones WHERE Activa = 1;")"
          if [ "$activas" -gt 1 ]; then
            echo "Baseline inválido: se encontraron $activas configuraciones empresariales activas." >&2
            exit 1
          fi

          if [ "$activas" -eq 0 ]; then
            docker exec "$mysql_container" mysql -uroot -proot solqaryn_migration_recovery -e "
              INSERT INTO EmpresaConfiguraciones (
                NombreComercial,
                Eslogan,
                NombreVisibleSistema,
                DescripcionSistema,
                MensajeLogin,
                Copyright,
                MostrarCopyright,
                UsarAnioAutomaticoCopyright,
                EncabezadoActivo,
                PiePaginaActivo,
                Moneda,
                ZonaHoraria,
                FormatoFecha,
                Activa,
                FechaActualizacion
              ) VALUES (
                'Storefront CI Recovery',
                'Eleva tu mundo digital',
                'Storefront CI Recovery',
                'Baseline efimero de recuperacion',
                'CI migration recovery',
                'CI only',
                1,
                1,
                1,
                1,
                'HNL',
                'America/Tegucigalpa',
                'dd/MM/yyyy',
                1,
                UTC_TIMESTAMP()
              );
            "
          fi

          test "$(q "SELECT COUNT(*) FROM EmpresaConfiguraciones WHERE Activa = 1;")" = 1
          echo 'Baseline efímero certificado con exactamente una configuración empresarial activa.'

      - name: Simular DDL parcial de un despliegue interrumpido
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"

          # Reproduce el síntoma observado en Render: M1 no está en historial pero
          # algunos DDL ya quedaron confirmados por MySQL.
          docker exec "$mysql_container" mysql -uroot -proot solqaryn_migration_recovery -e "
            ALTER TABLE Proveedores DROP INDEX IX_Proveedores_Nombre;
            ALTER TABLE Clientes DROP INDEX IX_Clientes_Nombre;
            ALTER TABLE Proveedores
              ADD COLUMN DocumentoNormalizado varchar(50)
              GENERATED ALWAYS AS (NULLIF(LOWER(REPLACE(REPLACE(TRIM(Documento), '-', ''), ' ', '')), '')) STORED;
            CREATE UNIQUE INDEX UX_Proveedores_Documento_Normalizado
              ON Proveedores (DocumentoNormalizado);
            CREATE INDEX IX_ImpuestoProveedores_ProveedorId
              ON ImpuestoProveedores (ProveedorId);
            CREATE UNIQUE INDEX UX_ImpuestoProveedores_Impuesto_Proveedor
              ON ImpuestoProveedores (ImpuestoId, ProveedorId);
            ALTER TABLE ImpuestoProveedores DROP INDEX IX_ImpuestoProveedores_ImpuestoId;
          "

          test "$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_migration_recovery -Nse "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20260808165129_M1EndurecerIntegridadRelacional';")" = 0
          test "$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_migration_recovery -Nse "SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='Proveedores' AND INDEX_NAME='IX_Proveedores_Nombre';")" = 0
          test "$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_migration_recovery -Nse "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='Proveedores' AND COLUMN_NAME='DocumentoNormalizado';")" = 1

      - name: Compilar backend Release
        working-directory: backend
        run: dotnet build Solqaryn.sln --configuration Release --no-restore

      - name: Arrancar API y reanudar migraciones como Render
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          nohup dotnet run \
            --project src/API/Solqaryn.API.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            > migration-recovery-api.log 2>&1 &
          echo $! > migration-recovery-api.pid

          for attempt in $(seq 1 75); do
            if curl --fail --silent http://127.0.0.1:5005/health > /dev/null && \
               curl --fail --silent http://127.0.0.1:5005/health/ready > /dev/null; then
              echo 'API recuperó el DDL parcial bajo sql_require_primary_key=ON y quedó saludable.'
              exit 0
            fi
            if ! kill -0 "$(cat migration-recovery-api.pid)" 2>/dev/null; then
              echo 'La API terminó antes de quedar saludable.' >&2
              cat migration-recovery-api.log >&2 || true
              exit 1
            fi
            sleep 2
          done

          echo 'Timeout esperando health después de recuperación.' >&2
          cat migration-recovery-api.log >&2 || true
          exit 1

      - name: Verificar convergencia de esquema, M2 e historial
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          q(){ docker exec "$mysql_container" mysql -uroot -proot solqaryn_migration_recovery -Nse "$1"; }

          test "$(q "SELECT @@GLOBAL.sql_require_primary_key;")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20260808165128_M1ReconciliarReintentoIntegridadRelacional';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20260808165129_M1EndurecerIntegridadRelacional';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20260809121915_M2VariantesMultidimensionales';")" = 1
          test "$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='Proveedores' AND COLUMN_NAME='DocumentoNormalizado';")" = 1
          test "$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='Proveedores' AND INDEX_NAME='IX_Proveedores_Nombre' AND NON_UNIQUE=1;")" = 1
          test "$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='Clientes' AND INDEX_NAME='IX_Clientes_Nombre' AND NON_UNIQUE=1;")" = 1
          test "$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='ImpuestoProveedores' AND INDEX_NAME='UX_ImpuestoProveedores_Impuesto_Proveedor' AND NON_UNIQUE=0;")" = 2
          test "$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='ImpuestoProveedores' AND INDEX_NAME='IX_ImpuestoProveedores_ImpuestoId';")" = 0
          test "$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='ProductoVariantes' AND INDEX_NAME='IX_ProductoVariantes_Dimensiones';")" = 5

      - name: Verificar segundo arranque idempotente
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          kill "$(cat migration-recovery-api.pid)"
          wait "$(cat migration-recovery-api.pid)" 2>/dev/null || true

          nohup dotnet run \
            --project src/API/Solqaryn.API.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            > migration-recovery-second-start.log 2>&1 &
          echo $! > migration-recovery-second.pid

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5005/health/ready > /dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat migration-recovery-second.pid)" 2>/dev/null; then
              cat migration-recovery-second-start.log >&2 || true
              exit 1
            fi
            sleep 2
          done
          cat migration-recovery-second-start.log >&2 || true
          exit 1

      - name: Publicar evidencia de recuperación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-recovery-dev
          path: |
            backend/migration-recovery-api.log
            backend/migration-recovery-second-start.log
          if-no-files-found: warn
          retention-days: 14
