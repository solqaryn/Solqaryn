name: DEV - recuperación de migración MySQL parcial

on:
  push:
    branches:
      - dev
    paths:
      - backend/src/Infrastructure.Migrations/**
      - backend/src/Infrastructure/Migrations/**
      - backend/src/Infrastructure/Persistence/**
      - backend/tools/Solqaryn.DatabaseBootstrap/**
      - backend/src/API/Program.cs
      - .github/workflows/migration-recovery-dev.yml
  pull_request:
    branches:
      - dev
    paths:
      - backend/src/Infrastructure.Migrations/**
      - backend/src/Infrastructure/Migrations/**
      - backend/src/Infrastructure/Persistence/**
      - backend/tools/Solqaryn.DatabaseBootstrap/**
      - backend/src/API/Program.cs
      - .github/workflows/migration-recovery-dev.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-recovery-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery:
    name: Recuperar adopción Oracle baseline con restricciones Aiven
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_migration_recovery
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: '5005'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=solqaryn_migration_recovery;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'
      Jwt__Secret: 'Migration-Recovery-CI-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'Solqaryn.API'
      Jwt__Audience: 'Solqaryn.Frontend'
      Jwt__ExpiraMinutos: '120'
      Security__LoginRateLimitPerMinute: '300'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      AppSettings__BackendPublicUrl: 'https://preview.solqaryn.invalid'
      Cloudinary__CloudName: 'ci-not-used'
      Cloudinary__ApiKey: 'ci-not-used'
      Cloudinary__ApiSecret: 'ci-not-used'

    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Scope lock
        run: node scripts/verify-project-scope.mjs

      - name: Restaurar compilar y fijar EF CLI
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
          dotnet tool restore
          dotnet tool run dotnet-ef --version | grep -F '10.0.12'

      - name: Activar restricción de primary key equivalente a Aiven
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot -e "SET GLOBAL sql_require_primary_key=ON;"
          test "$(docker exec "$mysql_container" mysql -uroot -proot -Nse "SELECT @@GLOBAL.sql_require_primary_key;")" = 1
          echo 'sql_require_primary_key=ON certificado para todas las conexiones nuevas.'

      - name: Bootstrap fresh Oracle canónico
        working-directory: backend
        env:
          SOLQARYN_DATABASE_BOOTSTRAP_MODE: fresh
        shell: bash
        run: |
          set -euo pipefail
          dotnet run             --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj             --configuration Release             --no-build

      - name: Certificar baseline y simular adopción interrumpida
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          q(){ docker exec "$mysql_container" mysql -uroot -proot solqaryn_migration_recovery -Nse "$1"; }

          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")" = 1
          table_count_before="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE' AND TABLE_NAME <> '__EFMigrationsHistory';")"
          test "$table_count_before" -ge 136

          docker exec "$mysql_container" mysql -uroot -proot solqaryn_migration_recovery -e "
            DELETE FROM __EFMigrationsHistory
            WHERE MigrationId='20261006111818_OracleBaseline';
          "
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")" = 0
          echo "RECOVERY_TABLES_BEFORE=$table_count_before"

      - name: Reanudar OracleBaseline sin replay Pomelo
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool run dotnet-ef database update             --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj             --startup-project src/API/Solqaryn.API.csproj             --context AppDbContext             --configuration Release             --no-build

          dotnet tool run dotnet-ef migrations has-pending-model-changes             --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj             --startup-project src/API/Solqaryn.API.csproj             --context AppDbContext             --configuration Release             --no-build

      - name: Verificar convergencia sin DDL histórico
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          q(){ docker exec "$mysql_container" mysql -uroot -proot solqaryn_migration_recovery -Nse "$1"; }

          test "$(q "SELECT @@GLOBAL.sql_require_primary_key;")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory;")" = 1

          table_count_after="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE' AND TABLE_NAME <> '__EFMigrationsHistory';")"
          test "$table_count_after" -ge 136
          test "$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN ('Empresas','Productos','ConfigEmpresas','AutomatizacionConfiguraciones','SuscripcionSaaSIdempotencia');")" = 5
          echo "RECOVERY_TABLES_AFTER=$table_count_after"
          echo 'ORACLE_BASELINE_RECOVERY=PASS'

      - name: Arrancar API y validar health
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          nohup dotnet run             --project src/API/Solqaryn.API.csproj             --configuration Release             --no-build             --no-launch-profile             > migration-recovery-api.log 2>&1 &
          echo $! > migration-recovery-api.pid

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5005/health > /dev/null &&                curl --fail --silent http://127.0.0.1:5005/health/ready > /dev/null; then
              echo 'API saludable después de recuperar OracleBaseline.'
              exit 0
            fi
            if ! kill -0 "$(cat migration-recovery-api.pid)" 2>/dev/null; then
              cat migration-recovery-api.log >&2 || true
              exit 1
            fi
            sleep 2
          done

          cat migration-recovery-api.log >&2 || true
          exit 1

      - name: Verificar segundo arranque idempotente
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          kill "$(cat migration-recovery-api.pid)"
          wait "$(cat migration-recovery-api.pid)" 2>/dev/null || true

          nohup dotnet run             --project src/API/Solqaryn.API.csproj             --configuration Release             --no-build             --no-launch-profile             > migration-recovery-second-start.log 2>&1 &
          echo $! > migration-recovery-second.pid

          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:5005/health/ready > /dev/null; then
              echo 'ORACLE_RECOVERY_SECOND_START=PASS'
              exit 0
            fi
            if ! kill -0 "$(cat migration-recovery-second.pid)" 2>/dev/null; then
              cat migration-recovery-second-start.log >&2 || true
              exit 1
            fi
            sleep 2
          done

          cat migration-recovery-second-start.log >&2 || true
          exit 1

      - name: Publicar evidencia de recuperación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-recovery-dev
          path: |
            backend/migration-recovery-api.log
            backend/migration-recovery-second-start.log
          if-no-files-found: warn
          retention-days: 14
