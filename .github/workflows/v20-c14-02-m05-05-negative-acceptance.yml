name: V20 C14-02.M05.05 - negative security acceptance preflight
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Application/C1402M0505NegativeSecurityAcceptanceTests.cs'
      - 'backend/src/Application/AutomationV5/C1402SecurityAcceptanceAuthorizationGate.cs'
      - '.github/workflows/v20-c14-02-m05-05-negative-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c1402-m0505-${{ github.sha }}
  cancel-in-progress: false
jobs:
  negative-preflight:
    name: C14-02.M05.05 - real negative xUnit preflight
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Strict project scope
        run: node scripts/verify-project-scope.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restore and build .NET 10 Release
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln -c Release --no-restore
      - name: Execute and count real negative xUnit
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~C1402M0505NegativeSecurityAcceptanceTests' --logger 'trx;LogFileName=c1402-m0505-negative.trx' --logger 'console;verbosity=normal'
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          paths = glob.glob('tests/Solqaryn.Tests/TestResults/**/c1402-m0505-negative.trx', recursive=True)
          assert len(paths) == 1, f'Expected one TRX, got {len(paths)}'
          root = ET.parse(paths[0]).getroot()
          node = next((n for n in root.iter() if n.tag.endswith('}Counters') or n.tag == 'Counters'), None)
          assert node is not None, 'Missing test counters'
          counts = node.attrib
          print('C14-02.M05.05:', counts)
          assert int(counts.get('executed', '0')) >= 18
          assert int(counts.get('failed', '-1')) == 0
          assert int(counts.get('error', '-1')) == 0
          assert int(counts.get('notExecuted', '-1')) == 0
          PY
      - name: Keep TRX evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c14-02-m05-05-negative-trx
          path: backend/tests/Solqaryn.Tests/TestResults/**/c1402-m0505-negative.trx
          if-no-files-found: error
          retention-days: 14
