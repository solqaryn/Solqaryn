name: SOLQARYN - Prueba comercial dirigida

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]

permissions:
  contents: read

concurrency:
  group: solqaryn-directed-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  directed:
    name: SOLQARYN - Directed commercial scope
    if: ${{ !github.event.pull_request.draft && (startsWith(github.event.pull_request.head.ref, 'work/solqaryn-p') || startsWith(github.event.pull_request.head.ref, 'work/solqaryn-i8-') || startsWith(github.event.pull_request.head.ref, 'work/solqaryn-g0-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify immutable PR commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "DIRECTED_SHA=$EXPECTED_HEAD"
      # G0-001.C adds an Angular/Vitest regression. The original xUnit-only
      # directed gate returned zero matching tests; route only this exact PR
      # through the real Angular test, retaining fail-closed execution.
      - uses: actions/setup-node@v4
        if: ${{ github.event.pull_request.number == 3981 && github.event.pull_request.head.ref == 'work/solqaryn-g0-001-c' }}
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Run exact Angular directed regression G0-001.C, reject zero passes
        if: ${{ github.event.pull_request.number == 3981 && github.event.pull_request.head.ref == 'work/solqaryn-g0-001-c' }}
        working-directory: frontend
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          [[ "$PR_TITLE" == *'G0-001.C'* ]] || { echo 'DIRECTED_FRONTEND_SCOPE_MISMATCH'; exit 1; }
          spec='src/app/features/configuracion/empresa-administracion-card.component.spec.ts'
          test -f "$spec"
          grep -Fq "it('G0-001.C " "$spec" || { echo 'DIRECTED_FRONTEND_TEST_MISSING'; exit 1; }
          git fetch --no-tags --depth=1 origin "$PR_BASE_SHA"
          changed="$(git diff --name-only "$PR_BASE_SHA" "$EXPECTED_HEAD")"
          printf '%s\n' "$changed" | grep -Fx 'frontend/src/app/features/configuracion/empresa-administracion-card.component.spec.ts' >/dev/null
          while IFS= read -r path; do
            case "$path" in
              CHANGELOG_AI.md|frontend/src/app/features/configuracion/empresa-administracion-card.component.spec.ts|.github/workflows/solqaryn-commercial-directed.yml) ;;
              *) echo "DIRECTED_FRONTEND_UNRELATED_CHANGE:$path"; exit 1 ;;
            esac
          done <<< "$changed"
          npm install --global npm@11.19.0
          npm ci
          report="$RUNNER_TEMP/solqaryn-g0-001-c-directed.json"
          npm run test:unit -- --include 'app/features/configuracion/empresa-administracion-card.component.spec.ts' --filter 'G0-001[.]C' --reporters=json --output-file="$report"
          python3 - <<'PY'
          import json, os, sys
          path = os.path.join(os.environ['RUNNER_TEMP'], 'solqaryn-g0-001-c-directed.json')
          try:
              with open(path, encoding='utf-8') as f: report = json.load(f)
          except (OSError, ValueError) as error:
              sys.exit('DIRECTED_ANGULAR_REPORT_UNAVAILABLE: ' + str(error))
          matched = [a for suite in report.get('testResults', []) for a in suite.get('assertionResults', [])
                     if 'G0-001.C' in ((a.get('fullName') or '') + ' ' + (a.get('title') or ''))]
          if not matched or any(a.get('status') != 'passed' for a in matched) or report.get('numFailedTests', 0):
              sys.exit('DIRECTED_ANGULAR_NO_GO matched=%d failed=%s' % (len(matched), report.get('numFailedTests')))
          print('DIRECTED_ANGULAR_PASS matched=%d exact_head=%s' % (len(matched), os.environ['EXPECTED_HEAD']))
          PY
      - uses: actions/setup-dotnet@v4
        if: ${{ github.event.pull_request.number != 3981 || github.event.pull_request.head.ref != 'work/solqaryn-g0-001-c' }}
        with:
          dotnet-version: '10.0.401'
      - name: Restore backend solution
        if: ${{ github.event.pull_request.number != 3981 || github.event.pull_request.head.ref != 'work/solqaryn-g0-001-c' }}
        working-directory: backend
        run: dotnet restore Solqaryn.sln
      - name: Run scope-matched xUnit tests and reject zero matches
        if: ${{ github.event.pull_request.number != 3981 || github.event.pull_request.head.ref != 'work/solqaryn-g0-001-c' }}
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          filter="$(python3 - <<'PY'
          import os,re,sys
          title=os.environ['PR_TITLE']
          match=re.search(r'\b((?:P\d+|I8|G0)-\d{3}\.[A-Z])\b',title,re.I)
          if not match:
              sys.exit('DIRECTED_NO_VALID_COMMERCIAL_SCOPE')
          scope=match.group(1).upper()
          print(scope.replace('-','').replace('.',''))
          PY
          )"
          mkdir -p "$RUNNER_TEMP/solqaryn-directed"
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj \
            --configuration Release --no-restore \
            --filter "FullyQualifiedName~$filter" \
            --logger "trx;LogFileName=scope.trx" \
            --results-directory "$RUNNER_TEMP/solqaryn-directed"
          python3 - <<'PY'
          import os,sys,xml.etree.ElementTree as ET
          path=os.path.join(os.environ['RUNNER_TEMP'],'solqaryn-directed','scope.trx')
          root=ET.parse(path).getroot()
          counts=root.find('.//{*}Counters')
          if counts is None:
              sys.exit('DIRECTED_TRX_COUNTERS_UNAVAILABLE')
          total=int(counts.get('total','0'))
          passed=int(counts.get('passed','0'))
          failed=int(counts.get('failed','0'))
          errors=int(counts.get('error','0'))
          aborted=int(counts.get('aborted','0'))
          if total<1 or passed<1 or failed or errors or aborted:
              sys.exit('DIRECTED_SCOPE_NO_GO total=%d passed=%d failed=%d error=%d aborted=%d'%(total,passed,failed,errors,aborted))
          print('DIRECTED_SCOPE_PASS total=%d passed=%d exact_head=%s'%(total,passed,os.environ['EXPECTED_HEAD']))
          PY
