name: V17 C07-04.M04.03 - branding seguro de pedidos
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v17-c07-04-m04-03-branding.yml'
      - 'frontend/src/app/features/pedidos-venta/pedidos-venta.components.ts'
      - 'frontend/src/app/features/pedidos-venta/c07-04-m04-03-branding.component.ts'
      - 'frontend/src/app/features/pedidos-venta/c07-04-m04-03-branding.spec.ts'
      - 'frontend/e2e/c07-04-m04-03-branding.spec.ts'
permissions:
  contents: read
concurrency:
  group: v17-c0704-m0403-${{ github.sha }}
  cancel-in-progress: false
jobs:
  branding-private:
    name: C07-04.M04.03 - Vitest Angular y Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm compatible
        run: npm install --global npm@11.19.0
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Seis Vitest de opciones estrictas y revocación
        working-directory: frontend
        run: npm test -- --no-watch --no-progress --include=src/app/features/pedidos-venta/c07-04-m04-03-branding.spec.ts
      - name: Tipado lint y build production Angular
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Chromium nativo
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Servir localhost
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c07-04-m04-03.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c07-04-m04-03.log >&2
          exit 1
      - name: Tres Chromium privados y denegación
        working-directory: frontend
        run: npx playwright test e2e/c07-04-m04-03-branding.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Evidencia de fallo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-c0704-m0403
          path: |
            frontend/c07-04-m04-03.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
