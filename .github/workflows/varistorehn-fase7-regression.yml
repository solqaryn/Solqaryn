permissions:
  contents: read

concurrency:
  group: varistorehn-fase7-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Fase 7 - contrato backend de destacados
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore backend
        run: dotnet restore InventoryApp.sln

      - name: Build backend
        run: dotnet build InventoryApp.sln --configuration Release --no-restore

      - name: Pruebas focales de destacados, bootstrap y cache
        run: dotnet test InventoryApp.sln --configuration Release --no-build --filter "FullyQualifiedName~TiendaControllerDestacadosTests|FullyQualifiedName~TiendaBootstrapServiceTests|FullyQualifiedName~PublicStoreMemoryCacheTests|FullyQualifiedName~PublicStoreTenantKeyProviderTests|FullyQualifiedName~PublicStoreCacheInvalidationTests|FullyQualifiedName~CatalogoPublicoCacheTests|FullyQualifiedName~TiendaPublicaTests"

  frontend:
    name: Fase 7 - regresion publica acumulada
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint TypeScript y guardas Fases 1-7
        run: npm run lint

      - name: Build de produccion
        run: npm run build:prod

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Iniciar Angular
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > varistorehn-fase7-regression.log 2>&1 &

      - name: Esperar Angular
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/varistorehn > /dev/null; then
              echo 'Angular listo para la regresion publica de Fase 7.'
              exit 0
            fi
            sleep 2
          done
          echo 'Angular no respondio dentro del tiempo esperado.' >&2
          cat varistorehn-fase7-regression.log >&2 || true
          exit 1

      - name: Regresion Fase 1
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:varistorehn-fase1

      - name: Regresion Fase 2
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:varistorehn-fase2

      - name: Regresion Fase 3
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:varistorehn-fase3

      - name: Regresion Fase 4
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:varistorehn-fase4

      - name: Regresion Fase 5
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:varistorehn-fase5

      - name: Regresion Fase 6
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:varistorehn-fase6

      - name: Playwright Fase 7
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:varistorehn-fase7

      - name: Publicar evidencia frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: varistorehn-fase7-frontend
          path: |
            frontend/varistorehn-fase7-regression.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
