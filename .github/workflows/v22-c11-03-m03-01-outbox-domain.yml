name: V22 C11-03.M03.01 - Outbox domain adversarial rules
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Domain/AutomationV5/C1103OutboxEventDomainRules.cs'
      - 'backend/tests/Solqaryn.Tests/Domain/C1103M0301OutboxEventDomainRulesTests.cs'
      - '.github/workflows/v22-c11-03-m03-01-outbox-domain.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c1103-m0301-${{ github.sha }}
  cancel-in-progress: false
jobs:
  outbox-domain:
    name: C11-03.M03.01 - .NET 10 pure Domain positive and adversarial tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify Scope Lock
        run: node scripts/verify-project-scope.mjs
      - name: Restore real .NET 10 test project
        run: dotnet restore backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj
      - name: Build Release with warnings as errors in directed tests
        run: dotnet build backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore
      - name: Execute exact C11-03.M03.01 adversarial xUnit and verify TRX
        shell: bash
        run: |
          set -euo pipefail
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj \
            --configuration Release --no-build \
            --filter FullyQualifiedName~C1103M0301OutboxEventDomainRulesTests \
            --logger 'console;verbosity=normal' \
            --logger 'trx;LogFileName=c1103.trx'
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          paths = list(pathlib.Path("backend/tests/Solqaryn.Tests").rglob("c1103.trx"))
          if len(paths) != 1:
              raise SystemExit(f"Expected one directed TRX file, found {len(paths)}")
          counters = ET.parse(paths[0]).getroot().find(".//{*}Counters")
          if counters is None:
              raise SystemExit("Missing TRX Counters")
          counts = {key: int(counters.attrib.get(key, -1))
                    for key in ("total", "passed", "failed", "notExecuted")}
          print("C11-03.M03.01 exact xUnit counters:", counts)
          if counts["passed"] < 15 or counts["passed"] != counts["total"] or counts["failed"] != 0 or counts["notExecuted"] != 0:
              raise SystemExit("Required directed tests did not all pass")
          PY
