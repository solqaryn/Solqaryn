name: DEV - Expansión tenant comercial MySQL efímera

on:
  pull_request:
    branches: [dev]
    paths:
      - 'backend/src/Domain/Entities/**'
      - 'backend/src/Infrastructure/Persistence/**'
      - 'backend/src/Infrastructure.Migrations/**'
      - 'backend/tools/Solqaryn.DatabaseBootstrap/**'
      - '.github/workflows/tenant-commercial-root-expand-ephemeral.yml'
      - 'scripts/ci/commercial-tenant-legacy-fixture.sql'
      - 'scripts/ci/cleanup-orphan-tenant-fk-indexes.sh'
  push:
    branches: [dev]
    paths:
      - 'backend/src/Domain/Entities/**'
      - 'backend/src/Infrastructure/Persistence/**'
      - 'backend/src/Infrastructure.Migrations/**'
      - '.github/workflows/tenant-commercial-root-expand-ephemeral.yml'
      - 'scripts/ci/commercial-tenant-legacy-fixture.sql'
      - 'scripts/ci/cleanup-orphan-tenant-fk-indexes.sh'

permissions:
  contents: read

jobs:
  upgrade-ephemeral:
    name: MySQL 8.4 legado -> EmpresaId nullable sin perder filas
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_tenant_expand
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=solqaryn_tenant_expand;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'false'
      Jwt__Secret: 'Tenant-Root-Expand-CI-Only-Secret-At-Least-32-Characters-2026'
      Jwt__Issuer: 'Solqaryn.API'
      Jwt__Audience: 'Solqaryn.Frontend'
      AppSettings__BackendPublicUrl: 'https://ci.solqaryn.invalid'
      Cloudinary__CloudName: 'ci-not-used'
      Cloudinary__ApiKey: 'ci-not-used'
      Cloudinary__ApiSecret: 'ci-not-used'
    steps:
      - name: Checkout exact-head sin datos ni secretos reales
        uses: actions/checkout@v4
      - name: SDK .NET 10 fijado
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Compilar y verificar alcance
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-project-scope.mjs
          cd backend
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
          dotnet tool restore
          dotnet tool run dotnet-ef --version | grep -F '10.0.12'
      - name: Fresh canónico y restricciones Aiven
        shell: bash
        working-directory: backend
        env:
          SOLQARYN_DATABASE_BOOTSTRAP_MODE: fresh
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "solqaryn/Solqaryn"
          test "$ASPNETCORE_ENVIRONMENT" = "Development"
          test -n "$ConnectionStrings__DefaultConnection"
          mysql_container="${{ job.services.mysql.id }}"
          docker exec "$mysql_container" mysql -uroot -proot -e 'SET GLOBAL sql_require_primary_key=ON;'
          dotnet run --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj --configuration Release --no-build
          test "$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_tenant_expand -Nse "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261013121500_CommercialTenantRootExpand';")" = 1
      - name: Simular estrictamente estado legacy sin owner y sembrar registro
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          # SQL en fixture aislada: preserva la simulación legacy exacta.
          docker exec -i "$mysql_container" mysql -uroot -proot solqaryn_tenant_expand < scripts/ci/commercial-tenant-legacy-fixture.sql
          bash scripts/ci/cleanup-orphan-tenant-fk-indexes.sh "$mysql_container"
          test "$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_tenant_expand -Nse "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=database() AND table_name IN ('Productos','Clientes','Proveedores','Compras','Ventas') AND column_name='EmpresaId';")" = 0
          echo "TENANT_LEGACY_SCHEMA=PASS owner_columns=0 data_preserved=YES"
      - name: Aplicar migración EF Oracle real sobre legacy efímera
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet tool run dotnet-ef database update --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj --startup-project src/API/Solqaryn.API.csproj --context AppDbContext --configuration Release --no-build
          dotnet tool run dotnet-ef migrations has-pending-model-changes --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj --startup-project src/API/Solqaryn.API.csproj --context AppDbContext --configuration Release --no-build
      - name: Verificar DDL FK índice NULL histórico e idempotencia
        shell: bash
        working-directory: backend
        run: |
          set -euo pipefail
          mysql_container="${{ job.services.mysql.id }}"
          q(){ docker exec "$mysql_container" mysql -uroot -proot solqaryn_tenant_expand -Nse "$1"; }
          test "$(q "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=database() AND table_name IN ('Productos','Clientes','Proveedores','Compras','Ventas') AND column_name='EmpresaId' AND IS_NULLABLE='YES';")" = 5
          test "$(q "SELECT COUNT(DISTINCT table_name) FROM information_schema.statistics WHERE table_schema=database() AND index_name IN ('IX_Productos_EmpresaId','IX_Clientes_EmpresaId','IX_Proveedores_EmpresaId','IX_Compras_EmpresaId','IX_Ventas_EmpresaId');")" = 5
          test "$(q "SELECT COUNT(*) FROM information_schema.referential_constraints WHERE constraint_schema=database() AND constraint_name IN ('FK_Productos_Empresas_EmpresaId','FK_Clientes_Empresas_EmpresaId','FK_Proveedores_Empresas_EmpresaId','FK_Compras_Empresas_EmpresaId','FK_Ventas_Empresas_EmpresaId');")" = 5
          test "$(q "SELECT COUNT(*) FROM Proveedores WHERE Nombre='SOLQARYN-CI-LEGACY-PRESERVED' AND EmpresaId IS NULL;")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261013121500_CommercialTenantRootExpand';")" = 1
          # Incluye migración P4 de cuentas públicas por empresa, sin atribuir
          # ni perder registros históricos de prueba de los módulos P3.
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261018200000_TenantRoleOwnershipDeterministicBackfill';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261029150000_EnforceTenantRoleNameUniqueIndex';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory;")" = 16
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261014112000_PublicStoreAccountEmailPerEmpresa';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261013181500_CommercialTenantScopedRootIndexes';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261013190000_CommercialTenantInvoiceDocuments';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261013193000_CommercialTenantSalesDocuments';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261013210000_CommercialTenantTaxDiscountExpand';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261013220000_CommercialTenantOwnershipGraphExpand';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261013221500_CommercialTenantOwnershipGraphScopedFks';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261013230000_CommercialTenantRemainingModules';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261013231000_CommercialTenantRemainingScopedFks';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261014130000_CommercialTenantNaturalKeysPostStorefront';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261016095000_PublicStoreBindingsPersistence';")" = 1
          test "$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261016200000_PublicStoreProofReplayGuard';")" = 1
          # Nueva tabla tenant-safe: UUID no es autoridad; host/clave global deben ser únicos.
          test "$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='PublicStoreBindings';")" = 1
          test "$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='PublicStoreBindings' AND INDEX_NAME='UX_PublicStoreBindings_Host_Key' AND SEQ_IN_INDEX=1 AND COLUMN_NAME='Host' AND NON_UNIQUE=0;")" = 1
          test "$(q "SELECT COUNT(DISTINCT CONCAT(TABLE_NAME, '/', INDEX_NAME)) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND NON_UNIQUE=0 AND SEQ_IN_INDEX=1 AND COLUMN_NAME='EmpresaId' AND INDEX_NAME IN ('UX_DevolucionesCliente_Empresa_IdempotencyKey','UX_DevolucionesProveedor_Empresa_IdempotencyKey','UX_DevolucionesProveedor_Empresa_NumeroDevolucion','UX_OrdenesCompra_Empresa_IdempotencyKey','UX_OrdenesCompra_Empresa_NumeroOrden','UX_RecepcionesCompra_Empresa_IdempotencyKey','UX_RecepcionesCompra_Empresa_NumeroRecepcion','UX_ReservasInventario_Empresa_Numero','UX_SeriesInventario_Empresa_NumeroSerie','UX_SolicitudesCompra_Empresa_NumeroSolicitud','UX_Sucursales_Empresa_CodigoActivoUnico','UX_Roles_Empresa_NombreNormalizado');")" = 12
          test "$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND NON_UNIQUE=0 AND INDEX_NAME IN ('UX_DevolucionesCliente_IdempotencyKey','UX_DevolucionesProveedor_IdempotencyKey','UX_DevolucionesProveedor_NumeroDevolucion','UX_OrdenesCompra_IdempotencyKey','UX_OrdenesCompra_NumeroOrden','UX_RecepcionesCompra_IdempotencyKey','UX_RecepcionesCompra_NumeroRecepcion','UX_ReservasInventario_Numero','UX_SeriesInventario_NumeroSerie','UX_SolicitudesCompra_NumeroSolicitud','UX_Sucursales_Codigo_Activo','IX_Roles_NombreNormalizado');")" = 0
          test "$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.STATISTICS WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='Roles' AND INDEX_NAME='UX_Roles_NombreNormalizadoGlobalUnico' AND NON_UNIQUE=0;")" = 1
          dotnet tool run dotnet-ef database update --project src/Infrastructure.Migrations/Solqaryn.Infrastructure.Migrations.csproj --startup-project src/API/Solqaryn.API.csproj --context AppDbContext --configuration Release --no-build
          test "$(q "SELECT COUNT(*) FROM Proveedores WHERE Nombre='SOLQARYN-CI-LEGACY-PRESERVED' AND EmpresaId IS NULL;")" = 1
          echo "TENANT_ROOT_EXPAND=PASS fk=5 indexes=5 null_legacy=YES data_loss=NO idempotent=YES source=A_DISPOSABLE_MYSQL"
