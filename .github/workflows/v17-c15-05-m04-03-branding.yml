name: V17 C15-05.M04.03 - Branding tipado UI y Chromium
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/features/plataforma/auditoria-operativa-v5.component.ts'
      - 'frontend/src/app/features/plataforma/auditoria-operativa-v5-branding.spec.ts'
      - 'frontend/e2e/c15-05-m04-03-branding.spec.ts'
      - '.github/workflows/v17-c15-05-m04-03-branding.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v17-c15-05-m04-03-${{ github.sha }}
  cancel-in-progress: false
jobs:
  branding:
    name: V17 C15-05.M04.03 - Angular Vitest y Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm fijado
        run: npm install --global npm@11.19.0
      - name: npm ci reproducible
        run: npm ci
      - name: Lint Angular
        run: npm run lint
      - name: Build Angular producción
        run: npm run build:prod
      - name: Cuatro Vitest positivos y negativos
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/auditoria-operativa-v5-branding.spec.ts
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Angular local loopback sin proveedor externo
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > m0403-auditoria-angular.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then
              echo 'ANGULAR_LOCAL_READY=PASS'
              exit 0
            fi
            sleep 2
          done
          cat m0403-auditoria-angular.log >&2
          exit 1
      - name: Cuatro Chromium UI y denegaciones sintéticas
        run: npx playwright test e2e/c15-05-m04-03-branding.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Trazas de navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-c15-05-m04-03-browser
          path: |
            frontend/m0403-auditoria-angular.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
