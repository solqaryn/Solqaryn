name: V20 C15-01.M04.06 - densidad y carga progresiva
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c15-01-m04-06-density.spec.ts'
      - '.github/workflows/v20-c15-01-m04-06-density.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c15-01-m04-06-${{ github.sha }}
  cancel-in-progress: false
jobs:
  chromium:
    name: C15-01.M04.06 - tres pruebas Chromium reales
    runs-on: ubuntu-latest
    timeout-minutes: 42
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Angular tipado y build de produccion
        run: |
          npx tsc --noEmit -p tsconfig.app.json
          npm run build:prod
      - run: npx playwright install --with-deps chromium
      - name: Angular en loopback efimero
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c1501m0406.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c1501m0406.log >&2
          exit 1
      - name: Chromium densidad, gating y rechazos
        run: npx playwright test e2e/c15-01-m04-06-density.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v20-c15-01-m04-06-density
          path: |
            frontend/c1501m0406.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
