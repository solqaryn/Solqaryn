name: N2.3 - RecepcionCompra frontend CI

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/n23-recepciones-frontend.yml
      - frontend/e2e/recepciones-compra-shell.spec.ts
      - frontend/e2e/recepcion-compra-form-detail.spec.ts
      - frontend/src/app/app.component.ts
      - frontend/src/app/core/models/recepcion-compra.model.ts
      - frontend/src/app/services/recepcion-compra.service.ts
      - frontend/src/app/features/recepciones-compra/**
      - frontend/src/app/features/inventario/ajustes.routes.ts
      - frontend/src/app/app.routes.ts
      - backend/src/**
  pull_request:
    branches: [dev, main]
    paths:
      - .github/workflows/n23-recepciones-frontend.yml
      - frontend/e2e/recepciones-compra-shell.spec.ts
      - frontend/e2e/recepcion-compra-form-detail.spec.ts
      - frontend/src/app/app.component.ts
      - frontend/src/app/core/models/recepcion-compra.model.ts
      - frontend/src/app/services/recepcion-compra.service.ts
      - frontend/src/app/features/recepciones-compra/**
      - frontend/src/app/features/inventario/ajustes.routes.ts
      - frontend/src/app/app.routes.ts
      - backend/src/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n23-recepciones-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recepciones-frontend:
    name: Shell, formulario, detalle y RBAC
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_n23_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=solqaryn_n23_e2e;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'
      Jwt__Secret: 'N23-E2E-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'Solqaryn.API'
      Jwt__Audience: 'Solqaryn.Frontend'
      Jwt__ExpiraMinutos: '120'
      Security__LoginRateLimitPerMinute: '300'
      SeedAdmin__Username: 'e2e_admin'
      SeedAdmin__Password: 'E2E.Admin#2026!'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      Cors__AllowedOrigins__1: 'http://localhost:4200'
      AppSettings__BackendPublicUrl: 'https://preview.solqaryn.invalid'
      AppSettings__LogoPublicUrl: 'https://solqaryn-dev.vercel.app/assets/storefront-logo.png'
      Cloudinary__CloudName: 'e2e-not-used'
      Cloudinary__ApiKey: 'e2e-not-used'
      Cloudinary__ApiSecret: 'e2e-not-used'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
      PHASE7_ADMIN_USERNAME: 'e2e_admin'
      PHASE7_ADMIN_PASSWORD: 'E2E.Admin#2026!'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - name: Compilar backend
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: Bootstrap Oracle fresh para N2.3
        working-directory: backend
        env:
          SOLQARYN_DATABASE_BOOTSTRAP_MODE: fresh
        run: |
          set -euo pipefail
          dotnet run \
            --project tools/Solqaryn.DatabaseBootstrap/Solqaryn.DatabaseBootstrap.csproj \
            --configuration Release \
            --no-build
      - name: Iniciar API y migrar MySQL
        working-directory: backend
        shell: bash
        env:
          PORT: '5005'
        run: |
          set -euo pipefail
          nohup dotnet run --project src/API/Solqaryn.API.csproj --configuration Release --no-build --no-launch-profile > n23-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5005/health/ready > /dev/null; then exit 0; fi
            sleep 2
          done
          cat n23-api.log >&2 || true
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Lint, build e instalar Chromium
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build:prod
          npx playwright install --with-deps chromium
      - name: Iniciar Angular
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > n23-frontend.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/login > /dev/null; then exit 0; fi
            sleep 2
          done
          cat n23-frontend.log >&2 || true
          exit 1
      - name: Ejecutar E2E N2.3.E.1 y E.2
        working-directory: frontend
        run: npx playwright test e2e/recepciones-compra-shell.spec.ts e2e/recepcion-compra-form-detail.spec.ts --config=playwright.config.ts
      - name: Publicar evidencia N2.3 frontend
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n23-recepciones-frontend
          path: |
            backend/n23-api.log
            frontend/n23-frontend.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
