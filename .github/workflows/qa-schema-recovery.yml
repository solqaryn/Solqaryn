name: QA - Oracle EF10 schema read-only certification

on:
  push:
    branches: [qa]
    paths:
      - 'backend/**'
      - '.github/workflows/qa-schema-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-oracle-schema-preflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: QA schema Oracle EF10, solo lectura, fail-closed
    if: github.ref_name == 'qa'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: QA
    env:
      DB_HOST: ${{ vars.SOLQARYN_QA_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_QA_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_QA_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_QA_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_QA_DB_PASSWORD }}
    steps:
      - name: Checkout QA y verificar identidad
        uses: actions/checkout@v4

      - name: Verificar gobierno y binding QA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "qa"
          node scripts/verify-project-scope.mjs
          test "$DB_HOST" = "solqaryn-mysql-solqaryn.h.aivencloud.com"
          test "$DB_PORT" = "14402"
          test "$DB_NAME" = "solqaryn_qa"
          test "$DB_USER" = "solqaryn_qa_user"
          test -n "$DB_PASSWORD"
          echo "QA_ORACLE_SCOPE_AND_BINDING=PASS"

      - name: Instalar solo cliente MySQL
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Auditar esquema QA sin mutaciones ni migrations update
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$DB_PASSWORD"
          q() {
            mysql --protocol=TCP --connect-timeout=12 --ssl-mode=REQUIRED \
              -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" \
              --batch --skip-column-names "$DB_NAME" -e "$1"
          }

          version="$(q 'SELECT VERSION();')"
          case "$version" in
            8.4.8|8.4.8-*) ;;
            *) echo "QA_MYSQL_PATCH_MISMATCH: se exige Aiven MySQL 8.4.8 aprobado; no se actualiza automaticamente." >&2; exit 1 ;;
          esac
          echo "QA_AIVEN_MYSQL_VERSION=8.4.8"

          application_tables="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE='BASE TABLE' AND TABLE_NAME <> '__EFMigrationsHistory';")"
          test "$application_tables" = "136" || {
            echo "QA_ORACLE_SCHEMA_DRIFT: cantidad de tablas distinta de las 136 certificadas en DEV." >&2
            exit 1
          }

          history_table="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME='__EFMigrationsHistory';")"
          test "$history_table" = "1" || {
            echo "QA_ORACLE_SCHEMA_DRIFT: falta historial EF; prohibida la promocion." >&2
            exit 1
          }

          required_tables="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLES WHERE TABLE_SCHEMA=DATABASE() AND TABLE_NAME IN ('Empresas','Productos','ConfigEmpresas','AutomatizacionConfiguraciones','SuscripcionSaaSIdempotencia');")"
          test "$required_tables" = "5" || {
            echo "QA_ORACLE_SCHEMA_DRIFT: faltan tablas requeridas por OracleBaseline." >&2
            exit 1
          }

          history_count="$(q 'SELECT COUNT(*) FROM __EFMigrationsHistory;')"
          marker="$(q "SELECT COUNT(*) FROM __EFMigrationsHistory WHERE MigrationId='20261006111818_OracleBaseline';")"
          echo "QA_ORACLE_HISTORY_AUDIT=PASS app_tables=$application_tables history_count=$history_count oracle_marker=$marker"

          test "$marker" = "1" || {
            echo "QA_ORACLE_BASELINE=PENDING: certificacion QA bloqueada. Aplicar adoption Oracle con backup verificado y autorizacion separada; esta prueba es SOLO LECTURA." >&2
            exit 1
          }

          trigger_count="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TRIGGERS WHERE TRIGGER_SCHEMA=DATABASE() AND TRIGGER_NAME IN ('TR_MovimientosInventario_N06_OrigenTipado_BI','TR_MovimientosInventario_N06_OrigenTipado_BU');")"
          check_count="$(q "SELECT COUNT(*) FROM INFORMATION_SCHEMA.TABLE_CONSTRAINTS WHERE CONSTRAINT_SCHEMA=DATABASE() AND TABLE_NAME='MovimientosInventario' AND CONSTRAINT_TYPE='CHECK' AND CONSTRAINT_NAME='CK_MovimientosInventario_OrigenTipado_Exclusivo_N06';")"
          test "$trigger_count" = "2" && test "$check_count" = "1" || {
            echo "QA_ORACLE_PHYSICAL_CONTRACT=FAIL: triggers o CHECK faltantes; no promover backend." >&2
            exit 1
          }

          echo "QA_ORACLE_SCHEMA_CERT=PASS app_tables=136 baseline=1 triggers=2 check=1 mysql=8.4.8"
          echo "QA_DATABASE_WRITES=0"
