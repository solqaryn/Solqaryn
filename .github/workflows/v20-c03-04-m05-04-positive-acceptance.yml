name: V20 C03-04.M05.04 - real positive incident preflight acceptance
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Application/C0304M0504IncidentPositiveAcceptanceTests.cs'
      - 'backend/src/Application/AutomationV5/V5ContinuityIncidentApplicationService.cs'
      - '.github/workflows/v20-c03-04-m05-04-positive-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c0304-m0504-${{ github.sha }}
  cancel-in-progress: false
jobs:
  real-positive-preflight:
    name: C03-04.M05.04 - real Application acceptance xUnit
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Strict Scope Lock
        run: node scripts/verify-project-scope.mjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restore and build .NET 10 Release
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln -c Release --no-restore
      - name: Real Application positive and negative tests with TRX
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~C0304M0504IncidentPositiveAcceptanceTests' --logger 'trx;LogFileName=c0304-m0504-acceptance.trx' --logger 'console;verbosity=normal'
          python3 - <<'PY'
          import glob,xml.etree.ElementTree as ET
          files=glob.glob('tests/Solqaryn.Tests/TestResults/**/c0304-m0504-acceptance.trx',recursive=True)
          assert len(files)==1, f'expected one TRX, got {len(files)}'
          root=ET.parse(files[0]).getroot()
          node=next((n for n in root.iter() if n.tag.endswith('}Counters') or n.tag=='Counters'),None)
          assert node is not None
          c=node.attrib
          print('C03-04.M05.04',c)
          assert int(c.get('executed','0'))>=15
          assert int(c.get('failed','-1'))==0
          assert int(c.get('error','-1'))==0
          assert int(c.get('notExecuted','-1'))==0
          PY
      - name: Preserve real test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c03-04-m05-04-positive-xunit-trx
          path: backend/tests/Solqaryn.Tests/TestResults/**/c0304-m0504-acceptance.trx
          if-no-files-found: error
          retention-days: 14
