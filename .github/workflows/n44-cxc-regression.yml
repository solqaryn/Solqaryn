name: N4.4 - CxC regression

on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/API/Controllers/CuentasPorCobrarController.cs'
      - 'backend/tests/Solqaryn.Tests/API/Controllers/CuentasPorCobrarControllerTests.cs'
      - 'frontend/src/app/features/cuentas-por-cobrar/**'
      - 'frontend/src/app/services/factura.service.ts'
      - '.github/workflows/n44-cxc-regression.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/src/API/Controllers/CuentasPorCobrarController.cs'
      - 'backend/tests/Solqaryn.Tests/API/Controllers/CuentasPorCobrarControllerTests.cs'
      - 'frontend/src/app/features/cuentas-por-cobrar/**'
      - 'frontend/src/app/services/factura.service.ts'
      - '.github/workflows/n44-cxc-regression.yml'

permissions:
  contents: read

jobs:
  backend-cxc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore backend tests
        run: dotnet restore backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj
      - name: Run CxC API and RBAC regression
        run: dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --no-restore --configuration Release --filter "FullyQualifiedName~CuentasPorCobrarControllerTests"

  frontend-cxc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Run canonical CxC component regression
        run: npm test -- --watch=false --include=src/app/features/cuentas-por-cobrar/cuentas-por-cobrar.component.spec.ts
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend production
        run: npm run build:prod
