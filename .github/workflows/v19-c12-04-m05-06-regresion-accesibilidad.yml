name: V19 C12-04.M05.06 - regresion y accesibilidad privada
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c12-04-m05-06-regresion-accesibilidad.spec.ts'
      - '.github/workflows/v19-c12-04-m05-06-regresion-accesibilidad.yml'
      - 'frontend/src/app/features/plataforma/c12-04-m04-01-cutover-readonly.component.ts'
      - 'frontend/src/app/core/guards/plataforma.guard.ts'
      - 'frontend/src/app/core/auth/plataforma-sesion.service.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c1204-m0506-${{ github.sha }}
  cancel-in-progress: false
jobs:
  c1204-m0506:
    name: C12-04.M05.06 - Vitest y cuatro Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.0
      - name: Dependencias inmutables
        working-directory: frontend
        run: npm ci
      - name: Vitest contrato del componente
        working-directory: frontend
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c12-04-m04-01-cutover-readonly.component.spec.ts
      - name: Lint y build Angular
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Chromium en GitHub-hosted
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Angular efimero loopback
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > v19-c1204-m0506.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat v19-c1204-m0506.log >&2
          exit 1
      - name: Cuatro pruebas Playwright Chromium
        working-directory: frontend
        run: npx playwright test e2e/c12-04-m05-06-regresion-accesibilidad.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Evidencias de fallo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v19-c1204-m0506-failure
          path: |
            frontend/v19-c1204-m0506.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 7