name: SOLQARYN V5 - Procedencia CHANGELOG
on:
  push:
    branches: [dev]
    paths: ['CHANGELOG_AI.md', 'scripts/quality/verify-v5-changelog-provenance.mjs', '.github/workflows/v5-changelog-provenance.yml']
  pull_request:
    branches: [dev]
    paths: ['CHANGELOG_AI.md', 'scripts/quality/verify-v5-changelog-provenance.mjs', '.github/workflows/v5-changelog-provenance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solqaryn-v5-changelog-dev
  cancel-in-progress: true
jobs:
  provenance:
    name: V5 - Sin encabezados vacios ni atribucion cruzada
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
      - name: Node.js 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Auditar atribucion documental
        run: node scripts/quality/verify-v5-changelog-provenance.mjs
