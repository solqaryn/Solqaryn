name: SOLQARYN - Backup operativo de DEV

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/backup-dev-operativo.yml
      - scripts/backup_dev.sh
      - scripts/restore_dev.sh
      - .github/checkpoints/backup-request
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/backup-dev-operativo.yml
      - scripts/backup_dev.sh
      - scripts/restore_dev.sh
  workflow_dispatch:
  schedule:
    - cron: '30 07 * * *'

permissions:
  contents: read

env:
  RETENTION_DAYS: '14'

jobs:
  validar-definicion:
    name: Validar definición y protecciones de backup
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar sintaxis de scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/backup_dev.sh
          bash -n scripts/restore_dev.sh

      - name: Validar invariantes de seguridad
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'PROD' scripts/backup_dev.sh
          grep -q 'ALLOW_DESTRUCTIVE_RESTORE=YES_SOLQARYN_DISPOSABLE_RESTORE' scripts/restore_dev.sh
          grep -q 'DB_SSL_MODE' scripts/backup_dev.sh
          grep -q 'TARGET_DB_SSL_MODE' scripts/restore_dev.sh
          grep -q 'productionInScope' scripts/backup_dev.sh
          grep -q 'productionTouched' scripts/restore_dev.sh

  certificar-proveedor:
    name: Certificar motor y proveedor de DEV sin secretos
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'schedule' && vars.SOLQARYN_DEV_BACKUP_SCHEDULE_ENABLED == 'true') ||
        (github.event_name == 'push' && (contains(github.event.head_commit.message, '[SOLQARYN-PROVIDER-PROBE]') || contains(github.event.head_commit.message, '[SOLQARYN-BACKUP-REAL]')))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: DEV

    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Verificar configuración externa requerida
        shell: bash
        env:
          DB_HOST: ${{ vars.SOLQARYN_DEV_DB_HOST }}
          DB_PORT: ${{ vars.SOLQARYN_DEV_DB_PORT }}
          DB_NAME: ${{ vars.SOLQARYN_DEV_DB_NAME }}
          DB_USER: ${{ vars.SOLQARYN_DEV_DB_USER }}
          DB_PASSWORD: ${{ secrets.SOLQARYN_DEV_DB_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.SOLQARYN_DEV_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          declare -A source_names=(
            [DB_HOST]='SOLQARYN_DEV_DB_HOST (variable)'
            [DB_PORT]='SOLQARYN_DEV_DB_PORT (variable)'
            [DB_NAME]='SOLQARYN_DEV_DB_NAME (variable)'
            [DB_USER]='SOLQARYN_DEV_DB_USER (variable)'
            [DB_PASSWORD]='SOLQARYN_DEV_DB_PASSWORD (secret)'
            [BACKUP_PASSPHRASE]='SOLQARYN_DEV_BACKUP_PASSPHRASE (secret)'
          )
          for name in DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD BACKUP_PASSPHRASE; do
            if [ -z "${!name:-}" ]; then
              echo "Falta configuración externa requerida: ${source_names[$name]}." >&2
              exit 1
            fi
          done

      - name: Consultar motor y proveedor sin secretos
        shell: bash
        env:
          DB_HOST: ${{ vars.SOLQARYN_DEV_DB_HOST }}
          DB_PORT: ${{ vars.SOLQARYN_DEV_DB_PORT }}
          DB_NAME: ${{ vars.SOLQARYN_DEV_DB_NAME }}
          DB_USER: ${{ vars.SOLQARYN_DEV_DB_USER }}
          DB_PASSWORD: ${{ secrets.SOLQARYN_DEV_DB_PASSWORD }}
        run: |
          set -euo pipefail
          export MYSQL_PWD="$DB_PASSWORD"
          SOLQARYN_DB_VERSION="$(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --default-character-set=utf8mb4 --ssl-mode=REQUIRED "$DB_NAME" --batch --skip-column-names -e 'SELECT VERSION();' | head -n 1)"
          unset MYSQL_PWD
          test -n "$SOLQARYN_DB_VERSION"
          SOLQARYN_DB_HOST_SUFFIX="$(python3 - <<'PY'
          import os
          labels = [part for part in os.environ['DB_HOST'].strip().lower().split('.') if part]
          print('*.' + '.'.join(labels[-2:]) if len(labels) >= 2 else 'NON_DNS_HOST')
          PY
          )"
          case "$SOLQARYN_DB_HOST_SUFFIX" in
            '*.aivencloud.com') SOLQARYN_DB_PROVIDER='AIVEN' ;;
            *) SOLQARYN_DB_PROVIDER='UNCLASSIFIED_MANAGED_MYSQL' ;;
          esac
          export SOLQARYN_DB_VERSION SOLQARYN_DB_HOST_SUFFIX SOLQARYN_DB_PROVIDER
          certificate="$RUNNER_TEMP/solqaryn-provider-certificate.json"
          python3 - "$certificate" <<'PY'
          import json, os, sys
          from datetime import datetime, timezone
          report = {
              'databaseEngine': 'MySQL',
              'databaseVersion': os.environ['SOLQARYN_DB_VERSION'],
              'provider': os.environ['SOLQARYN_DB_PROVIDER'],
              'hostSuffix': os.environ['SOLQARYN_DB_HOST_SUFFIX'],
              'connectionTls': 'REQUIRED',
              'plan': 'NOT_AVAILABLE_FROM_DATABASE_CONNECTION',
              'automaticBackup': 'NOT_PROBED',
              'pitr': 'NOT_PROBED',
              'restoreCapability': 'LOGICAL_SAME_ARTIFACT_DRILL',
              'createdAtUtc': datetime.now(timezone.utc).isoformat(),
              'secretsExposed': 0,
              'productionTouched': False,
          }
          with open(sys.argv[1], 'w', encoding='utf-8') as out:
              json.dump(report, out, ensure_ascii=False, indent=2)
              out.write('\n')
          PY
          unset DB_PASSWORD
          cat "$certificate"
          echo "Certificado seguro guardado para este run."

      - name: Publicar certificado seguro de proveedor
        uses: actions/upload-artifact@v4
        with:
          name: solqaryn-provider-certificate-${{ github.run_id }}
          path: ${{ runner.temp }}/solqaryn-provider-certificate.json
          if-no-files-found: error
          retention-days: 14

  backup-dev:
    name: Backup cifrado de DEV real + restore/drill same-artifact
    needs: certificar-proveedor
    if: >-
      ${{
        needs.certificar-proveedor.result == 'success' &&
        (
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'schedule' && vars.SOLQARYN_DEV_BACKUP_SCHEDULE_ENABLED == 'true') ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[SOLQARYN-BACKUP-REAL]'))
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: DEV

    services:
      mysql-solqaryn-restore:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: solqaryn-ci-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -psolqaryn-ci-root-only --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Crear backup cifrado de DEV
        id: backup
        shell: bash
        env:
          SOLQARYN_ENVIRONMENT: dev
          DB_HOST: ${{ vars.SOLQARYN_DEV_DB_HOST }}
          DB_PORT: ${{ vars.SOLQARYN_DEV_DB_PORT }}
          DB_NAME: ${{ vars.SOLQARYN_DEV_DB_NAME }}
          DB_USER: ${{ vars.SOLQARYN_DEV_DB_USER }}
          DB_PASSWORD: ${{ secrets.SOLQARYN_DEV_DB_PASSWORD }}
          DB_SSL_MODE: REQUIRED
          BACKUP_PASSPHRASE: ${{ secrets.SOLQARYN_DEV_BACKUP_PASSPHRASE }}
          OUTPUT_DIR: ${{ runner.temp }}/solqaryn-backups
          RETENTION_DAYS: ${{ env.RETENTION_DAYS }}
          BACKUP_LABEL: dev
        run: |
          set -euo pipefail
          chmod +x scripts/backup_dev.sh
          scripts/backup_dev.sh | tee "$RUNNER_TEMP/solqaryn-backup-operativo.log"
          backup_file="$(grep '^SOLQARYN_BACKUP_FILE=' "$RUNNER_TEMP/solqaryn-backup-operativo.log" | cut -d= -f2-)"
          checksum_file="$(grep '^SOLQARYN_BACKUP_SHA256=' "$RUNNER_TEMP/solqaryn-backup-operativo.log" | cut -d= -f2-)"
          metadata_file="$(grep '^SOLQARYN_BACKUP_METADATA=' "$RUNNER_TEMP/solqaryn-backup-operativo.log" | cut -d= -f2-)"
          test -s "$backup_file"
          test -s "$checksum_file"
          test -s "$metadata_file"
          grep -q '"environment": "dev"' "$metadata_file"
          grep -q '"encrypted": true' "$metadata_file"
          grep -q '"productionInScope": false' "$metadata_file"
          echo "backup_file=$backup_file" >> "$GITHUB_OUTPUT"
          echo "checksum_file=$checksum_file" >> "$GITHUB_OUTPUT"
          echo "metadata_file=$metadata_file" >> "$GITHUB_OUTPUT"

      - name: Restore drill del mismo artifact en MySQL descartable
        id: restore
        shell: bash
        env:
          RESTORE_ENVIRONMENT: ci
          TARGET_DB_HOST: 127.0.0.1
          TARGET_DB_PORT: '3306'
          TARGET_DB_NAME: solqaryn_restore_drill
          TARGET_DB_USER: root
          TARGET_DB_PASSWORD: solqaryn-ci-root-only
          TARGET_DB_SSL_MODE: DISABLED
          BACKUP_PASSPHRASE: ${{ secrets.SOLQARYN_DEV_BACKUP_PASSPHRASE }}
          BACKUP_FILE: ${{ steps.backup.outputs.backup_file }}
          BACKUP_CHECKSUM_FILE: ${{ steps.backup.outputs.checksum_file }}
          ALLOW_DESTRUCTIVE_RESTORE: YES_SOLQARYN_DISPOSABLE_RESTORE
          RESTORE_FILES_DIR: ${{ runner.temp }}/solqaryn-restored-files
          RESTORE_REPORT_PATH: ${{ runner.temp }}/solqaryn-restore-report.json
        run: |
          set -euo pipefail
          test -s "$BACKUP_FILE"
          test -s "$BACKUP_CHECKSUM_FILE"
          chmod +x scripts/restore_dev.sh
          scripts/restore_dev.sh | tee "$RUNNER_TEMP/solqaryn-restore-operativo.log"
          report_file="$(grep '^SOLQARYN_RESTORE_REPORT=' "$RUNNER_TEMP/solqaryn-restore-operativo.log" | cut -d= -f2-)"
          test -s "$report_file"
          grep -q '"checksumsVerified": true' "$report_file"
          grep -q '"allTableRowCountsVerified": true' "$report_file"
          grep -q '"productionTouched": false' "$report_file"
          grep -q '"status": "SUCCESS"' "$report_file"
          echo "restore_report=$report_file" >> "$GITHUB_OUTPUT"

      - name: Publicar evidencia SOLQARYN cifrada y same-artifact drill
        uses: actions/upload-artifact@v4
        with:
          name: solqaryn-backup-dev-${{ github.run_id }}
          path: |
            ${{ steps.backup.outputs.backup_file }}
            ${{ steps.backup.outputs.checksum_file }}
            ${{ steps.backup.outputs.metadata_file }}
            ${{ steps.restore.outputs.restore_report }}
          if-no-files-found: error
          retention-days: 14
