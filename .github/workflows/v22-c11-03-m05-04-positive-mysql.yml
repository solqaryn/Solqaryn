name: V22 C11-03.M05.04 - MySQL 8.4 positive outbox acceptance
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/C1103M0504PositiveAcceptanceMysqlTests.cs'
      - '.github/workflows/v22-c11-03-m05-04-positive-mysql.yml'
      - 'backend/src/Application/Services/MensajeOutboxService.cs'
      - 'backend/src/Infrastructure/Repositories/MensajeOutboxRepository.cs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c1103-m0504-${{ github.sha }}
  cancel-in-progress: false
jobs:
  acceptance:
    name: C11-03.M05.04 - Oracle EF physical MySQL 8.4 positive replay tenant
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=c1103_m0504_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ApplyMigrationsOnStartup: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Scope Lock exact SHA
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Prove physical MySQL 8.4
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION();' | grep -E '^8[.]4[.]'
      - name: Build Release and xUnit isolated acceptance
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet build backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-restore
          mkdir -p "$RUNNER_TEMP/c1103-m0504"
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj -c Release --no-build --filter 'FullyQualifiedName~C1103M0504PositiveAcceptanceMysqlTests&Category=Integration' --logger 'trx;LogFileName=acceptance.trx' --results-directory "$RUNNER_TEMP/c1103-m0504"
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          p=os.path.join(os.environ['RUNNER_TEMP'],'c1103-m0504','acceptance.trx')
          c=next((x.attrib for x in ET.parse(p).getroot().iter() if x.tag.endswith('Counters')),None)
          if c is None: raise SystemExit('NO_TRX')
          n={k:int(c.get(k,-1)) for k in ('total','passed','failed','notExecuted')}
          print('MYSQL84_OUTBOX_ACCEPTANCE',n)
          if n!={'total':1,'passed':1,'failed':0,'notExecuted':0}:
              raise SystemExit('NOT_PASS')
          PY
