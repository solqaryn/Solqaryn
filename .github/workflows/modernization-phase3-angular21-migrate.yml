name: Modernización - Aplicar Angular 20 a 21 DEV
# trigger: final Angular 21 migration

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/modernization-phase3-angular21-migrate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modernization-phase3-angular21-migrate-dev-v4
  cancel-in-progress: true

jobs:
  migrate:
    name: ng update oficial Angular 20 a 21
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Scope y baseline Angular 20
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-project-scope.mjs
          test -z "$(git status --porcelain)"
          cd frontend
          test "$(node -v)" = "v24.21.0"
          test "$(npm -v)" = "11.19.0"
          npm ci
          test "$(node -p "require('./package.json').dependencies['@angular/core']")" = "20.3.33"

      - name: ng update Core y CLI 20 a 21
        timeout-minutes: 12
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package @angular/cli@21.2.24 ng update @angular/cli@21.2.24 @angular/core@21.2.25

      - name: Alinear Vitest para Angular build 21
        timeout-minutes: 6
        working-directory: frontend
        run: npm install --save-dev --save-exact vitest@4.1.11

      - name: ng update Material y CDK 20 a 21
        timeout-minutes: 12
        working-directory: frontend
        shell: bash
        env:
          npm_config_yes: 'true'
        run: |
          set -euo pipefail
          npx --yes --package @angular/cli@21.2.24 ng update @angular/material@21.2.14 --allow-dirty

      - name: Alinear TypeScript y builder de tests Angular 21
        timeout-minutes: 8
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev typescript@~5.9.3
          npm install --save-dev --save-exact @angular/build@21.2.24
          node <<'NODE'
          const fs = require('fs');
          const path = 'angular.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const architect = data.projects?.['solqaryn-frontend']?.architect;
          const build = architect?.build;
          const test = architect?.test;
          if (!build || !test) throw new Error('No se encontraron los targets build/test de solqaryn-frontend');
          if (build.builder !== '@angular-devkit/build-angular:application') {
            throw new Error('Builder de producción inesperado: ' + build.builder);
          }
          test.options ||= {};
          test.options.runnerConfig = 'vitest-base.config.ts';
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          console.log('ANGULAR21_BUILD_TARGET=@angular-devkit/build-angular:application');
          console.log('ANGULAR21_TEST_RUNNER_CONFIG=vitest-base.config.ts');
          NODE
          cat > vitest-base.config.ts <<'EOF'
          import { defineConfig } from 'vitest/config';

          export default defineConfig({
            test: {
              globalSetup: ['./vitest-global-teardown.ts'],
            },
          });
          EOF
          cat > vitest-global-teardown.ts <<'EOF'
          export function setup(): void {}

          export function teardown(): void {
            const exitCode = process.exitCode ?? 0;
            setTimeout(() => process.exit(exitCode), 10_000).unref();
          }
          EOF

      - name: Verificar versiones migradas
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:toolchain
          test "$(node -p "require('./package.json').dependencies['@angular/core']")" = "21.2.25"
          test "$(node -p "require('./package.json').devDependencies['@angular/cli']")" = "21.2.24"
          test "$(node -p "require('./package.json').devDependencies['@angular/build']")" = "21.2.24"
          test "$(node -p "require('./package.json').devDependencies['@angular-devkit/build-angular']")" = "21.2.24"
          grep -q '@angular-devkit/build-angular:application' angular.json
          grep -q '@angular/build:unit-test' angular.json
          grep -q 'vitest-base.config.ts' angular.json
          test -f vitest-base.config.ts
          test -f vitest-global-teardown.ts
          test "$(node -p "require('./package.json').dependencies['@angular/material']")" = "21.2.14"
          test "$(node -p "require('./package.json').dependencies['@angular/cdk']")" = "21.2.14"
          test "$(node -p "require('./package.json').devDependencies['@angular/build']")" = "21.2.24"
          test "$(node -p "require('./package.json').devDependencies['vitest']")" = "4.1.11"
          test "$(node -p "require('typescript/package.json').version")" = "5.9.3"
          test "$(node -p "require('vitest/package.json').version")" = "4.1.11"
          npx ng version

      - name: Unit tests pre-publicación
        timeout-minutes: 6
        working-directory: frontend
        run: npm test -- --no-watch --no-progress

      - name: Lint pre-publicación
        working-directory: frontend
        run: npm run lint

      - name: Audit productivo pre-publicación
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build PROD pre-publicación
        timeout-minutes: 4
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -f fase3-build-prepush.log
          set +e
          timeout --signal=TERM --kill-after=10s 120s npm run build:prod 2>&1 | tee fase3-build-prepush.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "ANGULAR21_BUILD_EXIT=0"
            exit 0
          fi
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            if grep -q 'Output location:' fase3-build-prepush.log \
              && ! grep -q 'Application bundle generation failed' fase3-build-prepush.log \
              && ! grep -q 'An unhandled exception occurred' fase3-build-prepush.log \
              && test -n "$(find dist/solqaryn-frontend -type f -name index.html -print -quit)"; then
              echo "ANGULAR21_BUILD_SUCCESS_WITH_KNOWN_EXIT_HANG=PASS"
              exit 0
            fi
          fi
          echo "Angular 21 build failed or did not produce a complete artifact. exit=$code" >&2
          exit "$code"

      - name: Commit y push DEV
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/node_modules frontend/dist
          node scripts/verify-project-scope.mjs
          test -n "$(git status --porcelain frontend)"
          git config user.name "solqaryn-platform"
          git config user.email "solqaryn.platform@outlook.com"
          git add frontend
          git commit -m "feat(modernization): migrate Angular 20 to 21"
          git pull --rebase origin dev
          node scripts/verify-project-scope.mjs
          git push origin HEAD:dev
