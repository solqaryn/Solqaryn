name: V5 - Browser real de rutas de plataforma DEV

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v5-plataforma-browser-guards.yml'
      - 'frontend/e2e/v5-plataforma-browser-guards.spec.ts'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/src/app/features/plataforma/plataforma.component.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-plataforma-browser-${{ github.sha }}
  cancel-in-progress: false

jobs:
  browser-v5:
    name: V5 - Chromium real, rutas, denegaciones y responsive
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
      - name: Node.js fijo
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm compatible
        run: npm install --global npm@11.19.0
      - name: Dependencias bloqueadas
        working-directory: frontend
        run: npm ci
      - name: Lint y compilacion Angular
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Chromium oficial Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Angular dev server local no PROD
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > v5-plataforma-browser.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then
              echo 'LOCAL_ANGULAR_READY=PASS'
              exit 0
            fi
            sleep 2
          done
          cat v5-plataforma-browser.log >&2
          exit 1
      - name: Browser positivo/negativo y responsive, sin auth real
        working-directory: frontend
        run: npx playwright test e2e/v5-plataforma-browser-guards.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Publicar trazas sinteticas de navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v5-plataforma-browser-evidence
          path: |
            frontend/v5-plataforma-browser.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
