name: V19 C05-01.M05.01 - contrato unitario catalogo privado
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/features/plataforma/c05-01-m05-01-unit-contract.spec.ts'
      - '.github/workflows/v19-c05-01-m05-01-unit-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c05-01-m05-01-${{ github.sha }}
  cancel-in-progress: false
jobs:
  unit-contract:
    name: V19 C05-01.M05.01 - cinco pruebas Angular de contrato
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
      - name: Node24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Npm fijado
        run: npm install --global npm@11.19.0
      - name: Dependencias reproducibles
        run: npm ci
      - name: Contrato positivo negativo frontera error
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c05-01-m05-01-unit-contract.spec.ts
      - name: Tipado lint y Angular produccion
        run: |
          npm run lint
          npm run build:prod
