name: V20 C14-02.M05.02 - Safe API DTO contract negatives
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Application/C1402M0502SafeApiContractTests.cs'
      - 'backend/src/Application/AutomationV5/C1402SecurityAcceptanceAuthorizationGate.cs'
      - '.github/workflows/v20-c14-02-m05-02-api-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v20-c1402-m0502-${{ github.sha }}
  cancel-in-progress: false
jobs:
  safe-contract:
    name: C14-02.M05.02 - .NET 10 safe DTO negative tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Scope Lock STRICT
        run: node scripts/verify-project-scope.mjs
      - name: Restore and build .NET 10 Release
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: Real xUnit API DTO negative preflight
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~C1402M0502SafeApiContractTests" --logger "console;verbosity=normal"
