name: V19 C15-04.M05.01 - contrato unitario de auditoria UX
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/features/plataforma/c15-04-m05-01-contract.spec.ts'
      - '.github/workflows/v19-c15-04-m05-01-unit.yml'
      - 'frontend/src/app/features/plataforma/c15-04-auditoria-ux-v19.component.*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c15-04-m05-01-${{ github.sha }}
  cancel-in-progress: false
jobs:
  vitest:
    name: C15-04.M05.01 - cinco contratos Angular Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm institucional
        run: npm install --global npm@11.19.0
      - name: Dependencias reproducibles
        run: npm ci
      - name: Cinco pruebas Vitest del contrato
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/c15-04-m05-01-contract.spec.ts
      - name: Tipado, reglas y Angular produccion
        run: |
          npm run lint
          npm run build:prod
