name: QA - Candidato de dependencias npm

on:
  push:
    branches: [qa]
    paths:
      - '.github/workflows/qa-npm-candidate.yml'

permissions:
  contents: read

jobs:
  candidate:
    if: github.repository == 'solqaryn/Solqaryn' && github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
      - name: Verify QA scope
        working-directory: .
        run: node scripts/verify-project-scope.mjs
      - name: Generate targeted lockfile candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'JS'
          const fs = require('node:fs');
          const path = 'package.json';
          const p = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (p.devDependencies['@angular/cli'] !== '22.2.1') {
            throw new Error('QA baseline Angular CLI changed');
          }
          p.overrides = {
            ...p.overrides,
            'fast-uri': '3.1.9',
            undici: '8.12.4',
            zod: '4.6.6',
          };
          fs.writeFileSync(path, JSON.stringify(p, null, 2) + '\n');
          JS
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --check
          node <<'JS'
          const assert = require('node:assert/strict');
          const lock = require('./package-lock.json');
          for (const [name, expected] of Object.entries({
            'fast-uri': '3.1.9', undici: '8.12.4', zod: '4.6.6'
          })) {
            const packages = Object.entries(lock.packages).filter(([key]) =>
              key === 'node_modules/' + name || key.endsWith('/node_modules/' + name));
            assert.ok(packages.length, 'Missing ' + name);
            for (const [, entry] of packages) {
              assert.equal(entry.version, expected);
              assert.match(entry.integrity, /^sha512-/);
            }
          }
          assert.equal(lock.packages['node_modules/@angular/cli'].version, '22.2.1');
          JS
      - name: Validate candidate
        run: |
          set -euo pipefail
          npm ci --no-fund
          npm audit --audit-level=moderate
          npm audit --omit=dev --audit-level=moderate
          npm run lint
          npm run build:prod
          node scripts/validate-environment-routing.mjs
      - name: Preserve validated manifests only
        uses: actions/upload-artifact@v4
        with:
          name: qa-npm-validated-candidate
          path: |
            frontend/package.json
            frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Export checked manifest delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --no-ext-diff -- package.json package-lock.json > "$RUNNER_TEMP/qa-manifests.diff"
          test -s "$RUNNER_TEMP/qa-manifests.diff"
          test "$(wc -c < "$RUNNER_TEMP/qa-manifests.diff")" -le 24576
          git diff --check
          git hash-object package.json package-lock.json | paste -sd, - | sed 's/^/QA_NPM_GIT_BLOBS=/'
          base64 -w 0 "$RUNNER_TEMP/qa-manifests.diff" | sed 's/^/QA_NPM_PATCH_BASE64=/'
          printf '\n'
