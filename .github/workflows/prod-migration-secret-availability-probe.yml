name: PROD - Migration secret availability probe

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/prod-migration-secret-availability-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: LEGACY_DEV_MIGRATION
    env:
      LEGACY_DB_PASSWORD: ${{ secrets.LEGACY_DEV_DB_PASSWORD }}
      LEGACY_BACKUP_PASSPHRASE: ${{ secrets.LEGACY_DEV_BACKUP_PASSPHRASE }}
      PROD_DB_PASSWORD: ${{ secrets.SOLQARYN_PROD_DB_PASSWORD }}
      AIVEN_TOKEN: ${{ secrets.SOLQARYN_AIVEN_TOKEN }}
      PROD_DB_HOST: ${{ vars.SOLQARYN_PROD_DB_HOST }}
      PROD_DB_PORT: ${{ vars.SOLQARYN_PROD_DB_PORT }}
      PROD_DB_NAME: ${{ vars.SOLQARYN_PROD_DB_NAME }}
      PROD_DB_USER: ${{ vars.SOLQARYN_PROD_DB_USER }}
    steps:
      - name: Report names-only availability
        shell: bash
        run: |
          set -euo pipefail
          check() { if [ -n "${!1:-}" ]; then echo "$1=PRESENT"; else echo "$1=ABSENT"; fi; }
          check LEGACY_DB_PASSWORD
          check LEGACY_BACKUP_PASSPHRASE
          check PROD_DB_PASSWORD
          check AIVEN_TOKEN
          check PROD_DB_HOST
          check PROD_DB_PORT
          check PROD_DB_NAME
          check PROD_DB_USER
          echo "SECRET_VALUES_PRINTED=FALSE"
