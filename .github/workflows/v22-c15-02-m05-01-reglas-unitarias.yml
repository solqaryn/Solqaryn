name: V22 C15-02.M05.01 - reglas unitarias de fuente local
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/features/plataforma/c15-02-m05-01-reglas.component.spec.ts'
      - 'frontend/src/app/features/plataforma/c15-02-m04-01-revision-arquitectura.component.ts'
      - '.github/workflows/v22-c15-02-m05-01-reglas-unitarias.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c1502-m0501-${{ github.sha }}
  cancel-in-progress: false
jobs:
  reglas:
    name: C15-02.M05.01 - unitarias positivo negativo frontera error
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm 11 fijado
        run: npm install --global npm@11.19.0
      - name: Instalar lockfile
        run: npm ci
      - name: Lint tipado y build
        run: |
          npm run lint
          npm run build:prod
      - name: Test unitario real por include
        run: npx ng test --watch=false --no-progress --include='src/app/features/plataforma/c15-02-m05-01-reglas.component.spec.ts'
