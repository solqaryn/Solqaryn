name: Modernización - Aplicar Angular 21 a 22 DEV

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/modernization-phase4-angular22-migrate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modernization-phase4-angular22-migrate-dev
  cancel-in-progress: true

jobs:
  migrate:
    name: ng update oficial Angular 21 a 22
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Scope y baseline Angular 21 certificado
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-project-scope.mjs
          test -z "$(git status --porcelain)"
          cd frontend
          test "$(node -v)" = "v24.21.0"
          test "$(npm -v)" = "11.19.0"
          npm ci
          test "$(node -p "require('./package.json').dependencies['@angular/core']")" = "21.2.25"
          test "$(node -p "require('./package.json').devDependencies['@angular/cli']")" = "21.2.24"
          test "$(node -p "require('./package.json').dependencies['@angular/material']")" = "21.2.14"
          test "$(node -p "require('./package.json').dependencies['@angular/cdk']")" = "21.2.14"

      - name: ng update Core y CLI 21 a 22
        timeout-minutes: 15
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package @angular/cli@22.2.1 ng update @angular/cli@22.2.1 @angular/core@22.2.1

      - name: ng update Material y CDK 21 a 22
        timeout-minutes: 15
        working-directory: frontend
        shell: bash
        env:
          npm_config_yes: 'true'
        run: |
          set -euo pipefail
          npx --yes --package @angular/cli@22.2.1 ng update @angular/material@22.2.1 --allow-dirty

      - name: Fijar matriz exacta Fase 4
        timeout-minutes: 12
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-exact \
            @angular/animations@22.2.1 \
            @angular/cdk@22.2.1 \
            @angular/common@22.2.1 \
            @angular/compiler@22.2.1 \
            @angular/core@22.2.1 \
            @angular/forms@22.2.1 \
            @angular/material@22.2.1 \
            @angular/platform-browser@22.2.1 \
            @angular/platform-browser-dynamic@22.2.1 \
            @angular/router@22.2.1 \
            rxjs@7.8.2 \
            tslib@2.8.1 \
            zone.js@0.16.3
          npm install --save-dev --save-exact \
            @angular/cli@22.2.1 \
            @angular/compiler-cli@22.2.1 \
            @angular-devkit/build-angular@22.2.1 \
            @angular/build@22.2.1 \
            typescript@6.0.3

      - name: Preservar arquitectura Zone.js
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const path='angular.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const build=data.projects?.['solqaryn-frontend']?.architect?.build;
          if (!build) throw new Error('No existe target build canónico');
          build.options ||= {};
          const current=build.options.polyfills;
          if (!Array.isArray(current)) {
            build.options.polyfills=['zone.js'];
          } else if (!current.includes('zone.js')) {
            build.options.polyfills=['zone.js', ...current];
          }
          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          console.log('ZONEJS_POLYFILL=PRESERVED');
          NODE
          ! grep -R -n --exclude-dir=node_modules --exclude-dir=dist 'provideZonelessChangeDetection' src

      - name: Reinstalación limpia y verificación exacta
        timeout-minutes: 12
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci
          npm run verify:toolchain
          node <<'NODE'
          const fs=require('fs');
          const p=require('./package.json');
          const expected={
            '@angular/animations':'22.2.1',
            '@angular/cdk':'22.2.1',
            '@angular/common':'22.2.1',
            '@angular/compiler':'22.2.1',
            '@angular/core':'22.2.1',
            '@angular/forms':'22.2.1',
            '@angular/material':'22.2.1',
            '@angular/platform-browser':'22.2.1',
            '@angular/platform-browser-dynamic':'22.2.1',
            '@angular/router':'22.2.1',
            'rxjs':'7.8.2',
            'tslib':'2.8.1',
            'zone.js':'0.16.3',
            '@angular/cli':'22.2.1',
            '@angular/compiler-cli':'22.2.1',
            '@angular-devkit/build-angular':'22.2.1',
            '@angular/build':'22.2.1',
            'typescript':'6.0.3',
            'vitest':'4.1.11'
          };
          for (const [name,want] of Object.entries(expected)) {
            const got=p.dependencies?.[name] ?? p.devDependencies?.[name];
            if (got !== want) throw new Error(`${name}: expected ${want}, got ${got}`);
          }
          const a=JSON.parse(fs.readFileSync('angular.json','utf8'));
          const architect=a.projects?.['solqaryn-frontend']?.architect;
          if (architect?.build?.builder !== '@angular/build:application') throw new Error('builder build inesperado');
          if (architect?.serve?.builder !== '@angular/build:dev-server') throw new Error('builder serve inesperado');
          if (architect?.test?.builder !== '@angular/build:unit-test') throw new Error('builder test inesperado');
          if (!architect?.build?.options?.polyfills?.includes('zone.js')) throw new Error('zone.js no preservado');
          console.log('ANGULAR22_EXACT_MATRIX=PASS');
          console.log('ZONELESS_CONVERSION=false');
          NODE
          npx ng version
          npm ls @angular/core @angular/cli @angular/material @angular/cdk @angular-devkit/build-angular @angular/build @angular/compiler-cli typescript rxjs tslib zone.js vitest --depth=0

      - name: Unit tests pre-publicación
        timeout-minutes: 6
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout --signal=TERM 180s ./node_modules/.bin/ng test --watch=false --no-progress 2>&1 | tee /tmp/angular22-unit.log
          status=${PIPESTATUS[0]}
          set -e
          sed -E 's/\x1B\[[0-9;]*[mK]//g' /tmp/angular22-unit.log > /tmp/angular22-unit.clean.log
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            exit "$status"
          fi
          grep -Eq 'Test Files[[:space:]]+58 passed.*\(58\)' /tmp/angular22-unit.clean.log
          grep -Eq 'Tests[[:space:]]+217 passed.*\(217\)' /tmp/angular22-unit.clean.log
          ! grep -Eq '([0-9]+ failed|FAIL )' /tmp/angular22-unit.clean.log
          echo "ANGULAR22_UNIT_TESTS=PASS files=58/58 tests=217/217 processStatus=$status"

      - name: Lint pre-publicación
        working-directory: frontend
        run: npm run lint

      - name: Audit productivo pre-publicación
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Build configuración production pre-publicación (sin deploy)
        timeout-minutes: 5
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          rm -f fase4-build-prepush.log
          set +e
          timeout --signal=TERM --kill-after=10s 150s npm run build:prod 2>&1 | tee fase4-build-prepush.log
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" -eq 0 ]; then
            echo "ANGULAR22_BUILD_EXIT=0"
            exit 0
          fi
          if [ "$code" -eq 124 ] || [ "$code" -eq 143 ]; then
            if grep -q 'Output location:' fase4-build-prepush.log \
              && ! grep -q 'Application bundle generation failed' fase4-build-prepush.log \
              && ! grep -q 'An unhandled exception occurred' fase4-build-prepush.log \
              && test -n "$(find dist/solqaryn-frontend -type f -name index.html -print -quit)"; then
              echo "ANGULAR22_BUILD_SUCCESS_WITH_KNOWN_EXIT_HANG=PASS"
              exit 0
            fi
          fi
          echo "Angular 22 build failed or did not produce a complete artifact. exit=$code" >&2
          exit "$code"

      - name: Scope final y commit/push DEV
        shell: bash
        run: |
          set -euo pipefail
          rm -rf frontend/node_modules frontend/dist frontend/fase4-build-prepush.log
          node scripts/verify-project-scope.mjs
          test -n "$(git status --porcelain frontend)"
          test -z "$(git status --porcelain | grep -v '^.. frontend/' || true)"
          git config user.name "solqaryn-platform"
          git config user.email "solqaryn.platform@outlook.com"
          git add frontend
          git commit -m "feat(modernization): migrate Angular 21 to 22.2.1"
          git pull --rebase origin dev
          node scripts/verify-project-scope.mjs
          git push origin HEAD:dev
