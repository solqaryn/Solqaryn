name: PROD - Historical Cloudinary inventory

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/prod-historical-cloudinary-inventory.yml

permissions:
  contents: read
  actions: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: LEGACY_DEV_MIGRATION
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: legacy_inventory
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      BACKUP_PASSPHRASE: ${{ secrets.LEGACY_DEV_BACKUP_PASSPHRASE }}
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=legacy_inventory;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: "false"
      Jwt__Secret: Historical-Inventory-Only-JWT-Secret-At-Least-32-Characters-2026
      Cloudinary__CloudName: inventory-not-used
      Cloudinary__ApiKey: inventory-not-used
      Cloudinary__ApiSecret: inventory-not-used
      Cloudinary__EnvironmentPrefix: solqaryn_prod
      Smtp__Host: 127.0.0.1
      Smtp__Port: "2525"
      Smtp__OAuth2ClientId: inventory-not-used
      Smtp__OAuth2RefreshToken: inventory-not-used
      Smtp__UsuarioSmtp: inventory@example.invalid
      Smtp__NombreRemitente: SOLQARYN INVENTORY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y mysql-client gnupg jq >/dev/null
          dotnet tool install --global dotnet-ef --version 8.0.8 >/dev/null

      - name: Download and verify historical backup
        uses: actions/download-artifact@v4
        with:
          name: solqaryn-legacy-prod-defaultdb-backup-36228394479
          run-id: 36228394479
          github-token: ${{ github.token }}
          path: /tmp/legacy-backup

      - name: Restore and migrate historical copy locally
        shell: bash
        run: |
          set -euo pipefail
          encrypted="$(find /tmp/legacy-backup -type f -name '*.tar.gz.gpg' | head -n1)"
          checksum="$(find /tmp/legacy-backup -type f -name '*.gpg.sha256' | head -n1)"
          test -n "$encrypted" && test -n "$checksum" && test -n "$BACKUP_PASSPHRASE"
          test "$(sha256sum "$encrypted" | awk '{print $1}')" = "$(awk '{print $1}' "$checksum")"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0 \
            --decrypt --output /tmp/legacy.tar.gz "$encrypted"
          mkdir -p /tmp/legacy
          tar -C /tmp/legacy -xzf /tmp/legacy.tar.gz
          (cd /tmp/legacy && sha256sum -c MANIFEST.sha256)
          export MYSQL_PWD=root
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root --ssl-mode=REQUIRED -e \
            "DROP DATABASE IF EXISTS legacy_inventory; CREATE DATABASE legacy_inventory CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root --ssl-mode=REQUIRED legacy_inventory < /tmp/legacy/defaultdb.sql
          cd backend
          dotnet restore InventoryApp.sln >/dev/null
          dotnet ef database update \
            --project src/Infrastructure/InventoryApp.Infrastructure.csproj \
            --startup-project src/API/InventoryApp.API.csproj \
            --context AppDbContext >/dev/null
          echo "HISTORICAL_RESTORE_AND_MIGRATE=PASS"

      - name: Inventory Cloudinary references
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          mysqlc=(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root --ssl-mode=REQUIRED legacy_inventory --batch --skip-column-names)
          : > /tmp/cloudinary-columns.tsv
          "${mysqlc[@]}" -e "
            SELECT TABLE_NAME, COLUMN_NAME
            FROM INFORMATION_SCHEMA.COLUMNS
            WHERE TABLE_SCHEMA='legacy_inventory'
              AND DATA_TYPE IN ('char','varchar','text','tinytext','mediumtext','longtext')
              AND (
                LOWER(COLUMN_NAME) REGEXP 'url|imagen|image|logo|public|archivo|document|foto|avatar'
              )
            ORDER BY TABLE_NAME, ORDINAL_POSITION;" > /tmp/candidate-columns.tsv

          total_refs=0
          cloud_hosts=/tmp/cloud-hosts.txt
          : > "$cloud_hosts"
          while IFS=$'\t' read -r table column; do
            [ -n "$table" ] || continue
            count="$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM \`$table\` WHERE \`$column\` LIKE '%res.cloudinary.com%' OR \`$column\` LIKE '%cloudinary.com%';")"
            nonempty="$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM \`$table\` WHERE \`$column\` IS NOT NULL AND TRIM(\`$column\`) <> '';")"
            if [ "$count" -gt 0 ] || [ "$nonempty" -gt 0 ]; then
              printf '%s\t%s\t%s\t%s\n' "$table" "$column" "$nonempty" "$count" >> /tmp/cloudinary-columns.tsv
            fi
            if [ "$count" -gt 0 ]; then
              total_refs=$((total_refs + count))
              "${mysqlc[@]}" -e "SELECT DISTINCT \`$column\` FROM \`$table\` WHERE \`$column\` LIKE '%res.cloudinary.com%' OR \`$column\` LIKE '%cloudinary.com%' LIMIT 200;" \
                | sed -E 's#(https?://[^/]+).*#\1#' >> "$cloud_hosts"
            fi
          done < /tmp/candidate-columns.tsv

          sort -u "$cloud_hosts" > /tmp/cloud-hosts-unique.txt
          host_count="$(grep -c . /tmp/cloud-hosts-unique.txt || true)"
          rows="$(wc -l < /tmp/cloudinary-columns.tsv | tr -d ' ')"
          jq -n \
            --argjson totalRefs "$total_refs" \
            --argjson columns "$rows" \
            --argjson uniqueHosts "$host_count" \
            --arg hosts "$(paste -sd ',' /tmp/cloud-hosts-unique.txt)" \
            '{status:"PASS",cloudinaryReferences:$totalRefs,candidateColumnsWithData:$columns,uniqueCloudinaryHosts:$uniqueHosts,hostsCsv:$hosts,productionWrites:0}' \
            > /tmp/cloudinary-inventory.json
          cat /tmp/cloudinary-inventory.json
          echo "CLOUDINARY_HISTORICAL_INVENTORY=PASS"
          echo "PRODUCTION_WRITES=0"

      - name: Export exact legacy product-image manifest
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root --ssl-mode=REQUIRED legacy_inventory --batch --skip-column-names \
            -e "SELECT Id, Url, PublicId FROM ProductoImagenes ORDER BY Id;" > /tmp/product-images.tsv
          rows="$(wc -l < /tmp/product-images.tsv | tr -d ' ')"
          test "$rows" = "351"
          bad_cloud="$(awk -F '\t' '$2 !~ /https:\/\/res\.cloudinary\.com\/vyijnqzq\// {c++} END {print c+0}' /tmp/product-images.tsv)"
          test "$bad_cloud" = "0"
          python3 - <<'PY'
          import csv, json
          rows=[]
          with open('/tmp/product-images.tsv', encoding='utf-8') as f:
              for row in csv.reader(f, delimiter='\t'):
                  rows.append({"id": int(row[0]), "url": row[1], "publicId": row[2]})
          assert len(rows) == 351
          with open('/tmp/product-images-manifest.json','w',encoding='utf-8') as f:
              json.dump({"sourceCloud":"vyijnqzq","expectedRows":351,"items":rows},f,separators=(',',':'))
          PY
          echo "CLOUDINARY_EXACT_MANIFEST=PASS"
          echo "CLOUDINARY_SOURCE_CLOUD=vyijnqzq"
          echo "CLOUDINARY_PRODUCT_IMAGE_ROWS=351"

      - uses: actions/upload-artifact@v4
        with:
          name: prod-historical-cloudinary-inventory-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            /tmp/cloudinary-inventory.json
            /tmp/cloudinary-columns.tsv
            /tmp/product-images-manifest.json
