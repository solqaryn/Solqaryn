name: V19 C15-04.M04.06 - ligereza UI Chromium
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c15-04-m04-06-lightness.spec.ts'
      - '.github/workflows/v19-c15-04-m04-06-lightness.yml'
      - 'frontend/src/app/features/plataforma/c15-04-auditoria-ux-v19.component.*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c15-04-m04-06-${{ github.sha }}
  cancel-in-progress: false
jobs:
  chromium:
    name: V19 C15-04.M04.06 - tres pruebas ligereza Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
      - name: Node 24 reproducible
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Npm fijado
        run: npm install --global npm@11.19.0
      - name: Dependencias reproducibles
        run: npm ci
      - name: Lint y Angular build
        run: |
          npm run lint
          npm run build:prod
      - name: Chromium efimero
        run: npx playwright install --with-deps chromium
      - name: Angular efimero en loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c1504m0406-angular.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then
              echo 'ANGULAR_LOCAL_READY=PASS'
              exit 0
            fi
            sleep 2
          done
          cat c1504m0406-angular.log >&2
          exit 1
      - name: Tres pruebas dirigidas Chromium
        run: npx playwright test e2e/c15-04-m04-06-lightness.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Artefactos de fallos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v19-c15-04-m04-06-lightness
          path: |
            frontend/c1504m0406-angular.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
