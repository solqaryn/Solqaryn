name: V22 C11-03.M03.04 - outbox isolated Oracle EF MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Infrastructure/Repositories/C1103OutboxTenantEvidenceAdapter.cs'
      - 'backend/tests/Solqaryn.Tests/C1103M0304IsolatedMysqlOutboxAdapterTests.cs'
      - '.github/workflows/v22-c11-03-m03-04-isolated-mysql.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c1103-m0304-${{ github.sha }}
  cancel-in-progress: false
jobs:
  tenant-adapter:
    name: C11-03.M03.04 - Oracle EF MySQL 8.4 real adapter isolation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=c1103_m0304_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify Scope Lock
        run: node scripts/verify-project-scope.mjs
      - name: Verify physical MySQL version
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION();' | grep -E '^8[.]4[.]'
      - name: Build Release and execute physical MySQL adapter assertions
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet build backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~C1103M0304IsolatedMysqlOutboxAdapterTests&Category=Integration' --logger 'trx;LogFileName=c1103-isolated-mysql.trx'
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files=list(pathlib.Path('backend/tests/Solqaryn.Tests').rglob('c1103-isolated-mysql.trx'))
          if len(files)!=1: raise SystemExit('C1103_MYSQL84_MISSING_UNIQUE_TRX')
          counts=ET.parse(files[0]).getroot().find('.//{*}Counters')
          if counts is None: raise SystemExit('C1103_MYSQL84_NO_COUNTERS')
          values={k:int(counts.attrib.get(k,-1)) for k in ('total','passed','failed','notExecuted')}
          print('C1103_MYSQL84_REAL_ADAPTER',values)
          if values!={'total':1,'passed':1,'failed':0,'notExecuted':0}:
              raise SystemExit('C1103_MYSQL84_REAL_ADAPTER_FAIL_CLOSED')
          PY
