name: V22 C07-04.M06.04 - rollback comercial aislado MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/C0704M0503MySqlPedidosIntegrationTests.cs'
      - '.github/workflows/v22-c07-04-m06-04-rollback.yml'
      - 'docs/evidencias/C07-04.M06.04-V22.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0704-m0604-${{ github.sha }}
  cancel-in-progress: false
jobs:
  mysql-ephemeral:
    name: C07-04.M06.04 - rollback tenant A/B MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=v22_c0704m0604_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Scope Lock exact SHA
        run: node scripts/verify-project-scope.mjs
      - name: Version MySQL efimera real
        shell: bash
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION()' | grep -E '^8[.]4[.]'
      - name: xUnit Release MySQL real, cuatro casos, TRX estricto
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release \
            --filter 'FullyQualifiedName~C0704M0503MySqlPedidosIntegrationTests&Category=Integration' \
            --logger 'trx;LogFileName=c0704m0604.trx' --logger 'console;verbosity=normal'
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path('tests/Solqaryn.Tests/TestResults').glob('**/c0704m0604.trx'))
          assert len(files)==1, f'Expected one TRX, got {len(files)}'
          root=ET.parse(files[0]).getroot()
          c=next((e.attrib for e in root.iter() if e.tag.endswith('Counters')), None)
          assert c and tuple(int(c[k]) for k in ('executed','passed','failed','notExecuted')) == (4,4,0,0), c
          print('V22_REAL_MYSQL84_COMMERCIAL_ROLLBACK_TENANT_AB=4/4')
          PY
