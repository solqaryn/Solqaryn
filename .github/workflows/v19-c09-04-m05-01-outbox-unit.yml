name: V19 C09-04.M05.01 - replay y revocacion outbox
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/C0904M0305OutboxTenantWorkerTests.cs'
      - '.github/workflows/v19-c09-04-m05-01-outbox-unit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c09-04-m05-01-${{ github.sha }}
  cancel-in-progress: false
jobs:
  reglas:
    name: C09-04.M05.01 - xUnit reglas no duplicacion
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: xUnit Release - outbox tenant y replay
        run: |
          dotnet test backend/tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --filter 'FullyQualifiedName~C0904M0305OutboxTenantWorkerTests' --logger 'console;verbosity=normal'
