name: PROD - Historical Cloudinary source verification

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/prod-historical-cloudinary-source-verify.yml

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download certified exact manifest
        uses: actions/download-artifact@v4
        with:
          name: prod-historical-cloudinary-inventory-36297134701
          run-id: 36297134701
          github-token: ${{ github.token }}
          path: /tmp/manifest

      - name: Verify all 351 legacy assets are reachable
        shell: bash
        run: |
          set -euo pipefail
          manifest=/tmp/manifest/product-images-manifest.json
          test -s "$manifest"
          test "$(jq -r '.sourceCloud' "$manifest")" = "vyijnqzq"
          test "$(jq -r '.expectedRows' "$manifest")" = "351"
          jq -r '.items[].url' "$manifest" > /tmp/urls.txt
          test "$(wc -l < /tmp/urls.txt | tr -d ' ')" = "351"
          awk '$0 !~ /^https:\/\/res\.cloudinary\.com\/vyijnqzq\/image\/upload\// {bad++} END {exit bad ? 1 : 0}' /tmp/urls.txt
          : > /tmp/failures.txt

      - name: Probe source URLs concurrently
        shell: bash
        run: |
          set -euo pipefail
          check_one() {
            url="$1"
            if ! curl --fail --silent --show-error --max-time 30 --output /dev/null "$url"; then
              printf '%s\n' "$url" >> /tmp/failures.txt
            fi
          }
          export -f check_one
          : > /tmp/failures.txt
          xargs -r -n1 -P8 bash -c 'check_one "$1"' _ < /tmp/urls.txt
          failures="$(wc -l < /tmp/failures.txt | tr -d ' ')"
          test "$failures" = "0"
          echo "CLOUDINARY_LEGACY_SOURCE_ASSETS=351"
          echo "CLOUDINARY_LEGACY_SOURCE_REACHABLE=351"
          echo "CLOUDINARY_LEGACY_SOURCE_FAILURES=0"
          echo "PRODUCTION_WRITES=0"
