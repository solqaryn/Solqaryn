name: V25 - C08-03.M03.03 signed JWT HTTP Oracle MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Integration/C0803M0303RealMysql84HttpIntegrationTests.cs'
      - 'backend/src/API/Security/C0803GymVerifiedActorSource.cs'
      - '.github/workflows/v25-c08-03-m03-03-jwt-mysql84-http.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v25-c0803-m0303-mysql84-isolated
  cancel-in-progress: false
jobs:
  signed-jwt-http-mysql:
    name: C08-03.M03.03 - signed JWT HTTP Oracle EF MySQL 8.4 real
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v25-only
          MYSQL_DATABASE: solqaryn_c1502_m0503
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v25-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C1502_M0503_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=solqaryn_c1502_m0503;User=root;Password=ephemeral-v25-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Exact SHA and Scope Lock
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Real signed JWT HTTP and Oracle MySQL 8.4 tenant A/B
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~C0803M0303RealMysql84HttpIntegrationTests' --logger 'trx;LogFileName=C0803M0303Mysql84.trx' --verbosity normal
