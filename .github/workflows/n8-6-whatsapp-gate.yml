name: N8.6 WhatsApp frontend causal gate

on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/core/services/whatsapp-share.service.ts'
      - 'frontend/src/app/core/services/whatsapp-share.service.spec.ts'
      - 'frontend/src/app/core/services/factura-whatsapp-handoff.contract.spec.ts'
      - 'frontend/src/app/features/facturas/factura-view.component.ts'
      - 'frontend/angular.json'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/n8-6-whatsapp-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n8-6-whatsapp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-whatsapp:
    name: WhatsApp handoff directed tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout DEV commit
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run directed WhatsApp handoff tests
        run: >-
          npm test -- --watch=false
          --include=src/app/core/services/whatsapp-share.service.spec.ts
          --include=src/app/core/services/factura-whatsapp-handoff.contract.spec.ts

      - name: Type-check and quality lint
        run: npm run lint

      - name: Production build
        run: npm run build:prod
