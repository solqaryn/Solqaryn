name: V19 C12-04.M05.03 - Oracle EF MySQL 8.4 cutover A/B efimero
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/C1204M0503MySqlCutoverProviderIntegrationTests.cs'
      - '.github/workflows/v19-c12-04-m05-03-cutover-mysql.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c1204-m0503-${{ github.sha }}
  cancel-in-progress: false
jobs:
  mysql-ephemeral:
    name: C12-04.M05.03 - EF Oracle MySQL 8.4 A/B y checksum
    runs-on: ubuntu-latest
    timeout-minutes: 50
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=v19_cutover_bootstrap;User=root;Password=root;SslMode=Disabled;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401
      - name: Scope Lock estricto
        run: node scripts/verify-project-scope.mjs
      - name: Confirmar servidor efimero MySQL 8.4
        run: |
          set -euo pipefail
          docker exec "${{ job.services.mysql.id }}" mysql -uroot -proot -Nse 'SELECT VERSION();' | grep -E '^8[.]4[.]'
      - name: Tests Category Integration y TRX causal
        working-directory: backend
        run: |
          set -euo pipefail
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --filter 'FullyQualifiedName~C1204M0503MySqlCutoverProviderIntegrationTests&Category=Integration' --logger 'trx;LogFileName=c1204-m0503.trx' --logger 'console;verbosity=normal'
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          paths = list(Path("tests/Solqaryn.Tests/TestResults").rglob("c1204-m0503.trx"))
          assert paths, "No TRX: pruebas no acreditadas"
          root = ET.parse(paths[-1]).getroot()
          counters = next((x.attrib for x in root.iter() if x.tag.endswith("Counters")), None)
          assert counters is not None, "No contadores TRX"
          assert int(counters["executed"]) >= 3, counters
          assert int(counters["passed"]) >= 3, counters
          assert int(counters["failed"]) == 0, counters
          assert int(counters["notExecuted"]) == 0, counters
          print("C12_04_M05_03_MYSQL84_INTEGRATION_PASS=TRUE")
          PY
