name: V19 C09-04.M04.02 - estados UI multicanal
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v19-c09-04-m04-02-estados.yml'
      - 'frontend/src/app/features/plataforma/c09-04-m04-02-estados.component.ts'
      - 'frontend/src/app/features/plataforma/c09-04-m04-02-estados.spec.ts'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/e2e/v19-c09-04-m04-02-estados-ruta.spec.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c0904-m0402-${{ github.sha }}
  cancel-in-progress: false
jobs:
  estados-privados:
    name: C09-04.M04.02 - Angular TestBed y build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm compatible
        run: npm install --global npm@11.19.0
      - name: Instalar dependencias bloqueadas
        working-directory: frontend
        run: npm ci
      - name: Ejecutar ocho pruebas adversariales reales
        working-directory: frontend
        run: npm test -- --watch=false --include=src/app/features/plataforma/c09-04-m04-02-estados.spec.ts
      - name: Tipado, lint y build Angular
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Servidor Angular loopback
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c0904m0402.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c0904m0402.log >&2
          exit 1
      - name: Chromium de ruta real con sesion HTTP sintetica
        working-directory: frontend
        run: npx playwright test e2e/v19-c09-04-m04-02-estados-ruta.spec.ts --config=playwright.config.ts --workers=1 --retries=0
