name: V22 C01-02.M04.06 - Densidad, carga progresiva y ligereza de capacidades
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c01-02-m04-06-density-progress.spec.ts'
      - '.github/workflows/v22-c01-02-m04-06-safe-navigation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c01-02-m04-06-${{ github.sha }}
  cancel-in-progress: false
jobs:
  progressive-capabilities:
    name: C01-02.M04.06 - Chromium densidad y carga progresiva
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Scope Lock antes de dependencias
        working-directory: .
        run: node scripts/verify-project-scope.mjs
      - name: Npm fijado
        run: npm install --global npm@11.19.0
      - name: Dependencias fijas
        run: npm ci
      - name: Lint y build Angular
        run: |
          npm run lint
          npm run build:prod
      - name: Chromium efimero
        run: npx playwright install --with-deps chromium
      - name: Servidor Angular loopback
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c0102m0406.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then
              echo 'ANGULAR_LOCAL_READY=PASS'
              exit 0
            fi
            sleep 2
          done
          cat c0102m0406.log >&2
          exit 1
      - name: Tres pruebas Chromium responsive y a11y
        run: npx playwright test e2e/c01-02-m04-06-density-progress.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Evidencias navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v22-c01-02-m04-06-chromium
          path: |
            frontend/c0102m0406.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
