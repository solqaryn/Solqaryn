name: N6.8 - Storage isolation regression

on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Application/Interfaces/IImageStorageService.cs'
      - 'backend/src/Application/Interfaces/ICompraDocumentoStorageService.cs'
      - 'backend/src/Application/Interfaces/StorageTenantContext.cs'
      - 'backend/src/Infrastructure/Services/CloudinaryFolderResolver.cs'
      - 'backend/src/Infrastructure/Services/CloudinaryImageStorageService.cs'
      - 'backend/src/Infrastructure/Services/CloudinaryCompraDocumentoStorageService.cs'
      - 'backend/tests/Solqaryn.Tests/Application/Storage/**'
      - 'backend/tests/Solqaryn.Tests/Priority3FileSecurityTests.cs'
      - 'backend/tests/Solqaryn.Tests/CloudinaryEnvironmentIsolationTests.cs'
      - '.github/workflows/n6-8-storage-isolation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: n6-8-storage-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-isolation:
    name: Tenant ownership, locators and file security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
          cache: true
          cache-dependency-path: backend/**/*.csproj
      - name: Restore backend
        working-directory: backend
        run: dotnet restore Solqaryn.sln
      - name: Build backend Release
        working-directory: backend
        run: dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: Verify isolated storage regressions
        working-directory: backend
        run: >-
          dotnet test Solqaryn.sln --configuration Release --no-build
          --filter "FullyQualifiedName~Application.Storage.CloudinaryTenantOwnershipTests|FullyQualifiedName~Application.Storage.StorageTenantContextTests|FullyQualifiedName~Priority3FileSecurityTests|FullyQualifiedName~CloudinaryEnvironmentIsolationTests"
