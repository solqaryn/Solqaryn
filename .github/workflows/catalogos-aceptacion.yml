name: DEV - aceptación funcional integral
# Fase 5: exact-head Playwright runtime pin

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/catalogos-aceptacion.yml
      - frontend/e2e/**
      - frontend/scripts/**
      - frontend/package.json
      - frontend/src/**
      - backend/src/**
      - backend/tests/**
      - scripts/fase7_*
      - scripts/fase8_*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-aceptacion-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Módulos, cargas, sesión, catálogos, variantes, accesibilidad, facturación y correo
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: solqaryn_catalogos_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      ASPNETCORE_ENVIRONMENT: Development
      PORT: '5005'
      ConnectionStrings__DefaultConnection: 'Server=127.0.0.1;Port=3306;Database=solqaryn_catalogos_e2e;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;'
      Database__ServerVersion: '8.4.0'
      Database__ApplyMigrationsOnStartup: 'true'
      Jwt__Secret: 'Catalogos-E2E-Only-Secret-With-More-Than-32-Characters-2026'
      Jwt__Issuer: 'Solqaryn.API'
      Jwt__Audience: 'Solqaryn.Frontend'
      Jwt__ExpiraMinutos: '120'
      Security__LoginRateLimitPerMinute: '300'
      SeedAdmin__Username: 'e2e_admin'
      SeedAdmin__Password: 'E2E.Admin#2026!'
      Cors__AllowedOrigins__0: 'http://127.0.0.1:4200'
      Cors__AllowedOrigins__1: 'http://localhost:4200'
      AppSettings__BackendPublicUrl: 'https://preview.solqaryn.invalid'
      AppSettings__LogoPublicUrl: ''
      AppSettings__EnlacePublicoFacturaHorasValidez: '1'
      AppSettings__EnlacePublicoFacturaMaximoAccesos: '5'
      AppSettings__CorreoFacturaIdempotenciaMinutos: '15'
      Cloudinary__CloudName: 'e2e-not-used'
      Cloudinary__ApiKey: 'e2e-not-used'
      Cloudinary__ApiSecret: 'e2e-not-used'
      Smtp__Host: '127.0.0.1'
      Smtp__Port: '1025'
      Smtp__UsuarioSmtp: 'smtp-user'
      Smtp__UsarSsl: 'false'
      Smtp__RequiereAutenticacion: 'false'
      Smtp__CorreoRemitente: 'facturas@dev.test'
      Smtp__CorreoRespuesta: 'soporte@dev.test'
      Smtp__NombreRemitente: 'Solqaryn E2E'
      Smtp__TimeoutSeconds: '10'
      Smtp__MaxAttempts: '3'
      Smtp__RetryBaseDelayMilliseconds: '100'
      SMTP_CAPTURE_DIR: '/tmp/solqaryn-smtp'
      SMTP_CAPTURE_HOST: '127.0.0.1'
      SMTP_CAPTURE_PORT: '1025'
      SMTP_CAPTURE_USERNAME: 'smtp-user'
      SMTP_CAPTURE_PASSWORD: 'smtp-pass'
      SMTP_CAPTURE_REQUIRE_AUTH: 'false'
      SMTP_FAIL_FIRST_MESSAGES: '1'
      PHASE7_API_URL: 'http://127.0.0.1:5005'
      PHASE7_ADMIN_USERNAME: 'e2e_admin'
      PHASE7_ADMIN_PASSWORD: 'E2E.Admin#2026!'
      E2E_TENANT_ID: '1'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'

    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          cache: true
          cache-dependency-path: backend/**/*.csproj

      - name: Restaurar y compilar backend
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore

      - name: Iniciar SMTP efímero con captura
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$SMTP_CAPTURE_DIR"
          mkdir -p "$SMTP_CAPTURE_DIR"
          nohup python3 scripts/fase7_fake_smtp.py > fase7-smtp.log 2>&1 &
          echo $! > fase7-smtp.pid
          for attempt in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/1025) >/dev/null 2>&1; then
              echo 'SMTP efímero disponible.'
              exit 0
            fi
            sleep 1
          done
          cat fase7-smtp.log >&2 || true
          exit 1

      - name: Iniciar API con MySQL descartable
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          nohup dotnet run \
            --project src/API/Solqaryn.API.csproj \
            --configuration Release \
            --no-build \
            --no-launch-profile \
            > catalogos-api.log 2>&1 &
          echo $! > catalogos-api.pid

      - name: Esperar API, migraciones y disponibilidad de base
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5005/health > /dev/null && \
               curl --fail --silent http://127.0.0.1:5005/health/ready > /dev/null; then
              echo 'API lista, base disponible y migraciones aplicadas.'
              exit 0
            fi
            sleep 2
          done
          cat catalogos-api.log >&2 || true
          exit 1

      - name: Preparar tenant E2E para SeedAdmin
        shell: bash
        run: |
          set -euo pipefail
          mysql_container="$(docker ps --filter 'ancestor=mysql:8.4' --format '{{.ID}}' | head -n 1)"
          if [[ -z "$mysql_container" ]]; then
            echo 'No se encontró el contenedor MySQL 8.4 de la suite de aceptación.' >&2
            exit 1
          fi

          docker exec -i "$mysql_container" mysql -uroot -proot solqaryn_catalogos_e2e <<'SQL'
          INSERT INTO `Empresas` (`Id`,`Nombre`,`Activa`,`FechaCreacion`,`FechaActualizacion`)
          VALUES (1,'Empresa E2E Acceptance',TRUE,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6))
          ON DUPLICATE KEY UPDATE
            `Activa`=TRUE,
            `FechaActualizacion`=UTC_TIMESTAMP(6);

          INSERT INTO `UsuarioEmpresas` (`UsuarioId`,`EmpresaId`,`RolId`,`Activa`,`FechaCreacion`,`FechaActualizacion`)
          SELECT u.`Id`,1,u.`RolId`,TRUE,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)
          FROM `Usuarios` u
          WHERE u.`NombreUsuario`='e2e_admin'
            AND NOT EXISTS (
              SELECT 1
              FROM `UsuarioEmpresas` ue
              WHERE ue.`UsuarioId`=u.`Id` AND ue.`EmpresaId`=1
            );

          INSERT INTO `Planes` (`Codigo`,`Nombre`,`Activo`,`FechaCreacion`,`FechaActualizacion`)
          VALUES ('E2E_ACCEPTANCE','Plan E2E Acceptance',TRUE,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6))
          ON DUPLICATE KEY UPDATE
            `Nombre`=VALUES(`Nombre`),
            `Activo`=TRUE,
            `FechaActualizacion`=UTC_TIMESTAMP(6);

          SET @e2e_plan_id := (
            SELECT `Id`
            FROM `Planes`
            WHERE `Codigo`='E2E_ACCEPTANCE'
            LIMIT 1
          );

          INSERT INTO `Suscripciones` (`EmpresaId`,`PlanId`,`Estado`,`InicioUtc`,`FinUtc`,`FechaCreacion`,`FechaActualizacion`)
          SELECT 1,@e2e_plan_id,1,UTC_TIMESTAMP(6) - INTERVAL 1 DAY,NULL,UTC_TIMESTAMP(6),UTC_TIMESTAMP(6)
          WHERE @e2e_plan_id IS NOT NULL
            AND NOT EXISTS (
              SELECT 1
              FROM `Suscripciones`
              WHERE `EmpresaId`=1
                AND `Estado`=1
                AND `InicioUtc` <= UTC_TIMESTAMP(6)
                AND (`FinUtc` IS NULL OR `FinUtc` > UTC_TIMESTAMP(6))
            );
          SQL

          membership_count="$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_catalogos_e2e -Nse "SELECT COUNT(*) FROM UsuarioEmpresas ue INNER JOIN Usuarios u ON u.Id=ue.UsuarioId INNER JOIN Empresas e ON e.Id=ue.EmpresaId WHERE u.NombreUsuario='e2e_admin' AND e.Id=1 AND e.Activa=TRUE AND ue.Activa=TRUE;")"
          if [[ "$membership_count" != '1' ]]; then
            echo "La membresía tenant E2E del SeedAdmin no quedó materializada: count=$membership_count" >&2
            exit 1
          fi

          subscription_count="$(docker exec "$mysql_container" mysql -uroot -proot solqaryn_catalogos_e2e -Nse "SELECT COUNT(*) FROM Suscripciones WHERE EmpresaId=1 AND Estado=1 AND InicioUtc <= UTC_TIMESTAMP(6) AND (FinUtc IS NULL OR FinUtc > UTC_TIMESTAMP(6));")"
          if [[ "$subscription_count" != '1' ]]; then
            echo "La suscripción SaaS activa del tenant E2E no quedó materializada: count=$subscription_count" >&2
            exit 1
          fi

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/package-lock.json') }}

      - name: Instalar frontend y Chromium
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          test "$(node -p "require('./node_modules/@playwright/test/package.json').version")" = "1.63.0"
          test "$(node -p "require('./node_modules/playwright-core/package.json').version")" = "1.63.0"
          test "$(npx playwright --version)" = "Version 1.63.0"
          echo 'PLAYWRIGHT_E2E_RUNTIME=1.63.0'
          npx playwright install --with-deps chromium

      - name: Validar tipado y calidad estática
        working-directory: frontend
        run: npm run lint

      - name: Iniciar Angular
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup env -u PORT npm start -- --host 127.0.0.1 --port 4200 > catalogos-frontend.log 2>&1 &
          echo $! > catalogos-frontend.pid

      - name: Esperar Angular
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/login > /dev/null; then
              echo 'Angular listo.'
              exit 0
            fi
            sleep 2
          done
          cat catalogos-frontend.log >&2 || true
          exit 1

      - name: Ejecutar aceptación Playwright integral
        working-directory: frontend
        run: |
          npx playwright test \
            e2e/catalogos-mantenimientos.spec.ts \
            e2e/centros-costo.spec.ts \
            e2e/productos-filtros.spec.ts \
            e2e/fase3-interfaz.spec.ts \
            e2e/fase4-responsive.spec.ts \
            e2e/fase4-variantes.spec.ts \
            e2e/fase5-cargas-masivas.spec.ts \
            e2e/fase5-imagenes.spec.ts \
            e2e/fase6-facturacion-impresion.spec.ts \
            e2e/fase6-reportes-administrativos.spec.ts \
            e2e/n5-1-reportes-period-validation.spec.ts \
            e2e/fase7-validacion-integral.spec.ts \
            e2e/fase8-validacion-completa.spec.ts \
            e2e/fase7-correo.spec.ts \
            e2e/sesion-inactividad.spec.ts \
            e2e/matriz-modulos-visual.spec.ts \
            e2e/phase7-admin-role.spec.ts \
            e2e/phase7-user-isolation.spec.ts \
            e2e/phase7.spec.ts \
            e2e/fase2c4-escaner-frontend.spec.ts \
            e2e/fase2c5-autocomplete-remoto.spec.ts \
            e2e/fase2c5-regresiones-compatibilidad.spec.ts \
            e2e/m5-clientes-segmentacion.spec.ts \
            e2e/transferencias-inventario-acceso.spec.ts \
            e2e/transferencias-inventario-form.spec.ts \
            e2e/transferencias-inventario-lifecycle.spec.ts \
            --grep-invert="Angular exige la variante exacta en compra y venta|Compras y Ventas muestran imágenes o fallback en listas, formularios y detalles" \
            --config=playwright.config.ts

      - name: Validar mensaje SMTP y PDF adjunto
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fase7_validate_email.py
          mkdir -p frontend/test-results/fase7-smtp
          cp -a "$SMTP_CAPTURE_DIR"/. frontend/test-results/fase7-smtp/
          cp fase7-smtp.log frontend/test-results/fase7-smtp/server.log

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-aceptacion-integral
          path: |
            backend/catalogos-api.log
            frontend/catalogos-frontend.log
            fase7-smtp.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14