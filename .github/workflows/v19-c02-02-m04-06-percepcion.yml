name: V19 C02-02.M04.06 - percepcion placement privada
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v19-c02-02-m04-06-percepcion.yml'
      - 'frontend/e2e/c02-02-m04-06-placement-progresivo.spec.ts'
      - 'frontend/src/app/features/plataforma/placement-review-v5.component.ts'
      - 'frontend/src/app/features/plataforma/placement-presentacion-v5.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v19-c0202-m0406-${{ github.sha }}
  cancel-in-progress: false
jobs:
  browser:
    name: C02-02.M04.06 - Chromium progresivo 320-1280
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm reproducible
        run: npm install --global npm@11.19.0
      - name: Dependencias reproducibles
        working-directory: frontend
        run: npm ci
      - name: Vitest previo de estado y presentación
        working-directory: frontend
        run: |
          npm test -- --no-watch --no-progress --include=src/app/features/plataforma/placement-presentacion-v5.spec.ts
          npm test -- --no-watch --no-progress --include=src/app/features/plataforma/placement-review-v5.component.spec.ts
      - name: Lint y build Angular
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend local aislado
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > v19-c0202-m0406.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat v19-c0202-m0406.log >&2
          exit 1
      - name: Playwright estados progresivos y percepcion
        working-directory: frontend
        run: npx playwright test e2e/c02-02-m04-06-placement-progresivo.spec.ts --config=playwright.config.ts --workers=1 --reporter=list
