name: Promotion Source Guard

on:
  pull_request:
    branches:
      - qa
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  source-branch:
    name: Enforce DEV -> QA -> PROD
    runs-on: ubuntu-latest
    steps:
      - name: Validar promociones o retirada acotada de workflows obsoletos
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "solqaryn/Solqaryn"
          if [[ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "Bloqueado: la rama fuente debe pertenecer al mismo repositorio." >&2
            exit 1
          fi
          if [[ "$BASE_REF:$HEAD_REF" == "qa:dev" || "$BASE_REF:$HEAD_REF" == "main:qa" ]]; then
            echo "PROMOTION_SOURCE_GUARD=PASS"
            exit 0
          fi
          # Excepcion de mantenimiento de un solo uso: PRs existentes de retiro VAEP.
          # No permite codigo comercial, despliegues, secretos, backups ni otros workflows.
          case "$BASE_REF:$HEAD_REF:$PR_NUMBER" in
            "qa:cleanup/retire-vaep-qa-20261022:3717"|"main:cleanup/retire-vaep-main-20261022:3718") ;;
            *)
              echo "Promocion bloqueada: solo dev -> qa, qa -> main o limpieza VAEP exacta." >&2
              exit 1
              ;;
          esac
          metadata="$RUNNER_TEMP/promotion-maintenance-pr.json"
          changed="$RUNNER_TEMP/promotion-maintenance-files.json"
          curl --fail --silent --show-error --location --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" -o "$metadata"
          curl --fail --silent --show-error --location --retry 2 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" -o "$changed"
          python3 - "$metadata" "$changed" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          pr = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          changed = json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          if pr['head']['sha'] != os.environ['HEAD_SHA']:
              raise SystemExit('Mantenimiento bloqueado: HEAD del PR cambio durante la verificacion')
          if pr['head']['repo']['full_name'] != 'solqaryn/Solqaryn':
              raise SystemExit('Mantenimiento bloqueado: origen no autorizado')
          if pr['base']['ref'] != os.environ['BASE_REF']:
              raise SystemExit('Mantenimiento bloqueado: base no autorizada')
          expected = {
              '.github/workflows/vaep-admission-open-guard.yml': 'removed',
              '.github/workflows/vaep-checkpoints.yml': 'removed',
              '.github/workflows/vaep-ef-snapshot-probe.yml': 'removed',
              '.github/workflows/vaep-engine-ci.yml': 'removed',
              '.github/workflows/vaep-n57c-snapshot-repair-probe.yml': 'removed',
              '.github/workflows/vaep-n61c-ef-generate.yml': 'removed',
              '.github/workflows/vaep-n61f-security-audit-gate.yml': 'removed',
              '.github/workflows/vaep-n7-1-c-outbox.yml': 'removed',
              '.github/workflows/vaep-n72d-outbox-retry-gate.yml': 'removed',
              '.github/workflows/vaep-n812h-byte-append.yml': 'removed',
              '.github/workflows/vaep-n814h-byte-append.yml': 'removed',
              '.github/workflows/vaep-n86h-byte-export.yml': 'removed',
              '.github/workflows/vaep-n91h-byte-append.yml': 'removed',
              '.github/workflows/vaep-n92h-byte-append.yml': 'removed',
              '.github/workflows/vaep-n93h-byte-append.yml': 'removed',
              '.github/workflows/vaep-n95h-byte-append.yml': 'removed',
              '.github/workflows/promotion-source-guard.yml': 'modified',
              'frontend/package.json': 'modified',
              'frontend/package-lock.json': 'modified',
          }
          actual = {f['filename']: f['status'] for f in changed}
          if len(changed) != 19 or pr['changed_files'] != 19 or actual != expected:
              raise SystemExit('Mantenimiento bloqueado: diff distinto de 16 retiros VAEP, guard y 2 manifiestos de seguridad frontend')
          if any(f['additions'] != 0 or f['deletions'] <= 0 for f in changed if f['status'] == 'removed'):
              raise SystemExit('Mantenimiento bloqueado: operaciones de borrado inesperadas')
          print('PROMOTION_SOURCE_GUARD=PASS; MAINTENANCE_VAEP_EXACT=16')
          PY
