name: Modernización - Hardening final Angular 22 DEV

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/modernization-phase4-hardening.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modernization-phase4-hardening-dev
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Baseline y scope
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          node scripts/verify-project-scope.mjs
          test -z "$(git status --porcelain)"

      - name: Retirar dependencias directas obsoletas y refrescar lock seguro
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm uninstall --save-dev @angular-devkit/build-angular
          npm uninstall --save @angular/platform-browser-dynamic
          npm audit fix --package-lock-only --ignore-scripts || true
          rm -rf node_modules
          npm ci

      - name: Normalizar config Vitest ESM
        shell: bash
        run: |
          set -euo pipefail
          git mv frontend/vitest-base.config.ts frontend/vitest-base.config.mts
          node <<'NODE'
          const fs=require('fs');
          const p='frontend/angular.json';
          const a=JSON.parse(fs.readFileSync(p,'utf8'));
          const test=a.projects?.['solqaryn-frontend']?.architect?.test?.options;
          if (!test) throw new Error('No existe configuración de unit-test');
          test.runnerConfig='vitest-base.config.mts';
          fs.writeFileSync(p,JSON.stringify(a,null,2)+'\n');
          NODE

      - name: Endurecer certifier de Fase 4
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const p='.github/workflows/modernization-phase4-angular22.yml';
          let c=fs.readFileSync(p,'utf8');
          c=c.replace("            '@angular/platform-browser-dynamic':'22.2.1',\n",'');
          c=c.replace("            '@angular-devkit/build-angular':'22.2.1',\n",'');
          c=c.replace(
            'npm ls @angular/core @angular/cli @angular/material @angular/cdk @angular-devkit/build-angular @angular/build @angular/compiler-cli typescript rxjs tslib zone.js vitest --depth=0',
            'npm ls @angular/core @angular/cli @angular/material @angular/cdk @angular/build @angular/compiler-cli typescript rxjs tslib zone.js vitest --depth=0'
          );
          const marker='      - name: Audit productivo high+\n        run: npm audit --omit=dev --audit-level=high\n';
          if (!c.includes(marker)) throw new Error('No se encontró el audit productivo esperado');
          c=c.replace(marker,
            '      - name: Audit completo high+\n        run: npm audit --audit-level=high\n\n'+marker
          );
          c=c.replace(
            "          ! grep -Eq '([0-9]+ failed|FAIL )' /tmp/angular22-unit.clean.log\n",
            "          ! grep -Eq '([0-9]+ failed|FAIL )' /tmp/angular22-unit.clean.log\n          ! grep -Eq 'NG8011|NG8113|allowSignalWrites|configLoader' /tmp/angular22-unit.clean.log\n"
          );
          c=c.replace(
            "          initial_line=\"$(grep 'Initial total' ../fase4-build.log | tail -n1 || true)\"\n",
            "          ! grep -Eq 'NG8011|NG8113|allowSignalWrites' ../fase4-build.log\n          initial_line=\"$(grep 'Initial total' ../fase4-build.log | tail -n1 || true)\"\n"
          );
          c=c.replace(
            "            echo 'NPM_AUDIT_PROD_HIGH_PLUS=PASS'\n",
            "            echo 'NPM_AUDIT_FULL_HIGH_PLUS=PASS'\n            echo 'NPM_AUDIT_PROD_HIGH_PLUS=PASS'\n"
          );
          fs.writeFileSync(p,c);
          NODE

      - name: Actualizar evidencia de hardening
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const ep='docs/evidencias/modernizacion/FASE_4_ANGULAR_22_2026-10-03.md';
          let e=fs.readFileSync(ep,'utf8');
          e=e.replace("- `@angular-devkit/build-angular`: `22.2.1`.\n",'');
          if (!e.includes('## Hardening quirúrgico posterior')) {
            e += `\n## Hardening quirúrgico posterior\n\n- Se retiró la dependencia directa obsoleta \`@angular-devkit/build-angular\`; los targets canónicos ya usan exclusivamente \`@angular/build\`.\n- Se retiró \`@angular/platform-browser-dynamic\` porque SOLQARYN usa bootstrap standalone y no existían consumidores en source.\n- El lockfile se refrescó únicamente dentro de rangos compatibles y la certificación exige audit completo high+ además del audit productivo.\n- \`vitest-base.config.ts\` pasó a \`vitest-base.config.mts\` para cargar ESM sin warning de Vite.\n- Se eliminaron warnings Angular propios del source: imports standalone no usados, \`allowSignalWrites\` deprecado y proyección Material NG8011.\n- Se mantiene \`@angular/animations\` 22.2.1 por el contrato vigente de animaciones legacy async; su futura sustitución por APIs nativas no forma parte de Fase 4 ni de la decisión zoneless.\n`;
          }
          fs.writeFileSync(ep,e);
          const cp='CHANGELOG_AI.md';
          let ch=fs.readFileSync(cp,'utf8');
          const entry=`## 2026-10-03 — Hardening quirúrgico Fase 4 Angular 22 DEV\n\n- Eliminadas dependencias directas obsoletas no consumidas: @angular-devkit/build-angular y @angular/platform-browser-dynamic; SOLQARYN permanece sobre @angular/build.\n- Lockfile refrescado sin cambiar la matriz Angular 22.2.1 / TypeScript 6.0.3 / RxJS 7.8.2 / tslib 2.8.1 / Zone.js 0.16.3.\n- Certifier Fase 4 endurecido con npm audit completo high+, además del audit productivo.\n- Corregidos warnings propios Angular 22: RouterLink no usados, allowSignalWrites deprecado, NG8011 de proyección Material y config Vitest ESM.\n- Alcance exclusivo dev; QA, main y PROD no se modifican.\n\n`;
          if (!ch.startsWith('## 2026-10-03 — Hardening quirúrgico Fase 4 Angular 22 DEV')) ch=entry+ch;
          fs.writeFileSync(cp,ch);
          NODE

      - name: Verificar matriz exacta y ausencia de dependencias retiradas
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const p=require('./package.json');
          const expected={
            '@angular/animations':'22.2.1',
            '@angular/cdk':'22.2.1',
            '@angular/common':'22.2.1',
            '@angular/compiler':'22.2.1',
            '@angular/core':'22.2.1',
            '@angular/forms':'22.2.1',
            '@angular/material':'22.2.1',
            '@angular/platform-browser':'22.2.1',
            '@angular/router':'22.2.1',
            'rxjs':'7.8.2',
            'tslib':'2.8.1',
            'zone.js':'0.16.3',
            '@angular/build':'22.2.1',
            '@angular/cli':'22.2.1',
            '@angular/compiler-cli':'22.2.1',
            'typescript':'6.0.3',
            'vitest':'4.1.11'
          };
          for (const [name,want] of Object.entries(expected)) {
            const got=p.dependencies?.[name] ?? p.devDependencies?.[name];
            if (got!==want) throw new Error(`${name}: expected ${want}, got ${got}`);
          }
          for (const removed of ['@angular-devkit/build-angular','@angular/platform-browser-dynamic']) {
            if (p.dependencies?.[removed] || p.devDependencies?.[removed]) throw new Error(`${removed} aún es dependencia directa`);
          }
          NODE
          npm ls @angular/core @angular/cli @angular/material @angular/cdk @angular/build @angular/compiler-cli typescript rxjs tslib zone.js vitest --depth=0

      - name: Audit completo y productivo
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm audit --omit=dev --audit-level=high

      - name: Unit tests sin warnings Angular propios
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM 180s ./node_modules/.bin/ng test --watch=false --no-progress 2>&1 | tee /tmp/angular22-hardening-unit.log
          sed -E 's/\x1B\[[0-9;]*[mK]//g' /tmp/angular22-hardening-unit.log > /tmp/angular22-hardening-unit.clean.log
          grep -Eq 'Test Files[[:space:]]+58 passed.*\(58\)' /tmp/angular22-hardening-unit.clean.log
          grep -Eq 'Tests[[:space:]]+217 passed.*\(217\)' /tmp/angular22-hardening-unit.clean.log
          ! grep -Eq '([0-9]+ failed|FAIL |NG8011|NG8113|allowSignalWrites|configLoader)' /tmp/angular22-hardening-unit.clean.log

      - name: Lint y contratos
        working-directory: frontend
        run: npm run lint

      - name: Build production-mode sin errores Angular
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm run build:prod 2>&1 | tee /tmp/angular22-hardening-build.log
          ! grep -Eq 'NG8011|NG8113|allowSignalWrites|Application bundle generation failed|An unhandled exception occurred' /tmp/angular22-hardening-build.log
          grep -q 'Output location:' /tmp/angular22-hardening-build.log

      - name: Publicar hardening sólo en dev
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-project-scope.mjs
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$BASE_SHA"
          rm .github/workflows/modernization-phase4-hardening.yml
          git config user.name "solqaryn-platform"
          git config user.email "solqaryn.platform@outlook.com"
          git add frontend .github/workflows/modernization-phase4-angular22.yml .github/workflows/modernization-phase4-hardening.yml docs/evidencias/modernizacion/FASE_4_ANGULAR_22_2026-10-03.md CHANGELOG_AI.md
          git commit -m "fix(modernization): harden Angular 22 phase 4"
          git push origin HEAD:dev
