name: V22 C07-01.M06.06 real Productos HTTP JWT Oracle MySQL 8.4
on:
  push:
    branches: [dev]
    paths:
      - 'backend/tests/Solqaryn.Tests/Integration/C0701M0606ProductosRealHttpMysql84Tests.cs'
      - '.github/workflows/v22-c07-01-m06-06-productos-real-http-mysql84.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0701-m0606-${{ github.sha }}
  cancel-in-progress: false
jobs:
  real-productos-http-mysql:
    name: C07-01.M06.06 - real Productos HTTP JWT RBAC Oracle MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-v22-only
          MYSQL_DATABASE: c0701_m0606_bootstrap
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -pephemeral-v22-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      C0701_M0606_MYSQL_TEST: "Server=127.0.0.1;Port=3306;Database=c0701_m0606_bootstrap;User=root;Password=ephemeral-v22-only;SslMode=Disabled;AllowPublicKeyRetrieval=True;"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Exact SHA project scope and skill self-test
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
          node scripts/verify-solqaryn-skills.mjs --self-test
      - name: Real production controller signed JWT + ephemeral MySQL 8.4 TRX
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tests/Solqaryn.Tests/Solqaryn.Tests.csproj
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj \
            --configuration Release --no-restore \
            --filter 'FullyQualifiedName~C0701M0606ProductosRealHttpMysql84Tests' \
            --logger 'trx;LogFileName=C0701M0606RealProductosHttpMysql84.trx' --verbosity normal
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=list(Path('tests/Solqaryn.Tests').rglob('C0701M0606RealProductosHttpMysql84.trx'))
          if len(files)!=1: raise SystemExit("MISSING_UNIQUE_TRX")
          node=ET.parse(files[0]).getroot().find('.//{*}Counters')
          if node is None: raise SystemExit("MISSING_TRX_COUNTERS")
          c={key:int(node.attrib.get(key,-1)) for key in ('total','passed','failed','notExecuted','executed')}
          print("C0701_M0606_REAL_HTTP_MYSQL84_TRX",c)
          if c['total']<1 or c['passed']!=c['total'] or c['failed'] or c['notExecuted'] or c['executed']!=c['total']:
              raise SystemExit("REAL_HTTP_MYSQL84_NOT_PASS")
          PY
