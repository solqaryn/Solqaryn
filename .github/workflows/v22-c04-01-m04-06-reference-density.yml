name: V22 C04-01.M04.06 Angular reference density lazy load and keyboard
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/src/app/features/plataforma/c04-01-m04-01-planes-readonly.component.ts'
      - 'frontend/e2e/c04-01-m04-06-reference-density.spec.ts'
      - '.github/workflows/v22-c04-01-m04-06-reference-density.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0401-m0406-${{ github.sha }}
  cancel-in-progress: false
jobs:
  chromium:
    name: C04-01.M04.06 - Angular density progressive route and keyboard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Exact SHA Scope Lock
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/verify-project-scope.mjs
      - name: Build actual Angular 22 app
        working-directory: frontend
        run: |
          npm install -g npm@11.19.0
          npm ci
          npx tsc --noEmit -p tsconfig.app.json
          npm run build
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Four real Chromium cases with synthetic platform session
        working-directory: frontend
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
        run: |
          set -euo pipefail
          npx ng serve --host 127.0.0.1 --port 4200 >/tmp/v22-c0401-m0406.log 2>&1 &
          ready=0
          for i in $(seq 1 120); do
            if curl --silent --fail http://127.0.0.1:4200/login >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then tail -n 100 /tmp/v22-c0401-m0406.log; exit 1; fi
          npx playwright test e2e/c04-01-m04-06-reference-density.spec.ts --config=playwright.config.ts --workers=1 --retries=0
