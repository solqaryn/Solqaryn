name: Storefront Fase 2 - regresion categorias

on:
  push:
    branches:
      - dev
      - chatgpt/storefront-fase2-categorias
      - chatgpt/storefront-fase2-categoria-canonica
    paths:
      - 'frontend/src/app/features/storefront/**'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/e2e/storefront-fase1.spec.ts'
      - 'frontend/e2e/storefront-fase2.spec.ts'
      - 'frontend/scripts/validate-storefront-fase1.mjs'
      - 'frontend/scripts/validate-storefront-fase2.mjs'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/storefront-fase2-regression.yml'
  pull_request:
    branches:
      - dev
    paths:
      - 'frontend/src/app/features/storefront/**'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/e2e/storefront-fase1.spec.ts'
      - 'frontend/e2e/storefront-fase2.spec.ts'
      - 'frontend/scripts/validate-storefront-fase1.mjs'
      - 'frontend/scripts/validate-storefront-fase2.mjs'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
      - '.github/workflows/storefront-fase2-regression.yml'

permissions:
  contents: read

concurrency:
  group: storefront-fase2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Fase 2 - categorias publicas
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint y guardas estaticas
        run: npm run lint

      - name: Build de produccion
        run: npm run build:prod

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Iniciar Angular
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > storefront-fase2-regression.log 2>&1 &

      - name: Esperar Angular
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/tienda/categorias > /dev/null; then
              echo 'Angular listo para la regresion publica de Fase 2.'
              exit 0
            fi
            sleep 2
          done
          echo 'Angular no respondio dentro del tiempo esperado.' >&2
          cat storefront-fase2-regression.log >&2 || true
          exit 1

      - name: Regresion Fase 1
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:storefront-fase1

      - name: Playwright Fase 2
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:storefront-fase2

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-fase2-regression
          path: |
            frontend/storefront-fase2-regression.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
