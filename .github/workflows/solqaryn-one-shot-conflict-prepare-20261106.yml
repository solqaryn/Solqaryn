name: SOLQARYN one-shot conflict preparation
'on':
  push:
    branches: ['work/solqaryn-p2-005-c']
    paths: ['.github/workflows/solqaryn-one-shot-conflict-prepare-20261106.yml']
permissions: {}
jobs:
  prepare:
    if: ${{ github.repository == 'solqaryn/Solqaryn' && github.actor == 'solqaryn-platform' && github.event_name == 'push' && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Prepare immutable trees only - no branch updates or PR merges
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, tempfile, urllib.request
          from urllib.parse import quote
          REPO = 'solqaryn/Solqaryn'
          BASE = 'b1f7fdccd062594648ee6759073dd98baeb7148b'
          LOG = 'CHANGELOG_AI.md'
          HELPER = '.github/workflows/solqaryn-one-shot-conflict-prepare-20261106.yml'
          TARGETS = [
           (3899, 'P2-005.C', '8a72763974e12f8a2cb4de9bac21d2a6f18ecc9d', 'P2005CComprasEmpresaIdTests.cs'),
           (3901, 'I8-001.C', 'e3e5b18f30c8426b925f46873fb8563a30ec66e6', 'I8001CCredencialesErpTests.cs'),
           (3902, 'P2-016.C', '6a2fc27e5b78651781fe43fdc5e93b396782c9f9', 'P2016CDatosHistoricosEmpresaIdTests.cs'),
           (3903, 'P2-006.C', '3428b2eeef561d7802a55ff16854e77cba179edf', 'P2006CVentasEmpresaIdTests.cs'),
           (3905, 'P2-008.C', 'b30ed62d6e3455f540dd7cfa7bdd94705b607e7b', 'P2008CFacturasPrivadasEmpresaIdTests.cs'),
          ]
          def require(ok, message):
              if not ok:
                  raise RuntimeError(message)
          def blob_hash(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def api(suffix, payload=None):
              # Creates unreferenced TREE objects only. No refs, PRs or settings writes.
              require('..' not in suffix.split('/') and not suffix.startswith('/'), 'Unsafe API path')
              require(payload is None or suffix == 'git/trees', 'Write endpoint forbidden')
              request = urllib.request.Request('https://api.github.com/repos/' + REPO + '/' + suffix,
                  data=None if payload is None else json.dumps(payload, ensure_ascii=False).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28',
                           'Content-Type': 'application/json', 'User-Agent': 'SOLQARYN-authorized-conflict-preparation'},
                  method='GET' if payload is None else 'POST')
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          def file_at(path, sha):
              require(re.fullmatch('[a-f0-9]{40}', sha) is not None, 'Immutable SHA required')
              result = api('contents/' + quote(path, safe='/') + '?ref=' + sha)
              require(result.get('type') == 'file' and result.get('encoding') == 'base64', 'Full file required')
              content = base64.b64decode(result['content'])
              require(len(content) == result['size'] and blob_hash(content) == result['sha'], 'Incomplete blob')
              return content, result['sha']
          def entry_from(common, original, scope):
              require(bool(common) and original.endswith(common), scope + ': non-additive changelog')
              entry = original[:-len(common)]
              require(entry.startswith(b'## ') and entry.endswith(b'\n\n') and len(entry) < 32000,
                      scope + ': unexpected changelog block')
              require(scope.encode() in entry, scope + ': missing provenance')
              require(not re.search(rb'(?m)^(<<<<<<< |=======\r?$|>>>>>>> )', entry), 'Conflict markers')
              return entry
          def insertion_points(content, count):
              points, last = [], 0
              for match in re.finditer(rb'^## [^\r\n]*\r?\n', content, re.MULTILINE):
                  pos = match.start()
                  if content[last:pos].count(b'\n') >= 12 and content.count(match.group()) == 1:
                      points.append(pos)
                      last = pos
                      if len(points) == count:
                          return points
              raise RuntimeError('Insufficient distinct changelog anchors')
          def validate_live(bootstrap):
              require(api('git/ref/heads/dev')['object']['sha'] == BASE, 'dev changed; stop')
              for number, scope, original, filename in TARGETS:
                  pr = api('pulls/' + str(number))
                  branch = 'work/solqaryn-' + scope.lower().replace('.', '-')
                  expected = bootstrap if number == 3899 else original
                  require(pr['state'] == 'open' and not pr['merged'] and not pr['draft'], 'PR state changed')
                  require(pr['base']['ref'] == 'dev' and pr['base']['repo']['full_name'] == REPO, 'Wrong base')
                  require(pr['head']['repo']['full_name'] == REPO and pr['head']['ref'] == branch, 'Wrong head')
                  require(pr['head']['sha'] == expected, str(number) + ': concurrent head change')
          def simulate(base_log, plans):
              # Actual file contents in an isolated local Git repo; never remote refs.
              with tempfile.TemporaryDirectory(prefix='solqaryn-recovery-simulation-') as directory:
                  root = pathlib.Path(directory)
                  env = {'PATH': os.environ['PATH'], 'HOME': directory, 'GIT_CONFIG_NOSYSTEM': '1',
                         'GIT_CONFIG_GLOBAL': os.devnull, 'GIT_AUTHOR_NAME': 'Local recovery simulation',
                         'GIT_AUTHOR_EMAIL': 'simulation@invalid.example',
                         'GIT_COMMITTER_NAME': 'Local recovery simulation',
                         'GIT_COMMITTER_EMAIL': 'simulation@invalid.example'}
                  def git(*args, data=None):
                      run = subprocess.run(['git', '-c', 'commit.gpgsign=false', *args], cwd=root,
                                           env=env, input=data, capture_output=True, timeout=60)
                      require(run.returncode == 0, 'Content merge simulation failed: ' + run.stderr.decode()[-500:])
                      return run.stdout
                  git('init', '-q')
                  (root / LOG).write_bytes(base_log)
                  git('add', LOG)
                  git('commit', '-q', '-m', 'LOCAL_BASE')
                  base = git('rev-parse', 'HEAD').decode().strip()
                  heads = []
                  for plan in plans:
                      git('checkout', '-q', '--detach', base)
                      (root / LOG).write_bytes(plan['log_bytes'])
                      path = root / plan['test_path']
                      path.parent.mkdir(parents=True, exist_ok=True)
                      path.write_bytes(plan['test_bytes'])
                      git('add', LOG, plan['test_path'])
                      git('commit', '-q', '-m', 'LOCAL_PR_' + str(plan['pr']))
                      heads.append(git('rev-parse', 'HEAD').decode().strip())
                  cumulative = base
                  for head in heads:
                      tree = git('merge-tree', '--write-tree', cumulative, head).decode().splitlines()[0]
                      cumulative = git('commit-tree', tree, '-p', cumulative, '-p', head,
                                       data=b'LOCAL_MERGE_SIMULATION\n').decode().strip()
                  combined = git('show', cumulative + ':' + LOG)
                  for plan in plans:
                      require(combined.count(plan['entry']) == 1, 'Lost or duplicate changelog entry')
                      combined = combined.replace(plan['entry'], b'', 1)
                      require(git('show', cumulative + ':' + plan['test_path']) == plan['test_bytes'],
                              'Test content changed')
                  require(combined == base_log, 'Original changelog history changed')
          def main():
              require(os.environ.get('GITHUB_REPOSITORY') == REPO, 'Wrong repository')
              require(os.environ.get('GITHUB_ACTOR') == 'solqaryn-platform', 'Wrong initiating account')
              bootstrap = os.environ['GITHUB_SHA']
              boot_commit = api('git/commits/' + bootstrap)
              require([p['sha'] for p in boot_commit['parents']] == ['c20a3d73a76d9c77e6db5daef1446b2443763b6f'], 'Unexpected bootstrap parent')
              boot_diff = api('compare/' + TARGETS[0][2] + '...' + bootstrap)
              require([(f['filename'], f['status']) for f in boot_diff['files']] == [(HELPER, 'added')],
                      'Bootstrap changed unrelated content')
              validate_live(bootstrap)
              base_tree = api('git/commits/' + BASE)['tree']['sha']
              base_log, base_log_sha = file_at(LOG, BASE)
              offsets = insertion_points(base_log, len(TARGETS))
              plans = []
              for target, offset in zip(TARGETS, offsets):
                  number, scope, original, filename = target
                  test_path = 'backend/tests/Solqaryn.Tests/' + filename
                  diff = api('compare/' + BASE + '...' + original)
                  require({f['filename'] for f in diff['files']} == {LOG, test_path}, 'Unexpected PR files')
                  test_diff = next(f for f in diff['files'] if f['filename'] == test_path)
                  require(test_diff['status'] == 'added', 'Expected an isolated added test')
                  common = diff['merge_base_commit']['sha']
                  common_log, _ = file_at(LOG, common)
                  original_log, _ = file_at(LOG, original)
                  entry = entry_from(common_log, original_log, scope)
                  require(entry not in base_log, 'Changelog entry already integrated')
                  new_log = base_log[:offset] + entry + base_log[offset:]
                  require(new_log[:offset] + new_log[offset + len(entry):] == base_log, 'History loss')
                  test_bytes, test_sha = file_at(test_path, original)
                  require(test_sha == test_diff['sha'], 'Test blob mismatch')
                  plans.append({'pr': number, 'scope': scope, 'original_head': original,
                                'expected_live_head': bootstrap if number == 3899 else original,
                                'branch': 'work/solqaryn-' + scope.lower().replace('.', '-'),
                                'test_path': test_path, 'test_blob': test_sha, 'test_bytes': test_bytes,
                                'entry': entry, 'log_bytes': new_log, 'log_blob': blob_hash(new_log),
                                'anchor_offset': offset, 'common_base': common})
              simulate(base_log, plans)
              print('FIVE_TARGET_CONTENT_MERGES=PASS; ORIGINAL_TEST_BLOBS=UNCHANGED; BASE_LOG=BYTE_PRESERVED', flush=True)
              validate_live(bootstrap)
              for plan in plans:
                  tree = api('git/trees', {'base_tree': base_tree, 'tree': [
                      {'path': LOG, 'mode': '100644', 'type': 'blob', 'content': plan['log_bytes'].decode('utf-8')},
                      {'path': plan['test_path'], 'mode': '100644', 'type': 'blob', 'sha': plan['test_blob']}]})
                  receipt = {k: v for k, v in plan.items() if k not in ('entry', 'log_bytes', 'test_bytes')}
                  receipt.update(tree_sha=tree['sha'], base_dev=BASE, base_log_blob=base_log_sha,
                                 refs_updated=False, status='PREPARED_NOT_PUBLISHED')
                  print('RECOVERY_TREE=' + json.dumps(receipt, sort_keys=True), flush=True)
              validate_live(bootstrap)
              print('PREPARATION_COMPLETE; NO_REFS_UPDATED; NO_MERGES; NO_APPROVALS; REMOVE_TEMPORARY_HELPER_IN_FINAL_TREE', flush=True)
          if __name__ == '__main__':
              main()
          PY
