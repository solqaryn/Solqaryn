name: PROD - Bootstrap role diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-bootstrap-role-diagnostic.yml

permissions:
  contents: read
  actions: read

jobs:
  prod-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: PROD
    outputs:
      user_hash: ${{ steps.fp.outputs.user_hash }}
    env:
      DB_HOST: ${{ vars.SOLQARYN_PROD_DB_HOST }}
      DB_PORT: ${{ vars.SOLQARYN_PROD_DB_PORT }}
      DB_NAME: ${{ vars.SOLQARYN_PROD_DB_NAME }}
      DB_USER: ${{ vars.SOLQARYN_PROD_DB_USER }}
      DB_PASSWORD: ${{ secrets.SOLQARYN_PROD_DB_PASSWORD }}
    steps:
      - name: Install mysql client
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y mysql-client >/dev/null
      - name: Fingerprint current PROD bootstrap safely
        id: fp
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD="$DB_PASSWORD"
          mysqlc=(mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" --ssl-mode=REQUIRED --default-character-set=utf8mb4 "$DB_NAME" --batch --skip-column-names)
          test "$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Usuarios;')" = "1"
          hash="$("${mysqlc[@]}" -e 'SELECT SHA2(LOWER(NombreUsuario),256) FROM Usuarios LIMIT 1;')"
          test -n "$hash"
          admin="$("${mysqlc[@]}" -e 'SELECT COUNT(*) FROM Usuarios u JOIN Roles r ON r.Id=u.RolId WHERE r.EsAdministrador=1 AND u.Activo=1 AND u.Eliminado=0;')"
          test "$admin" = "1"
          echo "user_hash=$hash" >> "$GITHUB_OUTPUT"
          echo "CURRENT_BOOTSTRAP_ADMIN=PASS"
          echo "PRODUCTION_WRITES=0"

  historical-role:
    needs: prod-fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: LEGACY_DEV_MIGRATION
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: role_diag
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=18
    env:
      BACKUP_PASSPHRASE: ${{ secrets.LEGACY_DEV_BACKUP_PASSPHRASE }}
      ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=role_diag;User=root;Password=root;SslMode=None;AllowPublicKeyRetrieval=True;
      Database__ServerVersion: 8.4.0
      Database__ApplyMigrationsOnStartup: "false"
      Jwt__Secret: Role-Diagnostic-Only-JWT-Secret-At-Least-32-Characters-2026
      Cloudinary__CloudName: diag-not-used
      Cloudinary__ApiKey: diag-not-used
      Cloudinary__ApiSecret: diag-not-used
      Cloudinary__EnvironmentPrefix: solqaryn_prod
      Smtp__Host: 127.0.0.1
      Smtp__Port: "2525"
      Smtp__OAuth2ClientId: diag-not-used
      Smtp__OAuth2RefreshToken: diag-not-used
      Smtp__UsuarioSmtp: diag@example.invalid
      Smtp__NombreRemitente: SOLQARYN DIAG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y mysql-client gnupg jq >/dev/null
          dotnet tool install --global dotnet-ef --version 8.0.8 >/dev/null
      - name: Download certified historical backup
        uses: actions/download-artifact@v4
        with:
          name: solqaryn-legacy-prod-defaultdb-backup-36228394479
          run-id: 36228394479
          github-token: ${{ github.token }}
          path: /tmp/legacy-backup
      - name: Restore historical copy and inspect role mapping
        shell: bash
        run: |
          set -euo pipefail
          encrypted="$(find /tmp/legacy-backup -type f -name '*.tar.gz.gpg' | head -n1)"
          checksum="$(find /tmp/legacy-backup -type f -name '*.gpg.sha256' | head -n1)"
          test "$(sha256sum "$encrypted" | awk '{print $1}')" = "$(awk '{print $1}' "$checksum")"
          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --no-tty --pinentry-mode loopback --passphrase-fd 0 --decrypt --output /tmp/legacy.tar.gz "$encrypted"
          mkdir -p /tmp/legacy
          tar -C /tmp/legacy -xzf /tmp/legacy.tar.gz
          (cd /tmp/legacy && sha256sum -c MANIFEST.sha256)
          export MYSQL_PWD=root
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root --ssl-mode=REQUIRED -e "DROP DATABASE IF EXISTS role_diag; CREATE DATABASE role_diag CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root --ssl-mode=REQUIRED role_diag < /tmp/legacy/defaultdb.sql
          cd backend
          dotnet restore InventoryApp.sln >/dev/null
          dotnet ef database update --project src/Infrastructure/InventoryApp.Infrastructure.csproj --startup-project src/API/InventoryApp.API.csproj --context AppDbContext >/dev/null
          cd ..
          mysqlc=(mysql --protocol=TCP -h 127.0.0.1 -P 3306 -u root --ssl-mode=REQUIRED role_diag --batch --skip-column-names)
          match="$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM Usuarios WHERE SHA2(LOWER(NombreUsuario),256)='${{ needs.prod-fingerprint.outputs.user_hash }}';")"
          match_admin="$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM Usuarios u JOIN Roles r ON r.Id=u.RolId WHERE SHA2(LOWER(u.NombreUsuario),256)='${{ needs.prod-fingerprint.outputs.user_hash }}' AND r.EsAdministrador=1;")"
          admin_roles="$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM Roles WHERE EsAdministrador=1 AND Activo=1 AND Eliminado=0;")"
          active_admin_users="$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM Usuarios u JOIN Roles r ON r.Id=u.RolId WHERE r.EsAdministrador=1 AND u.Activo=1 AND u.Eliminado=0;")"
          match_memberships="$("${mysqlc[@]}" -e "SELECT COUNT(*) FROM UsuarioEmpresas ue JOIN Usuarios u ON u.Id=ue.UsuarioId WHERE SHA2(LOWER(u.NombreUsuario),256)='${{ needs.prod-fingerprint.outputs.user_hash }}' AND ue.Activo=1;")"
          echo "HISTORICAL_BOOTSTRAP_MATCHES=$match"
          echo "HISTORICAL_BOOTSTRAP_ADMIN_MATCHES=$match_admin"
          echo "HISTORICAL_ACTIVE_ADMIN_ROLES=$admin_roles"
          echo "HISTORICAL_ACTIVE_ADMIN_USERS=$active_admin_users"
          echo "HISTORICAL_BOOTSTRAP_ACTIVE_MEMBERSHIPS=$match_memberships"
          test "$match" = "1"
          test "$admin_roles" -ge 1
          echo "PRODUCTION_WRITES=0"
