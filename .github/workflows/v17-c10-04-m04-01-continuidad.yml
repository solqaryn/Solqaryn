name: V17 - C10-04.M04.01 continuidad privada Angular

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v17-c10-04-m04-01-continuidad.yml'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/src/app/features/plataforma/continuidad-operativa-v5.component.ts'
      - 'frontend/src/app/features/plataforma/continuidad-operativa-v5.component.spec.ts'
      - 'frontend/src/app/app.routes.auditoria-operativa-v5.spec.ts'
      - 'frontend/e2e/c10-04-m04-01-landmark-regression.spec.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v17-continuidad-ui-${{ github.sha }}
  cancel-in-progress: false

jobs:
  frontend-v17-continuidad:
    name: C10-04.M04.01 - ruta privada y seis Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm bloqueado
        run: npm install --global npm@11.19.0
      - name: Dependencias reproducibles
        run: npm ci
      - name: Vitest positivo negativo y fail-closed
        run: npm test -- --no-watch --no-progress --include=src/app/features/plataforma/continuidad-operativa-v5.component.spec.ts
      - name: 'Vitest de baseline previo: guia auditora protegida'
        run: npm test -- --no-watch --no-progress --include=src/app/app.routes.auditoria-operativa-v5.spec.ts
      - name: Calidad, tipado y build Angular
        run: |
          npm run lint
          npm run build:prod

      - name: 'Instalar Chromium para regresion A5 de landmarks'
        run: npx playwright install --with-deps chromium
      - name: 'Levantar Angular local sin backend productivo'
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c10-04-m04-01-landmarks.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c10-04-m04-01-landmarks.log >&2
          exit 1
      - name: 'Playwright Chromium A5 P2 single main teclado 320px y revocacion'
        run: npx playwright test e2e/c10-04-m04-01-landmark-regression.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: 'Evidencia de fallos navegador'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c10-04-m04-01-a5-p2
          path: |
            frontend/c10-04-m04-01-landmarks.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
