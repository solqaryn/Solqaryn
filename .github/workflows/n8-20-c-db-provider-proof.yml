name: N8.20.C - DB Provider Read-only Proof

on:
  workflow_dispatch:
    inputs:
      persist_evidence:
        description: Persist sanitized evidence back to DEV
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: n8-20-c-db-provider-proof
  cancel-in-progress: false

jobs:
  prove-dev-db-runtime:
    name: Prove DEV DB runtime/provider without secrets
    runs-on: ubuntu-latest
    environment: DEV
    timeout-minutes: 15
    if: github.ref_name == 'dev'

    steps:
      - name: Checkout DEV exact dispatch head
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Guard branch and required secret
        shell: bash
        env:
          SOLQARYN_DB_CONNECTION: Server=${{ vars.SOLQARYN_DEV_DB_HOST }};Port=${{ vars.SOLQARYN_DEV_DB_PORT }};Database=${{ vars.SOLQARYN_DEV_DB_NAME }};User Id=${{ vars.SOLQARYN_DEV_DB_USER }};Password=${{ secrets.SOLQARYN_DEV_DB_PASSWORD }};SslMode=Required;
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "dev"
          if [ -z "${SOLQARYN_DB_CONNECTION:-}" ]; then
            echo "::error::Missing DEV database configuration"
            exit 21
          fi
          echo "Branch guard PASS: DEV"
          echo "Required DEV DB secret is present. Value is not printed."

      - name: Restore probe dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore tools/vaep/N820C.DbProviderProbe/N820C.DbProviderProbe.csproj --verbosity minimal

      - name: Execute N8.20.C read-only probe
        id: probe
        shell: bash
        env:
          SOLQARYN_DB_CONNECTION: Server=${{ vars.SOLQARYN_DEV_DB_HOST }};Port=${{ vars.SOLQARYN_DEV_DB_PORT }};Database=${{ vars.SOLQARYN_DEV_DB_NAME }};User Id=${{ vars.SOLQARYN_DEV_DB_USER }};Password=${{ secrets.SOLQARYN_DEV_DB_PASSWORD }};SslMode=Required;
          OUT_DIR: .n820c-proof/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          set +e
          dotnet run \
            --project tools/vaep/N820C.DbProviderProbe/N820C.DbProviderProbe.csproj \
            --configuration Release \
            --no-restore \
            -- "$OUT_DIR" | tee "$OUT_DIR/probe-summary.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ -f "$OUT_DIR/README.md" ]; then
            cat "$OUT_DIR/README.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: Upload sanitized proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n8-20-c-db-provider-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: .n820c-proof/${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Persist sanitized PASS evidence to DEV
        if: success() && inputs.persist_evidence
        shell: bash
        env:
          OUT_DIR: .n820c-proof/${{ github.run_id }}-${{ github.run_attempt }}
          DEST_DIR: docs/evidencias/database-provider/n8-20-c/github-actions/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          test -f "$OUT_DIR/N8.20.C_DB_PROVIDER_EVIDENCE.json"
          test -f "$OUT_DIR/README.md"

          mkdir -p "$DEST_DIR"
          cp "$OUT_DIR/N8.20.C_DB_PROVIDER_EVIDENCE.json" "$DEST_DIR/"
          cp "$OUT_DIR/README.md" "$DEST_DIR/"

          if grep -R -E -i '(password[[:space:]]*=|pwd[[:space:]]*=|user(id)?[[:space:]]*=|connectionstrings?[^\n]*=)' "$DEST_DIR"; then
            echo "::error::Potential credential material detected in sanitized evidence; refusing commit."
            exit 23
          fi

          git diff --check -- "$DEST_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST_DIR"
          git commit -m "evidence(n8.20.c): persist read-only DB provider proof [skip ci]"

          pushed=0
          for attempt in 1 2 3; do
            git fetch origin DEV
            git rebase origin/dev
            if git push origin HEAD:dev; then
              pushed=1
              break
            fi
            sleep $((attempt * 2))
          done

          if [ "$pushed" -ne 1 ]; then
            echo "::error::Could not publish sanitized evidence after 3 concurrency-safe attempts. Artifact remains available."
            exit 24
          fi

          echo "Sanitized N8.20.C evidence persisted to $DEST_DIR" >> "$GITHUB_STEP_SUMMARY"

      - name: Controller handoff marker
        if: success()
        shell: bash
        run: |
          {
            echo ""
            echo "## Controller next action"
            echo "Evidence is PASS_PROVIDER_IDENTIFIED. VAEP must now reread fresh HEAD/Sheet, run REVIEW_FIRST, create a causal receipt, update N8.20.C to LISTO_REAL with readback, release lease, and promote N8.20.D. The workflow itself does not fabricate LISTO_REAL."
          } >> "$GITHUB_STEP_SUMMARY"
