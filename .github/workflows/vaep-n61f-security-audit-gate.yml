name: VAEP N6.1.F Empresa Security Audit Exact Head Gate

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/vaep-n61f-security-audit-gate.yml'
      - 'backend/src/API/Controllers/EmpresasController.cs'
      - 'backend/src/API/Program.cs'
      - 'backend/src/Application/Services/EmpresaService.cs'
      - 'backend/src/Application/Interfaces/IEmpresaService.cs'
      - 'backend/tests/Solqaryn.Tests/N61DEmpresaApplicationApiTests.cs'
      - 'backend/tests/Solqaryn.Tests/N61FEmpresaSecurityAuditTests.cs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaep-n61f-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore backend
        run: dotnet restore Solqaryn.sln
      - name: Build backend Release
        run: dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: Test N6.1 Empresa application and security audit regressions
        run: dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-restore --filter 'FullyQualifiedName~N61DEmpresaApplicationApiTests|FullyQualifiedName~N61FEmpresaSecurityAuditTests' --verbosity normal
      - name: Verify exact-head security wiring markers
        run: |
          set -euo pipefail
          grep -q 'AddScoped<IEmpresaRepository, EmpresaRepository>' src/API/Program.cs
          grep -q 'AddScoped<IEmpresaService, EmpresaService>' src/API/Program.cs
          grep -q 'public EmpresasController(IEmpresaService service)' src/API/Controllers/EmpresasController.cs
          grep -q '\[Authorize\]' src/API/Controllers/EmpresasController.cs
          grep -q 'IAuditoriaService auditoria' src/Application/Services/EmpresaService.cs
          grep -q 'AccionPermiso.Crear' src/Application/Services/EmpresaService.cs
          grep -q 'AccionPermiso.Editar' src/Application/Services/EmpresaService.cs
          grep -q 'AccionPermiso.Activar' src/Application/Services/EmpresaService.cs
          grep -q 'AccionPermiso.Desactivar' src/Application/Services/EmpresaService.cs
          printf 'N6.1.F security/audit markers validated on %s\n' "$(git rev-parse HEAD)"

# Controller QA gate only: exact-head, causal and proportional to N6.1.F.
# No deploy, migration generation, branch mutation, production access, or PR merge.
