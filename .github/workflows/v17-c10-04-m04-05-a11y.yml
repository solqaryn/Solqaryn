name: V17 C10-04.M04.05 - accesibilidad responsive Chromium
on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/v17-c10-04-m04-05-a11y.yml'
      - 'frontend/e2e/c10-04-m04-05-continuidad-a11y.spec.ts'
      - 'frontend/src/app/features/plataforma/continuidad-operativa-v5.component.ts'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v17-c1004-m0405-${{ github.sha }}
  cancel-in-progress: false
jobs:
  accesibilidad:
    name: C10-04.M04.05 - Angular lint build Chromium accesible
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - name: Checkout SHA exacto
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm reproducible
        run: npm install --global npm@11.19.0
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Lint y compilacion Angular
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod
      - name: Instalar Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Servidor local Angular sin backend real
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > c10-04-m04-05.log 2>&1 &
          for attempt in $(seq 1 70); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then exit 0; fi
            sleep 2
          done
          cat c10-04-m04-05.log >&2
          exit 1
      - name: Playwright real positivo negativo bordes teclado contraste y errores
        working-directory: frontend
        run: npx playwright test e2e/c10-04-m04-05-continuidad-a11y.spec.ts --config=playwright.config.ts --workers=1 --retries=0
      - name: Adjuntar evidencia de errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v17-c1004-m0405
          path: |
            frontend/c10-04-m04-05.log
            frontend/test-results/
            frontend/playwright-report/
          if-no-files-found: warn
          retention-days: 14
