name: Storefront Fase 1 - regresion publica

on:
  pull_request:
    branches:
      - dev
    paths:
      - '.github/workflows/storefront-fase1-regression.yml'
      - 'frontend/e2e/storefront-fase1.spec.ts'
      - 'frontend/scripts/validate-storefront-fase1.mjs'
      - 'frontend/src/app/features/storefront/**'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/src/app/app.component.ts'
      - 'frontend/src/app/app.config.ts'
      - 'frontend/src/app/services/empresa-identidad.service.ts'
      - 'frontend/src/app/services/theme-applier.service.ts'
      - 'frontend/src/app/services/tema-visual.service.ts'
      - 'frontend/src/app/services/color-contrast.service.ts'
      - 'frontend/src/environments/**'
      - 'frontend/src/styles/**'
      - 'frontend/src/styles.scss'
      - 'frontend/angular.json'
      - 'frontend/playwright.config.ts'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  push:
    branches:
      - dev
    paths:
      - '.github/workflows/storefront-fase1-regression.yml'
      - 'frontend/e2e/storefront-fase1.spec.ts'
      - 'frontend/scripts/validate-storefront-fase1.mjs'
      - 'frontend/src/app/features/storefront/**'
      - 'frontend/src/app/app.routes.ts'
      - 'frontend/src/app/app.component.ts'
      - 'frontend/src/app/app.config.ts'
      - 'frontend/src/app/services/empresa-identidad.service.ts'
      - 'frontend/src/app/services/theme-applier.service.ts'
      - 'frontend/src/app/services/tema-visual.service.ts'
      - 'frontend/src/app/services/color-contrast.service.ts'
      - 'frontend/src/environments/**'
      - 'frontend/src/styles/**'
      - 'frontend/src/styles.scss'
      - 'frontend/angular.json'
      - 'frontend/playwright.config.ts'
      - 'frontend/package.json'
      - 'frontend/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-fase1-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navegador:
    name: Fase 1 - navegador real
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint y guardas estaticas
        run: npm run lint

      - name: Build de produccion
        run: npm run build:prod

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Iniciar Angular
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > storefront-fase1-regression.log 2>&1 &

      - name: Esperar Angular
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4200/tienda > /dev/null; then
              echo 'Angular listo para la regresion publica de Fase 1.'
              exit 0
            fi
            sleep 2
          done
          echo 'Angular no respondio dentro del tiempo esperado.' >&2
          cat storefront-fase1-regression.log >&2 || true
          exit 1

      - name: Ejecutar Playwright Fase 1
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4200
        run: npm run test:e2e:storefront-fase1

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storefront-fase1-regression
          path: |
            frontend/storefront-fase1-regression.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
