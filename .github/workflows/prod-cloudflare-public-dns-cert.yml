name: PROD - Cloudflare public DNS certification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prod-cloudflare-public-dns-cert.yml

permissions:
  contents: read

jobs:
  dns:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query public DNS read-only
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y dnsutils >/dev/null
          echo "NS_START"
          dig +short NS solqaryn.com | sort
          echo "NS_END"
          echo "A_START"
          dig +short A solqaryn.com | sort
          echo "A_END"
          echo "AAAA_START"
          dig +short AAAA solqaryn.com | sort
          echo "AAAA_END"
          echo "WWW_CNAME_START"
          dig +short CNAME www.solqaryn.com | sort
          echo "WWW_CNAME_END"
          echo "ACME_TXT_START"
          dig +short TXT _acme-challenge.solqaryn.com | sort
          echo "ACME_TXT_END"
          echo "CLOUDFLARE_PUBLIC_DNS_READ_ONLY=PASS"
          echo "DNS_WRITES=0"
