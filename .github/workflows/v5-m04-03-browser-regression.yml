name: V5 M04.03 - Chromium real de rutas y tenant branding
on:
  push:
    branches: [dev]
    paths:
      - 'frontend/e2e/c00-01-m04-03-route-context.spec.ts'
      - 'frontend/src/app/app.component.ts'
      - 'frontend/src/app/services/theme-applier.service.ts'
      - 'frontend/src/app/features/storefront/storefront-identidad.service.ts'
      - '.github/workflows/v5-m04-03-browser-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v5-m04-03-browser-dev
  cancel-in-progress: true

jobs:
  browser:
    name: M04.03 - Angular + Chromium 3 pruebas de rutas y SEO
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      PLAYWRIGHT_TEST_BASE_URL: 'http://127.0.0.1:4200'
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4

      - name: Node.js 24.21.0
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar toolchain pinneada
        working-directory: frontend
        run: npm ci

      - name: Lint y build Angular
        working-directory: frontend
        run: |
          npm run lint
          npm run build:prod

      - name: Pruebas unitarias tema y shell
        working-directory: frontend
        run: |
          npx ng test --watch=false --include=src/app/services/theme-applier.service.spec.ts
          npx ng test --watch=false --include=src/app/app.component.spec.ts

      - name: Chromium oficial Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Servidor Angular local sin PROD
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          nohup npm start -- --host 127.0.0.1 --port 4200 > m0403-angular.log 2>&1 &
          for attempt in $(seq 1 65); do
            if curl --fail --silent http://127.0.0.1:4200/login >/dev/null; then
              echo 'ANGULAR_READY=PASS'
              exit 0
            fi
            sleep 2
          done
          cat m0403-angular.log >&2
          exit 1

      - name: Playwright Chromium real anti-stale A->login y A->B
        working-directory: frontend
        run: |
          npx playwright test e2e/c00-01-m04-03-route-context.spec.ts --config=playwright.config.ts --workers=1 --retries=0

      - name: Trazas de regresion y evidencia sin datos productivos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0403-browser-regression
          path: |
            frontend/m0403-angular.log
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 14
