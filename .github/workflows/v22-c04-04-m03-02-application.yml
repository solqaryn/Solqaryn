name: V22 C04-04.M03.02 - servicio de cobros provider-neutral
on:
  push:
    branches: [dev]
    paths:
      - 'backend/src/Application/AutomationV5/C0404PaymentLinkApplicationService.cs'
      - 'backend/tests/Solqaryn.Tests/Application/C0404M0302PaymentLinkApplicationTests.cs'
      - '.github/workflows/v22-c04-04-m03-02-application.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v22-c0404-m0302-${{ github.sha }}
  cancel-in-progress: false
jobs:
  application:
    name: C04-04.M03.02 - xUnit provider-neutral y adversariales
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Restore and Release build
        working-directory: backend
        run: |
          dotnet restore Solqaryn.sln
          dotnet build Solqaryn.sln --configuration Release --no-restore
      - name: xUnit directed TRX required
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/c0404-m0302"
          dotnet test tests/Solqaryn.Tests/Solqaryn.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~C0404M0302PaymentLinkApplicationTests' --logger 'trx;LogFileName=scope.trx' --results-directory "$RUNNER_TEMP/c0404-m0302"
          python3 - <<'PY'
          import os,sys,xml.etree.ElementTree as ET
          path=os.path.join(os.environ['RUNNER_TEMP'],'c0404-m0302','scope.trx')
          c=ET.parse(path).getroot().find('.//{*}Counters')
          if c is None:sys.exit('NO_TRX')
          total=int(c.get('total','0'));passed=int(c.get('passed','0'));failed=int(c.get('failed','0'));skipped=int(c.get('notExecuted','0'))
          if total<13 or passed!=total or failed or skipped:sys.exit(f'NO_GO total={total} pass={passed} fail={failed} skip={skipped}')
          print(f'GITHUB_HOSTED_REAL_PASS {passed}/{total} SHA={os.environ["GITHUB_SHA"]}')
          PY
