services:
  - type: web
    name: solqaryn-api-dev
    runtime: docker
    plan: free
    region: oregon
    branch: dev
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Development
      - key: AllowedHosts
        value: solqaryn-api-dev-fxx8.onrender.com
      - key: Database__ServerVersion
        value: 8.4.8
      - key: Database__ApplyMigrationsOnStartup
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: Solqaryn.DEV.API
      - key: Jwt__Audience
        value: Solqaryn.DEV.Frontend
      - key: Jwt__ExpiraMinutos
        value: "120"
      - key: Security__LoginRateLimitPerMinute
        value: "20"
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: Cloudinary__EnvironmentPrefix
        value: solqaryn_dev
      - key: Cors__AllowedOrigins__0
        value: https://solqaryn-dev.vercel.app
      - key: AppSettings__BackendPublicUrl
        value: https://solqaryn-api-dev-fxx8.onrender.com
      - key: AppSettings__LogoPublicUrl
        value: ""
      - key: AppSettings__EnlacePublicoFacturaHorasValidez
        value: "24"
      - key: AppSettings__EnlacePublicoFacturaMaximoAccesos
        value: "10"
      - key: AppSettings__CorreoFacturaIdempotenciaMinutos
        value: "15"
      - key: Swagger__Enabled
        value: "false"
      - key: Smtp__Host
        sync: false
      - key: Smtp__Port
        value: "587"
      - key: Smtp__UsuarioSmtp
        sync: false
      - key: Smtp__PasswordSmtp
        sync: false
      - key: Smtp__AuthenticationMode
        value: Password
      - key: Smtp__UsarSsl
        value: "true"
      - key: Smtp__RequiereAutenticacion
        value: "true"
      - key: Smtp__CorreoRemitente
        sync: false
      - key: Smtp__CorreoRespuesta
        sync: false
      - key: Smtp__NombreRemitente
        value: SOLQARYN DEV
      - key: Smtp__TimeoutSeconds
        value: "60"
      - key: Smtp__MaxAttempts
        value: "3"
      - key: Smtp__RetryBaseDelayMilliseconds
        value: "500"
      - key: SeedAdmin__Username
        sync: false
      - key: SeedAdmin__Password
        sync: false

  - type: web
    name: solqaryn-api-prod
    runtime: docker
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    healthCheckPath: /health/ready
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AllowedHosts
        value: solqaryn-api-prod.onrender.com
      - key: Database__ServerVersion
        value: 8.4.8
      - key: Database__ApplyMigrationsOnStartup
        value: "false"
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Secret
        generateValue: true
      - key: Jwt__Issuer
        value: Solqaryn.PROD.API
      - key: Jwt__Audience
        value: Solqaryn.PROD.Frontend
      - key: Jwt__ExpiraMinutos
        value: "120"
      - key: Security__LoginRateLimitPerMinute
        value: "20"
      - key: Cloudinary__CloudName
        sync: false
      - key: Cloudinary__ApiKey
        sync: false
      - key: Cloudinary__ApiSecret
        sync: false
      - key: Cloudinary__EnvironmentPrefix
        value: solqaryn_prod
      - key: Cors__AllowedOrigins__0
        value: https://solqaryn-prod.vercel.app
      - key: AppSettings__BackendPublicUrl
        value: https://solqaryn-api-prod.onrender.com
      - key: AppSettings__LogoPublicUrl
        value: ""
      - key: AppSettings__EnlacePublicoFacturaHorasValidez
        value: "24"
      - key: AppSettings__EnlacePublicoFacturaMaximoAccesos
        value: "10"
      - key: AppSettings__CorreoFacturaIdempotenciaMinutos
        value: "15"
      - key: Swagger__Enabled
        value: "false"
      - key: Smtp__Host
        value: smtp-mail.outlook.com
      - key: Smtp__Port
        value: "587"
      - key: Smtp__UsuarioSmtp
        value: solqaryn.platform@outlook.com
      - key: Smtp__AuthenticationMode
        value: OAuth2
      - key: Smtp__OAuth2ClientId
        sync: false
      - key: Smtp__OAuth2RefreshToken
        sync: false
      - key: Smtp__OAuth2ClientSecret
        sync: false
      - key: Smtp__OAuth2TokenEndpoint
        value: https://login.microsoftonline.com/consumers/oauth2/v2.0/token
      - key: Smtp__OAuth2Scope
        value: https://outlook.office.com/SMTP.Send offline_access
      - key: Smtp__UsarSsl
        value: "true"
      - key: Smtp__RequiereAutenticacion
        value: "true"
      - key: Smtp__CorreoRemitente
        value: solqaryn.platform@outlook.com
      - key: Smtp__CorreoRespuesta
        value: solqaryn.platform@outlook.com
      - key: Smtp__NombreRemitente
        value: SOLQARYN PROD
      - key: Smtp__TimeoutSeconds
        value: "60"
      - key: Smtp__MaxAttempts
        value: "3"
      - key: Smtp__RetryBaseDelayMilliseconds
        value: "500"
      - key: SeedAdmin__Username
        sync: false
      - key: SeedAdmin__Password
        sync: false
